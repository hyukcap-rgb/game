<div class="scene" aria-hidden="true"><i class="rays"></i></div>
<div class="wrap">

<section id="home">
  <header class="hud">
    <button class="me-btn" id="meBtn" aria-label="내 정보"></button>
    <div class="hud-logo" role="img" aria-label="하루퍼즐 리그">하루퍼즐<small>리그</small></div>
    <button class="mail frhud" id="frBtn" aria-label="친구"></button>
    <button class="res" id="heartChip" aria-label="하트"></button>
    <button class="mail" id="inboxBtn" aria-label="받은 하트"></button>
  </header>

  <div class="pane" id="paneToday">
    <button class="strip" id="strip" aria-label="오늘 점수와 순위 자세히 보기"></button>
    <button class="cta" id="nextBtn"></button>
    <div class="sec"><h2>오늘의 시험지</h2></div>
    <p class="daynote" id="dayNote"></p>
    <div class="glist" id="games"></div>
    <button class="pool" id="pool" aria-label="모두의 기부 안내 보기"></button>
    <button class="advpromo" id="advPromo" aria-label="솔로 모드로 가기"></button>
    <button class="advpromo duelpromo" id="duelPromo" aria-label="대전 모드로 가기"></button>
  </div>

  <div class="pane" id="paneAdv" hidden>
    <div class="sec"><h2>솔로</h2></div>
    <div class="lvcard" id="lvCard"></div>
    <button class="solopts" id="soloPts" aria-label="오늘 솔로 포인트"></button>
    <div class="fchips" id="advFilter" role="group" aria-label="과목으로 고르기"></div>
    <div class="advlist" id="advList"></div>
    <p class="advnote">솔로는 하트 없이 언제나 무료예요. 새 스테이지를 처음 깨면 솔로 포인트를 받아요.<br>솔로 포인트는 오늘 점수(시험지)와 따로 쌓여요(하루 최대 1,000).</p>
  </div>

  <div class="pane" id="paneDuel" hidden>
    <div class="sec"><h2>대전</h2></div>
    <div class="duelhead" id="duelHead"></div>
    <div class="duelfr" id="duelFriends"></div>
    <button class="btn primary block quickduel" id="quickDuel"></button>
    <div class="fchips" id="duelFilter" role="group" aria-label="과목으로 고르기"></div>
    <div class="glist" id="duelList"></div>
    <p class="advnote">대전은 2~5명이 같은 문제를 같은 순간에 풀고 순위로 겨뤄요.<br>게임을 누르면 그 게임의 대전 방 목록이 나와요. 난이도·인원을 골라 방을 만들고 친구를 초대하거나 방 코드를 알려 주세요.<br>빠른 대전은 실시간 상대가 없으면 컴퓨터와 겨뤄요.</p>
  </div>

  <div class="pane" id="paneLeague" hidden>
    <div class="sec"><h2>리그</h2></div>
    <div class="tabs" role="group" aria-label="순위 종류"><button id="tabDay" aria-pressed="true">친구 순위</button><button id="tabMonth" aria-pressed="false">주간 리그</button></div>
    <div id="lgHead"></div>
    <div class="rank panel" id="rank"></div>
    <p class="rank-note" id="rankNote"></p>
  </div>

  <div class="pane" id="paneMe" hidden>
    <!-- 내 정보(2026-10-12 간소화, Figma 10:4): 프로필 한 줄 + 오늘 요약 티켓 + ⚙ 설정. 나머지 메뉴는 설정 시트(openSettings) 안 -->
    <div class="mehead"><div><h2>내 정보</h2><small id="meDate"></small></div><button class="megear" id="meGear" aria-label="설정 열기 · 기록, 친구, 디자인 테마, 소리"></button></div>
    <div class="prof panel" id="prof"></div>
    <section class="meticket panel" aria-label="오늘의 성적">
      <div class="mt-band"><b>오늘의 성적</b><span id="meExam"></span></div>
      <div class="mt-score"><span class="num" id="bq" aria-live="polite">0</span><em>점</em><p id="rankLine"></p></div>
      <div class="mt-cells">
        <div class="mt-c"><small id="lbSkill"></small><b><span class="num" id="bqSkill">0</span><em id="bqSkillU"></em></b><span id="skillEx"></span></div>
        <div class="mt-c grit"><small id="lbGrit"></small><b><span class="num" id="bqGrit">0</span><em>일</em></b><span id="gritEx"></span></div>
      </div>
      <div class="mt-acts"><button class="mt-a" id="meReport">두뇌 리포트</button><button class="mt-a pri" id="meShare">성적표 공유</button></div>
    </section>
    <button class="memore" id="meMore"></button>
    <p class="tagline">같은 문제, <b>다른 점수</b>.</p>
  </div>

  <nav class="dock" id="dock" aria-label="메뉴">
    <button data-tab="today">ICO_home오늘</button>
    <button data-tab="adv">ICO_map솔로<i class="dot" id="advDot"></i></button>
    <button data-tab="duel">ICO_duel대전</button>
    <button data-tab="league">ICO_trophy리그</button>
    <button data-tab="me">ICO_user내 정보</button>
  </nav>
</section>

<section id="play">
  <div class="duelbar" id="duelBar" hidden></div>
  <div class="pbar">
    <button class="iconbtn" id="quitBtn" aria-label="그만하기"></button>
    <div class="ptitle" id="ptitle"></div>
    <button class="iconbtn" id="helpBtn" aria-label="게임 방법"></button>
  </div>
  <div class="stats">
    <div class="paws" id="paws" aria-label="남은 기회"></div>
    <div class="fcount" id="fcount"></div>
    <div class="clock" id="clock">0:00</div>
  </div>
  <div id="stage"></div>
</section>
