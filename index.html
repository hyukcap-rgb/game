<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하루퍼즐 리그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* ===== 하루퍼즐 리그 · 게임 로비 디자인 시스템 v2 =====
   세계관: 밤하늘 보랏빛 퍼즐 광장. 크림색 양피지 패널 + 굵은 보라 외곽선 + 사탕 버튼.
   한 가지 세계로 고정(라이트/다크 구분 없음). */
:root{
  color-scheme:light;
  --night:#1C1250; --night2:#2A1B6E; --outline:#2A1650; --outline2:#1A0F45;
  --paper:#FFF8EA; --paper2:#FBEBCB; --paper-line:#EADBC0;
  --ink:#3A2261; --sub:#7B6A93; --line:#E6D6B6;
  --gold:#FFC93C; --gold2:#FF9A1F; --pink:#F0368A; --sky:#2E8FE8;
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F3EBDD;
  --primary:#6C3CE0; --on-primary:#FFFFFF; --accent:#FF3D7F; --success:#27B86A; --danger:#E5484D;
  --g-fox:#FF7A1F; --g-sudoku:#3B6FD8; --g-ball:#9B44E8; --g-tower:#2E9E5B; --g-fleet:#1A8CC4;
  --card:var(--surface); --grape:var(--primary); --lemon:var(--gold); --mint:var(--success); --edge:#26215C; --cellink:#26215C;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --disp:"Jua","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --heavy:"Black Han Sans","Jua","Apple SD Gothic Neo",system-ui,sans-serif;
  box-sizing:border-box;
}
html{height:100%; background:var(--night)}
*{box-sizing:border-box}
body{word-break:keep-all; overflow-wrap:anywhere; margin:0; min-height:100%; background:var(--night); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.47; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0}
button:focus-visible, summary:focus-visible{outline:3px solid #FFE27A; outline-offset:3px}
.wrap{position:relative; z-index:1; max-width:460px; margin:0 auto; padding:10px 16px 44px}
.num{font-variant-numeric:tabular-nums}
.ico{display:inline-block; width:20px; height:20px; vertical-align:-4px; flex:none}
.ico svg{width:100%; height:100%; display:block}
.gdefs{position:absolute; width:0; height:0; overflow:hidden}

/* ---------- 배경 장면: 밤하늘 광장 + 천천히 도는 빛줄기 ---------- */
.scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(90% 45% at 50% 0%, #8D6BFF 0%, rgba(141,107,255,0) 70%),
    radial-gradient(70% 40% at 100% 85%, rgba(255,79,154,.35) 0%, rgba(255,79,154,0) 70%),
    radial-gradient(60% 40% at 0% 60%, rgba(46,143,232,.28) 0%, rgba(46,143,232,0) 70%),
    linear-gradient(180deg,#3A23A0 0%, #24166E 38%, #170D47 100%)}
.scene::before{content:""; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.4px), radial-gradient(rgba(255,255,255,.25) 1px, transparent 1.4px); background-size:120px 140px, 57px 61px; background-position:10px 20px, 30px 5px; opacity:.55}
.scene::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(45deg, rgba(255,255,255,.028) 0 14px, transparent 14px 28px)}
.scene .rays{position:absolute; left:50%; top:-340px; width:900px; height:900px; margin-left:-450px; border-radius:50%;
  background:repeating-conic-gradient(from 0deg, rgba(255,236,170,.13) 0deg 7deg, rgba(255,236,170,0) 7deg 18deg);
  -webkit-mask:radial-gradient(circle, #000 18%, transparent 62%); mask:radial-gradient(circle, #000 18%, transparent 62%);
  animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body[data-mode] .scene{display:none}
body[data-mode="sudoku"]{background:#EEF2F8}
body[data-mode="ball"]{background:#0B0718}
body[data-mode="tower"]{background:#0E150A}
body[data-mode="tower"] #play > .pbar{display:none!important}

/* ---------- 공통: 양피지 패널, 사탕 버튼 ---------- */
.panel{background:linear-gradient(180deg,var(--paper) 0%, var(--paper2) 100%); border:3px solid var(--outline); border-radius:22px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.75), inset 0 -4px 0 rgba(160,120,60,.12), 0 6px 0 var(--outline2), 0 14px 24px rgba(8,2,30,.35)}
.btn, .b1, .b2, .cta, .g-go{position:relative; overflow:hidden; isolation:isolate}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:52px; padding:0 18px; border-radius:16px; font-family:var(--disp); font-size:18px; transition:transform .08s, box-shadow .08s}
.btn.primary, .b1, .btn.secondary, .b2, .btn.gold{
  background:linear-gradient(180deg,var(--c1) 0%, var(--c2) 100%); border:2.5px solid var(--c3); color:#fff; text-shadow:0 2px 0 var(--c3);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.14), 0 4px 0 var(--c3), 0 7px 12px rgba(20,5,40,.22)}
.btn.primary, .b1{--c1:#FF8AC0; --c2:#F0368A; --c3:#8E0F4F}
.btn.secondary, .b2{--c1:#86D6FF; --c2:#2E8FE8; --c3:#124F92}
.btn.gold{--c1:#FFE98E; --c2:#FFB020; --c3:#9A5A00; color:#5A3300; text-shadow:0 1px 0 rgba(255,255,255,.55)}
.btn.primary::before, .b1::before, .btn.secondary::before, .b2::before, .btn.gold::before{content:""; position:absolute; z-index:-1; left:6px; right:6px; top:3px; height:42%; border-radius:12px 12px 20px 20px; background:linear-gradient(rgba(255,255,255,.6), rgba(255,255,255,.08))}
.btn:active, .b1:active, .b2:active{transform:translateY(3px); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 1px 0 var(--c3)}
.btn:disabled{filter:grayscale(.7); opacity:.6}
.btn.ghost{background:none; color:var(--sub); height:44px; font-family:var(--disp); font-size:16px; box-shadow:none; text-shadow:none; border:0}
.btn.small{height:38px; padding:0 14px; font-size:15px; border-radius:12px}
.btn.block{width:100%}
.cost{display:inline-flex; align-items:center; gap:3px; background:rgba(40,0,30,.22); border-radius:999px; padding:1px 9px 1px 7px; font-family:var(--heavy); font-size:14px; letter-spacing:.5px; text-shadow:none; color:#fff; box-shadow:inset 0 1px 0 rgba(0,0,0,.15)}
.cost .ico{width:14px; height:14px; vertical-align:-2px; color:#fff}
.btn.gold .cost{color:#5A3300; background:rgba(255,255,255,.4)}
.btn.ghost .cost{background:var(--paper2); color:var(--ink)}

/* ---------- 상단 HUD ---------- */
.hud{display:flex; align-items:center; justify-content:space-between; gap:10px; height:52px; margin-bottom:2px}
.res{display:inline-flex; align-items:center; height:38px; padding:0 4px 0 0; margin-left:14px; border-radius:999px; background:linear-gradient(#170C40,#241563); border:2.5px solid #0E0730; box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 3px 0 rgba(0,0,0,.35); color:#fff}
.res-ico{width:46px; height:46px; margin:0 2px 0 -18px; filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.res-ico svg{width:100%; height:100%; display:block}
.res-val{display:flex; align-items:baseline; gap:6px; padding-right:6px; line-height:1}
.res-val b{font-family:var(--heavy); font-weight:400; font-size:19px; letter-spacing:.5px}
.res-val small{font-family:var(--heavy); font-size:12px; color:#FFD86B; letter-spacing:.5px}
.res-plus{width:26px; height:26px; border-radius:9px; display:grid; place-items:center; font-family:var(--heavy); font-size:20px; line-height:1; color:#fff; background:linear-gradient(#8BF06A,#2BB24C); border:2px solid #0F5A23; box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 2px 0 #0F5A23; text-shadow:0 1px 0 #0F5A23}
.mail{position:relative; width:48px; height:44px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(#FFFFFF,#E7DDFF); border:2.5px solid var(--outline2); box-shadow:inset 0 -3px 0 rgba(90,60,160,.18), 0 4px 0 #0E0730}
.mail svg{width:30px; height:30px}
.mail:active{transform:translateY(3px); box-shadow:0 1px 0 #0E0730}
.badge{position:absolute; top:-8px; right:-8px; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:linear-gradient(#FF6B6B,#E0243A); border:2px solid #fff; color:#fff; font-family:var(--heavy); font-size:13px; line-height:18px; text-align:center; box-shadow:0 2px 0 rgba(0,0,0,.3)}

/* ---------- 로고 ---------- */
.logo{position:relative; z-index:0; isolation:isolate; display:flex; flex-direction:column; align-items:center; margin:4px 0 40px; user-select:none}
.logo-main{position:relative; font-family:var(--heavy); font-size:50px; line-height:1.05; letter-spacing:1px; color:transparent;
  background:linear-gradient(180deg,#FFFBD6 0%, #FFE35A 42%, #FFB21E 70%, #FF8A12 100%); -webkit-background-clip:text; background-clip:text}
.logo-main::before, .logo-main::after{content:attr(data-t); position:absolute; left:0; top:0; z-index:-1; color:var(--outline2); background:none}
.logo-main::before{-webkit-text-stroke:14px var(--outline2); text-shadow:0 7px 0 #0B0526, 0 12px 18px rgba(0,0,0,.35)}
.logo-main::after{-webkit-text-stroke:6px #FFFFFF; color:#FFFFFF}
.logo-sub{position:relative; margin-top:-6px; padding:3px 22px 4px; font-family:var(--heavy); font-size:17px; letter-spacing:6px; text-indent:6px; color:#fff; text-shadow:0 2px 0 #7A0B45;
  background:linear-gradient(#FF7DB8,#E62C7F); border:2.5px solid var(--outline2); border-radius:8px; box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 var(--outline2); transform:rotate(-2deg)}
.logo-sub::before, .logo-sub::after{content:""; position:absolute; top:6px; width:16px; height:22px; z-index:-1; background:#B01A60; border:2.5px solid var(--outline2)}
.logo-sub::before{left:-11px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.logo-sub::after{right:-11px; clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.spark{position:absolute; width:18px; height:18px; animation:twinkle 2.4s ease-in-out infinite}
.spark svg{width:100%; height:100%; display:block}
@keyframes twinkle{50%{transform:scale(.55) rotate(45deg); opacity:.5}}

/* ---------- 리그 카드(히어로) ---------- */
.hero{position:relative; padding:24px 16px 14px; border-radius:24px; color:#fff;
  background:radial-gradient(120% 90% at 20% 0%, rgba(160,130,255,.45), rgba(160,130,255,0) 60%), linear-gradient(180deg,#4A33A8 0%, #2C1C7C 100%);
  border:3px solid #FFD35C; box-shadow:0 0 0 3px var(--outline2), inset 0 2px 0 rgba(255,255,255,.3), inset 0 0 0 2px rgba(255,211,92,.25), 0 9px 0 #0E0730, 0 18px 30px rgba(0,0,0,.4)}
.ribbon{position:absolute; left:50%; top:-19px; transform:translateX(-50%); z-index:2; white-space:nowrap}
.ribbon span{position:relative; display:block; padding:5px 26px 6px; font-family:var(--disp); font-size:18px; color:#fff; text-shadow:0 2px 0 #7A0B45;
  background:linear-gradient(#FF7DB8,#E62C7F); border:2.5px solid var(--outline2); border-radius:10px; box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 var(--outline2)}
.hero-in{display:grid; grid-template-columns:88px 1fr; gap:14px; align-items:center}
.medal-big{width:88px; height:96px}
.medal-big svg, .pos svg{display:block; width:100%; height:100%; overflow:visible}
.hero-score small{display:block; font-family:var(--disp); font-size:14px; color:#CFC5FF}
.hero-score .n{display:flex; align-items:baseline; gap:4px; line-height:1}
.hero-score .n span{font-family:var(--heavy); font-size:48px; letter-spacing:.5px; color:#fff; -webkit-text-stroke:7px var(--outline2); paint-order:stroke fill; text-shadow:0 4px 0 var(--outline2)}
.hero-score .n em{font-style:normal; font-family:var(--heavy); font-size:20px; color:var(--gold); -webkit-text-stroke:5px var(--outline2); paint-order:stroke fill}
.hero-score p{margin:6px 0 0; font-family:var(--disp); font-size:15px; line-height:1.35; color:#EDE7FF; text-wrap:balance}
.hero-score p em{font-style:normal; color:#FFD86B}
.gems{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:16px 0 0}
.gem{position:relative; aspect-ratio:1; max-width:56px; justify-self:center; width:100%; border-radius:14px; display:grid; place-items:center; color:rgba(255,255,255,.28);
  background:#170C45; box-shadow:inset 0 3px 6px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.18)}
.gem .ico{width:52%; height:52%}
.gem.on{color:#fff; background:linear-gradient(180deg,var(--g1),var(--g2)); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.18), 0 3px 0 var(--outline2)}
.gem.on .ico{filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.gem-ck{position:absolute; right:-6px; bottom:-6px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#8BF06A,#2BB24C); border:2px solid var(--outline2); color:#fff}
.gem-ck .ico{width:12px; height:12px}
.hero-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px; padding-top:12px; border-top:2px dashed rgba(255,255,255,.18); font-family:var(--disp); font-size:14px; color:#CFC5FF}
.clock-chip{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; border-radius:999px; background:#170C45; box-shadow:inset 0 2px 4px rgba(0,0,0,.5); white-space:nowrap}
.clock-chip .ico{width:16px; height:16px; color:#FFD86B}
.clock-chip b{font-family:var(--heavy); font-weight:400; color:#FFD86B; letter-spacing:.5px}

/* ---------- 다음 한 판 (메인 버튼) ---------- */
.cta{display:flex; align-items:center; gap:12px; width:100%; min-height:82px; margin-top:22px; padding:10px 12px 12px; border-radius:22px; text-align:left; color:#fff;
  background:linear-gradient(180deg,#FF9BCB 0%, #FF4F9A 45%, #E0217A 100%); border:3px solid var(--outline2);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55), inset 0 -6px 0 rgba(120,0,60,.3), 0 7px 0 #0E0730, 0 16px 26px rgba(224,33,122,.35); transition:transform .08s, box-shadow .08s}
.cta::before{content:""; position:absolute; z-index:-1; left:10px; right:10px; top:4px; height:40%; border-radius:16px 16px 30px 30px; background:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0))}
.cta::after{content:""; position:absolute; z-index:-1; top:0; bottom:0; width:40%; left:-50%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform:skewX(-18deg); animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-50%} 85%,100%{left:130%}}
.cta:active{transform:translateY(5px); box-shadow:inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 #0E0730}
.cta-tile{flex:none; width:56px; height:56px; border-radius:16px; display:grid; place-items:center; color:var(--g2); background:linear-gradient(#FFFFFF,#FFE6F1); border:2.5px solid var(--outline2); box-shadow:inset 0 -3px 0 rgba(0,0,0,.08), 0 3px 0 rgba(80,0,40,.5)}
.cta-tile .ico{width:34px; height:34px}
.cta-txt{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.2}
.cta-txt i{font-style:normal; font-family:var(--disp); font-size:14px; color:#FFF1A8; text-shadow:0 1px 0 #8E0F4F}
.cta-txt b{font-family:var(--disp); font-weight:400; font-size:22px; color:#fff; -webkit-text-stroke:5px #8E0F4F; paint-order:stroke fill; text-shadow:0 3px 0 #8E0F4F; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.cta-txt small{font-size:13px; font-weight:700; color:#FFE3F0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
.cta-play{flex:none; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#FFF6B8,#FFC21C); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.7), 0 3px 0 rgba(80,0,40,.55)}
.cta-play svg{width:24px; height:24px; margin-left:3px; color:#B8250E}

/* ---------- 섹션 제목 ---------- */
.sec{display:flex; align-items:center; justify-content:center; gap:12px; margin:34px 0 14px}
.sec::before, .sec::after{content:""; flex:1; max-width:80px; height:3px; border-radius:2px; background:linear-gradient(90deg, rgba(255,211,92,0), #FFD35C)}
.sec::after{transform:scaleX(-1)}
.sec h2{margin:0; font-family:var(--disp); font-weight:400; font-size:22px; color:#fff; -webkit-text-stroke:6px var(--outline2); paint-order:stroke fill; text-shadow:0 3px 0 var(--outline2); white-space:nowrap}
.sec h2::before, .sec h2::after{content:"◆"; display:inline-block; font-size:12px; color:#FFD35C; -webkit-text-stroke:3px var(--outline2); vertical-align:3px; margin:0 8px}

/* ---------- 게임 카드 ---------- */
.games{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.game{position:relative; display:flex; flex-direction:column; gap:3px; padding:8px 8px 10px; text-align:left; transition:transform .1s}
.game:active{transform:translateY(3px) scale(.99)}
.g-art{position:relative; display:block; aspect-ratio:16/10; border-radius:14px; overflow:hidden; border:2.5px solid var(--outline); box-shadow:inset 0 0 0 2px rgba(255,255,255,.35); margin-bottom:6px; background:var(--gc)}
.g-art svg{display:block; width:100%; height:100%}
.g-art::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 35%); pointer-events:none}
.g-nm{font-family:var(--disp); font-size:18px; line-height:1.25; color:var(--ink); padding:0 4px}
.g-st{flex:1; font-size:12.5px; line-height:1.45; color:var(--sub); font-weight:500; padding:0 4px}
.g-st b{color:var(--ink)}
.g-go{display:flex; align-items:center; justify-content:center; gap:6px; height:40px; margin-top:8px; border-radius:13px; font-family:var(--disp); font-size:16px; color:#fff;
  --c1:#FF8AC0; --c2:#F0368A; --c3:#8E0F4F; background:linear-gradient(180deg,var(--c1),var(--c2)); border:2.5px solid var(--c3); text-shadow:0 2px 0 var(--c3);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 var(--c3)}
.g-go.re{--c1:#86D6FF; --c2:#2E8FE8; --c3:#124F92}
.g-go::before{content:""; position:absolute; z-index:-1; left:5px; right:5px; top:2px; height:42%; border-radius:10px 10px 16px 16px; background:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.05))}
.games .game:last-child:nth-child(odd){grid-column:1/-1; display:grid; grid-template-columns:48% 1fr; grid-template-rows:auto 1fr auto; column-gap:12px}
.games .game:last-child:nth-child(odd) .g-art{grid-row:1/4; margin:0; align-self:stretch; aspect-ratio:auto; min-height:120px}
.games .game:last-child:nth-child(odd) .g-nm{padding-top:4px}
.newb, .live, .stamp{position:absolute; top:6px; z-index:2; font-family:var(--heavy); font-size:12px; letter-spacing:1px; line-height:1; color:#fff; border:2px solid var(--outline2); box-shadow:0 2px 0 var(--outline2)}
.newb{left:6px; padding:4px 8px 5px; border-radius:8px; background:linear-gradient(#FF6B6B,#E0243A); transform:rotate(-6deg)}
.live{right:6px; display:inline-flex; align-items:center; gap:5px; padding:4px 8px 5px; border-radius:999px; background:linear-gradient(#FF6B6B,#E0243A)}
.live i{width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.stamp{right:6px; display:inline-flex; align-items:center; gap:3px; padding:3px 8px 4px 5px; border-radius:999px; background:linear-gradient(#FFE98E,#FFB020); color:#5A3300; letter-spacing:0; font-family:var(--disp); font-size:13px}
.stamp .ico{width:14px; height:14px}

/* ---------- 친구 랭킹 ---------- */
.rank{padding:6px 10px; overflow:hidden}
.row{display:grid; grid-template-columns:38px 46px 1fr auto 42px; align-items:center; gap:8px; min-height:66px; padding:6px 2px; border-top:2px dashed var(--paper-line)}
.row:first-child{border-top:0}
.row.me{margin:4px -6px; padding:6px 8px; border:2.5px solid #C98A12; border-radius:16px; background:linear-gradient(180deg,#FFF1B8,#FFD978); box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.row.me + .row{border-top:0}
.pos{width:38px; height:40px; display:grid; place-items:center}
.pnum{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-family:var(--heavy); font-size:15px; color:#fff; background:linear-gradient(#7B5CD6,#4B2C8F); border:2px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.pnum.none{background:#CDBEA0; color:#fff; box-shadow:none; border-color:#A8966F}
.av{position:relative; width:46px; height:46px; border-radius:50%; overflow:hidden; display:grid; place-items:center; border:3px solid #fff; box-shadow:0 0 0 2px var(--outline), 0 3px 0 2px rgba(42,22,80,.35); background:var(--avbg, #FFD6E0)}
.av svg{width:100%; height:100%; display:block}
.who{min-width:0; line-height:1.2}
.who b{display:block; font-family:var(--disp); font-weight:400; font-size:17px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.who small{display:flex; gap:3px; margin-top:4px; font-size:12px; color:var(--sub); font-weight:500; white-space:nowrap}
.mini{display:inline-grid; place-items:center; width:19px; height:19px; border-radius:6px; background:#E9DCC0; color:#B7A27A}
.mini .ico{width:13px; height:13px}
.mini.on{color:#fff; background:var(--gc); box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.sc{font-family:var(--heavy); font-size:19px; color:var(--ink); letter-spacing:.3px}
.send{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#FF9BCB,#F0368A); border:2.5px solid #8E0F4F; box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 3px 0 #8E0F4F; color:#fff}
.send .ico{width:20px; height:20px; filter:drop-shadow(0 1px 0 rgba(120,0,60,.6))}
.send:active{transform:translateY(2px); box-shadow:0 1px 0 #8E0F4F}
.send:disabled{background:#E9DCC0; border-color:#B7A27A; box-shadow:none; color:#A38E66}
.send:disabled .ico{filter:none}

/* ---------- 테스트 도구 ---------- */
.proto{margin-top:30px; font-size:12.5px; color:#B9AEE6; text-align:center}
.proto summary{cursor:pointer; list-style:none; min-height:44px; display:inline-flex; align-items:center; font-family:var(--disp); font-size:14px}
.proto summary::-webkit-details-marker{display:none}
.proto .btn{margin:4px}

/* ---------- 게임 화면 상단 바(스도쿠·구슬·디펜스) ---------- */
#play{display:none}
.pbar{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px; min-height:60px; margin:2px 0 12px; padding:6px 8px; border-radius:18px;
  background:linear-gradient(180deg,#4A33A8,#2C1C7C); border:3px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.25), 0 4px 0 #0E0730}
.ptitle{text-align:center; font-family:var(--disp); font-size:19px; line-height:1.2; min-width:0; color:#fff; -webkit-text-stroke:4px var(--outline2); paint-order:stroke fill}
.ptitle small{display:block; font-family:var(--font); font-size:11.5px; font-weight:700; color:#CFC5FF; -webkit-text-stroke:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iconbtn{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; color:var(--ink); background:linear-gradient(#FFFFFF,#E7DDFF); border:2.5px solid var(--outline2); box-shadow:inset 0 -3px 0 rgba(90,60,160,.18), 0 3px 0 #0E0730}
.iconbtn .ico{width:22px; height:22px}
.iconbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #0E0730}
.stats{display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:16px; padding:8px 14px; margin-bottom:12px; min-height:52px}
.paws{display:flex; gap:4px; color:var(--g-fox)}
.paws .ico{width:24px; height:24px}
.paws .off{color:var(--line)}
.paws .lost{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fcount{font-size:14px; font-weight:700; color:var(--sub)}
.clock{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}

/* ---------- 팝업 창 ---------- */
.veil{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(80% 60% at 50% 45%, rgba(40,20,110,.55), rgba(8,3,28,.82)); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.veil.on{display:flex}
.modal{position:relative; width:100%; max-width:420px; max-height:100%; overflow:auto; padding:16px 16px 18px; text-align:center; color:var(--ink);
  background:linear-gradient(180deg,var(--paper) 0%, var(--paper2) 100%); border:4px solid var(--outline); border-radius:26px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.8), 0 8px 0 var(--outline2), 0 26px 50px rgba(0,0,0,.5); animation:popin .32s cubic-bezier(.2,1.5,.45,1)}
@keyframes popin{from{transform:scale(.82); opacity:0}}
.modal > *:not(.burst){position:relative; z-index:1}
.modal h3{margin:0 0 12px; padding:9px 14px 10px; font-family:var(--disp); font-weight:400; font-size:21px; line-height:1.25; color:#fff; text-shadow:0 2px 0 var(--outline2); text-wrap:balance;
  background:linear-gradient(180deg,#9C7BFF,#6236D6); border:3px solid var(--outline2); border-radius:15px; box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 var(--outline2)}
.modal h3.ok{background:linear-gradient(180deg,#8BF06A,#23A548); text-shadow:0 2px 0 #0F5A23}
.modal h3.bad{background:linear-gradient(180deg,#9AA7C7,#5B6789)}
.modal .big{font-family:var(--heavy); font-weight:400; font-size:60px; line-height:1.1; margin:6px 0; letter-spacing:1px; font-variant-numeric:tabular-nums; color:#FFC93C; -webkit-text-stroke:8px var(--outline); paint-order:stroke fill; text-shadow:0 5px 0 var(--outline)}
.modal .big svg{width:72px; height:72px; display:block; margin:0 auto}
.lose{font-family:var(--disp); font-size:21px; line-height:1.35; margin:12px 0 6px; color:var(--ink); text-wrap:balance}
.note{font-size:14px; color:var(--sub); margin:8px 0; line-height:1.55; text-wrap:pretty}
.note b{color:var(--ink)}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-family:var(--disp); font-size:15px; margin:4px 2px; border:2px solid}
.pill.good{background:#E3F8E9; color:#18804A; border-color:#8FD9A8}
.pill.new{background:linear-gradient(#FFE98E,#FFB020); color:#5A3300; border-color:#9A5A00; box-shadow:0 2px 0 #9A5A00; animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.06)}}
.pill.info{background:#EFE7FF; color:#5B3FB5; border-color:#CDBBFA}
.burst{position:absolute; z-index:0; left:50%; top:-140px; width:420px; height:420px; margin-left:-210px; border-radius:50%; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,200,60,.35) 0deg 9deg, rgba(255,200,60,0) 9deg 22deg);
  -webkit-mask:radial-gradient(circle, #000 12%, transparent 60%); mask:radial-gradient(circle, #000 12%, transparent 60%); animation:spin 14s linear infinite}
.brk{text-align:left; margin:10px 0 4px; background:#fff; border:2px solid var(--paper-line); border-radius:14px; padding:0 12px}
.brk summary{min-height:44px; display:flex; align-items:center; justify-content:center; color:var(--sub); font-family:var(--disp); font-size:15px; cursor:pointer}
.brk div{display:flex; justify-content:space-between; gap:10px; padding:8px 2px; font-size:14px; color:var(--sub); border-top:2px dashed var(--paper-line)}
.brk div b{color:var(--ink); font-variant-numeric:tabular-nums}
.mbtns{display:grid; grid-template-columns:auto 1fr; gap:10px; margin-top:18px}
.mbtns.one{grid-template-columns:1fr}
.mbtns.two{grid-template-columns:1fr 1fr}
.mbtns + .btn.ghost{margin-top:6px; width:100%}
.mbtns + .mbtns{margin-top:12px}
.mbtns button, .mbtns .btn{height:54px; border-radius:16px; font-family:var(--disp); font-size:17px; padding:0 16px; min-width:0; white-space:nowrap; line-height:1.15; display:inline-flex; align-items:center; justify-content:center; gap:6px}
.opts{display:flex; flex-direction:column; gap:10px; margin-top:12px; text-align:left}
.opt{text-align:left; display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:10px; min-height:66px; padding:10px 14px; border-radius:16px; background:#fff; border:3px solid var(--paper-line); box-shadow:0 3px 0 var(--paper-line); transition:transform .08s}
.opt[aria-checked="true"]{border-color:var(--pink); background:#FFF1F7; box-shadow:0 3px 0 #B8185F, 0 0 0 4px rgba(240,54,138,.18)}
.opt .lvdots{display:flex; gap:5px; padding-left:2px}
.opt .lvdots i{width:8px; height:8px; transform:rotate(45deg); border-radius:2px; background:var(--line)}
.opt .lvdots i.on{background:linear-gradient(#FFE35A,#FF9A1F); box-shadow:0 0 0 1.5px #9A5A00}
.opt b{font-family:var(--disp); font-weight:400; font-size:18px}
.opt small{display:block; font-size:12.5px; color:var(--sub); font-weight:500; margin-top:1px}
.opt .rec{font-family:var(--disp); font-size:13px; color:#fff; background:linear-gradient(#FF8AC0,#F0368A); border:2px solid #8E0F4F; padding:1px 9px 2px; border-radius:999px}
.hrow{display:flex; justify-content:center; gap:4px; margin:10px 0}
.hrow .hi{width:40px; height:40px}
.hrow .hi svg{width:100%; height:100%; display:block}
.hrow .hi.off{filter:grayscale(1) opacity(.35)}
.hx{font-family:var(--heavy); font-size:20px; align-self:center; color:var(--pink)}
.gift{display:grid; grid-template-columns:40px 1fr 26px; align-items:center; gap:10px; min-height:58px; text-align:left; border-top:2px dashed var(--paper-line); font-size:15px}
.gift:first-child{border-top:0}
.gift .av{width:40px; height:40px; border-width:2px}
.gift .hi{width:26px; height:26px}
.gift .hi svg{width:100%; height:100%}
.gift.got{opacity:.45}
.help{display:flex; flex-direction:column; gap:10px; margin:12px 0 4px; text-align:left}
.hstep{display:grid; grid-template-columns:48px 1fr; gap:12px; align-items:center; padding:12px; border-radius:16px; background:#fff; border:2px solid var(--paper-line)}
.hstep .hn{width:48px; height:48px; border-radius:14px; display:grid; place-items:center; color:#fff; font-family:var(--heavy); font-size:24px; border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 var(--outline2); text-shadow:0 2px 0 rgba(0,0,0,.3)}
.hstep b{display:block; font-family:var(--disp); font-weight:400; font-size:17px; color:var(--ink)}
.hstep span{font-size:13.5px; color:var(--sub); line-height:1.5}
.legend{font-size:13px; color:inherit; opacity:.85; margin:6px 0 0}
.stile.sel{outline:3px solid #FFE082; outline-offset:2px}
.optsep{font-family:var(--disp); font-size:14px; color:var(--sub); margin:8px 4px 0}

/* ---------- 알림 ---------- */
.toast{position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translate(-50%,-14px); z-index:40; max-width:calc(100% - 32px); height:48px; padding:0 20px; border-radius:16px;
  display:flex; align-items:center; gap:8px; font-family:var(--disp); font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transition:.2s; pointer-events:none;
  background:linear-gradient(#3D2A8F,#24186A); border:2.5px solid #FFD35C; box-shadow:0 0 0 2.5px var(--outline2), 0 10px 24px rgba(0,0,0,.4)}
.toast.on{opacity:1; transform:translate(-50%,0)}

@media (max-width:370px){ .logo-main{font-size:42px} .hero-score .n span{font-size:40px} .hero-in{grid-template-columns:74px 1fr} .medal-big{width:74px; height:82px} .row{grid-template-columns:34px 42px 1fr auto 40px; gap:6px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* ===== 게임 화면(레퍼런스 유지) ===== */
.bcv{display:block; width:100%; margin:0 auto; touch-action:none; background:#000; user-select:none; -webkit-user-select:none; border:2px solid #7E6BFF; border-radius:8px; box-shadow:0 0 12px rgba(126,107,255,.7)}
.neon, .neon *{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.neon{background:linear-gradient(#0B1A2B,#07060F 30%,#1A0B2E); border-radius:22px; padding:12px 10px 16px; color:#EDEBFF}
.bhead{display:grid; grid-template-columns:40px 1fr 40px; align-items:center; gap:8px; margin-bottom:10px}
.nbtn{width:40px; height:40px; border-radius:50%; border:2px solid #3FA9F5; box-shadow:0 0 10px #3FA9F5, inset 0 0 8px rgba(63,169,245,.5); color:#BFE3FF; font-size:15px; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.nbtn small{font-size:9px; margin-top:1px}
.bmid{text-align:center; font-size:13px; min-width:0}
.btitle{color:#DCD8FF; margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bbar{position:relative; height:8px; border-radius:4px; background:#1B1830; margin:0 10px}
.bbar i{position:absolute; left:0; top:0; bottom:0; border-radius:4px; background:linear-gradient(90deg,#3FA9F5,#C77DFF); width:0; transition:width .2s}
.bbar .st{position:absolute; top:50%; transform:translate(-50%,-50%); font-size:18px; color:#2E2A40}
.bbar .st.on{color:#BFE3FF; text-shadow:0 0 6px #3FA9F5}
.bline{display:flex; justify-content:space-between; margin:8px 14px 0; font-size:14px; color:#DCD8FF}
.bline b{margin-left:8px}
.bfoot{display:grid; grid-template-columns:16% 48% 16%; justify-content:space-between; align-items:center; padding:0 3%; margin-top:14px}
.bfoot > *{grid-row:1}
.bfoot .aimbar, .bfoot .recall{grid-column:2}
.bfoot .undo, .bfoot .i3{grid-column:3}
.itm{grid-column:1; justify-self:center; width:100%; aspect-ratio:1; border-radius:50%; border:2px solid #FF3D5A; box-shadow:0 0 12px #FF3D5A; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.itm small{font-size:10px; margin-top:2px}
.itm:disabled{opacity:.35; box-shadow:none}
.recall{width:70%; aspect-ratio:2.1/1; justify-self:center; border:2px solid #FF3D5A; border-radius:10px; box-shadow:0 0 12px #FF3D5A, inset 0 0 8px rgba(255,61,90,.4); display:grid; place-items:center}
.undo{justify-self:center; width:100%; aspect-ratio:1; border-radius:50%; border:2px solid #FF3D5A; box-shadow:0 0 12px #FF3D5A; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1}
.undo small{font-size:10px; margin-top:3px}
.recall:disabled, .undo:disabled{opacity:.35; box-shadow:none}
.aimbar{height:56px; display:flex; align-items:center; touch-action:none; cursor:pointer}
.aimbar .track{position:relative; width:100%; margin:0 auto; height:16px; border:2px solid #E04BFF; border-radius:9px; box-shadow:0 0 10px #E04BFF, inset 0 0 6px rgba(224,75,255,.4)}
.aimbar .knob{position:absolute; top:50%; left:50%; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:#fff; box-shadow:0 0 12px #E04BFF}
.aimbar.drag .knob{transform:scale(1.12)}
.mode button.on{background:var(--grape); border-color:var(--grape); color:#fff}
.board{display:grid; width:100%; aspect-ratio:1; border:3px solid var(--edge); border-radius:10px; overflow:hidden; background:var(--edge); touch-action:manipulation}
.cell{display:grid; place-items:center; min-width:0; min-height:0; overflow:hidden; color:var(--cellink); font-family:"Jua",system-ui,sans-serif; user-select:none; -webkit-user-select:none; position:relative}
.fox .cell{font-size:clamp(16px,6vw,30px)}
.cell .x{font-size:.6em; opacity:.45}
.cell .x.auto{opacity:.22}
.cell.flash{animation:flash .5s}
@keyframes flash{0%,100%{box-shadow:none}30%{box-shadow:inset 0 0 0 99px rgba(255,77,77,.75)}}
.cell.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.25)}}
.mode{display:flex; gap:8px; margin-top:12px}
.mode button{flex:1; padding:12px; border-radius:16px; background:var(--card); border:2px solid var(--line); font-weight:700}
.mode button[aria-pressed="true"]{background:var(--grape); border-color:var(--grape); color:#fff}
.sud .cell{background:#FFFFFF; font-size:clamp(20px,7vw,30px)}
.sud .cell.given{color:#26215C}
.sud .cell.user{color:#4B3FA8}
.sud .cell.hl{background:#EEF0FF}
.sud .cell.sel{background:#FFE88A}
.sud .cell.same{background:#FFF4C2}
.shead{display:flex; align-items:center; justify-content:space-between; gap:6px; font-size:13px; color:#7A8BA6; margin:2px 2px 10px; white-space:nowrap}
.shead b{color:var(--ink); font-weight:700}
.sct{display:flex; align-items:center; gap:6px}
#sclock{font-variant-numeric:tabular-nums; font-weight:700; font-size:14px}
#spause{width:30px; height:30px; border-radius:50%; background:#EAEEF4; color:#344861; font-size:10px; letter-spacing:-1px}
.swrap{position:relative}
.s9{border:2px solid #344861; border-radius:4px; background:#344861; grid-template-columns:repeat(9,1fr); grid-template-rows:repeat(9,1fr)}
.s9 .cell{background:#FFFFFF; color:#344861; font-family:system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; font-size:clamp(18px,6vw,30px); font-weight:400}
.s9 .cell.user{color:#325AAF}
.s9 .cell.wrong{color:#E55C6C}
.s9 .cell.hl{background:#E2EBF3}
.s9 .cell.same{background:#C3D7EA}
.s9 .cell.sel{background:#BBDEFB}
.s9 .cell.wrong.sel, .s9 .cell.wrong.hl, .s9 .cell.wrong.same{background:#F7CFD6}
.nt{display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); width:100%; height:100%; font-size:clamp(8px,2.4vw,12px); color:#6E7C8C; line-height:1}
.nt span{display:grid; place-items:center}
.pcover{position:absolute; inset:0; background:#F4F6FA; border:2px solid #344861; border-radius:4px; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#344861; font-size:20px}
.pcover.on{display:flex}
.pcover button{padding:12px 22px; border-radius:16px; font-weight:700; font-size:15px}
.tools{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:14px}
.tools button{display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12px; color:#325AAF}
.tc{position:relative; width:52px; height:52px; border-radius:50%; background:#EAEEF4; display:grid; place-items:center; color:#344861}
.tools button.on .tc{background:#325AAF; color:#fff}
.tools button.used .tc{opacity:.45}
.tb{position:absolute; top:-6px; right:-10px; font-style:normal; font-size:10px; font-weight:700; background:#325AAF; color:#fff; border-radius:10px; min-width:22px; height:20px; display:grid; place-items:center; padding:0 5px; border:2px solid var(--bg)}
.tb.off{background:#AEB7C4}
.pad9{display:grid; grid-template-columns:repeat(9,1fr); gap:4px; margin-top:12px}
.pad9 button{background:#EAEEF4; border-radius:10px; padding:10px 0; font-family:system-ui, -apple-system, sans-serif; font-size:clamp(22px,7vw,30px); color:#325AAF}
.pad9 button:active{background:#C3D7EA}
.pad9 button.gone{visibility:hidden}
.pad{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-top:12px}
.pad button{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 0; font-family:"Jua",system-ui,sans-serif; font-size:24px}
.pad button:active{background:var(--lemon); color:#26215C}
.pad button.done{opacity:.3}
.modal.dark{background:#0B0A18; color:#EDEBFF; max-width:420px}
.modal.dark .note{color:#A9A5D8}
.modal.dark .b2{background:#1E1B38; color:#EDEBFF}
.sgrid{max-height:52vh; overflow-y:auto; margin:10px -4px 0; padding:4px; border:2px solid #3FA9F5; border-radius:14px; box-shadow:0 0 10px rgba(63,169,245,.6)}
.srow{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin:8px 0}
.stile{aspect-ratio:1/1.05; border-radius:10px; background:linear-gradient(#3A3325,#141210); border:2px solid #E0B84A; box-shadow:0 0 8px rgba(224,184,74,.55), inset 0 0 8px rgba(80,220,230,.25); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px}
.stile b{font-size:17px; font-weight:600}
.stile i{font-style:normal; font-size:11px; letter-spacing:-1px; color:#333}
.stile i .on{color:#9FD8FF; text-shadow:0 0 4px #3FA9F5}
.stile.lock{background:linear-gradient(#34322E,#1A1917); border-color:#8C8A80; box-shadow:none; opacity:.8}
.stile.lock i{color:#aaa; font-size:13px}
.stile.cur{border-color:#8FF0FF; box-shadow:0 0 12px #8FF0FF, inset 0 0 10px rgba(143,240,255,.35); transform:scale(1.05)}
.rstars{font-size:34px; letter-spacing:4px; color:#D6D3EA; margin:4px 0 -4px}
.rstars .on{color:#FFC93C; text-shadow:0 0 8px rgba(255,201,60,.6)}
.tdwrap{position:fixed; top:0; bottom:0; left:0; right:0; margin:0 auto; max-width:640px; z-index:5; box-sizing:border-box; overflow:hidden; background:#1B2A12;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); box-shadow:0 0 0 1px #0A1006, 0 0 60px rgba(0,0,0,.6)}
.tcv{display:block; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; background:#1B2A12}
.modal.wood .mbtns .b2.quiet{background:none!important; box-shadow:none!important; border:0!important; color:#F3DDB8; text-shadow:none; text-decoration:underline; text-underline-offset:4px; height:40px; min-height:0}
.modal.wood .mbtns .b2.quiet::before{display:none}
.modal.wood{background:linear-gradient(#8A5D34,#6B4424); color:#FFF3DC; border:4px solid #4A2F17; box-shadow:inset 0 0 0 3px #A77A4A}
.modal.wood .note{color:#F3DDB8}
.modal.wood .b2{background:#4A2F17; color:#FFF3DC}
.modal.wood .b1{background:#E8A33A; color:#3B2A1A}
.modal.wood .sgrid{border-color:#E8C27A; box-shadow:none}
/* 레퍼런스 게임 화면 보정(가독성) */
.nbtn small{font-size:11px} .itm small, .undo small{font-size:11px}
.stile i{color:#6E6A60}
#spause{width:44px; height:44px}
.shead{font-size:13px}
.board{border-width:2px; border-radius:16px}
/* ===== 여우 자리 찾기(레퍼런스 화면) ===== */
body.fxmode{background:#F5EEEB}
body.fxmode #play > .pbar, body.fxmode #play > .stats{display:none!important}
.fxg{--ink:#7A4450; color:#7A4450; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none}
.fx-top{display:grid; grid-template-columns:52px 1fr 52px; align-items:center; margin:4px 0 10px}
.fx-round{width:52px; height:52px; border-radius:50%; background:#fff; box-shadow:0 4px 10px rgba(122,68,80,.12); display:grid; place-items:center}
.fx-round svg{width:26px; height:26px}
.fx-lv{display:flex; justify-content:center; gap:36px; text-align:center; line-height:1.15}
.fx-lv small{display:block; font-size:15px; font-weight:500}
.fx-lv b{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums}
.fx-row{display:flex; justify-content:center; gap:14px; margin-bottom:10px}
.fx-pill{height:46px; padding:0 16px; border-radius:23px; background:#fff; display:flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(122,68,80,.06)}
.fx-paw svg{width:30px; height:30px; display:block; fill:#F58A3A}
.fx-paw.off svg{fill:#F1E1D8}
.fx-paw.lost{animation:pawlost .5s}
@keyframes pawlost{0%{transform:scale(1.3)}30%{transform:translateX(-4px) rotate(-10deg)}60%{transform:translateX(4px) rotate(10deg)}}
.fx-w svg{width:30px; height:30px; display:block}
.fx-time{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; min-width:62px}
.fx-bar{display:flex; justify-content:center; gap:3px; padding:6px 12px; margin:0 auto 10px; border-radius:24px; background:#fff; box-shadow:0 2px 6px rgba(122,68,80,.06); width:fit-content; max-width:100%}
.fx-head{width:28px; height:27px; display:block}
.fx-head svg{width:100%; height:100%; display:block}
.fx-head:not(.on){opacity:.62}
.fx-head.pop{animation:headpop .5s}
@keyframes headpop{40%{transform:scale(1.45) translateY(-4px)}}
.fx-rules{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:10px; border-radius:20px; background:#fff; margin-bottom:12px}
.frule{word-break:keep-all; display:flex; align-items:center; gap:6px; padding:8px 7px; border-radius:12px; background:#F9EEEA; font-size:12.5px; line-height:1.3; font-weight:500; min-width:0}
.frule-ico{width:26px; height:26px; flex:none}
.fx-board{--n:9; position:relative; display:grid; grid-template-columns:repeat(var(--n),minmax(0,1fr)); grid-template-rows:repeat(var(--n),minmax(0,1fr)); gap:calc(26px / var(--n)); padding:8px; border-radius:20px; background:#fff; aspect-ratio:1; touch-action:none; box-shadow:0 4px 14px rgba(122,68,80,.08)}
.fx-wait{grid-column:1/-1; align-self:center; text-align:center; font-weight:700; color:#B08A92}
.fxc{aspect-ratio:1; min-width:0; min-height:0; border-radius:22%; display:grid; place-items:center; position:relative; overflow:visible; cursor:pointer}
.fxc svg{width:74%; height:74%; pointer-events:none}
.fxc.fox svg{width:96%; height:96%; filter:drop-shadow(0 2px 1px rgba(0,0,0,.18))}
.fxc.in{animation:cellin .38s cubic-bezier(.2,1.4,.5,1) both}
@keyframes cellin{from{transform:scale(.15); opacity:0}}
.fxc.pop svg{animation:foxpop .45s cubic-bezier(.2,1.6,.5,1)}
@keyframes foxpop{from{transform:scale(.2) rotate(-20deg)}}
.fxc.dance svg{animation:foxdance .5s ease-in-out both}
@keyframes foxdance{40%{transform:translateY(-22%) scale(1.15)}}
.fx-board.shake{animation:shake .35s}
.fx-tools{display:flex; justify-content:center; gap:28px; margin:22px 0 6px}
.fx-tool{position:relative; width:68px; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#7A4450}
.fx-tool > svg{width:68px; height:68px; padding:17px; border-radius:50%; background:#fff; box-shadow:0 4px 12px rgba(122,68,80,.14); box-sizing:border-box}
.fx-tool i{position:absolute; top:-6px; right:-8px; min-width:30px; height:26px; padding:0 7px; border-radius:13px; background:#E53935; color:#fff; font-style:normal; font-size:14px; font-weight:800; display:grid; place-items:center; border:2px solid #F5EEEB}
.fx-tool:disabled{opacity:.45}
.fx-tip{text-align:center; font-size:13px; color:#A07A82; margin:10px 0 0}
/* ===== 여우 효과(효과팀) ===== */
.fxfx{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:30}
.fxfloat{position:fixed; transform:translate(-50%,-50%); pointer-events:none; z-index:19; font-weight:800; font-size:22px; color:#fff; -webkit-text-stroke:4px #7A4450; paint-order:stroke fill; animation:floatup 1.2s cubic-bezier(.2,.8,.3,1) forwards; white-space:nowrap}
.fxfloat.bad{color:#FF6A2B}
@keyframes floatup{0%{opacity:0; transform:translate(-50%,-30%) scale(.5)} 15%{opacity:1; transform:translate(-50%,-70%) scale(1.25)} 30%{transform:translate(-50%,-90%) scale(1)} 100%{opacity:0; transform:translate(-50%,-260%) scale(1)}}
.fxfly{position:fixed; z-index:19; pointer-events:none; filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.fxfly svg{width:100%; height:100%; display:block}
.fxc.glow{animation:regglow .55s ease-out both}
@keyframes regglow{35%{filter:brightness(1.35) saturate(1.2); transform:scale(1.07)}}
.fxc.pop{z-index:2}
.fxc.pop svg{animation:foxpop2 .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes foxpop2{0%{transform:scale(.1) rotate(-30deg)} 55%{transform:scale(1.35) rotate(8deg)} 100%{transform:scale(1) rotate(0)}}
.fxc.bad{z-index:2; animation:badcell .5s ease-out}
.fxc.bad svg{animation:xslam .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes badcell{0%,40%{box-shadow:0 0 0 4px #FF3B30, 0 0 18px 6px rgba(255,59,48,.7); filter:brightness(.8) saturate(1.4)} 100%{box-shadow:none}}
@keyframes xslam{0%{transform:scale(2.6) rotate(-35deg); opacity:0} 60%{transform:scale(.85) rotate(4deg); opacity:1} 100%{transform:scale(1) rotate(0)}}
.fxc.conflict{z-index:2; animation:conflict .45s ease-in-out 3}
@keyframes conflict{50%{box-shadow:0 0 0 4px #FF3B30, 0 0 16px rgba(255,59,48,.8); transform:scale(1.1)}}
.fx-board.shake2{animation:shake2 .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake2{10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(5px)} 30%,50%,70%{transform:translateX(-9px) rotate(-.6deg)} 40%,60%{transform:translateX(9px) rotate(.6deg)}}
.fxvig{position:fixed; inset:0; pointer-events:none; z-index:17; box-shadow:inset 0 0 90px 30px rgba(255,40,30,.55); animation:vig .6s ease-out forwards}
@keyframes vig{0%{opacity:0} 20%{opacity:1} 100%{opacity:0}}
.fxbubble{position:fixed; z-index:19; pointer-events:none; background:#3A2A30; color:#fff; font-size:14px; font-weight:700; padding:9px 13px; border-radius:12px; white-space:nowrap; box-shadow:0 6px 16px rgba(0,0,0,.25); animation:bubin .25s cubic-bezier(.2,1.5,.5,1)}
.fxbubble::after{content:""; position:absolute; left:calc(var(--ax) - 7px); border:7px solid transparent}
.fxbubble.up::after{top:100%; border-top-color:#3A2A30}
.fxbubble.down::after{bottom:100%; border-bottom-color:#3A2A30}
.fxbubble.out{opacity:0; transition:opacity .35s}
@keyframes bubin{from{transform:scale(.6); opacity:0}}
.fxcombo{position:fixed; z-index:19; pointer-events:none; transform:translate(-50%,0); display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; background:linear-gradient(90deg,#FF8A3D,#FF5C8A); color:#fff; box-shadow:0 8px 20px rgba(255,92,138,.4); animation:combo 1.2s cubic-bezier(.2,1.4,.4,1) forwards}
.fxcombo b{font-size:20px; font-weight:800}
.fxcombo span{font-size:15px; font-weight:700}
.fxcombo.max{background:linear-gradient(90deg,#FFB300,#FF5C8A,#8E6BD1)}
@keyframes combo{0%{opacity:0; transform:translate(-50%,10px) scale(.4)} 18%{opacity:1; transform:translate(-50%,0) scale(1.15)} 30%{transform:translate(-50%,0) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-14px)}}
#fxScore.bump{display:inline-block; animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.35); color:#FF8A3D}}
.fx-pill.hurt{animation:hurt .5s}
@keyframes hurt{30%{background:#FFE1DC; transform:scale(1.08)}}
.fx-paw.last svg{animation:lastpaw 1s ease-in-out infinite; fill:#FF5A3C}
@keyframes lastpaw{50%{transform:scale(1.25); filter:drop-shadow(0 0 6px rgba(255,60,40,.8))}}
.fx-board.danger{box-shadow:0 0 0 3px rgba(255,90,60,.55), 0 4px 14px rgba(122,68,80,.08)}
.fxlast{position:absolute; left:50%; top:-14px; transform:translateX(-50%); background:#FF5A3C; color:#fff; font-size:13px; font-weight:800; padding:4px 12px; border-radius:999px; z-index:3; white-space:nowrap; animation:lastin .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes lastin{from{transform:translateX(-50%) scale(.3)}}
.fxstamp{white-space:nowrap; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-12deg); z-index:4; font-size:clamp(40px,13vw,60px); font-weight:800; color:#FF5C8A; background:rgba(255,255,255,.9); border:6px solid #FF5C8A; border-radius:22px; padding:6px 26px; pointer-events:none; animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3); opacity:0} 100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1); opacity:1}}
.fx-snd{width:46px; height:46px; border-radius:50%; background:#fff; display:grid; place-items:center; box-shadow:0 2px 6px rgba(122,68,80,.06)}
.fx-snd svg{width:24px; height:24px}
.fx-lost{position:fixed; z-index:19; pointer-events:none; width:30px; height:30px}
.fx-lost svg{width:100%; height:100%; fill:#F58A3A}
@media (prefers-reduced-motion: reduce){ .fxfloat,.fxcombo{animation-duration:.01s} }
/* ===== 함대 결전(해전 전략) ===== */
body.flmode{background:radial-gradient(120% 55% at 50% 0%,#11355A 0%,#071A2E 55%,#050F1C 100%) fixed #050F1C}
body.flmode #play > .pbar, body.flmode #play > .stats{display:none!important}
.flg{color:#E6F4FF; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.fl-top{display:grid; grid-template-columns:44px 1fr 44px 44px; align-items:center; gap:8px; margin:0 0 10px}
.fl-rb{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:rgba(140,200,255,.1); box-shadow:inset 0 0 0 1px rgba(140,200,255,.25); color:#CFE8FF}
.fl-rb svg{width:22px; height:22px}
.fl-vs{text-align:center; min-width:0; line-height:1.15}
.fl-vs b{display:block; font-family:var(--disp); font-weight:400; font-size:18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fl-turn{display:inline-flex; align-items:center; gap:6px; height:24px; margin-top:4px; padding:0 11px; border-radius:999px; font-size:12px; font-weight:800; background:rgba(255,255,255,.08); color:#A9CBE6; font-variant-numeric:tabular-nums; transition:background .25s, color .25s, box-shadow .25s}
.fl-turn i{width:7px; height:7px; border-radius:50%; background:currentColor}
.fl-turn.me{background:#22D3A6; color:#03261C; box-shadow:0 0 16px rgba(34,211,166,.55)}
.fl-turn.me i{animation:flblink 1s infinite}
.fl-turn.op{background:#FF5E62; color:#2B0507}
.fl-turn.op i{animation:flblink .5s infinite}
@keyframes flblink{50%{opacity:.2}}
.fl-panel{position:relative; border-radius:18px; padding:10px 10px 12px; margin-bottom:10px; background:linear-gradient(180deg,#0D2B47,#081C31); box-shadow:inset 0 0 0 1px rgba(130,195,255,.2), 0 12px 28px rgba(0,0,0,.35)}
.fl-panel.dim .fl-sea{filter:saturate(.75) brightness(.82)}
.fl-head{display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:22px; margin:0 2px 4px; font-size:12px; font-weight:700; color:#8DB4D4}
.fl-head b{color:#E6F4FF}
.fl-head > span:first-child{min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fl-fleet{flex:none}
.fl-fleet{display:flex; align-items:center; gap:5px}
.fl-mini{display:block; height:13px; transition:opacity .3s, filter .3s}
.fl-mini.dead{opacity:.2; filter:grayscale(1)}
.fl-board{position:relative; margin:16px 0 0 14px}
.fl-lx, .fl-ly{position:absolute; display:grid; font-size:10px; font-weight:700; color:#6F97B8; pointer-events:none}
.fl-lx{left:0; right:0; top:-15px; height:14px; grid-template-columns:repeat(10,1fr); text-align:center; line-height:14px}
.fl-ly{top:0; bottom:0; left:-15px; width:14px; grid-template-rows:repeat(10,1fr); align-items:center; text-align:center}
.fl-sea{position:relative; display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); grid-template-rows:repeat(10,minmax(0,1fr)); aspect-ratio:1; border-radius:10px; overflow:hidden; touch-action:manipulation; transition:filter .4s;
  background:radial-gradient(130% 90% at 25% 0%,#1C73AE 0%,#0F4A7A 45%,#0A2C4E 100%); box-shadow:inset 0 0 0 1.5px rgba(140,210,255,.35), inset 0 0 28px rgba(0,0,0,.45)}
.fl-sea::before{content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background-image:linear-gradient(rgba(170,225,255,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(170,225,255,.13) 1px,transparent 1px); background-size:10% 10%}
.fl-sea::after{content:""; position:absolute; inset:-20%; z-index:0; pointer-events:none; background:repeating-linear-gradient(160deg,rgba(255,255,255,.05) 0 6px,transparent 6px 22px); animation:flwave 9s linear infinite}
@keyframes flwave{to{transform:translate(12%,6%)}}
.fl-radar{position:absolute; left:50%; top:50%; width:150%; aspect-ratio:1; margin:-75% 0 0 -75%; z-index:1; pointer-events:none; border-radius:50%; background:conic-gradient(from 0deg,rgba(60,255,200,0) 0deg 290deg,rgba(60,255,200,.16) 340deg,rgba(150,255,225,.45) 359deg,rgba(60,255,200,0) 360deg); opacity:0; transition:opacity .4s; animation:flspin 3.4s linear infinite}
.fl-sea.live .fl-radar{opacity:1}
@keyframes flspin{to{transform:rotate(360deg)}}
.fl-ships{position:absolute; inset:0; z-index:3; pointer-events:none}
.fl-ship{position:absolute; transition:left .18s, top .18s, filter .2s}
.fl-ships.edit .fl-ship{pointer-events:auto; cursor:grab; touch-action:none}
.fl-ship svg{display:block; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}
.fl-ship.drag{z-index:5; transition:none}
.fl-ship.drag svg{filter:drop-shadow(0 0 7px rgba(120,255,210,.95))}
.fl-ship.bad svg{filter:drop-shadow(0 0 7px rgba(255,70,70,.95)) saturate(.5)}
.fl-ship.wreck svg{filter:grayscale(.8) brightness(.5) sepia(.5) hue-rotate(-25deg) drop-shadow(0 0 5px rgba(255,80,40,.6))}
.fl-ship.ghost{opacity:.6}
.fl-ship.ghost svg{filter:drop-shadow(0 0 5px rgba(255,255,255,.5))}
.fl-ship.pop{animation:flshipin .55s cubic-bezier(.2,1.5,.5,1) both}
@keyframes flshipin{from{transform:scale(.3) translateY(-30%); opacity:0}}
.fl-ship.bob{animation:flbob 1.1s ease-in-out infinite}
@keyframes flbob{50%{transform:translateY(-7%)}}
.fl-ship.nudge{animation:shake .35s}
.fl-c{position:relative; z-index:4; display:grid; place-items:center; min-width:0; min-height:0; border-radius:3px; transition:background .15s}
.fl-sea > .fl-c{aspect-ratio:1}   /* 일부 Chrome에서 빈 칸 높이가 0이 되어 눌리지 않던 문제 */
button.fl-c{cursor:crosshair}
@media (hover:hover){ button.fl-c:not(.done):hover{background:rgba(120,230,255,.16)} }
.fl-c.hl{background:rgba(255,90,90,.1)}
.fl-c.aim{background:rgba(255,90,90,.24)}
.fl-c .xh{position:absolute; inset:-22%; pointer-events:none; animation:fllock .35s cubic-bezier(.2,1.3,.5,1)}
.fl-c .xh svg{width:100%; height:100%; display:block; animation:flspin 4s linear infinite}
@keyframes fllock{from{transform:scale(2.4) rotate(-90deg); opacity:0}}
.fl-miss::after{content:""; width:30%; aspect-ratio:1; border-radius:50%; background:#DDF1FF; box-shadow:0 0 0 3px rgba(221,241,255,.22), 0 0 8px rgba(190,230,255,.6); animation:flmark .35s cubic-bezier(.2,1.6,.5,1)}
@keyframes flmark{from{transform:scale(0)}}
.fl-hit{background:radial-gradient(circle,rgba(255,110,40,.6),rgba(255,60,30,.14) 60%,transparent 72%)}
.fl-hit .fl-flame{width:76%; height:76%; transform-origin:50% 90%; animation:flflame .5s ease-in-out infinite alternate; filter:drop-shadow(0 0 4px rgba(255,140,40,.9)); pointer-events:none}
@keyframes flflame{from{transform:scaleY(.88) rotate(-5deg)} to{transform:scaleY(1.12) rotate(5deg)}}
.fl-hit::before{content:""; position:absolute; left:33%; top:5%; width:34%; aspect-ratio:1; border-radius:50%; background:rgba(70,70,80,.6); filter:blur(2px); animation:flsmoke 1.7s ease-out infinite; pointer-events:none}
@keyframes flsmoke{from{transform:translateY(0) scale(.5); opacity:.85} to{transform:translateY(-130%) scale(1.7); opacity:0}}
.fl-sunk{background:radial-gradient(circle,rgba(255,60,40,.35),rgba(120,20,20,.25) 70%)}
.fl-sea.small .fl-hit::before{display:none}
.fl-bar{display:grid; grid-template-columns:auto auto 1fr; gap:14px; align-items:center; margin-top:10px}
.fl-stat{line-height:1.1; min-width:44px}
.fl-stat small{display:block; font-size:11px; color:#7FA6C6; font-weight:700}
.fl-stat b{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums}
.fl-fire{height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:17px; color:#fff; background:linear-gradient(180deg,#FF6B4A,#E0322E); box-shadow:0 6px 18px rgba(255,70,50,.45), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .08s, opacity .2s, filter .2s}
.fl-fire:active{transform:scale(.97)}
.fl-fire svg{width:24px; height:24px}
.fl-fire small{font-size:14px; opacity:.95; font-weight:800; font-variant-numeric:tabular-nums}
.fl-fire:disabled{filter:grayscale(.85) brightness(.65); box-shadow:none}
.fl-fire.ready{animation:flready 1.1s ease-in-out infinite}
@keyframes flready{50%{box-shadow:0 6px 28px rgba(255,90,60,.9), inset 0 1px 0 rgba(255,255,255,.35)}}
.fl-mewrap{display:grid; grid-template-columns:54% 1fr; gap:10px; align-items:start}
.fl-mewrap .fl-board{margin:15px 0 0 12px}
.fl-mewrap .fl-lx, .fl-mewrap .fl-ly{font-size:8.5px}
.fl-mewrap .fl-lx{top:-13px} .fl-mewrap .fl-ly{left:-13px; width:12px}
.fl-side{min-width:0}
.fl-row{display:flex; align-items:center; gap:6px; min-height:24px; font-size:12px; font-weight:700; color:#CFE3F5}
.fl-row .fl-mini{height:10px; flex:none}
.fl-row span{flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fl-pips{display:flex; gap:2px; flex:none}
.fl-pips i{width:6px; height:6px; border-radius:2px; background:#3DDBA8}
.fl-pips i.x{background:#FF5E62}
.fl-row.dead{opacity:.45}
.fl-row.dead span{text-decoration:line-through}
.fl-log{margin-top:8px; padding:7px 9px; border-radius:12px; background:rgba(0,0,0,.28); font-size:11.5px; line-height:1.5; color:#BFD8EE; min-height:58px}
.fl-log div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fl-log div:first-child{color:#fff}
.fl-log .h{color:#FF9A6B} .fl-log .m{color:#8FD3FF} .fl-log .s{color:#FFD84A}
.fl-xh{position:absolute; z-index:6; width:10%; height:10%; pointer-events:none; transition:left .2s cubic-bezier(.3,.8,.4,1), top .2s cubic-bezier(.3,.8,.4,1); opacity:0}
.fl-xh.on{opacity:1}
.fl-xh svg{position:absolute; left:-30%; top:-30%; width:160%; height:160%}
.fl-xh.lock svg{animation:fllock2 .3s ease-out}
@keyframes fllock2{50%{transform:scale(.65)}}
.fl-shell{position:fixed; z-index:19; left:0; top:0; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; background:#FFF3C4; box-shadow:0 0 10px 4px rgba(255,190,80,.85), 0 0 22px 8px rgba(255,120,40,.45); pointer-events:none}
.fl-shell.en{background:#FFD6D6; box-shadow:0 0 10px 4px rgba(255,90,90,.85), 0 0 22px 8px rgba(255,40,40,.45)}
.fl-banner{position:absolute; left:50%; top:46%; z-index:8; transform:translate(-50%,-50%); pointer-events:none; white-space:nowrap; text-align:center; font-family:var(--disp); font-size:clamp(28px,9vw,40px); line-height:1.15; color:#fff; padding:8px 24px; border-radius:18px; background:rgba(6,20,35,.8); box-shadow:0 0 0 2px rgba(255,255,255,.2), 0 12px 30px rgba(0,0,0,.45); animation:flban 1.6s cubic-bezier(.2,1.2,.4,1) forwards}
.fl-banner small{display:block; font-family:var(--font); font-size:13px; font-weight:700; color:rgba(255,255,255,.85)}
.fl-banner.hot{background:linear-gradient(90deg,rgba(190,35,20,.94),rgba(255,120,40,.94))}
.fl-banner.good{background:linear-gradient(90deg,rgba(12,140,112,.94),rgba(35,170,220,.94))}
.fl-banner.stay{animation:flban2 .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes flban{0%{opacity:0; transform:translate(-50%,-50%) scale(.4)} 14%{opacity:1; transform:translate(-50%,-50%) scale(1.08)} 24%{transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-75%)}}
@keyframes flban2{from{opacity:0; transform:translate(-50%,-50%) scale(2.2) rotate(-8deg)} to{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-4deg)}}
.fl-panel.shake{animation:shake2 .45s cubic-bezier(.36,.07,.19,.97)}
.fl-flash{position:absolute; inset:0; z-index:7; border-radius:18px; pointer-events:none; background:radial-gradient(circle,rgba(255,225,160,.6),rgba(255,80,40,.2) 60%,transparent); animation:flfl .5s ease-out forwards}
@keyframes flfl{from{opacity:1} to{opacity:0}}
.fxfloat.flf{font-size:20px; -webkit-text-stroke:4px #06213A}
.fxfloat.flf.h{color:#FFB347}
.fxfloat.flf.m{color:#CFEFFF}
.fxfloat.flf.s{color:#FFE45C; font-size:26px}
.fl-roster{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.fl-chip{display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px; border-radius:999px; background:rgba(140,200,255,.1); font-size:12px; font-weight:700; color:#CFE3F5}
.fl-chip .fl-mini{height:10px}
.fl-pbtns{display:grid; grid-template-columns:1fr 1.6fr; gap:8px; margin-top:12px}
.fl-sbtn{height:52px; border-radius:14px; font-weight:700; font-size:15px; background:rgba(140,200,255,.12); box-shadow:inset 0 0 0 1px rgba(140,200,255,.28); color:#DDEEFF; display:flex; align-items:center; justify-content:center; gap:6px}
.fl-sbtn svg{width:20px; height:20px}
.fl-go{height:52px; border-radius:14px; font-weight:800; font-size:16px; color:#03261C; background:linear-gradient(180deg,#4BE9C0,#1FBF94); box-shadow:0 6px 18px rgba(34,211,166,.4)}
.fl-go:active, .fl-sbtn:active{transform:scale(.97)}
.fl-tip{font-size:12.5px; color:#7FA6C6; text-align:center; margin:4px 4px 0; line-height:1.5}
.fl-searchp{text-align:center; padding:24px 16px 18px}
.fl-rbig{position:relative; width:min(220px,60vw); aspect-ratio:1; margin:4px auto 18px; border-radius:50%; overflow:hidden; background:radial-gradient(circle,#0F3E3C 0%,#062220 72%); box-shadow:0 0 0 2px rgba(60,255,200,.35), 0 0 44px rgba(60,255,200,.2), inset 0 0 30px rgba(0,0,0,.6)}
.fl-rbig::before{content:""; position:absolute; inset:0; background:repeating-radial-gradient(circle,transparent 0 17%,rgba(60,255,200,.24) 17% 17.6%), linear-gradient(rgba(60,255,200,.2),rgba(60,255,200,.2)) 50% 0/1px 100% no-repeat, linear-gradient(90deg,rgba(60,255,200,.2),rgba(60,255,200,.2)) 0 50%/100% 1px no-repeat}
.fl-rbig i{position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 0deg,rgba(60,255,200,0) 0deg 280deg,rgba(60,255,200,.25) 340deg,rgba(170,255,230,.75) 359deg,rgba(60,255,200,0) 360deg); animation:flspin 2.4s linear infinite}
.fl-blip{position:absolute; width:10px; height:10px; margin:-5px; border-radius:50%; background:#7CFFD9; box-shadow:0 0 10px #7CFFD9; opacity:0; animation:flblip 2.4s ease-out infinite}
.fl-rbig.found .fl-blip{animation:none; opacity:1; background:#FFE45C; box-shadow:0 0 16px #FFE45C; width:16px; height:16px; margin:-8px}
.fl-rbig.found i{animation-duration:.8s}
@keyframes flblip{0%,62%{opacity:0; transform:scale(.4)} 66%{opacity:1; transform:scale(1.4)} 100%{opacity:0; transform:scale(1)}}
.fl-st{font-family:var(--disp); font-weight:400; font-size:22px; margin:0 0 4px}
.fl-sn{font-size:13.5px; color:#8DB4D4; margin:0 0 18px; line-height:1.55}
.fl-sbtns{display:flex; flex-direction:column; gap:8px}
.opt .livedot{width:12px; height:12px; border-radius:50%; background:var(--success); box-shadow:0 0 0 4px color-mix(in srgb, var(--success) 22%, transparent); margin-left:6px; animation:flblink 1.4s infinite}
.opt .livedot.off{background:var(--line); box-shadow:none; animation:none}
.opt:disabled{opacity:.5}
.optsep{font-size:12px; font-weight:700; color:var(--sub); margin:8px 4px 0}
/* ===== 로비 디자인 v2: 스테이지 맵·일시정지 창(네온/나무) 보정 ===== */
.modal.dark{background:linear-gradient(180deg,#15112F,#0B0A18); color:#EDEBFF; border-color:#3FA9F5; box-shadow:0 0 0 3px #0B1A2B, 0 0 26px rgba(63,169,245,.45), 0 22px 44px rgba(0,0,0,.55)}
.modal.dark h3{background:linear-gradient(180deg,#5C4BD8,#2E2385); border-color:#3FA9F5; text-shadow:0 0 8px rgba(63,169,245,.8), 0 2px 0 #0B1A2B; box-shadow:0 0 12px rgba(63,169,245,.5)}
.modal.dark .b2{--c1:#3A3566; --c2:#1E1B38; --c3:#07061A; background:linear-gradient(180deg,var(--c1),var(--c2)); color:#EDEBFF}
.modal.wood{box-shadow:inset 0 0 0 3px #A77A4A, 0 8px 0 #2A1A0C, 0 26px 50px rgba(0,0,0,.5)}
.modal.wood h3{background:linear-gradient(180deg,#F2B84B,#C27A1E); border-color:#4A2F17; text-shadow:0 2px 0 #4A2F17; box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 #2A1A0C}
.modal.wood .b1{--c1:#FFD27A; --c2:#E8A33A; --c3:#6B4424; background:linear-gradient(180deg,var(--c1),var(--c2)); color:#3B2A1A; text-shadow:0 1px 0 rgba(255,255,255,.45)}
.modal.wood .b2{--c1:#8A5D34; --c2:#5A3A1E; --c3:#2A1A0C; background:linear-gradient(180deg,var(--c1),var(--c2)); color:#FFF3DC}
.modal.dark .legend, .modal.wood .legend{font-family:var(--disp); font-size:14px}
.pcover .b1{height:52px; padding:0 26px; border-radius:16px; font-family:var(--disp); font-size:17px}

/* ===== 두뇌 지수(실력+끈기) — 기획·게임제작·디자인·마케팅 회의 결론 ===== */
:root{--grit:#FF7A1F; --grit2:#E0480E; --grit3:#8A2A00}
.tagline{margin:-26px 0 30px; text-align:center; font-family:var(--disp); font-size:16px; color:#E9E2FF; text-shadow:0 2px 0 var(--outline2)}
.tagline b{font-weight:400; color:#FFD35C}
.hero-score .n em{white-space:nowrap}
.bq-split{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0 0}
.bq-part{border-radius:16px; padding:10px 12px 11px; background:#170C45; box-shadow:inset 0 3px 6px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.16); display:flex; flex-direction:column; gap:1px; min-width:0; text-align:left}
.bq-part .lb{display:flex; align-items:center; gap:5px; font-family:var(--disp); font-size:14px; color:#CDBDFF}
.bq-part .lb .ico{width:16px; height:16px}
.bq-part.grit .lb{color:#FFB070}
.bq-part .v{font-family:var(--heavy); font-size:26px; line-height:1.1; color:#fff; letter-spacing:.3px}
.bq-part .v small{font-family:var(--heavy); font-size:13px; color:#9C8FD6}
.bq-part .ex{font-size:12px; font-weight:700; color:#B7ABE8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bq-part .ex b{color:#fff}
.bar{height:8px; border-radius:4px; background:#0D0630; overflow:hidden; margin-top:6px; box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.bar i{display:block; height:100%; border-radius:4px; background:linear-gradient(90deg,#9C7BFF,#C9B6FF); transition:width .6s}
.bq-part.grit .bar i{background:linear-gradient(90deg,#FF9A3C,#FFD35C)}
.gritcard{width:100%; margin-top:22px; padding:12px 12px 12px 14px; display:grid; grid-template-columns:52px 1fr 26px; gap:12px; align-items:center; text-align:left; transition:transform .08s}
.gritcard:active{transform:translateY(3px)}
.flame{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; color:#fff; background:linear-gradient(180deg,#FFB36B,var(--grit) 55%,var(--grit2)); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 3px 0 var(--outline2)}
.flame .ico{width:30px; height:30px; filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.flame.off{background:linear-gradient(#D9CDB6,#B9A987); color:#fff}
.gc-t{display:block; font-family:var(--disp); font-size:18px; line-height:1.25; color:var(--ink)}
.gc-s{display:block; font-size:12.5px; font-weight:700; color:var(--sub); line-height:1.35}
.week{display:flex; gap:4px; margin-top:7px}
.wd{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; font-family:var(--disp); font-size:13px; color:#B7A27A; background:#EFE3CB; box-sizing:border-box}
.wd.att{color:#fff; background:linear-gradient(#FFA34F,var(--grit2)); border:2px solid var(--grit3); text-shadow:0 1px 0 var(--grit3)}
.wd.rest{background:#fff; border:2px dashed var(--grit); color:var(--grit)}
.wd.today{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--grit)}
.gc-go{color:var(--sub)}
.gc-go .ico{width:22px; height:22px}
.tabs{display:flex; justify-content:center; gap:6px; margin:-4px 0 12px}
.tabs button{height:38px; padding:0 18px; border-radius:12px; font-family:var(--disp); font-size:15px; color:#CFC5FF; background:#170C45; box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.tabs button[aria-pressed="true"]{color:#5A3300; background:linear-gradient(#FFE98E,#FFB020); border:2.5px solid #9A5A00; box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 3px 0 #9A5A00}
.streak{display:inline-flex; align-items:center; gap:2px; color:var(--grit2); font-weight:800}
.streak .ico{width:13px; height:13px; vertical-align:-2px}
.rank-note{font-size:12.5px; color:#B9AEE6; margin:10px 4px 0; text-align:center}
.pill.grit{background:#FFF0E2; color:#B8420A; border-color:#FFB98A}
.pill .ico{width:16px; height:16px}
/* 두뇌 리포트 */
.rp-kicker{font-size:13px; color:var(--sub); font-weight:700; margin:2px 0 0}
.rp-type{font-family:var(--heavy); font-size:32px; line-height:1.2; margin:2px 0 0; color:#FFC93C; -webkit-text-stroke:6px var(--outline); paint-order:stroke fill; text-shadow:0 4px 0 var(--outline)}
.rp-desc{font-size:14px; color:var(--sub); margin:6px 0 0}
.radar{width:100%; max-width:300px; margin:2px auto 0; display:block}
.rp-sec{text-align:left; margin-top:14px; padding:12px; background:#fff; border:2px solid var(--paper-line); border-radius:16px}
.rp-sec h4{margin:0 0 10px; font-family:var(--disp); font-weight:400; font-size:18px; color:var(--ink); display:flex; justify-content:space-between; align-items:center; gap:8px}
.rp-sec h4 small{font-family:var(--font); font-size:12px; color:var(--sub); font-weight:700}
.rp-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.rp-stat{background:var(--paper); border:2px solid var(--paper-line); border-radius:14px; padding:8px 4px; text-align:center}
.rp-stat b{display:block; font-family:var(--heavy); font-weight:400; font-size:22px; color:var(--ink); letter-spacing:.3px}
.rp-stat span{font-size:12px; font-weight:700; color:var(--sub)}
.rp-stat.hot b{color:var(--grit2)}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:12px}
.cal .h{font-size:11px; color:var(--sub); text-align:center; font-weight:800}
.cal .c{aspect-ratio:1; border-radius:8px; display:grid; place-items:center; font-size:12px; font-weight:800; background:#F4ECDC; color:#B7A27A; box-sizing:border-box}
.cal .c.att{color:#fff; background:linear-gradient(#FFA34F,var(--grit2)); border:2px solid var(--grit3)}
.cal .c.rest{background:#fff; border:2px dashed var(--grit); color:var(--grit)}
.cal .c.miss{opacity:.5}
.cal .c.fut{background:transparent; color:#D9CCB0}
.cal .c.today{box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--grit)}
.cal .c.blank{background:none}
.legend2{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; font-size:12px; font-weight:700; color:var(--sub); margin-top:10px}
.legend2 i{display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px; box-sizing:border-box}
.tickets{display:flex; gap:4px; align-items:center; margin-top:10px; font-size:12.5px; color:var(--sub); font-weight:500}
.tickets .ico{width:24px; height:24px; color:var(--grit)}
.tickets .ico.off{color:#E3D6BC}
.tickets span{margin-left:4px}
.mrow{display:flex; justify-content:space-between; padding:8px 2px; font-size:14px; color:var(--sub); border-top:2px dashed var(--paper-line)}
.mrow:first-of-type{border-top:0}
.mrow b{color:var(--ink); font-variant-numeric:tabular-nums}
.mrow.tot b{font-family:var(--heavy); font-weight:400; font-size:20px; color:var(--primary)}
.sharebox{background:#fff; border:2px solid var(--paper-line); border-radius:14px; padding:12px 14px; text-align:left; white-space:pre-wrap; font-size:14px; line-height:1.65; margin-top:10px; font-family:var(--font); color:var(--ink); user-select:all; -webkit-user-select:all}
.hstep .hn .ico{width:26px; height:26px}

/* ===== v4: 메인 간소화(탭 4개) + 모험(save) 모드 + 성장 축하 ===== */
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body[data-mode] .wrap{padding-bottom:44px}
/* HUD: 내 정보 · 로고 · 하트 · 편지 */
.hud{height:48px; gap:8px; margin-bottom:6px}
.me-btn{position:relative; flex:none; width:44px; height:44px; border-radius:50%; background:linear-gradient(#FFE0C4,#FFC08A); border:2.5px solid var(--outline2); box-shadow:0 3px 0 #0E0730; display:grid; place-items:center; overflow:visible}
.me-btn svg{width:34px; height:34px; margin-top:4px}
.me-btn .lvb{position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); padding:1px 6px 2px; border-radius:7px; font-family:var(--heavy); font-size:11px; line-height:1.2; color:#5A3300; background:linear-gradient(#FFE98E,#FFB020); border:2px solid var(--outline2); white-space:nowrap}
.hud-logo{flex:1; min-width:0; text-align:center; font-family:var(--heavy); font-size:22px; line-height:1; color:#FFE35A; -webkit-text-stroke:5px var(--outline2); paint-order:stroke fill; text-shadow:0 3px 0 #0B0526; white-space:nowrap; overflow:hidden}
.hud-logo small{font-size:13px; color:#FF9CC8; margin-left:3px}
.res{height:34px; margin-left:12px}
.res-ico{width:38px; height:38px; margin-left:-16px}
.res-val b{font-size:16px}
.res-val small{font-size:11px}
.res-plus{width:22px; height:22px; font-size:17px; border-radius:7px}
.mail{width:42px; height:40px; border-radius:12px}
.mail svg{width:26px; height:26px}
.badge{min-width:20px; height:20px; font-size:12px; line-height:16px; top:-7px; right:-7px}

/* 탭 화면 */
.pane[hidden]{display:none!important}
.pane{animation:paneIn .22s ease-out}
@keyframes paneIn{from{opacity:0; transform:translateY(6px)}}
.sec{margin:20px 0 10px}
.sec h2{font-size:18px; -webkit-text-stroke:5px var(--outline2)}
.sec h2::before, .sec h2::after{font-size:10px; margin:0 6px}
.sec.left{justify-content:flex-start; gap:8px}
.sec.left::before, .sec.left::after{display:none}
.sec.left h2::before, .sec.left h2::after{display:none}
.sec .more{margin-left:auto; font-family:var(--disp); font-size:14px; color:#CFC5FF; display:inline-flex; align-items:center; gap:2px; min-height:32px}
.sec .more .ico{width:16px; height:16px}

/* 오늘: 한 줄 요약 */
.strip{width:100%; display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; padding:8px 10px 8px 8px; border-radius:18px; text-align:left; color:#fff;
  background:linear-gradient(180deg,#4A33A8,#2C1C7C); border:2.5px solid #FFD35C; box-shadow:0 0 0 2.5px var(--outline2), inset 0 2px 0 rgba(255,255,255,.25), 0 5px 0 #0E0730}
.strip .md{width:44px; height:48px}
.strip .md svg{width:100%; height:100%; display:block; overflow:visible}
.strip b{display:block; font-family:var(--heavy); font-weight:400; font-size:20px; line-height:1.1; letter-spacing:.3px}
.strip b small{font-size:12px; color:#B7ABE8}
.strip span.s2{display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12.5px; font-weight:700; color:#CFC5FF; margin-top:2px}
.strip span.s2 .hot{color:#FFB070}
.strip span.s2 .ico{width:13px; height:13px; vertical-align:-2px}
.strip .go{color:#CFC5FF}
.strip .go .ico{width:20px; height:20px}
.cta{min-height:66px; margin-top:14px; padding:8px 10px 10px; border-radius:18px; gap:10px}
.cta-tile{width:46px; height:46px; border-radius:13px}
.cta-tile .ico{width:28px; height:28px}
.cta-txt b{font-size:19px; -webkit-text-stroke:4px #8E0F4F}
.cta-txt i{font-size:12.5px}
.cta-txt small{font-size:12px}
.cta-play{width:40px; height:40px}
.cta-play svg{width:20px; height:20px}

/* 오늘의 5게임: 한 줄씩, 바로 시작 */
.glist{display:flex; flex-direction:column; gap:10px}
.grow{display:grid; grid-template-columns:78px 1fr auto; gap:10px; align-items:center; padding:7px 8px 7px 7px; border-radius:18px}
.grow .g-art{width:78px; aspect-ratio:16/11; margin:0; border-radius:11px; border-width:2px}
.grow .g-art .newb, .grow .g-art .stamp, .grow .g-art .live{top:3px; font-size:10px; padding:2px 5px 3px}
.grow .g-art .newb{left:3px} .grow .g-art .stamp, .grow .g-art .live{right:3px}
.grow .g-art .stamp .ico{width:11px; height:11px}
.gr-mid{min-width:0; display:flex; flex-direction:column; gap:2px}
.gr-mid b{font-family:var(--disp); font-weight:400; font-size:17px; line-height:1.2; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gr-mid span{font-size:12px; font-weight:700; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.gr-mid span em{font-style:normal; color:var(--ink)}
.lvchip{align-self:flex-start; display:inline-flex; align-items:center; gap:2px; height:24px; padding:0 6px 0 8px; margin-top:2px; border-radius:8px; font-family:var(--disp); font-size:12.5px; color:var(--ink); background:#fff; border:2px solid var(--paper-line)}
.lvchip .ico{width:13px; height:13px; transform:rotate(90deg)}
.gr-go{height:44px; min-width:74px; padding:0 10px; border-radius:13px; display:inline-flex; align-items:center; justify-content:center; gap:4px; font-family:var(--disp); font-size:16px; color:#fff; position:relative; overflow:hidden; isolation:isolate;
  --c1:#FF8AC0; --c2:#F0368A; --c3:#8E0F4F; background:linear-gradient(180deg,var(--c1),var(--c2)); border:2.5px solid var(--c3); text-shadow:0 2px 0 var(--c3); box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 3px 0 var(--c3)}
.gr-go.re{--c1:#86D6FF; --c2:#2E8FE8; --c3:#124F92}
.gr-go.adv{--c1:#8BF06A; --c2:#23A548; --c3:#0F5A23}
.gr-go:active{transform:translateY(2px); box-shadow:0 1px 0 var(--c3)}
.gr-go .cost{padding:0 6px 0 5px; font-size:12px}
.gr-go .cost .ico{width:12px; height:12px}
.advpromo{width:100%; margin-top:14px; display:grid; grid-template-columns:40px 1fr auto; gap:10px; align-items:center; padding:10px 12px; border-radius:18px; text-align:left; color:#fff;
  background:linear-gradient(180deg,#2FBF6A,#15803D); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 0 4px 0 #0E0730}
.advpromo .ap-i{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:rgba(255,255,255,.2)}
.advpromo .ap-i svg{width:26px; height:26px}
.advpromo b{display:block; font-family:var(--disp); font-weight:400; font-size:16px; text-shadow:0 2px 0 #0F5A23}
.advpromo small{font-size:12px; font-weight:700; color:#D8FBD9}
.advpromo .ico{width:20px; height:20px}

/* 하단 탭 */
.dock{position:fixed; z-index:15; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:460px; padding:6px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:grid; grid-template-columns:repeat(4,1fr); gap:4px; background:linear-gradient(180deg,rgba(30,18,80,.96),rgba(18,10,54,.98)); border-top:2.5px solid #FFD35C; box-shadow:0 -6px 20px rgba(0,0,0,.35)}
body[data-mode] .dock{display:none}
.dock button{position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:52px; border-radius:14px; font-family:var(--disp); font-size:12.5px; color:#A99FDA}
.dock button .ico{width:24px; height:24px}
.dock button[aria-current="page"]{color:#5A3300; background:linear-gradient(#FFE98E,#FFB020); box-shadow:inset 0 2px 0 rgba(255,255,255,.6), 0 3px 0 #9A5A00; transform:translateY(-4px)}
