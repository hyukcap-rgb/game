.dock .dot{position:absolute; top:5px; right:calc(50% - 20px); width:9px; height:9px; border-radius:50%; background:#FF4D5E; border:2px solid #1C1250}

/* 모험 탭 */
.lvcard{display:grid; grid-template-columns:62px 1fr; gap:12px; align-items:center; padding:10px 14px 12px 10px; border-radius:20px; color:#fff;
  background:radial-gradient(120% 90% at 0% 0%, rgba(255,211,92,.25), transparent 60%), linear-gradient(180deg,#4A33A8,#2C1C7C); border:2.5px solid #FFD35C; box-shadow:0 0 0 2.5px var(--outline2), 0 5px 0 #0E0730}
.shield{width:62px; height:68px}
.shield svg{width:100%; height:100%; display:block; overflow:visible}
.lvcard .t{font-family:var(--disp); font-size:13px; color:#FFD86B}
.lvcard b{display:block; font-family:var(--disp); font-weight:400; font-size:19px; line-height:1.2}
.xp{position:relative; height:14px; margin-top:6px; border-radius:7px; background:#0D0630; box-shadow:inset 0 2px 3px rgba(0,0,0,.6); overflow:hidden}
.xp i{position:absolute; left:0; top:0; bottom:0; border-radius:7px; background:linear-gradient(90deg,#FFB020,#FFE35A); box-shadow:inset 0 2px 0 rgba(255,255,255,.5); transition:width .8s cubic-bezier(.2,.8,.3,1)}
.xp-t{display:flex; justify-content:space-between; margin-top:4px; font-size:12px; font-weight:700; color:#CFC5FF}
.xp-t b{display:inline; font-family:var(--heavy); font-size:13px; color:#FFD86B}
.advlist{display:flex; flex-direction:column; gap:12px; margin-top:14px}
.acard{display:grid; grid-template-columns:96px 1fr; gap:10px; padding:8px; border-radius:18px}
.acard .g-art{width:96px; margin:0; aspect-ratio:auto; height:100%; min-height:92px; border-radius:12px}
.acard .chn{position:absolute; left:0; right:0; bottom:0; z-index:2; padding:3px 4px; text-align:center; font-family:var(--disp); font-size:12px; color:#fff; background:rgba(26,15,69,.78)}
.ac-mid{min-width:0; display:flex; flex-direction:column; gap:3px}
.ac-top{display:flex; align-items:baseline; justify-content:space-between; gap:6px}
.ac-top b{font-family:var(--disp); font-weight:400; font-size:17px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ac-top span{flex:none; font-family:var(--heavy); font-size:13px; color:#B87400}
.ac-stage{font-size:12.5px; font-weight:700; color:var(--sub)}
.ac-stage em{font-style:normal; font-family:var(--heavy); font-size:15px; color:var(--ink)}
.chdots{display:grid; grid-template-columns:repeat(10,1fr); gap:3px; margin:2px 0}
.chdots i{height:9px; border-radius:3px; background:#E9DCC0}
.chdots i.s1{background:#FFD978} .chdots i.s2{background:#FFBC3A} .chdots i.s3{background:linear-gradient(#FFB020,#F07A00)}
.chdots i.cur{background:#fff; box-shadow:0 0 0 2px var(--gc)}
.ac-btns{display:flex; gap:6px; margin-top:4px}
.ac-btns .map{height:40px; padding:0 12px; border-radius:12px; font-family:var(--disp); font-size:14px; color:var(--ink); background:#fff; border:2px solid var(--paper-line); box-shadow:0 2px 0 var(--paper-line)}
.ac-btns .gr-go{flex:1; height:40px}
.freebadge{display:inline-flex; align-items:center; gap:3px; font-size:11px; font-weight:800; color:#fff; background:rgba(0,0,0,.18); border-radius:999px; padding:1px 7px; text-shadow:none}
.advnote{font-size:12.5px; color:#B9AEE6; text-align:center; margin:12px 4px 0; line-height:1.5}

/* 모험 맵 */
.modal.amap{--gc:#FF7A1F}
.amap .chhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 6px}
.amap .chhead button{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:#fff; border:2px solid var(--paper-line); color:var(--ink)}
.amap .chhead button:disabled{opacity:.3}
.amap .chhead .ico{width:20px; height:20px}
.amap .chhead .rot{transform:rotate(180deg)}
.amap .chname{font-family:var(--disp); font-size:19px; color:var(--ink); line-height:1.2}
.amap .chname small{display:block; font-family:var(--font); font-size:12px; font-weight:700; color:var(--sub)}
.path{position:relative; display:grid; grid-template-columns:repeat(5,1fr); gap:12px 8px; padding:14px 8px; margin-top:6px; border-radius:18px; background:color-mix(in srgb, var(--gc) 12%, #FFF8EA); border:2px solid color-mix(in srgb, var(--gc) 30%, #EADBC0)}
.st{position:relative; aspect-ratio:1; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--heavy); font-size:17px; color:#fff;
  background:linear-gradient(180deg, color-mix(in srgb, var(--gc) 65%, #fff), var(--gc)); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 3px 0 var(--outline2); text-shadow:0 2px 0 rgba(0,0,0,.3)}
.st i{position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); font-style:normal; font-size:11px; letter-spacing:-1px; white-space:nowrap; text-shadow:none; -webkit-text-stroke:0}
.st i .on{color:#FFB020; text-shadow:0 1px 0 #7A4A00} .st i .off{color:#D8C8A8}
.st.lock{background:#DCCFB4; color:#A8966F; border-color:#A8966F; box-shadow:0 3px 0 #A8966F; text-shadow:none}
.st.lock .ico{width:18px; height:18px}
.st.cur{animation:curpulse 1.3s ease-in-out infinite}
@keyframes curpulse{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 3px 0 var(--outline2), 0 0 0 6px color-mix(in srgb, var(--gc) 35%, transparent)}}
.st.sel{outline:3px solid #FFB020; outline-offset:3px}
.st.boss{border-radius:30%}
.st.boss::after{content:""; position:absolute; top:-12px; width:22px; height:14px; background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 14'><path d='M1 13 2 3l5 5 4-7 4 7 5-5 1 10z' fill='%23FFC93C' stroke='%231A0F45' stroke-width='1.6' stroke-linejoin='round'/></svg>") no-repeat center/contain}
.amap .rule{margin:12px 0 0; font-size:12.5px; color:var(--sub); line-height:1.5}
.amap .rule b{color:#B87400}

/* 결과(모험) */
.bigstars{display:flex; justify-content:center; gap:4px; margin:4px 0 2px}
.bigstars svg{width:56px; height:56px; overflow:visible}
.bigstars .s{opacity:0; transform:scale(.2) rotate(-40deg); animation:starpop .45s cubic-bezier(.2,1.7,.4,1) forwards}
.bigstars .s:nth-child(2){margin-top:-12px}
.bigstars .s.off{filter:grayscale(1) brightness(1.45) opacity(.5)}
@keyframes starpop{to{opacity:1; transform:scale(1) rotate(0)}}
.chprog{margin:10px 0 0; padding:10px 12px; border-radius:14px; background:#fff; border:2px solid var(--paper-line); text-align:left}
.chprog .h{display:flex; justify-content:space-between; font-family:var(--disp); font-size:15px; color:var(--ink)}
.chprog .h small{font-family:var(--font); font-size:12px; font-weight:700; color:var(--sub)}
.chprog .xp{background:#EFE3CB; box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.chprog .xp-t{color:var(--sub)}
.chprog .xp-t b{color:#B87400}

/* 성장 축하 창 */
.modal.celebrate{background:radial-gradient(120% 80% at 50% 0%, #5B3FD0 0%, #2C1C7C 55%, #1A0F45 100%); color:#fff; border-color:#FFD35C; box-shadow:0 0 0 3px var(--outline2), 0 0 40px rgba(255,211,92,.35), 0 26px 50px rgba(0,0,0,.5)}
.celebrate .burst{background:repeating-conic-gradient(from 0deg, rgba(255,225,120,.4) 0deg 8deg, rgba(255,225,120,0) 8deg 20deg); top:-120px}
.celebrate .kick{font-family:var(--heavy); font-size:15px; letter-spacing:4px; color:#FFD86B; margin:4px 0 0}
.celebrate .ttl{font-family:var(--heavy); font-size:40px; line-height:1.1; margin:2px 0 6px; color:#FFE35A; -webkit-text-stroke:7px var(--outline2); paint-order:stroke fill; text-shadow:0 5px 0 #0B0526; animation:ttlin .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes ttlin{from{transform:scale(2.2); opacity:0}}
.celebrate .emb{width:140px; height:150px; margin:4px auto 0; animation:embin .8s cubic-bezier(.2,1.5,.4,1) .15s both}
.celebrate .emb svg{width:100%; height:100%; display:block; overflow:visible}
@keyframes embin{from{transform:scale(.2) rotate(-25deg); opacity:0}}
.celebrate .newtitle{display:inline-block; margin:8px 0 0; padding:6px 18px 7px; font-family:var(--disp); font-size:18px; color:#fff; background:linear-gradient(#FF7DB8,#E62C7F); border:2.5px solid var(--outline2); border-radius:10px; box-shadow:0 3px 0 var(--outline2); text-shadow:0 2px 0 #7A0B45}
.celebrate .note{color:#D8D0FF}
.celebrate .note b{color:#FFD86B}
.rewards{display:flex; justify-content:center; gap:10px; margin:12px 0 0; flex-wrap:wrap}
.reward{display:flex; flex-direction:column; align-items:center; gap:4px; width:84px; padding:10px 4px 8px; border-radius:16px; background:rgba(255,255,255,.1); border:2px solid rgba(255,211,92,.5); font-family:var(--disp); font-size:13px; color:#FFE9A8; animation:embin .6s cubic-bezier(.2,1.5,.4,1) .45s both}
.reward .ri{width:40px; height:40px}
.reward .ri svg{width:100%; height:100%}
.reward b{font-family:var(--heavy); font-weight:400; font-size:17px; color:#fff}
.celebrate .mbtns .b1{--c1:#FFE98E; --c2:#FFB020; --c3:#9A5A00; color:#5A3300; text-shadow:0 1px 0 rgba(255,255,255,.5)}

/* 내 정보 탭 */
.prof{display:grid; grid-template-columns:64px 1fr; gap:12px; align-items:center; padding:12px; border-radius:20px}
.prof .av{width:64px; height:64px; border-width:3px}
.prof b{display:block; font-family:var(--disp); font-weight:400; font-size:20px; color:var(--ink)}
.prof .ttlchip{display:inline-block; margin-top:2px; padding:1px 9px 2px; border-radius:8px; font-family:var(--disp); font-size:13px; color:#fff; background:linear-gradient(#9C7BFF,#6236D6); border:2px solid var(--outline2)}
.prof .xp{background:#EFE3CB; box-shadow:inset 0 1px 2px rgba(0,0,0,.15); margin-top:8px}
.prof .xp-t{color:var(--sub)}
.prof .xp-t b{color:#B87400}
#paneMe .hero{margin-top:30px}
#paneMe .tagline{margin:12px 0 0; font-size:14px}
.growlist{padding:6px 12px}
.grw{display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:center; min-height:52px; border-top:2px dashed var(--paper-line)}
.grw:first-child{border-top:0}
.grw .gi{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:#fff; background:var(--gc); border:2px solid var(--outline2)}
.grw .gi .ico{width:20px; height:20px}
.grw b{display:block; font-family:var(--disp); font-weight:400; font-size:15px; color:var(--ink)}
.grw small{font-size:12px; font-weight:700; color:var(--sub)}
.grw .gs{font-family:var(--heavy); font-size:14px; color:#B87400; text-align:right}
.badges{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:12px}
.bdg{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:700; color:var(--sub); text-align:center; line-height:1.2}
.bdg svg{width:100%; max-width:56px; height:auto; display:block}
.bdg.off svg{filter:grayscale(1) opacity(.35)}
.bdg.off span{opacity:.6}
.me-links{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px}

/* ===== v5: 오늘 점수 × 끈기 보너스 + 주간 리그 + 모두의 상금 + 글로벌(마케팅팀) ===== */
.pool{width:100%; margin-top:10px; display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:14px; text-align:left; color:#5A3300;
  background:linear-gradient(180deg,#FFE98E,#FFB020); border:2.5px solid #9A5A00; box-shadow:inset 0 2px 0 rgba(255,255,255,.6), 0 3px 0 #7A4A00}
.pool .ico{width:22px; height:22px; flex:none}
.pool .pt{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.pool .pt small{font-size:11.5px; font-weight:800; opacity:.85}
.pool .pt b{font-family:var(--heavy); font-weight:400; font-size:19px; letter-spacing:.3px}
.pool .pr{margin-left:auto; font-size:11.5px; font-weight:800; text-align:right; line-height:1.3; opacity:.85}
.daynote{margin:-4px 0 12px; text-align:center; font-size:12.5px; font-weight:700; color:#CFC5FF}
.lgcard{display:grid; grid-template-columns:64px 1fr; gap:10px 12px; align-items:center; padding:12px; margin-bottom:12px; border-radius:20px; color:#fff;
  background:radial-gradient(120% 90% at 0% 0%, rgba(255,211,92,.22), transparent 60%), linear-gradient(180deg,#4A33A8,#2C1C7C); border:2.5px solid #FFD35C; box-shadow:0 0 0 2.5px var(--outline2), 0 5px 0 #0E0730}
.lgcard .tbd{width:64px; height:70px}
.lgcard .tbd svg, .emb svg{width:100%; height:100%; display:block; overflow:visible}
.lgcard .t{font-family:var(--disp); font-size:13px; color:#FFD86B}
.lgcard .big{display:block; font-family:var(--heavy); font-weight:400; font-size:23px; line-height:1.15; letter-spacing:.3px}
.lgcard .s2{display:flex; flex-wrap:wrap; gap:3px 10px; margin-top:3px; font-size:12.5px; font-weight:700; color:#CFC5FF}
.lgcard .s2 b{color:#fff}
.lgcard .s2 .ico{width:13px; height:13px; vertical-align:-2px}
.lgpool{grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; background:#170C45; box-shadow:inset 0 2px 4px rgba(0,0,0,.5); font-size:12.5px; font-weight:700; color:#FFD86B}
.lgpool .ico{width:16px; height:16px; vertical-align:-3px}
.lgpool b{font-family:var(--heavy); font-weight:400; font-size:17px; color:#FFE98E; letter-spacing:.3px; white-space:nowrap}
.zone{display:flex; align-items:center; gap:6px; margin:6px -4px; padding:5px 10px; border-radius:10px; font-family:var(--disp); font-size:13.5px}
.zone.up{background:#E3F8E9; color:#18804A; border:2px solid #8FD9A8}
.zone.down{background:#FDE8E6; color:#B42318; border:2px solid #F4B4AC}
.row.upz .pnum{background:linear-gradient(#5BD98A,#1F9D55)}
.row.downz .pnum{background:linear-gradient(#FF8A8A,#D63B3B)}
.worldcard{display:flex; gap:10px; align-items:center; padding:10px 12px; margin-bottom:12px; border-radius:16px; background:#170C45; color:#CFC5FF; font-size:13px; font-weight:700; line-height:1.45; box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.worldcard > .ico{width:26px; height:26px; flex:none; color:#7FD6FF}
.worldcard b{color:#FFD86B; font-family:var(--heavy); font-weight:400; font-size:16px; letter-spacing:.3px}
.ttls{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:10px 0 0}
.ttls span{padding:3px 10px 4px; border-radius:999px; font-family:var(--disp); font-size:13px; color:#fff; background:linear-gradient(#9C7BFF,#6236D6); border:2px solid var(--outline2)}
.ttls span.g{background:linear-gradient(#FFE98E,#FFB020); color:#5A3300; border-color:#9A5A00}
.ttls span.o{background:linear-gradient(#FFA34F,#E0480E); border-color:#8A2A00}
.sharebtn{margin-top:10px}
.me-links button{height:46px; border-radius:14px; font-family:var(--disp); font-size:15px; color:#fff; background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.2)}

/* ===== 사운드·효과팀 ===== */
.me-links{grid-template-columns:repeat(3,1fr)}
.me-links button{font-size:14px; padding:0 4px; display:inline-flex; align-items:center; justify-content:center; gap:4px; white-space:nowrap}
.me-links button .ico{width:17px; height:17px}
/* 설정 창 */
.sset{display:flex; flex-direction:column; gap:8px; margin-top:6px; text-align:left}
.srow2{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:16px; background:#fff; border:2px solid var(--paper-line)}
.srow2.col{flex-direction:column; align-items:stretch; gap:8px}
.srow2 b{display:block; font-family:var(--disp); font-weight:400; font-size:17px; color:var(--ink)}
.srow2 small{display:block; font-size:12.5px; color:var(--sub); font-weight:500; margin-top:1px}
.sw{position:relative; flex:none; width:58px; height:34px; border-radius:17px; background:#DCCFB4; box-shadow:inset 0 2px 4px rgba(0,0,0,.18); transition:background .2s}
.sw i{position:absolute; top:3px; left:3px; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.25); transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:linear-gradient(#8BF06A,#27B86A)}
.sw.on i{transform:translateX(24px)}
.rg{display:flex; align-items:center; gap:10px}
.rg em{font-style:normal; min-width:34px; text-align:right; font-family:var(--heavy); font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums}
.rg input{flex:1; -webkit-appearance:none; appearance:none; height:30px; background:none; margin:0}
.rg input::-webkit-slider-runnable-track{height:10px; border-radius:5px; background:linear-gradient(90deg,#FF8AC0,#F0368A); box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.rg input::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; margin-top:-9px; border-radius:50%; background:linear-gradient(#fff,#F3EBDD); border:3px solid var(--outline); box-shadow:0 2px 0 var(--outline2)}
.rg input::-moz-range-track{height:10px; border-radius:5px; background:linear-gradient(90deg,#FF8AC0,#F0368A)}
.rg input::-moz-range-thumb{width:24px; height:24px; border-radius:50%; background:#fff; border:3px solid var(--outline)}
.snd-row{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px}
.sdemo{height:40px; border-radius:12px; font-family:var(--disp); font-size:14px; color:var(--ink); background:#fff; border:2px solid var(--paper-line); box-shadow:0 2px 0 var(--paper-line)}

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function dayKey(d = new Date()){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmt(n){ return n.toLocaleString('ko-KR'); }
function mmss(s){ s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
let toastT;
function toast(msg, kind){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); if(typeof sfx === 'function') sfx(kind === 'err' ? 'error' : 'toast'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2600); }

function seedFrom(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, rng){ for(let i=arr.length-1;i>0;i--){ const j = Math.floor(rng()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; } return arr; }

function countFox(reg, N, limit, fixed){
  let count = 0; const colU = new Array(N).fill(false), regU = new Array(N).fill(false), pos = [];
  (function bt(r){
    if(count >= limit) return;
    if(r === N){ count++; return; }
    for(let c=0;c<N;c++){
      if(fixed && fixed[r] >= 0 && fixed[r] !== c) continue;
      if(colU[c]) continue;
      const g = reg[r*N+c]; if(regU[g]) continue;
      if(r > 0 && Math.abs(pos[r-1]-c) < 2) continue;
      colU[c] = regU[g] = true; pos[r] = c; bt(r+1); colU[c] = regU[g] = false;
    }
  })(0);
  return count;
}
/* 여우 자리 찾기 생성기: 정답 배치 → 구역 키우기 → 다른 답이 있으면 그 답의 칸을 이웃 구역으로 넘겨 없앰(답이 하나가 될 때까지) */
function solveFox(reg, N, limit){
  const out = [], colU = new Array(N).fill(false), regU = new Array(N).fill(false), pos = [];
  (function bt(r){
    if(out.length >= limit) return;
    if(r === N){ out.push(pos.slice()); return; }
    for(let c=0;c<N;c++){
      if(colU[c]) continue;
      const g = reg[r*N+c]; if(regU[g]) continue;
      if(r > 0 && Math.abs(pos[r-1]-c) < 2) continue;
      colU[c] = regU[g] = true; pos[r] = c; bt(r+1); colU[c] = regU[g] = false;
    }
  })(0);
  return out;
}
function genFox(rng, N){
  let best = null;
  for(let attempt=0; attempt<40; attempt++){
    const perm = [], used = new Array(N).fill(false);
    (function bt(r){
      if(r === N) return true;
      for(const c of shuffle([...Array(N).keys()], rng)){
        if(used[c] || (r > 0 && Math.abs(perm[r-1]-c) < 2)) continue;
        used[c] = true; perm[r] = c;
        if(bt(r+1)) return true;
        used[c] = false;
      }
      return false;
    })(0);
    const reg = new Array(N*N).fill(-1), seed = new Array(N*N).fill(false);
    for(let r=0;r<N;r++){ reg[r*N+perm[r]] = r; seed[r*N+perm[r]] = true; }
    const nb = i => { const r = Math.floor(i/N), c = i%N, o = []; if(r) o.push(i-N); if(r < N-1) o.push(i+N); if(c) o.push(i-1); if(c < N-1) o.push(i+1); return o; };
    /* 크기가 들쭉날쭉하게: 구역마다 성장 가중치를 달리 줌 */
    const w = [...Array(N)].map(() => 0.5 + rng()*1.8);
    let left = N*N - N;
    while(left > 0){
      const cands = [];
      for(let i=0;i<N*N;i++){ if(reg[i] !== -1) continue; for(const j of nb(i)) if(reg[j] !== -1) cands.push([i, reg[j]]); }
      let tot = 0; for(const [, g] of cands) tot += w[g];
      let x = rng()*tot, k = 0; for(; k<cands.length-1; k++){ x -= w[cands[k][1]]; if(x <= 0) break; }
      reg[cands[k][0]] = cands[k][1]; left--;
    }
    const connected = (g, without) => {
      const cells = []; for(let i=0;i<N*N;i++) if(reg[i] === g && i !== without) cells.push(i);
      if(!cells.length) return false;
      const seen = new Set([cells[0]]), st = [cells[0]];
      while(st.length){ const i = st.pop(); for(const j of nb(i)) if(j !== without && reg[j] === g && !seen.has(j)){ seen.add(j); st.push(j); } }
      return seen.size === cells.length;
    };
    let ok = false;
    for(let it=0; it<N*N*3; it++){
      const sols = solveFox(reg, N, 2);
      if(sols.length === 1){ ok = true; break; }
      const alt = sols.find(s => s.some((c, r) => c !== perm[r])) || sols[1];
      let moved = false;
      for(const r of shuffle([...Array(N).keys()], rng)){
        if(alt[r] === perm[r]) continue;
        const i = r*N + alt[r], g = reg[i];
        if(seed[i]) continue;
        const targets = shuffle(nb(i).map(j => reg[j]).filter(h => h !== g), rng);
        if(!targets.length || !connected(g, i)) continue;
        reg[i] = targets[0]; moved = true; break;
      }
      if(!moved) break;
    }
    const tiny = [...Array(N)].filter((_, g) => reg.filter(x => x === g).length === 1).length;
    if(ok && tiny === 0) return { N, reg, sol:perm.slice(), tries:attempt + 1 };
    if(ok && (!best || !best.ok)) best = { N, reg:reg.slice(), sol:perm.slice(), tries:attempt + 1, ok:true };
    continue;
  }
  return best || { N, reg:[], sol:[], tries:40 };
}


function countSud(g, limit){
  g = g.slice();
  const row = new Array(9).fill(0), col = new Array(9).fill(0), box = new Array(9).fill(0);
  for(let i=0;i<81;i++){ const v = g[i]; if(v){ const b = 1 << v, r = (i/9)|0, c = i%9, x = ((r/3)|0)*3 + ((c/3)|0); row[r] |= b; col[c] |= b; box[x] |= b; } }
  let count = 0;
  (function bt(){
    if(count >= limit) return;
    let best = -1, bestMask = 0, bestN = 10;
    for(let i=0;i<81;i++){
      if(g[i]) continue;
      const r = (i/9)|0, c = i%9, x = ((r/3)|0)*3 + ((c/3)|0);
      const m = ~(row[r] | col[c] | box[x]) & 0x3FE;
      let n = 0; for(let t=m; t; t &= t-1) n++;
      if(n < bestN){ best = i; bestMask = m; bestN = n; if(n <= 1) break; }
    }
    if(best === -1){ count++; return; }
    if(bestN === 0) return;
    const r = (best/9)|0, c = best%9, x = ((r/3)|0)*3 + ((c/3)|0);
    for(let v=1; v<=9; v++){
      const b = 1 << v; if(!(bestMask & b)) continue;
      g[best] = v; row[r] |= b; col[c] |= b; box[x] |= b;
      bt();
      g[best] = 0; row[r] &= ~b; col[c] &= ~b; box[x] &= ~b;
      if(count >= limit) return;
    }
  })();
  return count;
}
function genSudoku(rng, minGivens){
  const base = (r,c) => ((r*3 + Math.floor(r/3) + c) % 9) + 1;
  const rows = [], cols = [];
  for(const b of shuffle([0,1,2], rng)) for(const i of shuffle([0,1,2], rng)) rows.push(b*3+i);
  for(const s of shuffle([0,1,2], rng)) for(const i of shuffle([0,1,2], rng)) cols.push(s*3+i);
  const dig = shuffle([1,2,3,4,5,6,7,8,9], rng), tr = rng() < 0.5;
  const sol = [];
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){ const a = tr ? c : r, b = tr ? r : c; sol[r*9+c] = dig[base(rows[a], cols[b]) - 1]; }
  const puz = sol.slice(); let givens = 81;
  for(const i of shuffle([...Array(81).keys()], rng)){
    if(givens <= minGivens) break;
    const v = puz[i]; puz[i] = 0;
    if(countSud(puz, 2) !== 1) puz[i] = v; else givens--;
  }
  return { sol, puz };
}

};

function heartState(){
  const h = store.get('hp:hearts', { n:MAX_H, t:Date.now() });
  if(h.n < MAX_H){
    const gained = Math.floor((Date.now() - h.t) / REGEN_MS);
    if(gained > 0){ h.n = Math.min(MAX_H, h.n + gained); h.t += gained * REGEN_MS; }
  }
  if(h.n >= MAX_H) h.t = Date.now();
  store.set('hp:hearts', h);
  return h;
}
function addHearts(k){ const h = heartState(); const wasFull = h.n >= MAX_H; h.n += k; if(h.n < MAX_H && wasFull) h.t = Date.now(); store.set('hp:hearts', h); }
function spendHeart(){
  const h = heartState(); if(h.n < 1) return false;
  const wasFull = h.n >= MAX_H; h.n -= 1; if(wasFull && h.n < MAX_H) h.t = Date.now();
  store.set('hp:hearts', h); return true;
}

function friendScore(f){
  const rng = mulberry(seedFrom(dayKey() + f.name));
  const full = Math.round((1000 + rng()*1900) / 10) * 10;
  const start = 7 + rng()*9, span = 3 + rng()*6;
  const now = new Date(); const h = now.getHours() + now.getMinutes()/60;
  const p = Math.max(0, Math.min(1, (h - start) / span));
  return Math.round(full * (p === 0 ? 0 : 0.45 + 0.55*p) / 10) * 10;
}

/* ===== 점수·리그 v5 (마케팅팀 설계) =====
   오늘 점수 = 5게임 오늘 최고점 합계 × (1 + 끈기 보너스). 끈기 보너스 = 연속 출석 하루당 +1%, 최대 +10%
   출석 = 한 판을 끝까지(성공·실패 무관, 그만하기 제외). 휴식권 월 2장: 빠진 날 자동 사용, 연속 유지(그날 점수 0)
   주간 리그 = 월~일 매일 '오늘 점수'의 합. 실력 비슷한 30명, 일요일 21:00(현지) 마감, 상위 5명 승급·하위 5명 강등
   글로벌: 모든 날짜·마감은 현지 시간 기준, 문제는 날짜별로 전 세계 동일, 상금 리그는 같은 시간대 권역끼리 */
const REST_PER_MONTH = 2, BONUS_MAX = 10;
const ABIL = { fox:'논리력', sudoku:'집중력', ball:'공간지각', tower:'전략력', fleet:'추리력' };

  tower:['전략형 두뇌','한 수 앞을 내다보고 자원을 배분해요'],

function addDays(k, n){ const [y, m, d] = k.split('-').map(Number); return dayKey(new Date(y, m - 1, d + n)); }
const bonusPct = streak => Math.min(BONUS_MAX, Math.max(0, streak));
function myDay(k){
  const d = store.get('hp:day:' + k, null); if(!d || !d.best) return { att:false, total:0, best:{} };
  const total = Object.values(d.best).reduce((a, b) => a + (b || 0), 0);
  return { att: !!d.att || total > 0, total, best:d.best };
}
function friendDay(f){
  const p = 0.55 + mulberry(seedFrom('p:' + f.name))() * 0.43, today = dayKey();
  return k => {
    if(k === today){ const sc = friendScore(f); return { att: sc > 0, total: sc }; }
    const r = mulberry(seedFrom('att:' + k + f.name)); const att = r() < p;
    return { att, total: att ? Math.round((1000 + r() * 1900) / 10) * 10 : 0 };
  };
}
/* 최근 120일을 앞에서부터 훑어 연속·휴식권·하루 점수를 계산 */
function timeline(getDay){
  const today = dayKey(), days = [], restUsed = {};
  let streak = 0, best = 0;
  for(let i = 119; i >= 0; i--){
    const k = addDays(today, -i), info = getDay(k), mo = k.slice(0, 7);
    let st, base = 0, pct = 0, final = 0;
    if(info.att){ streak++; st = 'att'; base = info.total; pct = bonusPct(streak); final = Math.round(base * (1 + pct / 100)); }
    else if(k === today){ st = 'today'; }
    else if(streak > 0 && (restUsed[mo] || 0) < REST_PER_MONTH){ restUsed[mo] = (restUsed[mo] || 0) + 1; st = 'rest'; }
    else { streak = 0; st = 'miss'; }
    best = Math.max(best, streak);
    days.push({ k, st, base, pct, final, streak });
  }
  const t = days[days.length - 1], mo = today.slice(0, 7);
  const month = days.filter(x => x.k.slice(0, 7) === mo);
  return { days, streak, best, today:t, score:t.final, bq:t.final, restLeft: REST_PER_MONTH - (restUsed[mo] || 0), month, mAtt: month.filter(x => x.st === 'att').length };
}

function weekStartKey(k = dayKey()){ const [y, m, d] = k.split('-').map(Number), dt = new Date(y, m - 1, d); return dayKey(new Date(y, m - 1, d - (dt.getDay() + 6) % 7)); }
function weekDeadline(wk = weekStartKey()){ const [y, m, d] = wk.split('-').map(Number); return new Date(y, m - 1, d + 6, 21, 0, 0); }
function weekLeft(){ const s = Math.max(0, Math.floor((weekDeadline().getTime() - Date.now()) / 1000)), dd = Math.floor(s / 86400); return (dd ? dd + '일 ' : '') + String(Math.floor(s % 86400 / 3600)).padStart(2,'0') + ':' + String(Math.floor(s % 3600 / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0'); }
function weekSum(tl, wk){ const end = addDays(wk, 6); return tl.days.filter(x => x.k >= wk && x.k <= end).reduce((a, x) => a + x.final, 0); }
const TIERS = [['브론즈','#D9772E','#FFC39A'],['실버','#8FA3B8','#EEF3F8'],['골드','#F0A000','#FFEA8E'],['다이아','#3BB8F5','#DDF6FF']];

const LG_B = ['고양이','사자','펭귄','부엉이','수달','판다','토끼','여우','곰','거북','고래','다람쥐','참새','사슴','돌고래'];
function leagueState(){ return store.get('hp:league', null) || { tier:0, week:weekStartKey() }; }
function leagueRivals(wk, tier){
  const r = mulberry(seedFrom('lg:' + wk + ':' + tier)), used = new Set(), out = [];
  while(out.length < 29){
    const n = LG_A[Math.floor(r() * LG_A.length)] + LG_B[Math.floor(r() * LG_B.length)];
    if(used.has(n)) continue; used.add(n);
    out.push({ name:n, skill:(1300 + tier * 450) * (0.72 + r() * 0.56), p:0.5 + r() * 0.48 });
  }
  return out;
}
function rivalDay(o, k){
  const today = dayKey(); if(k > today) return 0;
  const r = mulberry(seedFrom('rd:' + k + o.name)); if(r() > o.p) return 0;
  let v = o.skill * (0.7 + r() * 0.6);
  if(k === today){ const st = 7 + r() * 12, sp = 2 + r() * 5, n = new Date(), h = n.getHours() + n.getMinutes() / 60, q = Math.max(0, Math.min(1, (h - st) / sp)); v = q ? v * (0.45 + 0.55 * q) : 0; }
  return Math.round(v * 1.05 / 10) * 10;
}
function leagueBoard(wk = weekStartKey(), tier = leagueState().tier, tl = myTL()){
  const days = []; for(let i = 0; i < 7; i++) days.push(addDays(wk, i));
  const list = leagueRivals(wk, tier).map(o => ({ name:o.name, rival:true, score:days.reduce((a, k) => a + rivalDay(o, k), 0) }));
  list.push({ name:'나', me:true, score:weekSum(tl, wk) });
  list.sort((a, b) => b.score - a.score || (a.me ? 1 : b.me ? -1 : 0));
  return list;
}
/* 새 주가 시작되면 지난주 결과로 승급·강등 */
function leagueRollover(){
  const s = leagueState(), cur = weekStartKey();
  if(s.week === cur){ store.set('hp:league', s); return null; }
  const tl = myTL(), b = leagueBoard(s.week, s.tier, tl), pos = b.findIndex(x => x.me) + 1, my = b[pos - 1].score;
  let move = 0;
  if(my > 0 && pos <= 5 && s.tier < 3) move = 1; else if(pos > 25 && s.tier > 0) move = -1;
  const res = { week:s.week, pos, score:my, from:s.tier, to:s.tier + move, prize: my > 0 && pos <= 3 ? [30000, 20000, 10000][pos - 1] * (s.tier + 1) : 0 };
  s.tier += move; s.week = cur; s.last = res; s.seen = false; store.set('hp:league', s);
  return res;
}
/* 모두의 상금(시뮬레이션): 이번 주 모두가 본 광고 수익이 쌓임 + 내가 본 광고 1번 = 12원 */
function prizePool(){
  const wk = weekStartKey(), [y, m, d] = wk.split('-').map(Number), st = new Date(y, m - 1, d).getTime();
  const el = Math.max(0, Math.min(Date.now(), weekDeadline(wk).getTime()) - st) / 1000;
  return 250000 + Math.round(el * 3.1) + (store.get('hp:adsWeek', {})[wk] || 0) * 12;
}

function worldStat(score){
  const n = new Date(), h = n.getHours() + n.getMinutes() / 60;
  const cnt = Math.round(4200 + 118000 * Math.min(1, Math.max(0.05, (h - 5) / 17)));
  const top = score ? Math.round(Math.max(0.3, Math.min(99, 100 / (1 + Math.exp((score - 2300) / 500)))) * 10) / 10 : null;
  return { n:cnt, top };
}

function advLevel(id, n){
  const L = { name:'스테이지 ' + n, mult:1 };

  const gv = Math.max(24, 46 - Math.floor((n - 1) * 0.4));
  L.sudoku = { givens:gv, limit: gv >= 38 ? 420 : gv >= 30 ? 600 : 900 };
  L.ball = ballStageCfg(n);
  L.tower = { n, limit:0 };
  L.ai = n <= 5 ? 'easy' : n <= 15 ? 'normal' : 'hard';
  L.fleet = { limit:0 };
  return L;
}

  const L = advLevel(id, n);
  if(id === 'fox') return L.fox.N + '×' + L.fox.N + ' 판';
  if(id === 'sudoku') return '숫자 ' + L.sudoku.givens + '개 제공';

function pickLevel(id){

  let sel = lastLv(id);
  const rows = Object.entries(LEVELS).map(([k, L], i) => {
    const X = levelOf(id, k);
    const d0 = id === 'fox' ? X.fox.N + '×' + X.fox.N + ' 판' : id === 'sudoku' ? (X.sudoku.givens ? '숫자 ' + X.sudoku.givens + '개 제공' : '숫자 최소 제공') : id === 'ball' ? '블록 ' + X.ball.rows + '줄' : '공격 ' + Math.min(15, 5 + Math.ceil(X.tower.n * 0.6)) + '번';
    const desc = d0 + ' · 최대 약 ' + fmt(maxPts(id, k)) + '점';
    return `<button class="opt" role="radio" data-lv="${k}" aria-checked="${k === sel}"><span class="lvdots">${[0,1,2].map(j => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</span><span><b>${L.name}</b><small>${desc}</small></span>${k === 'normal' ? '<span class="rec">추천</span>' : '<span></span>'}</button>`;
  }).join('');

}

/* ---- 모험 맵: 챕터 10칸, 10번은 보스 ---- */
function openAdvMap(id, want){
  const p = advProg(id);
  let pick = Math.min(want || p.max, p.max), c = chOf(pick);
  const draw = () => {
    const cs = (c - 1) * 10;

      return `<button class="st${lock ? ' lock' : ''}${n === p.max ? ' cur' : ''}${n === pick ? ' sel' : ''}${k === 10 ? ' boss' : ''}" data-n="${n}" ${lock ? 'disabled aria-label="' + n + ' 잠김"' : 'aria-label="스테이지 ' + n + (k === 10 ? ' 보스' : '') + ', 별 ' + s + '개"'}>${lock ? ic('lock') : n}${lock ? '' : `<i>${[1,2,3].map(j => `<span class="${j <= s ? 'on' : 'off'}">★</span>`).join('')}</i>`}</button>`; }).join('');
    const canNext = p.max > c * 10;
    openModal(`<h3>${GAMES[id].name} 모험</h3>
      <div class="chhead"><button id="chPrev" aria-label="이전 챕터" ${c <= 1 ? 'disabled' : ''}>${ic('chev', 'rot')}</button><div class="chname">${chName(id, c)}<small>챕터 ${c} · 별 ${chStars(id, c)}/30${chCleared(id, c) ? ' · 클리어' : ''}</small></div><button id="chNext" aria-label="다음 챕터" ${canNext ? '' : 'disabled'}>${ic('chev')}</button></div>
      <div class="path">${cells}</div>
      <p class="rule">${ADV_RULE[id]}<br>스테이지 ${pick}${pick % 10 === 0 ? ' (보스)' : ''}: <b>${advDesc(id, pick)}</b></p>
      <div class="mbtns"><button class="b2" id="mClose">닫기</button><button class="b1" id="mGo">${pick} 시작 · 무료</button></div>`);
    const m = $('#modal'); m.classList.add('amap'); m.style.setProperty('--gc', GCOL[id][1]);
    $('#mClose').onclick = closeModal;
    $('#mGo').onclick = () => { closeModal(); startGame(id, null, { adv:pick }); };
    $('#chPrev').onclick = () => { c--; pick = Math.min(p.max, c * 10); draw(); };
    $('#chNext').onclick = () => { c++; pick = Math.min(p.max, c * 10); draw(); };
    document.querySelectorAll('.st:not(.lock)').forEach(b => b.onclick = () => { pick = +b.dataset.n; draw(); });
  };
  draw();
}

function advFinish(win){

    if(n % 10 === 0 && first){ addHearts(2); cel.push({ kind:'chapter', id, c:n / 10 }); }

  }
  const lv1 = lvInfo(), c = chOf(n), cs = (c - 1) * 10;

  const xpFrom = lv1.L > lv0.L ? 0 : lv0.cur / lv0.need * 100, xpTo = lv1.cur / lv1.need * 100;
  const chBox = `<div class="chprog" style="--gc:${GCOL[id][1]}"><div class="h">${chName(id, c)} <small>챕터 ${c} · 별 ${chStars(id, c)}/30</small></div><div class="chdots">${dots}</div>
    <div class="xp"><i id="advXp" style="width:${xpFrom}%"></i></div><div class="xp-t"><span>Lv.${lv1.L} ${lv1.title}</span><b class="num">${win && st ? (better ? '+' + (st - prev) + '★ · ' : '') : ''}${lv1.cur}/${lv1.need}</b></div></div>`;

function radarSVG(ab){
  const cx = 150, cy = 128, R = 84, n = GAME_IDS.length, pt = (i, r) => { const a = (-90 + i * 360 / n) * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  let g = '';
  [0.25, 0.5, 0.75, 1].forEach(f => { g += `<polygon points="${GAME_IDS.map((_, i) => pt(i, R * f).join(',')).join(' ')}" style="fill:none;stroke:var(--line);stroke-width:1"/>`; });
  GAME_IDS.forEach((_, i) => { const [x, y] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line);stroke-width:1"/>`; });
  const poly = GAME_IDS.map((k, i) => pt(i, R * Math.max(0.04, ab[k] / 100)).join(',')).join(' ');
  g += `<polygon points="${poly}" style="fill:color-mix(in srgb, var(--primary) 26%, transparent);stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round"/>`;
  GAME_IDS.forEach((k, i) => {
    const [x, y] = pt(i, R * Math.max(0.04, ab[k] / 100)); g += `<circle cx="${x}" cy="${y}" r="4.5" style="fill:${GAME_META[k].col};stroke:var(--surface);stroke-width:2"/>`;
    const [lx, ly] = pt(i, R + 24), anc = Math.abs(lx - cx) < 8 ? 'middle' : lx > cx ? 'start' : 'end';
    g += `<text x="${lx}" y="${ly - 2}" text-anchor="${anc}" style="fill:var(--ink);font-size:13px;font-weight:700">${ABIL[k]}</text><text x="${lx}" y="${ly + 14}" text-anchor="${anc}" style="fill:${ab[k] ? GAME_META[k].col : 'var(--sub)'};font-size:12px;font-weight:700">${ab[k] ? ab[k] : '–'}</text>`;
  });
  return `<svg class="radar" viewBox="0 0 300 260" role="img" aria-label="능력 5가지: ${GAME_IDS.map(k => ABIL[k] + ' ' + ab[k]).join(', ')}">${g}</svg>`;
}

}

    if(id === 'ball'){ time = Math.max(0, 350 - Math.max(0, G.turn - G.R) * 35); paw = G.undoUsed ? 0 : 150; l1 = '스테이지 클리어'; l2 = '턴 보너스 (' + G.turn + '턴, 최소 ' + G.R + '턴)'; l3 = G.undoUsed ? '되돌리기 사용' : '되돌리기 안 씀'; }
    if(id === 'fleet'){ const n = G.sh.length; base = 500; time = Math.round(350 * Math.max(0, Math.min(1, (100 - n) / 83))); paw = Math.round(150 * G.myLeft / FL_TOTAL);

    const d2 = dayState(), r1 = myPos(d2);

  } else {

let G = null, tick = null;

function startGame(id, lv = 'normal', o = {}){
  const adv = o.adv || 0;
  if(!adv && !spendHeart()){ openHeartSheet('empty'); return; }
  if(!adv) sfx('heartUse'); sfx('start');
  if(G && G.cleanup){ try{ G.cleanup(); }catch(_){} G.cleanup = null; }
  if(G && G.raf) cancelAnimationFrame(G.raf);
  let attempt = 0;
  if(!adv){ const d = dayState(); d.tries[id]++; saveDay(d); attempt = d.tries[id]; }
  const L = levelOf(id, lv, adv);
  if(adv) lv = id === 'fleet' ? L.ai : 'adv';
  const rng = adv ? mulberry(seedFrom('adv:' + id + ':' + adv)) : mulberry(seedFrom(dayKey() + ':' + id + ':' + lv + ':' + attempt));
  G = { id, lv, adv, L, attempt, paws:3, start:Date.now(), over:false, limit:L[id].limit, paused:false, pauseAt:0, pausedMs:0 };
  if(id === 'fox'){
    Object.assign(G, { N:L.fox.N, rng, reg:null, cells:[], placed:0, earned:0, hints:3, autos:3, hist:[], hintUsed:0, combo:0 });
  } else if(id === 'ball'){
    ballInit(genBall(rng, L.ball));
  } else if(id === 'tower'){
    tdInit(L.tower.n, rng);
  } else if(id === 'fleet'){
    flInit(lv, rng);
  } else {
    const p = genSudoku(rng, L.sudoku.givens);
    const empty = p.puz.filter(v => !v).length;
    Object.assign(G, { sol:p.sol, grid:p.puz.slice(), given:p.puz.map(v => v>0), notes:new Array(81).fill(0), wrong:new Array(81).fill(false),
      sel:-1, memo:false, hints:3, hintUsed:0, undo:[], earned:0, earnedCells:{}, perCell:500/empty, scombo:0, done:false });
    G.uDone = sudUnitsDone();
  }
  $('#home').style.display = 'none'; $('#play').style.display = 'block';
  $('#ptitle').innerHTML = GAMES[id].name + (adv ? `<small>모험 · ${chName(id, chOf(adv))} · 스테이지 ${adv}${id === 'tower' ? ' · ' + G.mapName : ''}</small>` : `<small>${L.name}${id === 'tower' ? ' · ' + G.mapName : ''} · 오늘 ${attempt}번째 판 · 친구와 같은 문제</small>`);
  $('.stats').style.display = 'none'; document.body.dataset.mode = id; document.body.classList.toggle('fxmode', id === 'fox'); document.body.classList.toggle('flmode', id === 'fleet');

  clearInterval(tick);

}

function sfx(name, o = {}){
  const f = SFX_LIB[name]; if(!f || !SND.on || AUD.set.sfx <= 0) return;
  const g = SFX_GATE[name]; if(g && !aGate(name, g)) return;
  const ac = audReady(); if(!ac) return;
  try{ f(o); }catch(_){}
}

function fxSound(kind, level){
  if(kind === 'ok') sfx('fOk', { n:level || 0 });

/* ===== 배경 소리(게임별 분위기): 함대 = 바다 물결, 디펜스 = 숲 바람과 새, 구슬 = 네온 신스 ===== */
function ambFor(id){ return { fleet:'sea', tower:'forest', ball:'neon' }[id] || null; }
function ambStart(kind){
  if(AUD.ambKind === kind && AUD.amb) return;
  ambStop();
  if(!kind || !SND.on) return;
  const ac = audReady(); if(!ac) return;
  const out = ac.createGain(); out.gain.value = .0001; out.connect(AUD.bus.amb);
  out.gain.setTargetAtTime(1, ac.currentTime + .05, .9);
  const A = { out, nodes:[], timers:[], kind, stopped:false };
  const noise = (ft, f, q) => { const s = ac.createBufferSource(); s.buffer = AUD.nb; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = ft; fl.frequency.value = f; fl.Q.value = q || .7; s.connect(fl); s.start(0, Math.random() * 1.8); A.nodes.push(s); return fl; };
  const lfo = (param, rate, depth, base) => { param.value = base; const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = rate; g.gain.value = depth; o.connect(g); g.connect(param); o.start(); A.nodes.push(o); };
  const gainTo = (node, v) => { const g = ac.createGain(); g.gain.value = v; node.connect(g); g.connect(out); return g; };
  if(kind === 'sea'){
    const swell = gainTo(noise('lowpass', 380), .07); lfo(swell.gain, .085, .045, .07);
    const foam = gainTo(noise('bandpass', 1500, .6), .015); lfo(foam.gain, .12, .012, .015);
    const low = ac.createOscillator(), lg = ac.createGain(); low.frequency.value = 46; lg.gain.value = .012; low.connect(lg); lg.connect(out); low.start(); A.nodes.push(low);
    const buoy = () => { if(A.stopped) return; aBell({ f:m2f(rnd(0, 1) < .5 ? 74 : 69), ratio:2.4, idx:.8, d:2.2, v:.018, rev:.7, bus:'amb', pan:rnd(-.6, .6) }); A.timers.push(setTimeout(buoy, rnd(7000, 13000))); };
    A.timers.push(setTimeout(buoy, 3000));
  } else if(kind === 'forest'){
    const wind = gainTo(noise('lowpass', 650), .03); lfo(wind.gain, .06, .02, .03);
    const leaves = gainTo(noise('bandpass', 2600, .8), .006); lfo(leaves.gain, .17, .005, .006);
    const bird = () => {
      if(A.stopped) return;
      const pan = rnd(-.8, .8), base = rnd(2400, 3600), n = 2 + Math.floor(rnd(0, 4));
      for(let k = 0; k < n; k++) aTone({ f:base * rnd(.9, 1.1), f2:base * rnd(1.2, 1.5), t:k * rnd(.08, .13), d:.06, v:.012, bus:'amb', pan, rev:.3 });
      A.timers.push(setTimeout(bird, rnd(2500, 7000)));
    };
    A.timers.push(setTimeout(bird, 1200));
  } else if(kind === 'neon'){
    const flt = ac.createBiquadFilter(); flt.type = 'lowpass'; flt.Q.value = 3; lfo(flt.frequency, .05, 180, 380);
    const g = ac.createGain(); g.gain.value = .02; flt.connect(g); g.connect(out);
    for(const [f, det] of [[55, 0], [55, 8], [82.41, -6], [110, 4]]){ const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det; o.connect(flt); o.start(); A.nodes.push(o); }
    const hum = gainTo(noise('bandpass', 120, 4), .01); lfo(hum.gain, .3, .004, .01);
  }
  AUD.amb = A; AUD.ambKind = kind;
}
function ambStop(){
  const A = AUD.amb; AUD.amb = null; AUD.ambKind = null;
  if(!A || !AUD.ac) return;
  A.stopped = true; A.timers.forEach(clearTimeout);
  const t = AUD.ac.currentTime; try{ A.out.gain.cancelScheduledValues(t); A.out.gain.setTargetAtTime(.0001, t, .3); }catch(_){}
  setTimeout(() => { A.nodes.forEach(n => { try{ n.stop(); }catch(_){} }); try{ A.out.disconnect(); }catch(_){} }, 1600);
}
function ambDuck(on){ const A = AUD.amb; if(!A || !AUD.ac) return; A.out.gain.setTargetAtTime(on ? .25 : 1, AUD.ac.currentTime, .3); }

/* 틀린 이유: 이미 놓은 여우와 부딪히면 그 여우를 짚어줌 */
function foxWhy(i){
  const N = G.N, r = Math.floor(i/N), c = i%N;
  for(let f=0; f<N*N; f++){
    if(G.cells[f] !== 2) continue;
    const fr = Math.floor(f/N), fc = f%N;
    if(fr === r) return { f, text:'같은 가로줄에 여우가 있어요' };
    if(fc === c) return { f, text:'같은 세로줄에 여우가 있어요' };
    if(G.reg[f] === G.reg[i]) return { f, text:'같은 색 구역에 여우가 있어요' };
    if(Math.abs(fr - r) <= 1 && Math.abs(fc - c) <= 1) return { f, text:'옆 여우와 붙어 있어요' };
  }
  return { f:-1, text:'여기는 여우 자리가 아니에요' };
}

/* 고리 메뉴 버튼 위치(화면 밖으로 나가지 않게 중심을 안쪽으로) */
function tdRing(){
  const s = G.sel; if(!s || (s.type !== 'spot' && s.type !== 'tower')) return null;
  const o = s.type === 'spot' ? G.spots[s.i] : s.t, V = G.V;
  const cx = Math.max(-V.ox + 120, Math.min(TW + V.ox - 120, o.x)), cy = Math.max(-V.oy + 150, Math.min(V.h - V.oy - 150, o.y - 24));
  const opts = [];

    TD_ORDER.forEach((ty, k) => { const c = TD_TYPES[ty].cost[0]; opts.push({ id:ty, x:cx + off[k][0], y:cy + off[k][1], price:c, ok:G.gold >= c }); });
  } else {
    const t = s.t, T = TD_TYPES[t.type];
    if(t.lv < 2){ const c = T.cost[t.lv+1]; opts.push({ id:'up', x:cx, y:cy - 104, price:c, ok:G.gold >= c }); }
    else opts.push({ id:'max', x:cx, y:cy - 104, price:null, ok:false });

function tdTap(vx, vy){

  for(const k of ['fire','help']) if(hitV(L[k])){
    if(G.spell[k] > 0){ toast('아직 준비 중이에요 (' + Math.ceil(G.spell[k]) + '초)', 'err'); return; }
    G.sel = G.sel && G.sel.type === 'spell' && G.sel.k === k ? null : { type:'spell', k }; G.pick = null; sfx('tSel'); return;
  }

  const x = vx - G.V.ox, y = vy - G.V.oy, hit = (b, r) => Math.hypot(x - b.x, y - b.y) <= (r || b.r);
  const R = tdRing();
  if(R){
    for(const o of R.opts) if(hit(o, 50)){
      if(o.id === 'max') return;
      if(G.pick !== o.id){ G.pick = o.id; sfx('tSel'); return; }   /* 원본처럼 첫 번째 터치 = 설명, 두 번째 터치 = 실행 */
      if(o.id === 'sell'){ const t = G.sel.t; tdSell(t); tdDust(t.x, t.y, 10); G.sel = null; G.pick = null; return; }
      if(!o.ok){ toast('골드가 모자라요', 'err'); return; }
      if(o.id === 'up'){ tdUpgrade(G.sel.t); tdDust(G.sel.t.x, G.sel.t.y, 8); } else { const s = G.spots[G.sel.i]; tdBuild(G.sel.i, o.id); tdDust(s.x, s.y, 10); }
      G.sel = null; G.pick = null; return;
    }
  }
  if(tdCanCall()) for(let pi=0; pi<G.entries.length; pi++) if(hit(G.entries[pi], 58)){
    if(G.sel && G.sel.type === 'call'){ tdCall(); G.sel = null; }
    else { G.sel = { type:'call', pi }; G.pick = null; sfx('tSel'); }
    return;
  }
  if(G.sel && G.sel.type === 'spell'){ if(tdCast(G.sel.k, x, y)) G.sel = null; return; }
  if(G.sel && G.sel.type === 'hero'){ if(tdMoveHero(x, y)){ G.fxs.push({ kind:'mark', x:tdHero().hx, y:tdHero().hy, t:0, dur:0.7 }); G.sel = null; } return; }
  G.pick = null;
  const t = G.towers.find(t => Math.hypot(t.x - x, t.y - 44 - y) < 66);
  if(t){ G.sel = G.sel && G.sel.t === t ? null : { type:'tower', t }; sfx('tSel'); return; }
  const i = G.spots.findIndex(s => !s.used && Math.hypot(s.x - x, s.y - 10 - y) < 62);
  if(i >= 0){ G.sel = G.sel && G.sel.i === i ? null : { type:'spot', i }; sfx('tSel'); return; }
  const h = tdHero();
  if(h && !h.dead && Math.hypot(h.x - x, h.y - 30 - y) < 44){ G.sel = { type:'hero' }; sfx('tSel'); return; }
  G.sel = null;
}

function flCells(s){ const o = []; for(let k=0;k<s.len;k++) o.push((s.y + (s.v ? k : 0)) * 10 + s.x + (s.v ? 0 : k)); return o; }

function flRandomFleet(rng){   /* 서로 붙지 않게 무작위 배치 */
  for(let tries=0; tries<300; tries++){
    const ships = [], block = new Set(); let ok = true;
    for(const S of FL_SHIPS){
      let placed = false;
      for(let a=0; a<200 && !placed; a++){
        const v = rng() < .5, s = { ...S, v, x:Math.floor(rng() * (v ? 10 : 11 - S.len)), y:Math.floor(rng() * (v ? 11 - S.len : 10)), hits:0 };
        const cs = flCells(s); if(cs.some(c => block.has(c))) continue;
        ships.push(s); placed = true;
        cs.forEach(c => { const r = Math.floor(c / 10), q = c % 10; for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){ const rr = r + dr, cc = q + dc; if(rr >= 0 && rr < 10 && cc >= 0 && cc < 10) block.add(rr * 10 + cc); } });
      }

let ROOM = null, ROOM_STATE = 'pending';
/* 대전 서버(Railway). Claude 링크에서는 Claude의 room을, 그 밖(GitHub Pages 등)에서는 이 서버를 쓴다. */
const BATTLE_WS = 'wss://battle-production-c11b.up.railway.app/ws';
function netRoomConnect(url){
  return new Promise((resolve, reject) => {
    let ws = null, you = null, closedByUs = false, first = true, retry = 0;
    const rooms = new Map(); // name -> {peers, pres, subs:Set, errs:Set, waiters:[], joined}
    const send = m => { try{ if(ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }catch(_){} };
    const st = name => { let s = rooms.get(name); if(!s){ s = { peers:[], pres:{}, subs:new Set(), errs:new Set(), waiters:[], joined:false }; rooms.set(name, s); } return s; };
    function api(name, isLobby){
      const s = st(name);
      return {
        peers: () => s.peers.map(p => ({ peer:p.peer, presence:p.presence, sameTab:p.peer === you })),
        presence: obj => { Object.assign(s.pres, obj); send({ t:'p', r:name, p:obj }); return Promise.resolve(); },
        onPeers: (cb, err) => { s.subs.add(cb); if(err) s.errs.add(err); return () => { s.subs.delete(cb); if(err) s.errs.delete(err); }; },
        join: sub => new Promise((res, rej) => {
          const ss = st(sub); ss.pres = {};
          const tm = setTimeout(() => { rej(new Error('join timeout')); }, 8000);
          ss.waiters.push(() => { clearTimeout(tm); res(api(sub, false)); });
          send({ t:'join', r:sub });
        }),
        leave: () => { if(isLobby) return; send({ t:'leave', r:name }); rooms.delete(name); },
      };
    }
    function open(){
      try{ ws = new WebSocket(url); }catch(e){ if(first) reject(e); return; }
      const failT = setTimeout(() => { if(first){ first = false; try{ ws.close(); }catch(_){} reject(new Error('timeout')); } }, 7000);
      ws.onmessage = ev => {
        let m; try{ m = JSON.parse(ev.data); }catch(_){ return; }
        if(m.t === 'hello'){
          you = m.you; retry = 0;
          const lob = st('lobby'); send({ t:'join', r:'lobby' });
          if(Object.keys(lob.pres).length) send({ t:'p', r:'lobby', p:lob.pres });
          if(first){ first = false; clearTimeout(failT); resolve(api('lobby', true)); }
          return;
        }
        if(m.t === 'peers' && rooms.has(m.r)){
          const s = rooms.get(m.r); s.peers = m.peers || []; s.joined = true;
          const w = s.waiters.splice(0); w.forEach(f => f());
          const ch = { joined:m.joined || [], left:m.left || [] };
          s.subs.forEach(cb => { try{ cb(ch); }catch(_){} });
        }
      };
      ws.onclose = () => {
        clearTimeout(failT);
        // 대전 방은 끊기면 끝(게임이 처리), 대기실은 다시 연결
        for(const [name, s] of rooms){ if(name !== 'lobby'){ s.errs.forEach(f => { try{ f(); }catch(_){} }); rooms.delete(name); } }
        const lob = rooms.get('lobby'); if(lob) lob.peers = [];
        if(first){ first = false; reject(new Error('closed')); return; }
        if(!closedByUs) setTimeout(open, Math.min(15000, 1500 * (++retry)));
      };
    }
    open();
    setInterval(() => send({ t:'ping' }), 25000);
  });
}

function flPlaceShips(anim){

  layer.querySelectorAll('.fl-ship').forEach(el => {

      drag.moved = true;
      const rc = sea.getBoundingClientRect(), cs = rc.width / 10;
      const nx = Math.max(0, Math.min(10 - (s.v ? 1 : s.len), Math.floor((e.clientX - rc.left) / cs) - drag.gx));
      const ny = Math.max(0, Math.min(10 - (s.v ? s.len : 1), Math.floor((e.clientY - rc.top) / cs) - drag.gy));
      if(nx !== drag.nx || ny !== drag.ny) flSound('aim');
      drag.nx = nx; drag.ny = ny; el.style.left = nx * 10 + '%'; el.style.top = ny * 10 + '%';
      el.classList.toggle('bad', !flFits(G.my, { ...s, x:nx, y:ny }, s));
    };
    const end = () => {
      if(!drag) return; const d = drag; drag = null; el.classList.remove('drag', 'bad');
      if(!d.moved){   /* 회전: 안 맞으면 가까운 자리로 밀어서 시도 */

}

function flSearchText(){

  if(G.phase === 'joining'){ st.textContent = '상대를 찾았어요!'; sn.innerHTML = `<b>${flEsc(G.oppNick)}</b> 선장과 연결하는 중…`; $('#flSBtns').style.display = 'none'; return; }

}
function flSearch(){
  G.phase = 'search'; G.mmT0 = Date.now(); flRender();
  const room = ROOM;
  if(!room){ return; }
  G.ft = Date.now();
  room.presence({ fl:'wait', ft:G.ft, nk:G.nick, pr:null }).catch(() => {});
  const check = () => {
    if(G.over || (G.phase !== 'search' && G.phase !== 'nobody')) return;
    let ps; try{ ps = room.peers(); }catch(_){ return; }
    const me = ps.find(p => p.sameTab); if(!me) return;
    G.myPeer = me.peer;
    const claim = ps.find(p => !p.sameTab && p.presence && p.presence.fl === 'play' && p.presence.pr === me.peer);
    if(claim){ flMatch(claim); return; }
    const list = ps.filter(p => p.presence && p.presence.fl === 'wait' && typeof p.presence.ft === 'number')
      .sort((a, b) => a.presence.ft - b.presence.ft || (a.peer < b.peer ? -1 : 1));
    const i = list.findIndex(p => p.sameTab); if(i < 0) return;
    const opp = list[i % 2 ? i - 1 : i + 1]; if(opp) flMatch(opp);
  };
  try{ G.mmUn = room.onPeers(check, () => {}); }catch(_){}
  G.mmIv = setInterval(() => {
    check();
    if((G.phase === 'search' || G.phase === 'nobody') && Date.now() - (G.pingT || 0) > 2400){ G.pingT = Date.now(); flSound('ping'); }
    if(G.phase === 'search' && Date.now() - G.mmT0 > 20000){ G.phase = 'nobody'; flSound('bad'); }
    flSearchText();
  }, 500);
}
function flStopSearch(){ clearInterval(G.mmIv); if(G.mmUn) try{ G.mmUn(); }catch(_){} G.mmUn = null; }
function flSwitchAI(){
  flStopSearch(); flCleanupRoom();
  G.mode = 'ai'; G.lv = 'normal'; G.ai = 'normal'; G.L = FL_LV.normal; G.oppNick = 'AI 함장';
  flStartBattle();
}
function flCleanupRoom(){
  clearInterval(G.syncIv); if(G.nrUn) try{ G.nrUn(); }catch(_){} G.nrUn = null;
  if(G.nr){ const nr = G.nr; G.nr = null; try{ nr.leave(); }catch(_){} }
  if(ROOM) ROOM.presence({ fl:null, ft:null, pr:null }).catch(() => {});
}
async function flMatch(opp){
  if(G.phase !== 'search' && G.phase !== 'nobody') return;

  G.phase = 'joining'; G.oppPeer = opp.peer; G.oppNick = String((opp.presence && opp.presence.nk) || '상대 선장').slice(0, 12);
  G.first = G.myPeer < opp.peer;
  ROOM.presence({ fl:'play', pr:opp.peer }).catch(() => {});
  flRender(); flSound('lock'); fxBuzz([20, 40, 20]);
  const a = [G.myPeer, opp.peer].map(x => String(x).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20)).sort();
  const me = G; let nr;
  try{ nr = await ROOM.join(('fl-' + a[0] + '-' + a[1]).slice(0, 48)); }catch(_){ if(G === me) flMatchFail(); return; }
  if(G !== me || G.phase !== 'joining' || G.over){ try{ nr.leave(); }catch(_){} return; }
  G.nr = nr; G.joinT = Date.now();
  nr.presence({ v:1, nk:G.nick, sh:[], an:[] }).catch(() => {});
  try{ G.nrUn = nr.onPeers(ch => { if(G !== me) return; if(G.oppSeen && ch.left.some(p => p.peer === G.oppPeer)) flOppLeft(); else flSync(); }, () => { if(G === me && !G.over && G.phase === 'battle'){ toast('연결이 끊겼어요'); flEnd(false); } }); }catch(_){}

}

/* 차례 */
function flTurn(){
  if(G.phase !== 'battle' || G.ending) return 'end';
  if(G.pending >= 0 || G.busy) return 'wait';
  if(G.mode === 'ai') return G.turn;
  if(G.opp.sh.length > G.an.length || G.busyIn) return 'op';
  const miss = r => !(r === 1 || Array.isArray(r));
  let t = G.first ? 'me' : 'op', i = 0, j = 0;
  for(let n=0; n<400; n++){
    if(t === 'me'){ if(i >= G.sh.length) return 'me'; if(i >= G.opp.an.length) return 'wait'; if(miss(G.opp.an[i++])) t = 'op'; }
    else { if(j >= G.opp.sh.length) return 'op'; if(j >= G.an.length) return 'op'; if(miss(G.an[j++])) t = 'me'; }
  }
  return 'op';
}
function flTurnUI(){

    if(t === 'op') G.opSince = Date.now();

  }
  let txt = t === 'me' ? '내 차례' : t === 'wait' ? '포탄 비행 중' : t === 'end' ? '전투 종료' : G.mode === 'ai' ? 'AI 조준 중' : '상대 차례';

}

  }

}

function flFromShip(){
  const alive = G.my.map((s, k) => [s, k]).filter(([s]) => s.hits < s.len);

function flFire(i){

  const me = G;

function flShell(fromEl, toEl, en, done){

function flSunkInfo(cells, kIdx){

}

/* 내가 쏜 결과: 0 빗나감, 1 명중, [칸들] 격침 */
function flMyResult(i, r){
  G.pending = -1;

/* 적 포격이 우리 함대에 떨어짐 */

/* ----- AI ----- */
function flAiReceive(i){ const si = G.enMap[i]; if(si < 0) return 0; const s = G.en[si]; s.hits++; return s.hits >= s.len ? flCells(s) : 1; }
function flNb(i){ const r = Math.floor(i / 10), c = i % 10, o = []; if(r) o.push(i - 10); if(r < 9) o.push(i + 10); if(c) o.push(i - 1); if(c < 9) o.push(i + 1); return o; }
function flAiPick(){
  const K = G.aiKnow, all = [...Array(100).keys()], unk = all.filter(i => !K[i]), hits = all.filter(i => K[i] === 2);
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  if(G.ai === 'easy'){
    if(hits.length && Math.random() < .5){ const c = hits.flatMap(flNb).filter(j => !K[j]); if(c.length) return rnd(c); }
    return rnd(unk);
  }
  if(G.ai === 'normal'){
    if(hits.length){
      let best = [], bw = 0;
      for(const h of hits) for(const j of flNb(h)){
        if(K[j]) continue;
        const d = j - h, back = h - d, sameRow = Math.abs(d) !== 1 || Math.floor(back / 10) === Math.floor(h / 10);
        const w = back >= 0 && back < 100 && sameRow && K[back] === 2 ? 3 : 1;
        if(w > bw){ bw = w; best = [j]; } else if(w === bw) best.push(j);
      }
      if(best.length) return rnd(best);
    }
    const par = unk.filter(i => (Math.floor(i / 10) + i % 10) % 2 === 0);
    return rnd(par.length ? par : unk);
  }
  /* 어려움: 남은 함선이 들어갈 수 있는 모든 자리를 세어 가장 확률 높은 칸 */
  const left = FL_SHIPS.map(S => S.len); G.aiSunk.forEach(l => { const k = left.indexOf(l); if(k >= 0) left.splice(k, 1); });
  const sc = new Array(100).fill(0);
  for(const len of left) for(const v of [0, 1]) for(let y=0; y<(v ? 11 - len : 10); y++) for(let x=0; x<(v ? 10 : 11 - len); x++){
    const cs = flCells({ x, y, v, len }); let bad = false, hc = 0;
    for(const c of cs){ if(K[c] === 1 || K[c] === 3){ bad = true; break; } if(K[c] === 2) hc++; }
    if(bad) continue;
    const w = hc ? 1 + hc * 25 : (hits.length ? 0.05 : 1);
    for(const c of cs) if(!K[c]) sc[c] += w;
  }
  let mx = -1, best = [];
  for(const i of unk){ const s2 = sc[i] + ((Math.floor(i / 10) + i % 10) % 2 ? 0 : .01); if(s2 > mx + 1e-9){ mx = s2; best = [i]; } else if(Math.abs(s2 - mx) < 1e-9) best.push(i); }
  return rnd(best.length ? best : unk);
}
function flAiTurn(){
  if(G.over || G.ending || G.id !== 'fleet') return;
  if(G.paused || $('#veil').classList.contains('on')){ const me = G; setTimeout(() => { if(G === me) flAiTurn(); }, 400); return; }
  const i = flAiPick(), me = G;
  flEnemyAim(i, () => {
    if(G !== me || G.over) return;
    const r = flReceive(i);
    G.aiKnow[i] = r === 0 ? 1 : 2;
    if(Array.isArray(r)){ r.forEach(c => G.aiKnow[c] = 3); G.aiSunk.push(r.length); }
    flIncoming(i, r);
    if(G.myLeft <= 0){ flEnd(false); return; }
    if(r !== 0){ G.turn = 'ai'; flTurnUI(); setTimeout(() => { if(G === me) flAiTurn(); }, 900); return; }
    G.turn = 'me'; flTurnUI();
  });
}

/* ----- 실시간 동기화: 서로의 presence(쏜 칸 목록 sh, 받은 포격 답 an)만으로 진행 ----- */
function flSync(){
  if(!G || G.id !== 'fleet' || !G.nr || G.over) return;
  let opp = null; try{ opp = G.nr.peers().find(p => p.peer === G.oppPeer && !p.sameTab); }catch(_){}
  if(!opp){ if(G.phase === 'joining' && Date.now() - G.joinT > 12000) flMatchFail(); return; }
  const o = opp.presence || {};
  if(Array.isArray(o.rv)) G.oppRv = o.rv;
  if(G.phase === 'joining'){
    if(o.v === 1){ G.oppSeen = true; if(typeof o.nk === 'string') G.oppNick = o.nk.slice(0, 12); flStartBattle(); }
    else if(Date.now() - G.joinT > 12000) flMatchFail();
    return;
  }
  if(G.phase !== 'battle' || G.ending) return;
  G.opp = { sh:Array.isArray(o.sh) ? o.sh : [], an:Array.isArray(o.an) ? o.an : [] };
  if(!G.busyIn && G.opp.sh.length > G.an.length){
    const i = Math.max(0, Math.min(99, G.opp.sh[G.an.length] | 0)), r = flReceive(i);
    G.an.push(r); G.nr.presence({ an:G.an }).catch(() => {});
    G.busyIn = true; flTurnUI(); const me = G;
    flEnemyAim(i, () => { if(G !== me) return; G.busyIn = false; flIncoming(i, r); if(G.myLeft <= 0){ flEnd(false); return; } flSync(); }, true);
    return;
  }
  if(!G.busy && G.shown < Math.min(G.opp.an.length, G.sh.length)){ const k = G.shown++; flMyResult(G.sh[k], G.opp.an[k]); return; }
  flTurnUI();
}

/* 효과음(해전용): 공용 엔진의 함대 소리로 연결. pan = 좌우 위치 */
function flSound(kind, pan){

const boxOf = i => Math.floor(Math.floor(i/9)/3)*3 + Math.floor((i%9)/3);
const isPeer = (a, b) => a !== b && (Math.floor(a/9) === Math.floor(b/9) || a%9 === b%9 || boxOf(a) === boxOf(b));
const locked = i => G.given[i] || (G.grid[i] && !G.wrong[i]);

function paintSud(){
  const sel = G.sel, sv = sel >= 0 ? G.grid[sel] : 0;
  document.querySelectorAll('#bd .cell').forEach(el => {
    const i = +el.dataset.i, v = G.grid[i];
    let cls = 'cell ' + (G.given[i] ? 'given' : G.wrong[i] ? 'wrong' : 'user');
    if(sel >= 0){
      if(i === sel) cls += ' sel';
      else if(sv && v === sv) cls += ' same';
      else if(isPeer(i, sel)) cls += ' hl';
    }
    for(const fc of ['pop','wave','winw','flash']) if(el.classList.contains(fc)) cls += ' ' + fc;
    el.className = cls;
    if(v){ el.textContent = v; }
    else if(G.notes[i]){
      let h = '<div class="nt">'; for(let d=1;d<=9;d++) h += `<span>${G.notes[i] & (1<<d) ? d : ''}</span>`; el.innerHTML = h + '</div>';
    } else el.textContent = '';
  });
  document.querySelectorAll('#pad button').forEach(b => {
    const v = +b.dataset.v; let n = 0; for(let i=0;i<81;i++) if(G.grid[i] === v && !G.wrong[i]) n++;
    b.classList.toggle('gone', n >= 9);
  });
  $('#smis').textContent = (3 - G.paws) + '/3';
  $('#sscore').textContent = fmt(Math.round(G.earned * G.L.mult));
  $('#memoBadge').textContent = G.memo ? 'ON' : 'OFF'; $('#memoBadge').classList.toggle('off', !G.memo);
  $('#tMemo').classList.toggle('on', G.memo);
  $('#hintBadge').textContent = G.hints; $('#tHint').classList.toggle('used', G.hints === 0);
}
function snap(){ G.undo.push({ grid:G.grid.slice(), notes:G.notes.slice(), wrong:G.wrong.slice() }); if(G.undo.length > 200) G.undo.shift(); }
function placeCorrect(i, v, earn){
  G.grid[i] = v; G.wrong[i] = false; G.notes[i] = 0;
  for(let j=0;j<81;j++) if(isPeer(i, j)) G.notes[j] &= ~(1 << v);
  if(!G.earnedCells[i]){ G.earnedCells[i] = 1; if(earn) G.earned += G.perCell; }
}
function sudCheckWin(){ for(let i=0;i<81;i++) if(G.grid[i] !== G.sol[i]) return false; return true; }
function cellEl(i){ return document.querySelector(`#bd .cell[data-i="${i}"]`); }

function sudInput(v){
  const i = G.sel;
  if(G.over || G.paused || G.done || i < 0 || locked(i)) return;
  if(G.memo){
    if(G.grid[i]) return;
    snap(); G.notes[i] ^= (1 << v); paintSud(); sfx('sNote', { on:!!(G.notes[i] & (1 << v)) }); return;
  }
  snap();
  if(G.sol[i] === v){
    placeCorrect(i, v, true);
    const padR = sudPadRect(v);
    paintSud();
    sudCelebrate(i, v, padR, false);
    if(sudCheckWin()) sudWin();
  } else {
    G.grid[i] = v; G.wrong[i] = true; G.notes[i] = 0; G.scombo = 0; paintSud(); miss(cellEl(i)); paintSud();
  }
}
/* ----- 스도쿠 효과(효과팀) ----- */
function sudUnitsDone(){
  const u = {}, ok = ids => ids.every(j => G.grid[j] && G.grid[j] === G.sol[j]);
  for(let k=0;k<9;k++){
    if(ok([...Array(9)].map((_, x) => k*9 + x))) u['r' + k] = 1;
    if(ok([...Array(9)].map((_, x) => x*9 + k))) u['c' + k] = 1;
    if(ok([...Array(81).keys()].filter(j => boxOf(j) === k))) u['b' + k] = 1;
  }
  return u;
}
/* 이 숫자를 넣으면 9개가 다 채워지는지: 채워지면 숫자판 버튼 위치를 미리 기억(곧 사라지므로) */
function sudPadRect(v){ let n = 0; for(let j=0;j<81;j++) if(G.grid[j] === v && !G.wrong[j]) n++; const b = document.querySelector(`#pad button[data-v="${v}"]`); return n >= 9 && b ? fxCenter(b) : null; }
function sudCelebrate(i, v, padR, hint){
  const el = cellEl(i); if(!el) return;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  const p = fxCenter(el), pan = panX(p.x);
  G.scombo = hint ? 0 : (G.scombo || 0) + 1;
  fxRing(p.x, p.y, hint ? '#FFD54F' : '#5AA9FF', p.w * 1.4, .45, 5);
  fxBurst(p.x, p.y, hint ? ['#FFE27A','#FFFFFF','#9C7BD8'] : ['#5AA9FF','#BBDEFB','#FFFFFF','#FFD54F'], hint ? 14 : 9, { speed:170, size:3.4, kinds:['dot','star','spark'], up:70, g:480, dur:.6, glow:hint });
  if(hint){ fxFloat(p.x, p.y - p.h * .5, '힌트', 'sud'); sfx('fHint', { pan }); }
  else { fxFloat(p.x, p.y - p.h * .5, '+' + Math.round(G.perCell * G.L.mult), 'sud'); sfx('sNum', { v, n:G.scombo, pan }); fxBuzz(10); }
  /* 가로줄·세로줄·굵은 칸이 완성되면: 놓은 칸에서부터 물결 + 반짝임 + 차임 */
  const r = Math.floor(i/9), c = i%9, b = boxOf(i), found = [];
  const ok = ids => ids.every(j => G.grid[j] === G.sol[j] && !G.wrong[j]);
  const units = [['r' + r, [...Array(9)].map((_, x) => r*9 + x), '가로줄'], ['c' + c, [...Array(9)].map((_, x) => x*9 + c), '세로줄'], ['b' + b, [...Array(81).keys()].filter(j => boxOf(j) === b), '굵은 칸']];
  G.uDone = G.uDone || {};
  for(const [k, ids, nm] of units) if(!G.uDone[k] && ok(ids)){ G.uDone[k] = 1; found.push([ids, nm]); }
  if(found.length){
    const seen = new Set();
    found.forEach(([ids]) => ids.forEach(j => {
      if(seen.has(j)) return; seen.add(j);
      const e = cellEl(j); if(!e) return;
      const dist = Math.max(Math.abs(Math.floor(j/9) - r), Math.abs(j%9 - c));
      e.style.setProperty('--wd', dist * 55 + 'ms'); e.classList.remove('wave'); void e.offsetWidth; e.classList.add('wave');
      setTimeout(() => { if(!e.isConnected) return; const q = fxCenter(e); fxBurst(q.x, q.y, ['#FFE27A','#FFFFFF','#FFB020'], 4, { speed:120, size:3, kinds:['star','spark'], up:90, g:300, glow:true, dur:.55 }); }, dist * 55 + 120);
    }));
    setTimeout(() => sfx('sLine', { k:found.length }), 60);
    fxFloat(p.x, p.y - p.h * 1.3, found.length > 1 ? (found.length > 2 ? '트리플!' : '더블!') : found[0][1] + ' 완성!', 'big');
    fxBuzz(found.length > 1 ? [20, 30, 20, 30, 30] : [20, 30, 20]);
  }
  if(padR){
    setTimeout(() => { sfx('sDigit'); fxRing(padR.x, padR.y, '#FFD54F', padR.w * 1.6, .5, 6); fxBurst(padR.x, padR.y, ['#FFE27A','#FFFFFF','#5AA9FF'], 16, { speed:220, size:4, kinds:['star','spark','dot'], up:160, g:500, glow:true }); fxFloat(padR.x, padR.y - padR.h, v + ' 끝!', 'sud'); }, 160);
  }
}
/* 스도쿠 완성: 왼쪽 위에서 오른쪽 아래로 파도 → 완성 음악 → 색종이 → 결과 */
function sudWin(){
  G.done = true; G.paused = true; G.pauseAt = Date.now(); G.sel = -1; paintSud();
  document.querySelectorAll('#bd .cell').forEach(e => { const j = +e.dataset.i, d = Math.floor(j/9) + j%9; e.style.setProperty('--wd', d * 40 + 'ms'); e.classList.remove('winw', 'wave', 'pop'); void e.offsetWidth; e.classList.add('winw'); });
  sfx('win', { g:'sudoku' }); fxBuzz([30, 60, 30, 60, 80]);
  const me = G;
  setTimeout(() => { if(G !== me) return; fxConfetti(); fxPop($('#bd'), 'gold'); }, 650);
  setTimeout(() => { if(G === me) finish(true); }, 1500);
}
function sudUndo(){
  if(G.over || G.paused || G.done || !G.undo.length) return;
  const u = G.undo.pop(); G.grid = u.grid; G.notes = u.notes; G.wrong = u.wrong; paintSud(); sfx('sUndo');
}
function sudErase(){
  const i = G.sel;

  snap(); G.grid[i] = 0; G.wrong[i] = false; G.notes[i] = 0; paintSud(); sfx('sErase');
}
function sudHint(){
  if(G.over || G.paused || G.done) return;
  if(G.hints <= 0){ toast('힌트를 모두 썼어요', 'err'); return; }
  let i = G.sel;
  if(i < 0 || locked(i)){
    const open = []; for(let j=0;j<81;j++) if(!locked(j)) open.push(j);
    if(!open.length) return; i = open[Math.floor(Math.random()*open.length)];

  const hv = G.sol[i];
  snap(); G.hints--; G.hintUsed++; placeCorrect(i, hv, false); G.sel = i;
  const padR = sudPadRect(hv); paintSud();

}

  if(G.paws <= 0) setTimeout(() => finish(false), 650);
}



let lastSig = '', ABOVE = null;
/* 추월 알림: 친구가 나를 제치면 여우가 알려줌 */
function checkOvertake(){
  const d = dayState(); if(!myTotal(d)){ ABOVE = null; return; }
  const b = board(d), mi = b.findIndex(x => x.me), above = b.slice(0, mi).filter(x => x.score > 0).map(x => x.name);
  if(ABOVE){ const nw = above.filter(n => !ABOVE.includes(n)); if(nw.length) toast(nw[0] + '님이 당신을 제쳤어요! 가만있을 거예요? 🦊'); }
  ABOVE = above;
}
function homeSig(){ const d = dayState(), h = heartState(); return [dayKey(), h.n, d.ads, d.att ? 1 : 0, RANK_MODE, FRIENDS.map(friendScore).join(',')].join('|'); }
function tickHome(){
  const h = heartState();
  const ht = $('#hsT'); if(ht) ht.textContent = heartLeft(h);
  if($('#home').style.display === 'none' || $('#veil').classList.contains('on')) return;
  const sig = homeSig();
  if(sig !== lastSig){ lastSig = sig; checkOvertake(); renderHome(); return; }
  const t = $('#hTimer'); if(t) t.textContent = heartLeft(h);
  const cl = $('#closing'); if(cl) cl.textContent = closingText();
  const pa = $('#poolAmt'), pb = $('#poolAmt2'), lc = $('#lgClose'), pv = fmt(prizePool()) + '원';
  if(pa) pa.textContent = pv; if(pb) pb.textContent = pv; if(lc) lc.textContent = weekLeft();
}
$('#quitBtn').innerHTML = ic('back'); $('#helpBtn').innerHTML = ic('help');
document.querySelectorAll('#dock button').forEach(b => { b.innerHTML = b.innerHTML.replace(/ICO_(\w+)/, (_, n) => ic(n)); b.onclick = () => setTab(b.dataset.tab); });
$('#meBtn').onclick = () => setTab('me');
$('#strip').onclick = () => setTab('me');
$('#pool').onclick = () => { RANK_MODE = 'week'; setTab('league'); };
$('#devWeek').onclick = () => { const s0 = leagueState(); s0.week = addDays(weekStartKey(), -7); store.set('hp:league', s0); showLeagueResult(leagueRollover()); };
$('#advPromo').onclick = () => setTab('adv');
$('#meSound').onclick = () => openSoundSheet(); $('#meReport').onclick = openReport; $('#meShare').onclick = () => openShare(closeModal);
if(!store.get('hp:advLv', 0)) store.set('hp:advLv', lvInfo().L);
$('#devAdv').onclick = () => { GAME_IDS.forEach(g => store.set(advKey(g), null)); store.set('hp:advLv', 1); renderHome(); toast('모험 기록을 초기화했어요'); };
$('#devLvUp').onclick = () => { const L = lvInfo().L + 1; showCelebrations([{ kind:'level', L, from:L - 1, hearts:1 }], () => {}); };
$('#devCh').onclick = () => showCelebrations([{ kind:'chapter', id:'fox', c:1 }], () => {});
$('#heartChip').onclick = () => openHeartSheet();
$('#inboxBtn').innerHTML = MAIL_G + '<span class="badge" id="badge">0</span>'; $('#inboxBtn').onclick = openInbox;
$('#quitBtn').onclick = confirmQuit;
$('#helpBtn').onclick = () => { if(G && !G.over) openHelp(G.id); };
$('#devFill').onclick = () => { const h = heartState(); if(h.n < MAX_H){ h.n = MAX_H; h.t = Date.now(); store.set('hp:hearts', h); } renderHome(); toast('하트를 채웠어요'); };
$('#devReset').onclick = () => { store.set('hp:day:' + dayKey(), null); renderHome(); toast('오늘 기록을 초기화했어요'); };
$('#devWelcome').onclick = () => { GAME_IDS.forEach(g => store.set('hp:help:' + g, 0)); welcome(); };
$('#tabDay').onclick = () => { RANK_MODE = 'day'; renderHome(); };
$('#tabMonth').onclick = () => { RANK_MODE = 'week'; renderHome(); };
$('#devHist').onclick = () => {
  const today = dayKey(), r = mulberry(seedFrom('hist' + today));
  for(let i = 1; i <= 14; i++){
    const k = addDays(today, -i);
    if(i === 4 || i === 11){ store.set('hp:day:' + k, null); continue; }
    const best = {}; for(const g of GAME_IDS) best[g] = r() < 0.75 ? Math.round((350 + r() * 750) / 10) * 10 : 0;
    store.set('hp:day:' + k, { best, tries:{}, sent:{}, claimed:[], ads:0, att:true });
  }
  renderHome(); toast('지난 2주 기록을 만들었어요(2일은 휴식권)');
};
$('#devHistClr').onclick = () => { const today = dayKey(); for(let i = 0; i <= 120; i++) store.set('hp:day:' + addDays(today, -i), null); renderHome(); toast('출석 기록을 모두 지웠어요'); };
renderHome(); lastSig = homeSig(); checkOvertake();
const LG_RES = leagueRollover();
if(store.get('hp:welcome', 0) < 3) welcome();
else if(LG_RES) showLeagueResult(LG_RES);
else { const ls0 = leagueState(); if(ls0.last && ls0.seen === false) showLeagueResult(ls0.last); }

setInterval(tickHome, 1000);
</script>
</body>
