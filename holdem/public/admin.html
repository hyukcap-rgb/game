<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>로열 홀덤 관리자</title>
<link rel="icon" href="img/av1.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0d14; --panel:#131a28; --panel2:#1a2335; --line:rgba(255,255,255,.09); --text:#eef0f5; --muted:#8e97ab; --gold:#f2c35b; --green:#2fbf71; --red:#e0384d; --blue:#3b82f6; --orange:#f59e0b; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:'Noto Sans KR',system-ui,sans-serif; font-size:14px; }
button { font:inherit; color:inherit; border:0; cursor:pointer; border-radius:10px; }
input, select { font:inherit; color:var(--text); background:#0e1420; border:1px solid var(--line); border-radius:10px; padding:9px 11px; outline:none; }
input:focus, select:focus { border-color:var(--gold); }
.num { font-family:'Oswald',sans-serif; letter-spacing:.3px; }
.wrap { max-width:1200px; margin:0 auto; padding:16px; }
header { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); background:#0d121c; position:sticky; top:0; z-index:5; }
header h1 { margin:0; font-size:17px; font-weight:900; }
header h1 span { color:var(--gold); }
header .sp { flex:1; }
.live { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.live i { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
.btn { padding:8px 13px; font-weight:700; font-size:13px; background:var(--panel2); border:1px solid var(--line); }
.btn.g { background:var(--green); border-color:transparent; color:#04140b; }
.btn.r { background:var(--red); border-color:transparent; }
.btn.y { background:var(--gold); border-color:transparent; color:#2a1a00; }
.btn.b { background:var(--blue); border-color:transparent; }
.btn.sm { padding:5px 9px; font-size:12px; border-radius:8px; }
.btn:disabled { opacity:.4; cursor:default; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
.stat.rk b { color:var(--gold); }
.rk-table input { width:90px; padding:6px 8px; }
.rk-table td { padding:6px 8px; }
.rk-state { font-size:12px; padding:4px 10px; border-radius:99px; background:rgba(255,255,255,.06); }
.rk-state.on { color:#86efac; } .rk-state.off { color:var(--muted); }
.rk-sum { margin:12px 0 10px; }
.rk-all { margin-bottom:10px; gap:8px; flex-wrap:wrap; } .rk-all input { width:80px; padding:6px 8px; }
.rk-chart { display:flex; align-items:flex-end; gap:6px; height:140px; padding-top:16px; }
.rk-bar { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; position:relative; min-width:0; }
.rk-bar i { flex:none; display:block; width:100%; max-width:28px; min-height:2px; background:linear-gradient(180deg,#f2c35b,#b8862b); border-radius:4px 4px 0 0; }
.rk-bar .v { font-size:10px; color:var(--muted); margin-bottom:2px; white-space:nowrap; }
.rk-bar small { white-space:nowrap; font-size:10px; color:var(--muted); margin-top:4px; }
.rk-two { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:700px) { .rk-two { grid-template-columns:1fr; } .rk-bar .v { display:none; } .rk-table input { width:58px; padding:6px; } .rk-table td, .rk-table th { padding:6px 4px; font-size:12px; } .rk-table th:nth-child(4), .rk-table td:nth-child(4) { display:none; } }
.sw { display:flex; gap:16px; flex-wrap:wrap; margin:6px 0 12px; }
.sw label { display:flex; gap:6px; align-items:center; font-size:13px; color:var(--text); cursor:pointer; }
.tname { color:var(--gold); }
.suppill { background:rgba(147,51,234,.25); color:#d8b4fe; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:700; }
.stat { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
.stat small { color:var(--muted); font-size:12px; display:block; }
.stat b { font-size:24px; font-family:'Oswald',sans-serif; }
.stat.hot { border-color:rgba(242,195,91,.6); box-shadow:0 0 0 1px rgba(242,195,91,.25) inset; }
.tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.tabs button { padding:9px 14px; background:var(--panel); border:1px solid var(--line); font-weight:700; }
.tabs button.on { background:var(--gold); color:#2a1a00; border-color:transparent; }
.tabs .badge { background:var(--red); color:#fff; border-radius:99px; padding:0 7px; margin-left:6px; font-size:11px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
.card h2 { margin:0 0 10px; font-size:15px; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
th { color:var(--muted); font-size:12px; font-weight:500; white-space:nowrap; }
tr:hover td { background:rgba(255,255,255,.02); }
.ava { width:30px; height:30px; border-radius:50%; vertical-align:middle; margin-right:8px; }
.nm { font-weight:700; }
.pill { display:inline-block; padding:2px 8px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap; }
.p-on { background:rgba(47,191,113,.16); color:#6ee7a6; }
.p-off { background:rgba(255,255,255,.06); color:var(--muted); }
.p-game { background:rgba(59,130,246,.18); color:#93c5fd; }
.p-wait { background:rgba(242,195,91,.18); color:var(--gold); }
.p-ok { background:rgba(47,191,113,.16); color:#6ee7a6; }
.p-bad { background:rgba(224,56,77,.18); color:#fca5b1; }
.acts { display:flex; gap:5px; flex-wrap:wrap; }
.plus { color:#6ee7a6; } .minus { color:#fca5b1; }
.empty { color:var(--muted); padding:18px; text-align:center; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.muted { color:var(--muted); font-size:12px; }
.login { max-width:340px; margin:14vh auto; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px; text-align:center; }
.login h1 { margin:0 0 4px; font-size:20px; }
.login input { width:100%; margin:16px 0 10px; text-align:center; }
.login .btn { width:100%; padding:12px; }
.err { color:#fca5b1; font-size:13px; min-height:18px; margin-top:8px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
.modal.show { display:flex; }
.mcard { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; width:100%; max-width:380px; }
.mcard h3 { margin:0 0 4px; }
.mcard label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
.mcard input { width:100%; }
.quick { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.quick button { padding:5px 9px; font-size:12px; background:var(--panel2); border:1px solid var(--line); border-radius:8px; }
.mbtns { display:flex; gap:8px; margin-top:16px; }
.mbtns .btn { flex:1; padding:11px; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1f2a40; border:1px solid var(--line); padding:10px 16px; border-radius:99px; opacity:0; transition:.25s; pointer-events:none; z-index:60; }
.toast.show { opacity:1; }
.search { min-width:180px; }
.setgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
.setgrid label { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
.setgrid input[type=number] { width:100%; }
.hl-table td { vertical-align:top; font-size:13px; }
.hl-table tr.hl-row { cursor:pointer; }
.hl-flow { line-height:1.75; }
.hl-flow .st { display:inline-block; font-size:11px; font-weight:700; color:#2a1a00; background:var(--gold); border-radius:6px; padding:0 6px; margin:0 4px 0 2px; }
.hl-flow .me { color:var(--gold); font-weight:700; }
.hl-flow .tag { color:var(--muted); font-size:11px; }
.hl-flow .warn { color:#fca5b1; font-size:11px; font-weight:700; }
.cd { display:inline-block; font-family:'Oswald',sans-serif; font-size:12px; background:#f4f1ea; color:#111; border-radius:4px; padding:0 3px; margin:0 1px; line-height:16px; }
.cd.r { color:#d0182e; }
.hl-detail { background:#0e1420; border-radius:10px; padding:10px 12px; margin-top:8px; }
.hl-detail table td, .hl-detail table th { padding:5px 6px; font-size:12.5px; }
.hl-no { font-family:'Oswald',sans-serif; color:var(--gold); white-space:nowrap; }
@media (max-width:820px) {
  .stats { grid-template-columns:repeat(2,1fr); }
  .hide-m { display:none; }
  th, td { padding:8px 5px; }
}
</style>
</head>
<body>
<div id="loginView" class="login" hidden>
  <h1>로열 홀덤 <span style="color:var(--gold)">관리자</span></h1>
  <p class="tname" id="loginName"></p>
  <p class="muted">관리자 비밀번호를 입력하세요</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
  <button class="btn y" id="loginBtn">로그인</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="appView" hidden>
  <header>
    <h1>로열 홀덤 <span>관리자</span> <small class="tname" id="tName"></small></h1>
    <span id="supBox"></span>
    <span class="sp"></span>
    <span class="live"><i></i><span id="liveTxt">실시간</span></span>
    <button class="btn sm" id="logoutBtn">로그아웃</button>
  </header>
  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="tabs" id="tabs">
      <button data-tab="wait" class="on">승인 대기<span class="badge" id="waitBadge" hidden></span></button>
      <button data-tab="users">전체 회원</button>
      <button data-tab="logs">칩 로그</button>
      <button data-tab="hands">게임 로그</button>
      <button data-tab="rooms">게임 방</button>
      <button data-tab="rake">수수료</button>
      <button data-tab="settings">설정</button>
    </div>
    <section id="tab-wait"></section>
    <section id="tab-users" hidden></section>
    <section id="tab-logs" hidden></section>
    <section id="tab-hands" hidden></section>
    <section id="tab-rooms" hidden></section>
    <section id="tab-rake" hidden><div id="rkStats"></div><div id="rkForm"></div><div id="rkWho"></div></section>
    <section id="tab-settings" hidden></section>
  </div>
</div>

<div class="modal" id="modal"><div class="mcard" id="mcard"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
  const short = (n) => (n >= 1e8 ? +(n / 1e8).toFixed(1) + '억' : n >= 1e4 ? +(n / 1e4).toFixed(1) + '만' : fmt(n));
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ava = (i) => `<img class="ava" src="img/av${(i | 0) % 9}.png" alt="">`;
  const ago = (t) => { if (!t) return '-'; const s = Math.max(0, (Date.now() - t) / 1000); if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전'; return Math.floor(s / 86400) + '일 전'; };
  const dt = (t) => { const d = new Date(t); const p = (n) => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
  const TYPE = { rebuy: '리바인', admin_add: '관리자 지급', admin_sub: '관리자 차감', welcome: '가입 지급', buyin: '바이인', cashout: '정산', refund: '반환', signup: '가입 신청', delete: '삭제' };
  const MODE = { solo: 'AI 대결', friends: '친구 대전', daily: '오늘의 토너먼트' };
  // 분양 주소(/s/이름/admin)면 그 사업장 관리자
  const BASE = (location.pathname.match(/^\/s\/[a-z0-9-]{2,30}/) || [''])[0];
  const TK = 'rh_admin' + BASE;
  let token = null; try { token = sessionStorage.getItem(TK); } catch (e) { /* */ }
  fetch(BASE + '/api/config').then((r) => r.json()).then((c) => { $('#loginName').textContent = c.name || ''; }).catch(() => {});
  let S = null, tab = 'wait', logFilter = { acct: '', type: '' }, search = '', pollT = null;

  let toastT;
  function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }
  async function api(path, body) {
    const r = await fetch(BASE + '/admin/api/' + path, { method: body ? 'POST' : 'GET', headers: Object.assign({ 'x-admin-token': token || '' }, body ? { 'content-type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && path !== 'login') { logout(); throw new Error(j.error || '로그인 필요'); }
    if (!r.ok) throw new Error(j.error || '실패');
    return j;
  }
  function logout() { token = null; try { sessionStorage.removeItem(TK); } catch (e) { /* */ } clearTimeout(pollT); $('#appView').hidden = true; $('#loginView').hidden = false; }
  async function login() {
    $('#loginErr').textContent = '';
    try { const j = await api('login', { password: $('#pw').value }); token = j.token; try { sessionStorage.setItem(TK, token); } catch (e) { /* */ } boot(); }
    catch (e) { $('#loginErr').textContent = e.message; }
  }
  $('#loginBtn').onclick = login;
  $('#pw').onkeydown = (e) => { if (e.key === 'Enter') login(); };
  $('#logoutBtn').onclick = logout;

  function boot() { $('#loginView').hidden = true; $('#appView').hidden = false; poll(); }
  async function poll() {
    clearTimeout(pollT);
    try { S = await api('state'); $('#liveTxt').textContent = '실시간 · ' + new Date().toLocaleTimeString('ko-KR'); render(); }
    catch (e) { $('#liveTxt').textContent = '연결 끊김'; }
    if (token) pollT = setTimeout(poll, 2500);
  }

  $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b)); render(); if (tab === 'logs') loadLogs(); if (tab === 'hands') loadHands(); };

  function render() {
    if (!S) return;
    const st = S.stats;
    $('#stats').innerHTML = [
      ['정회원', st.members], ['가입 대기', st.pending, st.pending > 0], ['입장 대기', st.entryReq, st.entryReq > 0], ['접속 중', st.online], ['게임 중', st.playing], ['전체 보유 칩', fmt(st.totalBalance)],
      ['오늘 수수료', fmt(st.rakeToday), false, 'rk'], ['누적 수수료', fmt(st.rakeTotal), false, 'rk'],
    ].map(([k, v, hot, c]) => `<div class="stat${hot ? ' hot' : ''}${c ? ' ' + c : ''}"><small>${k}</small><b>${typeof v === 'number' ? fmt(v) : v}</b></div>`).join('');
    $('#tName').textContent = S.tenant ? '· ' + S.tenant.name : '';
    $('#supBox').innerHTML = S.tenant && S.tenant.sup ? '<span class="suppill">슈퍼 관리자</span> <a class="btn sm" href="/super">분양 관리</a>' : '';
    const w = st.pending + st.entryReq;
    $('#waitBadge').hidden = !w; $('#waitBadge').textContent = w;
    document.title = (w ? `(${w}) ` : '') + (S.tenant ? S.tenant.name + ' ' : '') + '관리자';
    for (const k of ['wait', 'users', 'logs', 'hands', 'rooms', 'rake', 'settings']) $('#tab-' + k).hidden = k !== tab;
    if (tab === 'wait') renderWait();
    if (tab === 'users') renderUsers();
    if (tab === 'rooms') renderRooms();
    if (tab === 'settings' && !$('#tab-settings').dataset.done) renderSettings();
    if (tab === 'rake') renderRake();
  }

  function stateCell(u) {
    if (u.status === 'pending') return '<span class="pill p-wait">가입 대기</span>';
    if (u.status === 'blocked') return '<span class="pill p-bad">차단</span>';
    if (u.status === 'rejected') return '<span class="pill p-bad">가입 거절</span>';
    if (u.room && u.room.status === 'playing') return `<span class="pill p-game">게임 중 · ${MODE[u.room.mode] || ''}</span>`;
    if (u.online && u.req) return '<span class="pill p-wait">입장 대기</span>';
    if (u.online && u.approved) return '<span class="pill p-on">접속 · 승인됨</span>';
    if (u.online) return '<span class="pill p-on">접속</span>';
    return `<span class="pill p-off">오프라인 · ${ago(u.lastSeen)}</span>`;
  }

  function renderWait() {
    const signups = S.users.filter((u) => u.status === 'pending');
    const entries = S.users.filter((u) => u.req);
    $('#tab-wait').innerHTML = `
      <div class="card"><div class="row" style="justify-content:space-between"><h2>입장 승인 대기 (${entries.length})</h2>${entries.length > 1 ? '<button class="btn g sm" data-entry-all>모두 승인</button>' : ''}</div>
        ${entries.length ? `<table><tr><th>회원</th><th>보유 칩</th><th>요청</th><th></th></tr>${entries.map((u) => `<tr><td>${ava(u.avatar)}<span class="nm">${esc(u.name)}</span></td><td class="num">${fmt(u.balance)}</td><td class="muted">${ago(u.req)}</td>
          <td><div class="acts"><button class="btn g sm" data-entry="${u.id}" data-ok="1">입장 승인</button><button class="btn r sm" data-entry="${u.id}" data-ok="0">거절</button></div></td></tr>`).join('')}</table>` : '<div class="empty">들어오려고 기다리는 회원이 없어요</div>'}
      </div>
      <div class="card"><h2>가입 승인 대기 (${signups.length})</h2>
        ${signups.length ? `<table><tr><th>닉네임</th><th>신청</th><th>접속</th><th></th></tr>${signups.map((u) => `<tr><td>${ava(u.avatar)}<span class="nm">${esc(u.name)}</span></td><td class="muted">${ago(u.createdAt)}</td><td>${u.online ? '<span class="pill p-on">접속 중</span>' : '<span class="pill p-off">오프라인</span>'}</td>
          <td><div class="acts"><button class="btn g sm" data-signup="${u.id}" data-ok="1">가입 승인 (+${fmt(S.settings.welcomeChips)})</button><button class="btn r sm" data-signup="${u.id}" data-ok="0">거절</button></div></td></tr>`).join('')}</table>` : '<div class="empty">가입 신청이 없어요</div>'}
      </div>`;
  }

  function renderUsers() {
    const q = search.trim().toLowerCase();
    const list = S.users.filter((u) => !q || u.name.toLowerCase().includes(q));
    const box = $('#tab-users');
    const focused = document.activeElement && document.activeElement.id === 'search';
    box.innerHTML = `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">전체 회원 (${S.users.length})</h2><input id="search" class="search" placeholder="닉네임 검색" value="${esc(search)}"></div>
      ${list.length ? `<table><tr><th>회원</th><th>상태</th><th>보유 칩</th><th class="hide-m">테이블</th><th class="hide-m">낸 수수료</th><th class="hide-m">가입</th><th>관리</th></tr>
      ${list.map((u) => `<tr><td>${ava(u.avatar)}<span class="nm">${esc(u.name)}</span>${u.note ? `<div class="muted">${esc(u.note)}</div>` : ''}</td><td>${stateCell(u)}</td>
        <td class="num">${fmt(u.balance)}</td><td class="num hide-m">${u.inPlay ? fmt(u.inPlay) : '-'}</td><td class="num hide-m">${u.rakePaid ? fmt(u.rakePaid) : '-'}</td><td class="muted hide-m">${ago(u.createdAt)}</td>
        <td><div class="acts">
          ${u.status === 'pending' ? `<button class="btn g sm" data-signup="${u.id}" data-ok="1">가입 승인</button>` : ''}
          ${u.req ? `<button class="btn g sm" data-entry="${u.id}" data-ok="1">입장 승인</button>` : ''}
          <button class="btn y sm" data-money="${u.id}">칩 ±</button>
          <button class="btn sm" data-logs="${u.id}">칩 로그</button>
          <button class="btn sm b" data-hands="${u.id}">게임 로그</button>
          ${u.online || u.approved ? `<button class="btn sm" data-act="kick" data-id="${u.id}">강퇴</button>` : ''}

  // ---------- 게임 로그(최근 7일, 핸드마다) ----------
  let handFilter = { acct: '', no: '', days: 7 }, handData = [], openHand = null;
  const ST = { preflop: '프리플랍', flop: '플랍', turn: '턴', river: '리버' };
  const ACT = { SB: 'SB', BB: 'BB', fold: '폴드', check: '체크', call: '콜', bet: '베팅', raise: '레이즈', allin: '올인', timebank: '타임뱅크' };
  const HOW = { timeout: '시간초과', reserve: '폴드예약' };
  const SUIT = { s: '♠', h: '♥', d: '♦', c: '♣' };
  const cd = (c) => c ? `<span class="cd${c[1] === 'h' || c[1] === 'd' ? ' r' : ''}">${c[0] === 'T' ? '10' : c[0]}${SUIT[c[1]] || ''}</span>` : '';
  const cdt = (c) => (c[0] === 'T' ? '10' : c[0]) + (SUIT[c[1]] || '');
  const sec = (ms) => (ms / 1000).toFixed(1) + 's';
  const signed = (n) => (n > 0 ? '+' : '') + fmt(n);
  // 한 줄 진행: 프리플랍 A SB 50, B BB 100, C 콜 100 · 플랍 [..] A 체크 …
  function flowHtml(h, meName) {
    let out = '', st = '';
    for (const a of h.acts) {
      if (a.deal) { out += ` <span class="st">${ST[a.st]}</span>${a.deal.map(cd).join('')} `; st = a.st; continue; }
      if (st === '' ) { out += `<span class="st">${ST.preflop}</span>`; st = 'preflop'; }
      const nm = a.n === meName ? `<span class="me">${esc(a.n)}</span>` : esc(a.n);
      if (a.a === 'timebank') { out += `${nm} <span class="tag">⏱타임뱅크</span>, `; continue; }
      const amt = ['fold', 'check'].includes(a.a) ? '' : ' ' + fmt(a.to);
      out += `${nm} ${ACT[a.a] || a.a}${amt}${a.how ? ` <span class="warn">(${HOW[a.how] || a.how})</span>` : ''}${a.t ? ` <span class="tag">${sec(a.t)}</span>` : ''}, `;
    }
    return out.replace(/, $/, '').replace(/,( <span class="st">)/g, '$1');
  }
  function flowText(h) {
    let out = '', st = '';
    for (const a of h.acts) {
      if (a.deal) { out += ` [${ST[a.st]} ${a.deal.map(cdt).join(' ')}] `; st = a.st; continue; }
      if (!st) { out += `[${ST.preflop}] `; st = 'preflop'; }
      if (a.a === 'timebank') { out += `${a.n} 타임뱅크, `; continue; }
      out += `${a.n} ${ACT[a.a] || a.a}${['fold', 'check'].includes(a.a) ? '' : ' ' + a.to}${a.how ? '(' + (HOW[a.how] || a.how) + ')' : ''}, `;
    }
    return out.replace(/, $/, '').replace(/,( \[)/g, '$1');
  }
  function resultTxt(h) {
    return (h.pots || []).map((p) => `${p.win.join('·')} ${fmt(p.amt)}${p.hand ? ' (' + p.hand + ')' : ''}${p.refund ? ' 반환' : ''}`).join(' / ') + (h.rakeAmt ? ` · 수수료 ${fmt(h.rakeAmt)}` : '');
  }
  async function loadHands() {
    const q = new URLSearchParams({ days: handFilter.days || 7 });
    if (handFilter.no) q.set('no', handFilter.no); else if (handFilter.acct) q.set('acct', handFilter.acct);
    let j = { hands: [], total: 0 };
    $('#tab-hands').innerHTML = '<div class="card"><div class="empty">불러오는 중…</div></div>';
    try { j = await api('hands?' + q); } catch (e) { toast(e.message); }
    handData = j.hands; renderHands(j.total);
  }
  function renderHands(total) {
    const users = S ? S.users : [];
    const me = handFilter.acct ? users.find((u) => String(u.id) === String(handFilter.acct)) : null;
    const meId = me ? me.id : null;
    const rows = handData.map((h) => {
      const mine = meId ? h.players.find((p) => p.acct === meId) : null;
      const open = openHand === h.no;
      return `<tr class="hl-row" data-hno="${h.no}"><td><span class="hl-no">#${h.no}</span><div class="muted num">${dt(h.at)}</div><div class="muted">${MODE[h.mode] || h.mode}${h.mode === 'friends' ? ' ' + esc(h.room) : ''} · ${fmt(h.sb)}/${fmt(h.bb)}</div></td>
        <td class="muted">${h.players.map((p) => `${p.bot ? '🤖' : '👤'}${p.acct === meId ? `<b style="color:var(--gold)">${esc(p.n)}</b>` : esc(p.n)}${p.pos ? `<span class="tag">(${p.pos})</span>` : ''}`).join(' ')}</td>
        ${meId ? `<td>${mine ? mine.hole.map(cd).join('') : '-'}<div class="muted">${mine && mine.pos ? mine.pos : ''}</div></td>` : ''}
        <td class="hl-flow">${flowHtml(h, mine ? mine.n : null)}</td>
        <td>${meId && mine ? `<b class="num ${mine.net > 0 ? 'plus' : mine.net < 0 ? 'minus' : ''}">${signed(mine.net)}</b><div class="muted num">${fmt(mine.start)} → ${fmt(mine.end)}</div>` : ''}<div class="muted">${esc(resultTxt(h))}</div></td></tr>
        ${open ? `<tr><td colspan="${meId ? 5 : 4}">${detailHtml(h, meId)}</td></tr>` : ''}`;
    }).join('');
    $('#tab-hands').innerHTML = `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">게임 로그 <span class="muted">· 최근 ${handFilter.days}일 ${fmt(total || handData.length)}판${handData.length < (total || 0) ? ` (최근 ${fmt(handData.length)}판 표시)` : ''}</span></h2>
      <div class="row"><select id="hfUser"><option value="">전체 회원</option>${users.map((u) => `<option value="${u.id}" ${String(u.id) === String(handFilter.acct) ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
      <select id="hfDays">${[1, 3, 7].map((d) => `<option value="${d}" ${+handFilter.days === d ? 'selected' : ''}>최근 ${d}일</option>`).join('')}</select>
      <input id="hfNo" placeholder="게임번호 #" style="width:110px" value="${esc(handFilter.no)}">
      <button class="btn sm" id="hfGo">찾기</button><button class="btn sm" id="hfTxt">TXT 저장</button></div></div>
      <p class="muted" style="margin:0 0 8px">줄을 누르면 참가자 카드·칩 변화·결과를 자세히 볼 수 있어요. 시간초과·폴드예약은 빨간 글씨, 숫자 뒤 s는 핸드 시작 뒤 경과 시간이에요.</p>
      ${handData.length ? `<table class="hl-table"><tr><th>게임번호 · 시간</th><th>참가자</th>${meId ? '<th>내 카드</th>' : ''}<th>진행</th><th>결과</th></tr>${rows}</table>` : '<div class="empty">기록이 없어요 (기록은 이 기능을 켠 뒤 판부터 남아요)</div>'}</div>`;
    $('#hfUser').onchange = (e) => { handFilter.acct = e.target.value; handFilter.no = ''; loadHands(); };
    $('#hfDays').onchange = (e) => { handFilter.days = +e.target.value; loadHands(); };
    $('#hfGo').onclick = () => { handFilter.no = $('#hfNo').value.replace(/\D/g, ''); loadHands(); };
    $('#hfNo').onkeydown = (e) => { if (e.key === 'Enter') $('#hfGo').click(); };
    $('#hfTxt').onclick = () => {
      const lines = handData.slice().reverse().map((h) => {
        const mine = meId ? h.players.find((p) => p.acct === meId) : null;
        return `#${h.no} | ${new Date(h.at).toLocaleString('ko-KR')} | ${MODE[h.mode] || h.mode}${h.mode === 'friends' ? ' ' + h.room : ''} ${h.sb}/${h.bb} | 참가: ${h.players.map((p) => p.n + (p.pos ? '(' + p.pos + ')' : '') + ' ' + p.start + ' [' + p.hole.map(cdt).join(' ') + ']').join(', ')} | ${flowText(h)} | 보드 ${(h.board || []).map(cdt).join(' ')} | 결과: ${resultTxt(h)}${mine ? ' | ' + mine.n + ' ' + signed(mine.net) : ''}`;
      });
      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `game-log-${me ? me.name : 'all'}-${new Date().toISOString().slice(0, 10)}.txt`; a.click();
    };
    $('#tab-hands').querySelectorAll('tr.hl-row').forEach((tr) => tr.onclick = () => { const n = +tr.dataset.hno; openHand = openHand === n ? null : n; renderHands(total); });
  }
  function detailHtml(h, meId) {
    const dur = h.end ? sec(h.end - h.at) : '-';
    return `<div class="hl-detail"><div class="row" style="justify-content:space-between"><b>#${h.no} · ${MODE[h.mode] || h.mode} ${esc(h.room)} · ${h.hand}번째 핸드 · 블라인드 ${fmt(h.sb)}/${fmt(h.bb)}${h.rake ? ' · 수수료 ' + h.rake + '%' : ''}</b><span class="muted">${new Date(h.at).toLocaleString('ko-KR')} · ${dur}</span></div>
      <div style="margin:6px 0">보드 ${(h.board || []).map(cd).join('') || '-'}</div>
      <table><tr><th>자리</th><th>참가자</th><th>위치</th><th>카드</th><th>시작</th><th>끝</th><th>손익</th><th>족보·상태</th></tr>
      ${h.players.map((p) => `<tr${p.acct === meId ? ' style="background:rgba(242,195,91,.08)"' : ''}><td class="num">${p.seat + 1}</td><td>${p.bot ? '🤖' : '👤'}${esc(p.n)}</td><td>${p.pos || ''}</td><td>${p.hole.map(cd).join('')}</td>
        <td class="num">${fmt(p.start)}</td><td class="num">${fmt(p.end)}</td><td class="num ${p.net > 0 ? 'plus' : p.net < 0 ? 'minus' : ''}">${signed(p.net)}</td><td class="muted">${p.hn ? esc(p.hn) : ''}${p.fold ? ' 폴드' : ''}${p.show ? ' 카드공개' : ''}</td></tr>`).join('')}</table>
      <div class="muted" style="margin-top:6px">팟: ${esc(resultTxt(h))}</div></div>`;
  }

  function modal(html, mount) { $('#mcard').innerHTML = html; $('#modal').classList.add('show'); if (mount) mount($('#mcard')); }
  function closeModal() { $('#modal').classList.remove('show'); }
  $('#modal').onclick = (e) => { if (e.target.id === 'modal' || e.target.closest('[data-close]')) closeModal(); };
  const userById = (id) => S.users.find((u) => String(u.id) === String(id));

  function moneyModal(u) {
    modal(`<h3>${esc(u.name)} · 보유 칩</h3><p class="muted">지금 보유 <b class="num" style="color:var(--gold)">${fmt(u.balance)}</b>${u.inPlay ? ` · 테이블 ${fmt(u.inPlay)}` : ''}</p>
      <label>금액</label><input id="mAmt" type="number" min="1" step="1000" placeholder="예: 10000">
      <div class="quick">${[1000, 5000, 10000, 50000, 100000].map((v) => `<button data-q="${v}">${fmt(v)}</button>`).join('')}</div>
      <label>사유</label><input id="mWhy" maxlength="100" placeholder="예: 이벤트 지급">
      <div class="mbtns"><button class="btn g" id="mAdd">추가</button><button class="btn r" id="mSub">차감</button><button class="btn" data-close>취소</button></div>`, (el) => {
      el.querySelectorAll('[data-q]').forEach((b) => b.onclick = () => { el.querySelector('#mAmt').value = b.dataset.q; });
      const go = async (sign) => {
        const v = Math.round(Number(el.querySelector('#mAmt').value));
        if (!v || v <= 0) return toast('금액을 입력하세요');
        try { const j = await api('money/' + u.id, { amount: sign * v, reason: el.querySelector('#mWhy').value }); toast(`${sign > 0 ? '추가' : '차감'}했어요 · 보유 ${fmt(j.balance)}`); closeModal(); poll(); }
        catch (e) { toast(e.message); }
      };
      el.querySelector('#mAdd').onclick = () => go(1);
      el.querySelector('#mSub').onclick = () => go(-1);
      el.querySelector('#mAmt').focus();
    });
  }

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b || !S) return;
    try {
      if (b.dataset.entryAll !== undefined) { await api('entry/all', { approve: true }); toast('모두 승인했어요'); return poll(); }
      if (b.dataset.entry) { await api('entry/' + b.dataset.entry, { approve: b.dataset.ok === '1' }); toast(b.dataset.ok === '1' ? '입장을 승인했어요' : '입장을 거절했어요'); return poll(); }
      if (b.dataset.signup) { await api('signup/' + b.dataset.signup, { approve: b.dataset.ok === '1' }); toast(b.dataset.ok === '1' ? '가입을 승인했어요' : '가입을 거절했어요'); return poll(); }
      if (b.dataset.money) return moneyModal(userById(b.dataset.money));
      if (b.dataset.hands) { handFilter = { acct: b.dataset.hands, no: '', days: 7 }; tab = 'hands'; document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x.dataset.tab === 'hands')); render(); return loadHands(); }
      if (b.dataset.logs) { logFilter = { acct: b.dataset.logs, type: '' }; tab = 'logs'; document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x.dataset.tab === 'logs')); render(); return loadLogs(); }
      if (b.dataset.act) {
        const u = userById(b.dataset.id); const act = b.dataset.act; const body = { action: act };
        if (act === 'resetPin') { const pin = prompt(`${u.name}의 새 PIN (숫자 4~6자리)`); if (!pin) return; body.pin = pin; }
        else if (act === 'note') { const note = prompt(`${u.name} 메모`, u.note || ''); if (note == null) return; body.note = note; }
        else if (act === 'delete') { if (!confirm(`${u.name} 계정을 삭제할까요? 되돌릴 수 없어요.`)) return; if (u.balance + u.inPlay > 0) { if (!confirm(`보유 칩 ${fmt(u.balance + u.inPlay)}이 남아 있어요. 그래도 삭제할까요?`)) return; body.force = true; } }
        else if (act === 'block' && !confirm(`${u.name}을(를) 차단할까요? 게임 중이면 바로 퇴장돼요.`)) return;
        else if (act === 'kick' && !confirm(`${u.name}을(를) 퇴장시킬까요?`)) return;
        await api('user/' + u.id, body); toast('처리했어요'); return poll();
      }
    } catch (err) { toast(err.message); }
  });

  if (token) boot(); else { $('#loginView').hidden = false; $('#pw').focus(); }
})();
</script>
</body>
</html>
