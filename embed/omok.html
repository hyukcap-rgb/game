.ng-omok .hchip.time.hurry{background:linear-gradient(180deg,#FFE3E4,#FFB3B6)} .ng-omok .hchip.time.hurry b{color:#E5484D}
.ng-omok .hchip.time.opp{background:linear-gradient(180deg,#F4F1FA,#E3DDF2)}
.ng-omok .om-tbar{position:absolute; left:12px; right:12px; bottom:3px; height:3px; border-radius:9px; background:rgba(26,15,69,.12); overflow:hidden}
.ng-omok .om-tbar i{position:absolute; inset:0; transform-origin:left center; background:#8C6CF0; border-radius:9px}
.ng-omok .hchip.time.hurry .om-tbar i{background:#E5484D}
.ng-omok .om-side{transition:transform .15s, background .15s}
.ng-omok .om-side.on{background:linear-gradient(180deg,#FFF6C8,#FFD86B); transform:translateY(-2px); box-shadow:0 5px 0 #1A0F45}
.ng-omok .om-side .om-opn{font-size:17px; overflow:hidden; text-overflow:ellipsis}
.ng-omok .om-row{display:flex; align-items:center; gap:8px; width:100%; height:40px; margin-top:6px}
.ng-omok .hlives{flex:none}
.ng-omok .om-msg{flex:1; min-width:0; overflow:hidden; height:40px; display:flex; align-items:center; justify-content:center; gap:8px; font-family:var(--disp); font-size:14.5px; color:#3A2C78; white-space:nowrap}
.ng-omok .om-msg > span{overflow:hidden; text-overflow:ellipsis}
.ng-omok .om-msg b{font-family:var(--heavy); font-weight:400; font-size:20px; color:#fff; -webkit-text-stroke:5px #1A0F45; paint-order:stroke fill; letter-spacing:.5px}
.ng-omok .om-msg b.sm{font-size:16px; -webkit-text-stroke:4px #1A0F45; color:#FFE27A}
.ng-omok .om-msg b.boss{color:#FFE27A}
.ng-omok .om-msg b.bad{color:#FF8A8F}
.ng-omok .om-msg.om-pop, .ng-omok .om-msg.om-win{animation:omok-in .35s cubic-bezier(.2,1.5,.4,1)}
.ng-omok .om-msg.om-win b{font-size:24px; color:#FFE27A}
.ng-omok .om-think i{display:inline-block; width:5px; height:5px; margin-left:3px; border-radius:50%; background:#6E62A0; animation:omok-dot 1s infinite}
.ng-omok .om-think i:nth-child(2){animation-delay:.15s} .ng-omok .om-think i:nth-child(3){animation-delay:.3s}
@keyframes omok-dot{50%{transform:translateY(-4px); opacity:.4}}
@keyframes omok-in{from{transform:scale(.6); opacity:0}}
.ng-omok .om-board{position:relative; margin:auto -8px; flex:none; border-radius:16px; padding:0; touch-action:none; outline:none;
  background:radial-gradient(120% 90% at 30% 20%, #FCE6B8 0%, #F2CB86 60%, #E4AE62 100%); border:3px solid #1A0F45;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.55), 0 5px 0 #1A0F45, 0 14px 22px rgba(60,30,120,.22)}
.ng-omok .om-board:focus-visible{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55), 0 0 0 3px #FFE27A, 0 5px 0 #1A0F45}
.ng-omok .om-svg{display:block; width:100%; height:100%; overflow:visible}
.ng-omok .om-st.om-new{transform-box:fill-box; transform-origin:center; animation:omok-drop .28s cubic-bezier(.2,1.6,.4,1)}
@keyframes omok-drop{from{transform:scale(1.6); opacity:.2}}
.ng-omok .om-st.om-wins{filter:drop-shadow(0 0 2px #FFE27A) drop-shadow(0 0 3px #FFB020)}
.ng-omok .om-winline{stroke:#FF5A6E; stroke-width:1.6; stroke-linecap:round; opacity:.9; stroke-dasharray:80; stroke-dashoffset:80; animation:omok-line .45s ease-out forwards}
@keyframes omok-line{to{stroke-dashoffset:0}}
.ng-omok .om-ban{stroke:#E5484D; stroke-width:.9; stroke-linecap:round; opacity:.75}
.ng-omok .om-guide{stroke:#FF8A3D; stroke-width:.5; stroke-dasharray:1.6 1.4; opacity:.9}
.ng-omok .om-ghost{opacity:.6}
.ng-omok .om-ghost.ban{opacity:.35}
.ng-omok .om-ring{fill:none; stroke:#FF8A3D; stroke-width:.9; animation:omok-pulse 1s ease-in-out infinite alternate}
.ng-omok .om-ring.ban{stroke:#E5484D}
.ng-omok .om-hintring{fill:none; stroke:#FFD23F; stroke-width:1.4; stroke-dasharray:2 1.5; animation:omok-pulse .6s ease-in-out infinite alternate}
@keyframes omok-pulse{to{opacity:.35}}
.ng-omok .om-coord{width:100%; margin:10px 0 0; min-height:20px; font-family:var(--disp); font-size:14px; line-height:1.35; color:#3A2C78; text-align:center}
.ng-omok .om-coord b{font-family:var(--heavy); font-weight:400; font-size:16px; color:#1A0F45}
.ng-omok .om-coord b.bad{color:#D0303A}
.ng-omok .om-act{margin-top:8px; align-items:stretch}
.ng-omok .om-act .tool{flex:1 1 0}
.ng-omok .om-act .tool .cnt{font-style:normal}
.ng-omok .om-zoom{flex:.9 1 0}
.ng-omok .om-zoom.on{background:linear-gradient(180deg,#DFF1FF,#9ED2FF)}
.ng-omok .om-board.zoom{overflow:hidden; touch-action:none}
.ng-omok .om-board .om-svg{transform-origin:0 0}
.ng-omok .om-put{flex:1.7 1 0; height:56px; min-width:0; flex-direction:column; gap:0; font-size:22px; line-height:1.05}
.ng-omok .om-put small{font-family:var(--disp); font-size:13px; color:#fff; opacity:.95}
.ng-omok .om-put small:empty{display:none}
.ng-omok .om-rules{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:8px 0 0; max-width:100%}
.ng-omok .om-chip{font-family:var(--disp); font-size:13px; line-height:1; padding:5px 10px; border-radius:99px; border:2px solid #1A0F45; background:#fff; color:#2E2260; box-shadow:0 2px 0 #1A0F45; white-space:nowrap}
.ng-omok .om-chip.mj{background:#FFF0DC; color:#9A5A12}
.ng-omok .om-chip.tw{background:#EFE7FF; color:#5B3FB5}
.ng-omok .om-chip.boss{background:linear-gradient(180deg,#FFE27A,#FFB020); color:#5A2E00}
/* 세대별 테스트(2026-10-06): 칩 글자 13px, 시간 고르기, 자리 비움, [두기] 진한 핑크, 놓을 자리 분홍, 돋보기 */
.ng-omok .hchip em{font-size:13px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ng-omok .om-side .om-opn{max-width:74px; white-space:nowrap}
.ng-omok button.hchip{font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent}
.ng-omok button.hchip:active{transform:translateY(2px)}
.ng-omok .hchip.time.slow em{color:#137A43}
.ng-omok .om-side.away{background:linear-gradient(180deg,#FFF0F0,#FFD0D3)} .ng-omok .om-side.away em{color:#B3202A}
.ng-omok .om-put:not(:disabled){--c1:#FF4FA0; --c2:#D81B72; --c3:#7A0A40}
.ng-omok .om-put:disabled{filter:none; opacity:1; --c1:#FFD3E7; --c2:#F6A9CB; --c3:#C27399}
.ng-omok .om-put:disabled, .ng-omok .om-put:disabled small{color:#fff}
.ng-omok .om-guide{stroke:#F0368A}
.ng-omok .om-ring{stroke:#F0368A; stroke-width:1.1}
.ng-omok .om-bantip{fill:none; stroke:#E5484D; stroke-width:1; animation:omok-pulse .55s ease-in-out infinite alternate}
body[data-mode="omok"] .om-loupe{position:fixed; left:0; top:0; z-index:60; width:120px; height:120px; border-radius:50%; overflow:hidden; pointer-events:none; opacity:0; transition:opacity .08s;
  background:#F2CB86; border:3px solid #1A0F45; box-shadow:0 0 0 3px #fff, 0 8px 18px rgba(26,15,69,.35)}
body[data-mode="omok"] .om-loupe.on{opacity:1}
body[data-mode="omok"] .om-loupe svg{display:block; width:120px; height:120px}
body[data-mode="omok"] .om-loupe .om-ghost{opacity:.6}
body[data-mode="omok"] .om-loupe .om-ring{fill:none; stroke:#F0368A; stroke-width:.7}
body[data-mode="omok"] .om-loupe .om-guide{stroke:#F0368A; stroke-width:.3; stroke-dasharray:1.6 1.4}
body[data-mode="omok"] .om-loupe .om-ban{stroke:#E5484D; stroke-width:.9; stroke-linecap:round; opacity:.75}
body[data-mode="omok"] .om-loupe .om-winline, .om-loupe .om-bantip{display:none}
body[data-mode="omok"] .om-loupe .om-lx{position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px; border-radius:50%; background:#F0368A; box-shadow:0 0 0 2px #fff}
@media (max-width:370px){ .ng-omok .om-msg b{font-size:18px} }
@media (prefers-reduced-motion: reduce){ .ng-omok .om-st.om-new, .ng-omok .om-ring, .ng-omok .om-hintring, .ng-omok .om-bantip{animation:none} }
