/* ---- 게임 정의에서 읽는 대전 설정 ---- */
const duelNG = id => NG[id] || {};
const duelKindOf = id => ['race', 'score', 'shared', 'turn'].includes(duelNG(id).duelKind) ? duelNG(id).duelKind : 'race';
/* 대전 판 다시 풀기·보내기(R11, 결정 221): 혼자 다시 풀어 의미 있는 대전만. 게임 정의 duelReplay(true|false)가 있으면 그것,
   없으면 경주(race)·점수(score)만 켜짐. 선점(shared)·차례(turn)·자기 방식(duelLaunch)은 꺼짐(게임 이름은 모름) */
const duelReplayOk = id => { const m = duelNG(id); if(typeof m.duelReplay === 'boolean') return m.duelReplay; return !m.duelLaunch && ['race', 'score'].includes(duelKindOf(id)); };
const duelMaxOf = id => Math.max(2, Math.min(5, Math.floor(+duelNG(id).duelMax || 2)));
function duelEndOf(id){ const e = duelNG(id).duelEnd, k = duelKindOf(id); return ['first', 'all', 'game'].includes(e) ? e : k === 'race' ? 'first' : k === 'score' ? 'all' : 'game'; }
const duelPaceGet = () => store.get('hp:duelPace', 'n') === 's' ? 's' : 'n';
const duelSeenGet = id => { const a = store.get('hp:duelSeen:' + id, null); return Array.isArray(a) ? a.slice(-3).map(x => String(x).slice(0, 40)) : []; };
function duelSeenPush(id){
  try{ const f = duelNG(id).duelAvoidKey; if(!f) return; const k = f(); if(k == null || k === '') return;
    const a = duelSeenGet(id).filter(x => x !== String(k)); a.push(String(k).slice(0, 40)); store.set('hp:duelSeen:' + id, a.slice(-3)); }catch(_){}
}
/* 대전 판 설정: 게임의 duelCfg({ n, pace, avoid, diff })가 있으면 그것, 없으면 그 난이도 판. 느긋하게면 duelSlow 또는 limit×2.
   null을 돌려주면 엔진(startGame)이 원래 난이도 판을 쓴다. 문제 내용은 여기서 정하지 않음(init의 rng로만) */
function duelCfgFor(id, lv, o){
  const m = duelNG(id); let cfg = null;
  try{ if(m.duelCfg) cfg = m.duelCfg(Object.assign({ diff:lv }, o)) || null; }catch(_){ cfg = null; }
  if(!cfg && o.pace !== 's') return null;
  if(!cfg){ try{ cfg = Object.assign({}, levelOf(id, lv)[id]); }catch(_){ return null; } }
  if(o.pace === 's'){
    try{ cfg = m.duelSlow ? (m.duelSlow(Object.assign({}, cfg)) || cfg) : Object.assign({}, cfg, { limit:(cfg.limit || 0) * 2 }); }catch(_){}
  }
  return cfg;
}

/* ======================================================================
   (1) 빠른 대전 찾기 v3 (docs/21 3-4, 10-2)
   대기실 presence { du:'w3'|'h3'|'j3', dg, dt, nk, dk:'n'|'s', dv:3, dr, dc }
   - 같은 게임·같은 속도에서 dt가 가장 이른 사람이 방장(h3) → 방 이름 'fl-d3-<peer12>-<dt36>'
   - 나머지는 그 방에 들어감(j3). 방장이 시작: 최대 인원이 차거나, 2명 이상 + 두 번째 입장 6초, 또는 찾기 12초
   - 12초에 혼자면 컴퓨터 1:1. 시작 정보 { go, pl, sd, r, cf }에 없는 늦은 사람은 다시 찾기
   ====================================================================== */
let DS = null;   /* 상대 찾기 상태 */
function duelStart(id){
  if(!HOST.canDuel()) return;
  if(duelNG(id).duelLaunch){ duelNG(id).duelLaunch({ pace:duelPaceGet() }); return; }   /* 자기 방식의 대전(함대·고스톱·끝말잇기) */
  duelSearch(id);
}
function duelLobbyClear(){ if(ROOM) try{ ROOM.presence({ du:null, dg:null, dt:null, dp:null, nk:null, dk:null, dv:null, dr:null, dc:null }).catch(() => {}); }catch(_){} }
function duelSearchStop(){
  if(!DS) return;
  clearInterval(DS.iv); clearTimeout(DS.to); if(DS.un) try{ DS.un(); }catch(_){}
  if(DS.nr && !DS.keep) try{ DS.nr.leave(); }catch(_){}
  if(DS.live) duelLobbyClear();
  DS = null;
}
const duelPeerKey = p => String(p || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 12);
function duelSearch(id, keepT0){
  const t0 = keepT0 || Date.now();
  duelSearchStop();
  const max = duelMaxOf(id), pace = duelPaceGet();
  const S = DS = { id, nick:duelNick(), pid:duelPidNew(), t0, dt:Date.now(), live:duelLive(), phase:'search', max, pace, fresh:!store.get('hp:help:' + id, false) };
  const slots = Array.from({ length:max }, (_, i) => `<span class="ds-slot${i ? '' : ' me'}" data-i="${i}">${i ? '' : avatar({ me:true })}</span>`).join('');
  openModal(`<div class="dsearch v3" style="--gc:${GCOL[id][1]}"><p class="kick">${T('core.ds3.kick', { n:max })}</p><h3>${T('core.ds3.title')}</h3><p class="ds-game">${GAMES[id].name}</p>
    <div class="ds-ppl" id="dsPpl">${slots}</div>
    <p class="ds-cnt" id="dsCnt">${S.live ? T('core.ds3.cnt', { n:1, max }) : T('core.ds3.cpuNow')}</p>
    <p class="note" id="dsTxt"></p>
    <button class="ds-pace${pace === 's' ? ' on' : ''}" id="dsPace" aria-pressed="${pace === 's'}"><i></i>${T('core.ds3.slow')}</button>
    ${HOST.duelRewardHtml()}
    <div class="mbtns"><button class="b2" id="dsCancel">${T('core.cancel')}</button><button class="b1" id="dsAi">${S.live ? T('core.ds3.vsCpu') : T('core.ds3.startNow')} ${costTag()}</button></div></div>`);
  $('#modal').classList.add('duelm');
  sfx('flPing');
  $('#dsCancel').onclick = () => { duelSearchStop(); closeModal(); };
  $('#dsAi').onclick = () => duelGoAI(S);
  $('#dsPace').onclick = () => { if(DS !== S || S.phase === 'start') return; store.set('hp:duelPace', S.pace === 's' ? 'n' : 's'); sfx('toggle', { on:S.pace !== 's' }); duelSearch(id); };
  if(!S.live){ duelSearchText(S); S.to = setTimeout(() => duelGoAI(S), 1600); return; }
  duelLobbyPub(S, { du:'w3' });
  const check = () => { if(DS === S) try{ duelSearchCheck(S); }catch(_){} };
  try{ S.un = ROOM.onPeers(check, () => {}); }catch(_){}
  S.iv = setInterval(() => { check(); duelSearchText(S); }, 400);
  duelSearchText(S);
}
function duelLobbyPub(S, o){
  try{ ROOM.presence(Object.assign({ du:'w3', dg:S.id, dt:S.dt, nk:S.nick, dk:S.pace, dv:3, dp:null, dr:null, dc:null }, o)).catch(() => {}); }catch(_){}
}
/* 찾기 창 글자·얼굴 */
function duelSearchText(S){
  if(DS !== S) return;
  const t = $('#dsTxt'), c = $('#dsCnt'), ppl = $('#dsPpl'); if(!t) return;
  if(!S.live){ t.innerHTML = T('core.ds3.offline'); return; }
  const left = Math.max(0, 12 - Math.floor((Date.now() - S.t0) / 1000));
  const mem = S.mem || [];
  if(c) c.textContent = T('core.ds3.cnt', { n:Math.max(1, mem.length), max:S.max });
  if(ppl){
    const others = mem.filter(m => m.pid !== S.pid);
    ppl.querySelectorAll('.ds-slot').forEach((el, i) => {
      if(!i) return; const m = others[i - 1], k = m ? m.pid : '';
      if(el.dataset.k === k) return; el.dataset.k = k;
      el.classList.toggle('on', !!m); el.innerHTML = m ? oppAv(m.nick) : '';
    });
  }
  if(S.phase === 'start'){ t.innerHTML = T('core.ds3.allIn'); return; }
  if(S.aiSoon){ t.innerHTML = '<b>' + T('core.ds3.aiSoon') + '</b>'; return; }
  const n = duelWaiting(S.id);
  t.innerHTML = mem.length >= 2 ? `${T('core.ds3.mem', { n:mem.length })}${S.max > mem.length ? ' · ' + T('core.ds3.more') : ''}`
    : `${T('core.ds3.left', { n:left })}${n ? ' · ' + T('core.ds3.waitN', { n }) : ''}`;
}
/* 대기실·방을 보고 할 일 정하기(0.4초마다 + 대기실이 바뀔 때) */
function duelSearchCheck(S){
  if(S.phase === 'start' || S.aiSoon) return;
  const now = Date.now();
  if(S.phase === 'search'){
    let ps; try{ ps = ROOM.peers(); }catch(_){ return; }
    const me = ps.find(p => p.sameTab); if(!me) return;
    S.myPeer = me.peer;
    const same = p => p.presence && p.presence.dv === 3 && p.presence.dg === S.id && (p.presence.dk || 'n') === S.pace && typeof p.presence.dt === 'number';
    const ord = (a, b) => a.presence.dt - b.presence.dt || (a.peer < b.peer ? -1 : 1);
    const hosts = ps.filter(p => !p.sameTab && same(p) && p.presence.du === 'h3' && p.presence.dr && (+p.presence.dc || 1) < S.max && !(S.skip || {})[p.presence.dr]).sort(ord);
    if(hosts.length){ duelJoinRoom(S, hosts[0].presence.dr); return; }
    const ws = ps.filter(p => same(p) && p.presence.du === 'w3').sort(ord);
    /* 가장 이른 사람이 0.8초 동안 그대로면 방장(동시에 찾기 시작해 대기실 소식이 덜 왔을 때 방장이 둘 생기는 것 줄이기) */
    if(ws.length && ws[0].sameTab){ if(!S.firstAt) S.firstAt = now; if(now - S.firstAt >= 800){ duelBecomeHost(S); return; } } else S.firstAt = 0;
    if(now - S.t0 > 12000) duelAiSoon(S);
    return;
  }
  if(!S.nr) return;
  let rp = []; try{ rp = S.nr.peers(); }catch(_){ return; }
  S.mem = rp.filter(p => p.presence && p.presence.pid && p.presence.nk && p.presence.dv === 3).map(p => ({ pid:p.presence.pid, nick:String(p.presence.nk).slice(0, 12), peer:p.peer, nw:!!p.presence.nw, me:!!p.sameTab, hs:!!p.presence.hs, go:p.presence.go, pl:p.presence.pl, sd:p.presence.sd, r:p.presence.r, cf:p.presence.cf }));
  if(!S.mem.some(m => m.me)) S.mem.unshift({ pid:S.pid, nick:S.nick, me:true });
  if(S.phase === 'host'){
    const n = S.mem.length;
    try{ ROOM.presence({ dc:n }).catch(() => {}); }catch(_){}
    if(n >= 2){ if(!S.secondAt) S.secondAt = now; } else S.secondAt = 0;
    /* 거의 같은 때 방장이 둘 생겼으면: 합쳐도 정원 안이면 늦은 쪽 방장이 이른 쪽 방으로(남은 사람도 방장이 없어 다시 찾다가 합류) */
    {
      let ps = []; try{ ps = ROOM.peers(); }catch(_){}
      const other = ps.find(p => !p.sameTab && p.presence && p.presence.dv === 3 && p.presence.du === 'h3' && p.presence.dg === S.id && (p.presence.dk || 'n') === S.pace && p.presence.dr && p.presence.dr !== S.R
        && (+p.presence.dc || 1) + n <= S.max && (p.presence.dt < S.dt || (p.presence.dt === S.dt && p.peer < S.myPeer)));
      if(other){ const nr = S.nr; S.nr = null; try{ nr.leave(); }catch(_){} duelJoinRoom(S, other.presence.dr); return; }
    }
    if(n >= S.max || (n >= 2 && now - S.secondAt >= 6000) || (n >= 2 && now - S.t0 >= 12000)){ duelHostGo(S); return; }
    if(n < 2 && now - S.t0 >= 12000) duelAiSoon(S);
    return;
  }
  if(S.phase === 'join'){
    const h = S.mem.find(m => m.hs || (m.go && Array.isArray(m.pl)));
    if(h && typeof h.go === 'number' && Array.isArray(h.pl) && (h.r || 1) === 1){
      if(h.pl.includes(S.pid)){ duelLaunchRound(S, h); return; }
      duelRejoin(S, T('core.ds3.full')); return;
    }
    if(!h){ if(!S.noHost) S.noHost = now; else if(now - S.noHost > 1500){ duelRejoin(S, T('core.ds3.closed')); return; } } else S.noHost = 0;
    if(now - S.joinAt > 25000) duelRejoin(S, '');
  }
}
async function duelJoinRoom(S, R){
  S.phase = 'joining';
  duelLobbyPub(S, { du:'j3', dr:R });
  let nr;
  try{ nr = await ROOM.join(String(R).slice(0, 60)); }catch(_){ if(DS === S){ S.phase = 'search'; (S.skip = S.skip || {})[R] = 1; duelLobbyPub(S, { du:'w3' }); } return; }
  if(DS !== S){ try{ nr.leave(); }catch(_){} return; }
  S.nr = nr; S.R = R; S.phase = 'join'; S.joinAt = Date.now(); S.noHost = 0;
  nr.presence({ pid:S.pid, nk:S.nick, nw:S.fresh ? 1 : 0, dv:3, hs:0 }).catch(() => {});
  sfx('flLock'); fxBuzz([20, 40, 20]);
}
async function duelBecomeHost(S){
  S.phase = 'hosting';
  const R = ('fl-d3-' + duelPeerKey(S.myPeer) + '-' + S.dt.toString(36)).slice(0, 60);
  let nr;
  try{ nr = await ROOM.join(R); }catch(_){ if(DS === S) S.phase = 'search'; return; }
  if(DS !== S){ try{ nr.leave(); }catch(_){} return; }
  S.nr = nr; S.R = R; S.phase = 'host'; S.secondAt = 0;
  nr.presence({ pid:S.pid, nk:S.nick, nw:S.fresh ? 1 : 0, dv:3, hs:1 }).catch(() => {});
  duelLobbyPub(S, { du:'h3', dr:R, dc:1 });
}
/* 방장: 시작 정보 보내고 시작 */
function duelHostGo(S){
  const mem = S.mem.slice(0, S.max), me = mem.find(m => m.me) || { pid:S.pid };
  const pl = [me.pid, ...mem.filter(m => !m.me).map(m => m.pid)].slice(0, S.max);
  const fresh = S.fresh || mem.some(m => m.nw);
  const go = netNow() + (fresh ? 4000 : 2500), sd = duelSdNew();
  const info = { go, pl, sd, r:1, cf:{ dk:S.pace, av:duelSeenGet(S.id), n:pl.length } };
  try{ S.nr.presence(Object.assign({ hs:1 }, info)).catch(() => {}); }catch(_){}
  duelLaunchRound(S, Object.assign({ pid:S.pid }, info));
}
function duelRejoin(S, msg){
  const nr = S.nr; S.nr = null; if(nr) try{ nr.leave(); }catch(_){}
  if(msg) toast(msg);
  if(DS === S){ (S.skip = S.skip || {})[S.R] = 1; S.phase = 'search'; S.mem = []; S.R = null; S.t0 = Date.now(); duelLobbyPub(S, { du:'w3' }); }
}
function duelAiSoon(S){
  if(S.aiSoon) return; S.aiSoon = true; duelSearchText(S);
  S.to = setTimeout(() => { S.aiSoon = false; duelGoAI(S); }, 700);
}
/* 모두 같은 시작 정보로 같은 판을 시작 */
function duelLaunchRound(S, h){
  if(S.phase === 'start') return;
  S.phase = 'start'; S.keep = true; clearInterval(S.iv); if(S.un) try{ S.un(); }catch(_){} S.un = null;
  duelSearchText(S);
  const byPid = {}; (S.mem || []).forEach(m => { byPid[m.pid] = m; });
  const cf = h.cf || {}, avoid = Array.isArray(cf.av) ? cf.av.slice(0, 3) : [];
  const pl = h.pl.map(pid => ({ pid, nick:pid === S.pid ? S.nick : ((byPid[pid] || {}).nick || T('core.opp')), peer:(byPid[pid] || {}).peer }));
  const duel = duelMake({ id:S.id, mode:'pvp', R:S.R, r:h.r || 1, sd:h.sd, nr:S.nr, pl, myPid:S.pid, myNick:S.nick, go:h.go, pace:S.pace, avoid, quick:true });
  duelSearchStop(); closeModal(); startGame(S.id, 'normal', { duel });
}
function duelGoAI(S){
  if(DS !== S || S.phase === 'start' || S.phase === 'joining' || S.phase === 'hosting') return;
  const id = S.id, myNick = S.nick;
  if(S.nr){ const nr = S.nr; S.nr = null; try{ nr.leave(); }catch(_){} }

function duelMakeAI(id, myNick, pace){

  if(T.pid && D.P[T.pid] && D.P[T.pid].left){ duelTurnFire(D, { kind:'skip', pid:T.pid, n:T.n, auto:true }); duelTurnAdvance(D, Math.round(duelSrv())); return; }
  if(T.lim && duelSrv() > T.since + T.lim * 1000 + 2000){

}
/* 선점·차례 게임이 '판 끝'을 알림(모두 같은 상태에서 같은 판단 → 누가 불러도 같음) */
function duelEndNow(why){
  const D = G && G.duel; if(!D || D.v !== 3 || G.over) return;

  if(!D.endBy) D.endBy = { k:'game' };

/* ======================================================================
   (4) 컴퓨터 상대(사람 같은 속도, docs/21 3-10): 미리 정한 결과를 한 칸씩 계단으로
   ====================================================================== */
function duelAiSched(D){
  const a = D.ai, S = duelStatOf(G.id) || {}, me = duelStatNow();
  const dT = Object.getOwnPropertyDescriptor(a, 'T');
  if(a.smooth || (dT && dT.get)) return { smooth:true };   /* 게임이 직접 움직이는 컴퓨터(예: 실제로 두는 수) */
  const rng = mulberry(seedFrom(D.seed + 'h'));
  const score = S.score || a.pts != null || D.kind === 'score';
  const N = score ? Math.max(4, Math.round(a.T / 6)) : Math.max(1, Math.min(60, me.t != null && !S.tile ? me.t : 12));
  const fEnd = a.ok ? 1 : Math.max(0, Math.min(.99, a.fail || 0));
  const K = a.ok ? N : Math.max(0, Math.floor(N * fEnd));
  const first = 3 + rng() * 3, at = [];
  let tt = first;
  for(let k = 0; k < K; k++){ if(k){ let g = (0.5 + rng() * 1.1); if(rng() < .15) g += (4 + rng() * 4) / Math.max(1, (a.T - first) / Math.max(1, K - 1)); tt += g; } at.push(tt); }
  if(K > 1){ const span = at[K - 1] - first, want = Math.max(1, a.T - first); for(let k = 1; k < K; k++) at[k] = first + (at[k] - first) * want / span; }
  else if(K === 1) at[0] = Math.min(first, a.T);
  /* 틀린 횟수: 기회 3번 게임에서 못 끝내면 3번(기회를 다 씀), 아니면 0~2번 */
  const nm = S.lfMax === 3 && !a.ok ? 3 : Math.floor(rng() * 3), mis = [];
  for(let k = 0; k < nm; k++) mis.push(S.lfMax === 3 && !a.ok && k === nm - 1 ? a.T : 2 + rng() * Math.max(1, a.T - 2));
  mis.sort((x, y) => x - y);
  return { N, K, at, mis, score, keys:null, kOrder:null };
}
function duelAiTick(D, tf){   /* tf: 이 시각(초)까지 한 번에 진행(점수전에서 내가 먼저 끝났을 때 컴퓨터 판을 끝까지) */
  const a = D.ai, P = D.P.ai; if(!a || !P || P.st.dn) return;
  const S = duelStatOf(G.id) || {}, t = tf != null ? tf : elapsed(), st = P.st;
  if(!D.aiS) D.aiS = duelAiSched(D);
  const H = D.aiS, me = duelStatNow();
  if(H.smooth){   /* 예전 방식(연속) */
    st.pg = a.ok ? Math.min(1, Math.pow(Math.max(0, t) / a.T, .9)) : Math.min(a.fail, a.fail * t / a.T);
    if(me.t != null){ st.t = me.t; st.v = Math.min(me.t, Math.floor(st.pg * me.t)); }
  } else {
    const k = H.at.filter(x => x <= t).length, prevV = st.k || 0;
    st.k = k; st.pg = Math.min(1, k / H.N);
    if(k > prevV) st.la = Math.round(D.goSrv + H.at[k - 1] * 1000);
    if(D.kind === 'shared'){ if(me.t != null) st.t = me.t; }
    else if(me.t != null){
      st.t = me.t;
      if(S.tile){ const top = Math.log2(Math.max(4, me.t)); st.v = Math.pow(2, Math.max(1, Math.round(1 + st.pg * (top - 1)))); }
      else if(H.score) st.v = Math.round(st.pg * (a.pts != null ? a.pts : (a.sc || me.t * .5)) / 10) * 10;
      else st.v = Math.min(me.t, k);
    } else st.v = k;
    st.mis = H.mis.filter(x => x <= t).length;
    if(S.lfMax === 3) st.lf = Math.max(0, 3 - st.mis);
    if(S.lfMax === 10) st.lf = Math.max(1, 10 - Math.floor(st.pg * (a.ok ? 3 : 7)));
    /* 선점 게임: 계단마다 남은 키 하나를 차지(같은 씨앗 → 같은 순서). 키 목록은 게임의 duelKeys() */
    if(D.kind === 'shared' && k > (H.claimed || 0)){
      try{ if(!H.keys){ const f = duelNG(G.id).duelKeys; H.keys = f ? (f() || []).map(String) : []; H.kOrder = shuffle(H.keys.slice(), mulberry(seedFrom(D.seed + 'k'))); } }catch(_){ H.keys = []; H.kOrder = []; }
      for(let j = H.claimed || 0; j < k; j++){
        const key = H.kOrder.find(x => !(D.owners || {})[x]);
        if(key != null) P.cl[key] = Math.round(D.goSrv + H.at[j] * 1000);
      }
      H.claimed = k; duelClaimsRecalc(D);
      if(!H.keys.length) st.v = k;
    }
    if(k > prevV) duelOppStep(D, P, prevV);
  }
  if(t >= a.T && !(H.smooth && !a.ok)){
    st.dn = 1; st.ok = a.ok ? 1 : 0; st.sc = a.ok ? (a.sc || 0) : 0;
    if(a.ok){ st.ft = Math.round(D.goSrv + a.T * 1000); st.pg = 1; if(st.t != null && !S.score && !S.tile && D.kind !== 'shared') st.v = st.t; }
    duelOnDone(D, P);
  } else if(H.smooth && t >= a.T){ /* 끝나지 않는 컴퓨터(게임이 끝을 정함) */ }
  duelSyncOpp(D);
}

/* 게임이 컴퓨터 상대를 sec초 늦춤(예: 짝 잇기 얼음 공격을 받은 컴퓨터). 아직 오지 않은 계단과 끝나는 시각을 뒤로 민다 */
function duelAiDelay(sec){
  try{ const D = G && G.duel; if(!D || !D.ai || !D.P.ai || D.P.ai.st.dn || G.over || !(sec > 0)) return false;
    const t = elapsed(); D.ai.T += sec;

}

/* 시작 순간: 시계를 정해진 시각에 맞추고 판을 보여 줌(늦게 도착했으면 그만큼 이미 지난 것으로) */

    const order = D.pl.slice().sort((a, b) => rk[a] - rk[b] || D.P[a].seat - D.P[b].seat);
    const narrow = (box.clientWidth || 358) < 352, step = narrow ? 65 : 73;
    box.style.width = (order.length * step - (narrow ? 5 : 7)) + 'px';
    const named = Date.now() - (D.t3 || Date.now()) < 3000 || !D.go;
    const TN = D.kind === 'turn' && D.turn ? D.turn : null;   /* 차례(이름 T는 언어 사전 함수라 피함) */
    order.forEach((pid, i) => {
      const P = D.P[pid], s = stOf(P), c = box.querySelector(`.dpchip[data-pid="${pid}"]`); if(!c) return;
      c.style.transform = `translateX(${i * step}px)`;

      const gone = P.gone && !s.dn, left = P.left && !s.dn;

      c.classList.toggle('first', rk[pid] === 1 && D.go); c.classList.toggle('done', !!(s.dn && D.kind === 'score'));
      c.classList.toggle('gone', !!gone); c.classList.toggle('left', !!left);
      c.classList.toggle('turn', !!(TN && TN.pid === pid));
    });

  }
  /* 미니 화면 */
  const box = $('#dMinis'); if(!box) return;
  const mini = duelNG(id).duelMini;
  box.querySelectorAll('.dmini').forEach(c => {
    const P = D.P[c.dataset.pid]; if(!P) return; const s = P.st;
    c.querySelector('.dm-val').innerHTML = P.left && !s.dn ? T('core.dbar.left') : duelValShort(id, s, D);
    c.classList.toggle('left', !!(P.left || P.gone)); c.classList.toggle('first', rk[P.pid] === 1 && D.go);
    const b = c.querySelector('.dm-board');
    if(b._s !== P.mv || P.ai){ b._s = P.mv; try{ mini.draw(b, P.mv || '', duelPub3(D, P, rk)); }catch(_){} }   /* 컴퓨터는 판 글자가 없어 매번(게임이 진행 st로 그림) */
  });
  const r = $('#dmRank'); if(r){ r.textContent = D.go ? T('core.d.rank', { n:rk[D.myPid] }) : '-'; r.classList.toggle('first', rk[D.myPid] === 1 && D.go); }
}

/* ---- 큰 알림(docs/21 3-12): 화면 위 30%, 1.2초, 같은 사람 3초에 1번, 판을 가리지 않게 반투명 ---- */
function duelNotify(text, o = {}){
  try{
    const D = G && G.duel; if(!D) return;
    const now = Date.now(), from = o.from || null, key = from ? from.pid : '_';
    D.noteAt = D.noteAt || {};
    if(!o.force && from && now - (D.noteAt[key] || 0) < 3000) return;
    D.noteAt[key] = now;
    let el = $('#dNote');
    if(!el){ el = document.createElement('div'); el.id = 'dNote'; el.className = 'dnote'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); }
    const P = from && D.P ? D.P[from.pid] : null, s = P ? DUEL_SEAT[duelViewSeat(D, P) % 5] : DUEL_SEAT[0];
    el.style.setProperty('--sc', s.col);
    el.className = 'dnote ' + (o.kind || 'info');
    el.innerHTML = `${from ? (from.me ? avatar({ me:true }) : oppAv(from.nick)) : ''}${from ? duelShapeSvg(s.shape, s.col, 14) : ''}<span>${text}</span>`;
    void el.offsetWidth; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), o.ms || 1200);
  }catch(_){}
}
/* 상황별 알림(우선순위·같은 알림 간격) → 큰 알림으로 보여 줌 */
const DPING = {
  oppDone: { pri:5, kind:'end',  sfx:'flHorn', buzz:[30, 40, 30] },
  oppFail: { pri:5, kind:'gray', sfx:'toggle' },
  oppLeft: { pri:5, kind:'gray', sfx:'toggle' },
  oppNet:  { pri:5, kind:'gray', sfx:'toggle' },
  meNet:   { pri:5, kind:'gray', sfx:'toggle', ms:2400 },
  oppBack: { pri:5, kind:'good', sfx:'toast' },
  meLead:  { pri:4, kind:'good', sfx:'star', same:12000 },
  oppLead: { pri:4, kind:'bad',  sfx:'starOff', buzz:20, same:12000 },
  oppHot:  { pri:3, kind:'hot',  sfx:'flPing', once:true },
  last10:  { pri:3, kind:'hot',  sfx:'flPing', once:true },
  oppStep: { pri:2, kind:'info' },
  oppMiss: { pri:2, kind:'info', sfx:'toast', same:15000 },
  oppHit:  { pri:2, kind:'info', sfx:'toast', same:15000 }
};
function duelPing(kind, text, from){
  const D = G && G.duel, P = DPING[kind]; if(!D || !P) return;
  const now = Date.now();
  D.pingAt = D.pingAt || {}; D.pingOnce = D.pingOnce || {};
  if(P.once && D.pingOnce[kind + (from ? from.pid : '')]) return;
  if(P.same && now - (D.pingAt[kind] || 0) < P.same) return;
  if(P.pri < 5 && (!D.go || elapsed() < 3)) return;
  if(P.pri < 5 && now - (D.pingLast || 0) < 1300 && (D.pingPri || 0) > P.pri) return;
  D.pingAt[kind] = D.pingLast = now; D.pingPri = P.pri; D.pingOnce[kind + (from ? from.pid : '')] = 1;
  duelNotify(text, { from:from || (kind === 'meLead' ? { pid:D.myPid, me:true } : null), kind:P.kind, force:P.pri >= 4, ms:P.ms });
  try{ if(P.sfx) sfx(P.sfx, P.sfx === 'star' ? { i:1 } : P.sfx === 'toggle' ? { on:false } : {}); if(P.buzz) fxBuzz(P.buzz); }catch(_){}
}
/* 상대가 하나 찾음(경주): "판다 · 5/9". 5명 대전은 1위가 바뀔 때와 마무리 때만 */
function duelOppStep(D, P, prev){
  if(G.over || D.kind !== 'race') return;
  const s = P.st, S = duelStatOf(G.id) || {};
  if(S.score || S.tile) return;
  const n = D.pl.length, rk = duelRanks();
  const near = s.t != null && s.v >= s.t - 1;
  if(n >= 5){ const lead = D.pl.find(pid => rk[pid] === 1); if(lead === D.lastLead && !near) return; D.lastLead = lead; }
  if(near) duelPing('oppHot', T('core.dn.hot', { name:esc(P.nick) }), P);
  else if(s.t != null) duelNotify(`${esc(P.nick)} · ${s.v}/${s.t}`, { from:P, kind:'info' });
}

/* ======================================================================
   (6) 소식 주고받기 · 판정
   ====================================================================== */
/* 다른 사람들의 presence 읽기 */
function duelRead(){
  const D = G && G.duel; if(!D || D.v !== 3 || D.mode !== 'pvp' || !D.nr) return;
  let ps = []; try{ ps = D.nr.peers(); }catch(_){ return; }
  const seen = {}; let dirty = false;
  for(const p of ps){
    if(p.sameTab) continue;
    const q = p.presence || {}, pid = q.pid || ('p:' + p.peer), P = D.P[pid];
    if(!P || P.me) continue;
    seen[pid] = 1; P.peer = p.peer;
    if(P.gone && !P.left){ P.gone = 0; if(!G.over) duelPing('oppBack', T('core.dn.back', { name:esc(P.nick) }), P); }
    if(D.startAt == null && typeof q.go === 'number' && (q.r == null || q.r === D.r)) D.startAt = duelLocalStart(q.go);
    if(q.rr != null && q.rr !== D.r) continue;   /* 지난 판 값 */
    const sig = JSON.stringify(q); if(sig !== P.sig){ P.sig = sig; P.msgAt = Date.now(); }
    if(q.q && !q.dn && !P.st.dn){ duelLeft(D, P); continue; }
    if(!D.go) continue;
    const st = P.st, prevV = st.v != null ? st.v : 0, prevLf = st.lf;
    if(typeof q.pg === 'number') st.pg = Math.max(st.pg || 0, Math.min(1, q.pg));
    for(const k of D.kind === 'shared' ? ['t', 'lf', 'mis', 'sc', 'ft'] : ['v', 't', 'lf', 'mis', 'la', 'sc', 'ft', 'tb']) if(typeof q[k] === 'number') st[k] = q[k];
    if(q.ok) st.ok = 1;
    if(D.kind === 'shared' && q.cl && typeof q.cl === 'object'){ const s2 = JSON.stringify(q.cl); if(s2 !== P.clSig){ P.clSig = s2; P.cl = Object.assign({}, q.cl); dirty = true; } }
    if(typeof q.mv === 'string') P.mv = q.mv.slice(0, 400);
    duelEvRead(D, P, q.ev);
    if(!G.over && !st.dn){
      if(D.kind === 'race' && typeof st.v === 'number' && st.v > prevV) duelOppStep(D, P, prevV);
      const S = duelStatOf(G.id) || {};
      if(S.lfMax === 3 && prevLf != null && st.lf < prevLf && st.lf > 0) duelPing('oppMiss', T('core.dn.miss', { name:esc(P.nick) }), P);
    }
    if(q.dn && !st.dn){ st.dn = 1; st.ge = q.ge ? 1 : 0; if(!q.ok) st.ok = 0; duelOnDone(D, P); }
  }
  if(dirty) duelClaimsRecalc(D);
  for(const pid of D.pl){ const P = D.P[pid]; if(P.me || P.ai || P.left || P.st.dn) continue; if(!seen[pid] && !P.gone){ P.gone = Date.now(); if(!G.over) duelPing('oppNet', T('core.dn.net', { name:esc(P.nick) }), P); } }
  if(D.kind === 'turn' && D.turn) duelTurnDrain(D);
  duelSyncOpp(D);
}
/* 예전 이름(1:1 게임이 G.duel.opp·oppPeer를 읽음): 첫 상대 값 맞추기 */
function duelSyncOpp(D){
  const P = D.P[D.pl.find(p => p !== D.myPid)]; if(!P) return;
  D.opp.nick = P.nick; D.opp.pg = P.st.pg || 0; D.opp.dn = P.st.dn ? 1 : 0; D.opp.sc = P.st.sc || 0;
  if(P.peer) D.oppPeer = P.peer; D.oppLeft = !!P.left; D.oppStat = P.st;
}
/* 다른 사람이 끝남 */
function duelOnDone(D, P){
  if(!G.over){
    if(P.st.ok && D.end === 'first'){ let tx = ''; try{ const f = duelNG(G.id).duelDoneMsg; if(f) tx = f(esc(P.nick)) || ''; }catch(_){} duelPing('oppDone', tx || T('core.dn.done', { name:esc(P.nick) }), P); }
    else if(!P.st.ok && D.kind === 'race') duelPing('oppFail', T('core.dn.stop', { name:esc(P.nick), r:duelRowTxt(D, P.st, false) }), P);
  } else try{ sfx(P.st.ok ? 'flPing' : 'toggle'); }catch(_){}
  duelJudge(D);
  duelRender();
}
function duelLeft(D, P){
  if(P.left) return;
  P.left = true; P.gone = 0;
  if(!G.over) duelPing('oppLeft', T('core.dn.left', { name:esc(P.nick) }), P);
  if(D.kind === 'turn' && D.turn && D.turn.pid === P.pid) duelTurnTick(D);
  duelSyncOpp(D);
  duelJudge(D);
  duelRender();
}
/* 끝나는 규칙(대표 의견 1): 경주는 누가 다 풀면 0.7초 뒤 모두 끝. 혼자 남았는데 이미 1위면 끝. 점수는 모두 끝나거나 시간. 선점·차례는 게임이 */
function duelJudge(D){
  if(!D.go) return;
  const others = D.pl.filter(p => p !== D.myPid).map(p => D.P[p]);
  if(G.over){ if(D.fin && !D.resolved && others.every(P => P.st.dn || P.left || P.ai)) duelResolveSoon(D); return; }
  if(D.end === 'first'){ const f = others.find(P => P.st.dn && P.st.ok); if(f){ if(!D.endBy) D.endBy = { k:'first', pid:f.pid }; duelCutSoon('done', typeof f.st.ft === 'number' ? f.st.ft + 700 : null); return; } }
  if(D.end === 'game'){ const f = others.find(P => P.st.dn && P.st.ge); if(f){ if(!D.endBy) D.endBy = { k:'game' }; duelCutSoon('game'); return; } }
  const active = others.filter(P => !P.left && !P.st.dn);
  if(active.length) return;
  if(others.every(P => P.left && !P.st.dn)){ if(!D.endBy) D.endBy = { k:'left' }; duelCutSoon('left'); return; }
  if(D.end === 'first' || (D.end === 'game' && D.kind === 'shared')){
    const rk = duelRanks();
    if(rk[D.myPid] === 1 && !duelTieAt(rk, D.myPid)){ if(!D.endBy) D.endBy = { k:'ahead' }; duelCutSoon('ahead'); }
  }
}
/* 한쪽이 끝나면(다 풂·나감) 다른 쪽 판도 끝난다. 끝난 쪽은 결과 뒤 '계속 풀기'로 혼자 이어 풀 수 있다(기록 안 됨) */
/* atSrv(서버 ms)를 주면 그 시각에 끝냄 → 소식이 늦게 와도 모두 같은 순간(다 푼 시각 + 0.7초)에 끝남 */
function duelCutSoon(why, atSrv){
  const D = G && G.duel, me = G; if(!D || D.fleet || G.over || D.cutT) return;
  D.cutStat = duelStatNow();   /* 알림을 보여 주는 동안에도 값이 바뀌지 않게 지금 값을 먼저 저장 */
  const ms = typeof atSrv === 'number' ? Math.max(150, Math.min(700, atSrv - duelSrv())) : 700;
  D.cutT = setTimeout(() => { if(G === me && !G.over && G.duel === D) duelCut(why); }, ms);
}
function duelCut(why){
  const D = G && G.duel; if(!D || D.fleet || G.over) return;
  if(D.v === 3){ try{ const s = duelStatNow(); D.cutStat = !D.cutStat || (s.v || 0) >= (D.cutStat.v || 0) ? s : D.cutStat; }catch(_){} }   /* 잘리기 직전 값(0% 버그) */
  D.cut = why; D.cutSec = elapsed();
  finish(false);
}
function duelCanContinue(){
  const D = G && G.duel;
  return !!(D && !D.fleet && D.cut && D.cut !== 'game' && G.over && !(D.fin ? D.fin.ok : D.me && D.me.sc) && NG[G.id] && NG[G.id].render);
}
/* 결과 창에 붙이는 '계속 풀기' 버튼(사이트·모듈 결과 창이 같이 씀) */
function duelContinueHtml(){

}
function duelContinueBind(){ const b = $('#mCont'); if(b) b.onclick = duelContinue; }
function duelContinue(){

/* 내 연결이 20초 넘게 끊김: 결과를 주고받을 수 없어서 무승부로 처리 */
function duelMyNetLost(){
  const D = G && G.duel; if(!D || D.netLost || D.resolved) return;
  D.netLost = true;
  if(!G.over) duelPing('meNet', T('core.dn.meLost'));
  if(G.over && D.fin) duelResolve();
}
/* 연결 상태 점검(게임 중·대기 창 모두): 끊긴 사람 15초 유예, 내 연결 끊김/복구 알림 */
function duelNetCheck(){
  const D = G && G.duel; if(!D || D.v !== 3 || D.mode !== 'pvp') return;
  for(const pid of D.pl){ const P = D.P[pid]; if(P.gone && !P.left && !P.st.dn && Date.now() - P.gone > 15000) duelLeft(D, P); }
  if(!D.netLost && D.go){
    const up = typeof netUp === 'function' ? netUp() : true;
    if(!up && !D.netDown){ D.netDown = Date.now(); if(!G.over) duelPing('meNet', T('core.dn.meDown')); }
    else if(up && D.netDown){ D.netDown = 0; if(!G.over) duelPing('oppBack', T('core.dn.meBack')); duelPub(true); }
  }
}
/* 내 진행 보내기: 0.8초마다, 급할 때(기회 잃음·끝남·사건·선점) 바로(최소 0.15초 간격) */
function duelPub(force){
  const D = G && G.duel; if(!D || D.v !== 3 || D.mode !== 'pvp' || !D.nr || !D.go) return;
  const s = G.over && D.fin ? D.fin : duelStatNow(), now = Date.now();
  const o = Object.assign({ pid:D.myPid, nk:D.myNick, rr:D.r }, s);
  if(D.evLog) o.ev = D.evLog;
  if(D.kind === 'shared') o.cl = D.P[D.myPid].cl;
  const mini = duelNG(G.id).duelMini;
  if(mini && !G.over && now - (D.mvAt || 0) > 700){ try{ const m = mini.get(); if(typeof m === 'string'){ D.mv = m.slice(0, 400); D.mvAt = now; } }catch(_){} }
  if(D.mv != null) o.mv = D.mv;
  const sig = JSON.stringify(o), urgent = D.urgent || (D.meStatLf != null && s.lf != null && s.lf < D.meStatLf);
  if(!force && sig === D.pubSig && now - D.lastPub < 5000) return;
  if(!force && !(urgent && now - D.lastPub > 150) && now - D.lastPub < 800) return;
  D.lastPub = now; D.pubSig = sig; D.meStatLf = s.lf; D.urgent = false;
  try{ D.nr.presence(Object.assign({ hb:(D.hb = (D.hb || 0) + 1) }, o)).catch(() => {}); }catch(_){}
}
/* 대전 규칙 목록: 게임 정의 duelHelp([[제목, 설명], …], 선택)가 있으면 그것, 없으면 help */
function duelHelpOf(id){ try{ const h = (NG[id] || {}).duelHelp; const r = typeof h === 'function' ? h() : h; if(Array.isArray(r) && r.length) return r; }catch(_){} return HELP[id] || []; }
function duelTick(){
  const D = G && G.duel; if(!D || D.fleet) return;
  if(D.v !== 3) return;
  if(!D.go){ duelRender(); return; }
  if(D.mode === 'ai' && !G.over) duelAiTick(D);
  if(D.mode === 'pvp'){ duelRead(); duelNetCheck(); if(!G.over) duelPub(false); }
  duelTurnTick(D);
  if(!G.over){
    duelJudge(D);

/* ===== 청기 백기 (flag) · 하루퍼즐 리그 순발력 게임 =====
   진행자가 "청기 올려", "백기 내려"처럼 명령하면 엄지 자리 큰 버튼으로 내 깃발을 올리고 내린다.
   순발력 = 판단이 빠른 것: 이미 그 상태인 명령, "~하지 마", 흉내쟁이 명령은 가만히 있는 게 정답(막 누르면 손해).
   모든 명령은 말풍선 글자 + 그림(깃발·화살표·✕ 도장)으로 나온다. 목소리(speechSynthesis)는 덤.
   명령 순서는 init에서 rng로만 미리 다 만든다(같은 씨앗 = 같은 명령). 판단 창은 글자가 화면에 뜬 순간부터 엔진 시계(elapsed)로 잰다. */
NG.flag = (() => {
  const OL = '#1A0F45';
  const FN = { b:'청기', w:'백기', y:'황기' };                 /* 깃발 이름 */
  const FC = { b:'#2F7BEA', w:'#FDFDFF', y:'#FFC21A' };         /* 깃발 천 색 */
  const FLAGS2 = ['b', 'w'], FLAGS3 = ['b', 'w', 'y'];
  const WRONG_GAP = .4;   /* 오답 뒤 다음 명령까지(초): 짧게 보여 주고 바로 넘어간다(2026-10-06 사용자 지시) */
  const HOSTS = ['fox', 'rabbit', 'bear', 'panda', 'tiger'];    /* 챕터 진행자(솔로) */
  const FL_SHORT = { both:'두 개', third:'황기', tight:'외줄' };   /* 판 위 규칙 꼬리표 4글자 이하(docs/29) */
  function flTips(){
    const t = [['버튼', '아래 큰 버튼: 깃발 색 + ▲ 올려 / ▼ 내려. 왼쪽은 청기, 오른쪽은 백기(노란 깃발 판은 가운데 황기)예요.'],
      ['가만히', '이미 그 상태인 명령, "~하지 마", 흉내쟁이 너구리의 명령에는 아무것도 누르지 않는 게 정답이에요.']];
    try{ const m = G && G.fl; if(m && G.adv){ (m.mj || []).forEach(k => t.push([FL_SHORT[k] || CONC.info[k].name, CONC.info[k].name + ' — ' + CONC.info[k].desc]));
      if(m.tw) t.push([FL_SHORT[m.tw] || CONC.twInfo[m.tw].name, CONC.twInfo[m.tw].name + ' — ' + CONC.twInfo[m.tw].desc]); } }catch(_){}
    return t;
  }
  const HOST_NAME = { fox:'여우 대장', rabbit:'토끼 반장', bear:'곰 선생님', panda:'판다 코치', tiger:'호랑이 단장', mimic:'흉내쟁이 너구리' };
  const HOST_COL = { fox:'#FF7A12', rabbit:'#FF9EC2', bear:'#B06A30', panda:'#2C2838', tiger:'#FF9420' };
  /* 진행자 말투(챕터마다 다르게). 보이기만 하는 글이라 Math.random으로 골라도 된다 */
  const TALK = {
    fox:{ ready:'자, 깃발 들어!', ok:['좋아!', '그렇지!', '딱 맞아!'], stay:['잘 참았어!', '속지 않았네!'], bad:['아깝다!', '다시 집중!'] },
    rabbit:{ ready:'깡총! 시작할게요', ok:['깡총, 잘했어요!', '폴짝 정답!', '빠르다!'], stay:['꾹 참았어요!', '안 속았네요!'], bad:['앗, 아까워요', '귀 쫑긋!'] },
    bear:{ ready:'자, 준비됐나요?', ok:['음, 훌륭해요', '좋아요!', '정확해요'], stay:['잘 참았어요', '침착하네요'], bad:['괜찮아요, 다음!', '천천히 봐요'] },
    panda:{ ready:'느긋하게, 정확하게!', ok:['대나무처럼 쭉!', '굿!', '깔끔해!'], stay:['흔들리지 않네!', '참기 성공!'], bad:['어이쿠!', '숨 한 번 쉬고!'] },
    tiger:{ ready:'어흥! 시작한다!', ok:['어흥, 멋져!', '번개 같아!', '정답이다!'], stay:['안 속았군!', '대단한 인내!'], bad:['어흥, 틀렸다!', '눈 크게 떠!'] }
  };
  /* 챕터 배경(운동회 마당·깃발 학교·바람 언덕·반대 나라·깃발 왕국): 하늘 위·아래, 땅, 땅 그늘 */
  const THEME = [
    { sky:['#9ED6FF', '#E3F4FF'], field:['#9BDC78', '#6CBF52'], pen:['#FF8A8A', '#FFD25A', '#7CCBFF', '#8EE07A', '#C59BFF'] },
    { sky:['#FFD9A8', '#FFF4E2'], field:['#A9DB86', '#79B95E'], pen:['#FF9F6B', '#FFE07A', '#86C8FF', '#FF8FB8', '#9BE38A'] },
    { sky:['#B4E2FF', '#F2FBFF'], field:['#B6E38C', '#82C060'], pen:['#7CCBFF', '#FFFFFF', '#9BE38A', '#FFE07A', '#7CCBFF'] },
    { sky:['#D9C8FF', '#F5F0FF'], field:['#B9E39A', '#86C06A'], pen:['#B48BFF', '#FF9CC4', '#FFE07A', '#86C8FF', '#B48BFF'] },
    { sky:['#FFE7A0', '#FFF8DE'], field:['#A3D97F', '#6FB556'], pen:['#FFC93C', '#FF8A8A', '#7CCBFF', '#FFC93C', '#9BE38A'] }
  ];

  /* ===== 개념(솔로) ===== */
  const CONC = {
    order:['neg', 'both', 'third', 'flip'],
    info:{
      neg:{ name:'하지 마', desc:'"청기 올리지 마"처럼 "~하지 마"가 붙으면 아무것도 누르지 말고 가만히 있어요. 빨간 ✕ 도장이 찍힌 명령이에요.' },
      both:{ name:'두 개 한꺼번에', desc:'"청기 올리고 백기 내려"처럼 두 깃발을 한 번에 시켜요. 두 깃발이 모두 맞아야 정답이에요. 누르는 순서는 상관없어요.' },
      third:{ name:'노란 깃발', desc:'진행자 머리에 노란 깃발(황기)이 생겨요. 가운데 노란 버튼으로 올리고 내려요. 버튼이 3×2로 바뀌어요.' },
      flip:{ name:'반대로!', desc:'진행자가 "반대로!" 카드를 들면 "그대로!"가 나올 때까지 올려는 내리고, 내려는 올려요. 그동안 화면 테두리가 보라색이에요.' }
    },
    twists:['flash', 'mimic', 'tight'],
    twInfo:{
      flash:{ name:'빠른 판', desc:'판단 시간이 평소보다 짧아요. 침착하게, 하지만 빠르게!' },
      mimic:{ name:'흉내쟁이', desc:'가끔 진행자 대신 흉내쟁이 너구리가 옆에서 명령해요. 진행자 명령만 따르고, 너구리 명령은 가만히!' },
      tight:{ name:'외줄 타기', desc:'기회가 2번뿐이에요. 두 번 틀리면 끝나요.' }
    }
  };
  const RULE_TIP = { neg:'"~하지 마"는 가만히', both:'두 깃발 한꺼번에', third:'노란 깃발 추가', flip:'반대로 카드 조심', flash:'판단 시간이 짧아요', mimic:'너구리 명령은 가만히', tight:'기회 2번' };

  /* ----- 솔로 난이도 표 -----
     명령 수 = 12 + 2×(챕터−1) + KADD[k] (최대 32, 보스 +6)
     판단 창 = 챕터 1은 2.8→2.2초, 챕터마다 ×0.94, k=5 ×0.9 · 보스 ×0.85 · 쉬어가기 ×1.15 · 소개 판 ×1.08, 번개 ×0.8 (바닥 1.15→0.9초)
     함정 비율 = 10% + 7.5%p×(챕터−1) (최대 45%), 보스 +10%p, 쉬운 판 −4%p */
  const KADD = [0, 0, 1, 2, 3, 5, 1, 4, 5, 2, 6];
  function stageCfg(n){
    const p = planOf('flag', n), c = p.c, k = p.k, mj = p.mj || [], tw = p.tw, has = x => mj.includes(x);
    const cnt = Math.min(32, 12 + 2 * (c - 1) + KADD[k]);
    const dec = Math.pow(.94, c - 1), km = p.boss ? .85 : k === 5 ? .9 : k === 9 ? 1.15 : (k === 1 || k === 6) ? 1.08 : 1, fl = tw === 'flash' ? .8 : 1;
    const w0 = Math.max(1.15, 2.8 * dec * km * fl), w1 = Math.max(.9, Math.min(w0, 2.2 * dec * km * fl));
    const trap = Math.min(.45, .1 + .075 * (c - 1)) + (p.boss ? .1 : 0) - (p.easy ? .04 : 0);
    return { cnt, w0:+w0.toFixed(2), w1:+w1.toFixed(2), trap:+trap.toFixed(3), limit:0,
      neg:has('neg') || c >= 3, negBoost:has('neg'), both:has('both'), bothP:has('both') ? .4 : 0, third:has('third'),
      flip:has('flip'), flipEp:has('flip') ? (p.boss || k === 5 ? 2 : 1) : 0, mimic:tw === 'mimic', lives:tw === 'tight' ? 2 : 3,
      boss:p.boss, hard:p.hard, mj:mj.slice(), tw, n, host:HOSTS[(c - 1) % HOSTS.length], theme:(c - 1) % THEME.length };
  }

  /* ===== 명령 만들기(rng만) =====
     깃발 상태(0 내림 · 1 올림)를 따라가며 명령을 만든다. 정답 상태(tgt)는 플레이어가 무엇을 누르든 이 순서대로 간다
     (틀리면 내 깃발을 정답 상태로 맞춰 준다) → 같은 씨앗이면 모든 사람이 같은 명령을 같은 순서로 받는다.
     함정: already(이미 그 상태) · neg(~하지 마) · mimic(흉내쟁이) · both0(두 개 모두 이미 그 상태). 함정 = 가만히가 정답. */
  function gen(cfg, rng){
    const F = cfg.third ? FLAGS3 : FLAGS2, N = cfg.cnt, seq = [], st = { b:0, w:0, y:0 };
    const pick = a => a[Math.floor(rng() * a.length)];
    const pair = () => { const a = pick(F); let b = pick(F); if(b === a) b = F[(F.indexOf(a) + 1 + Math.floor(rng() * (F.length - 1))) % F.length]; return F.indexOf(a) < F.indexOf(b) ? [a, b] : [b, a]; };
    /* 반대로 구간: [시작, 끝) 명령 번호 */
    const flips = [];
    if(cfg.flip){
      const ep = Math.max(1, cfg.flipEp || 1); let from = 3;
      for(let e = 0; e < ep; e++){
        const room = N - from - 2; if(room < 3) break;
        const span = Math.floor(room / (ep - e)), a = from + Math.floor(rng() * Math.max(1, span - 4)), len = 3 + Math.floor(rng() * 3);
        flips.push([a, Math.min(N, a + len)]); from = a + len + 2;
      }
    }
    /* 함정 자리: 개수는 명령 수 × 함정 비율(반올림, 최소 1)로 정하고, 뒤쪽일수록 뽑힐 무게가 크다(긴장 곡선).
       처음 두 명령은 함정 없음, 함정이 셋 연달아 나오지 않음(가만히만 있어도 버티는 판이 되지 않게) */
    const traps = new Set();
    if(cfg.trap > 0 && N > 3){
      const K = Math.min(Math.floor((N - 2) * .6), Math.max(1, Math.round(N * cfg.trap)));
      for(let tries = 0; traps.size < K && tries < 400; tries++){
        let tot = 0; const cand = [];
        for(let i = 2; i < N; i++){ if(traps.has(i) || (traps.has(i - 1) && traps.has(i - 2)) || (traps.has(i + 1) && traps.has(i + 2)) || (traps.has(i - 1) && traps.has(i + 1))) continue; const w = .55 + .9 * i / (N - 1); cand.push([i, w]); tot += w; }
        if(!cand.length) break;
        let r = rng() * tot, pickI = cand[cand.length - 1][0];
        for(const [i, w] of cand){ if(r < w){ pickI = i; break; } r -= w; }
        traps.add(pickI);
      }
    }
    let flip = false;
    for(let i = 0; i < N; i++){
      for(const [a, b] of flips){ if(i === b && flip){ seq.push({ card:'keep' }); flip = false; } if(i === a){ seq.push({ card:'flip' }); flip = true; } }
      const p = N > 1 ? i / (N - 1) : 0;
      const trap = traps.has(i);
      const tgt = { b:st.b, w:st.w, y:st.y };
      let kind, parts, from = 'host';
      const shown = v => flip ? !v : !!v;   /* 반대로 구간: 화면 글자는 실제로 할 일의 반대 */
      if(trap){
        const ks = [['already', 3]];
        if(cfg.neg) ks.push(['neg', cfg.negBoost ? 6 : 3]);
        if(cfg.mimic) ks.push(['mimic', 5]);
        if(cfg.both) ks.push(['both0', 1.5]);
        let r = rng() * ks.reduce((s, x) => s + x[1], 0); kind = ks[ks.length - 1][0];
        for(const [k, w] of ks){ if(r < w){ kind = k; break; } r -= w; }
        if(kind === 'already'){ const f = pick(F); parts = [{ f, up:shown(st[f]) }]; }
        else if(kind === 'neg'){ const f = pick(F); parts = [{ f, up:rng() < .5, neg:true }]; }
        else if(kind === 'mimic'){ const f = pick(F); parts = [{ f, up:shown(1 - st[f]) }]; from = 'mimic'; }
        else { const [a, b] = pair(); parts = [{ f:a, up:shown(st[a]) }, { f:b, up:shown(st[b]) }]; }
      } else {
        if(cfg.both && rng() < (cfg.bothP || 0)){
          kind = 'both';
          const [a, b] = pair(); let va = rng() < .5 ? 1 : 0, vb = rng() < .5 ? 1 : 0;
          if(va === st[a] && vb === st[b]){ if(rng() < .5) va = 1 - va; else vb = 1 - vb; }
          tgt[a] = va; tgt[b] = vb; parts = [{ f:a, up:shown(va) }, { f:b, up:shown(vb) }];
        } else {
          kind = 'single';
          const f = pick(F), v = 1 - st[f]; tgt[f] = v; parts = [{ f, up:shown(v) }];
        }
      }
      let win = cfg.w0 + (cfg.w1 - cfg.w0) * p;   /* 한 판 안에서 창이 선형으로 짧아진다 */
      if(parts.length === 2) win *= 1.3;
      if(cfg.third) win *= 1.08;
      if(flip) win *= 1.12;
      seq.push({ i, kind, from, parts, tgt, stay:kind !== 'single' && kind !== 'both', flip, win:Math.round(win * 100) / 100 });
      st.b = tgt.b; st.w = tgt.w; st.y = tgt.y;
    }
    return seq;
  }
  const verbOf = (p, last) => p.neg ? (p.up ? '올리지 마' : '내리지 마') : last ? (p.up ? '올려' : '내려') : (p.up ? '올리고' : '내리고');
  const sayOf = q => q.parts.map((p, j) => FN[p.f] + ' ' + verbOf(p, j === q.parts.length - 1)).join(', ');

  /* ===== 그림(3D 비닐 장난감 질감: 외곽선 없음, 색 하나 + 위 하이라이트·아래 그늘) ===== */
  const FX_ID = { pb:'flgPB', pm:'flgPM', ps:'flgPS' };
  const DEFS_SVG = `<svg class="fl-defs" width="0" height="0" aria-hidden="true" focusable="false"><defs>${TOY.PUFF(FX_ID.pb, 5, 4, .8, 1.8)}${TOY.PUFF(FX_ID.pm, 2.6, 3, .75, 1)}${TOY.PUFF(FX_ID.ps, 1.3, 2.6, .9)}
    <radialGradient id="flgGL" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs></svg>`;
  /* 팔 + 손 + 깃대 + 깃발 천(오른팔 기준, 왼팔은 좌우 뒤집기). 어깨 = (30, 96) */
  function armSvg(f, col){
    const c = FC[f], wave = f === 'w' ? '#E4E9F5' : f === 'y' ? '#FFE48A' : '#6FB0FF';
    return `<svg class="fl-armi" viewBox="0 0 60 110" aria-hidden="true">
      <g filter="url(#${FX_ID.ps})"><rect x="27.4" y="6" width="5.2" height="80" rx="2.6" fill="#E6BE84"/><circle cx="30" cy="6" r="5" fill="#FFC93C"/></g>
      <g class="fl-cloth u"><g filter="url(#${FX_ID.pm})"><path d="M32 8.5C40 5 48 12 58.5 8v29.5c-10.5 4-18.5-3-26.5.5z" fill="${c}"/></g>
        <path d="M36 14c5-1.6 9 1.4 14 0" stroke="${wave}" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".8"/>
        <ellipse cx="41" cy="15" rx="6" ry="3" fill="url(#flgGL)"/></g>
      <g class="fl-cloth d"><g filter="url(#${FX_ID.pm})"><path d="M28 8.5C20 5 12 12 1.5 8v29.5c10.5 4 18.5-3 26.5.5z" fill="${c}"/></g>
        <path d="M24 31c-5 1.6-9-1.4-14 0" stroke="${wave}" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".8"/>
        <ellipse cx="19" cy="30" rx="6" ry="3" fill="url(#flgGL)"/></g>
      <g filter="url(#${FX_ID.pm})"><path d="M30 97V66" stroke="${col}" stroke-width="13" stroke-linecap="round"/><circle cx="30" cy="61" r="9.2" fill="${col}"/></g>
      <ellipse cx="27" cy="57.5" rx="3.6" ry="2.4" fill="url(#flgGL)"/></svg>`;
  }
  /* 머리 위 노란 깃발(황기) */
  const topSvg = () => `<svg class="fl-topi" viewBox="0 0 40 70" aria-hidden="true"><g filter="url(#${FX_ID.ps})"><rect x="17.6" y="5" width="4.8" height="62" rx="2.4" fill="#E6BE84"/><circle cx="20" cy="5" r="4.4" fill="#FFC93C"/></g>
    <g filter="url(#${FX_ID.pm})"><path d="M22 7.5c6-2.6 10.5 2.5 16-.5v20c-5.5 3-10-2-16 .5z" fill="${FC.y}"/></g><ellipse cx="29" cy="13" rx="4.5" ry="2.4" fill="url(#flgGL)"/></svg>`;
  /* 흉내쟁이 너구리(오리지널, 공용 캐릭터와 같은 질감) */
  let RAC = null;
  const raccoonSrc = () => RAC || (RAC = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>${TOY.DEFS}</defs>${TOY.SH}
    <g filter="url(#pb)"><circle cx="25" cy="31" r="11" fill="#7D6E64"/><circle cx="75" cy="31" r="11" fill="#7D6E64"/></g>
    <g filter="url(#pm)"><circle cx="25" cy="31" r="5.5" fill="#3E3540"/><circle cx="75" cy="31" r="5.5" fill="#3E3540"/></g>
    <g filter="url(#pb)"><ellipse cx="50" cy="58" rx="37" ry="31" fill="#A39385"/></g>${TOY.GL(36, 40, 14, 7)}
    <g filter="url(#pm)"><path d="M19 52c6-9 20-9 27-1-2 9-8 12-15 12s-12-4-12-11zM81 52c-6-9-20-9-27-1 2 9 8 12 15 12s12-4 12-11z" fill="#3E3540"/><ellipse cx="50" cy="70" rx="15" ry="10.5" fill="#F4EEE6"/><path d="M50 30v9M43 32l2 6M57 32l-2 6" stroke="#6A5D55" stroke-width="3" stroke-linecap="round"/></g>

function embEmit(type, data){

  try{ if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.haruPuzzle) window.webkit.messageHandlers.haruPuzzle.postMessage(msg); }catch(_){}   /* iOS WKWebView */
  try{ if(window.HaruPuzzle && typeof window.HaruPuzzle.postMessage === 'function') window.HaruPuzzle.postMessage(json); }catch(_){}   /* Android addJavascriptInterface · Flutter JavaScriptChannel */
  try{ window.dispatchEvent(new CustomEvent('haru-puzzle', { detail:msg })); }catch(_){}
}

      { pid:'op', nick:(D.opp && D.opp.nick) || T('core.opp'), ai, col:DUEL_SEAT[1].col, shape:DUEL_SEAT[1].shape, rank:r === 'w' ? 2 : 1, txt:tx(b) } ].sort((x, y) => x.rank - y.rank) };
}
function embDuelResult(r, a, b, res){
  const D = G.duel, id = G.id, R = res && res.rows ? res : embDuelFallback(r, a, b), r1 = R.rank === 1 && !R.tie;
  const RC = duelRec(), x = RC[id] || { w:0, d:0, l:0 }; x[r]++; RC[id] = x; store.set('hp:duelRec', RC);
  embEmit('finish', { mode:'duel', result:r, win:r === 'w', vs:D.mode === 'ai' || (D.fleet && G.mode !== 'pvp') ? 'ai' : 'live', me:a ? { score:a.sc, progress:a.pg } : null, opp:b ? { score:b.sc, progress:b.pg } : null, record:x,
    rank:R.rank, players:R.rows.map(y => ({ nick:y.me ? null : y.nick, me:!!y.me, ai:!!y.ai, rank:y.rank, ok:!!y.ok, v:y.v == null ? null : y.v, t:y.t == null ? null : y.t, mis:y.mis || 0, score:y.sc || 0, text:y.txt || '', left:!!y.left })),
    kind:R.kind, round:R.round ? { r:R.round.r, series:R.round.series || {} } : null, room:EMB.room ? { code:EMB.room, r:EMB.roomRd } : (R.room && R.room.code ? { code:R.room.code } : null) });
  const tot = x.w + x.d + x.l, t = R.n <= 2 && R.tie ? T('core.d.draw') : `${R.tie ? T('core.d.tie') : ''}${T('core.d.rank', { n:R.rank })}`;
  const me = R.rows.find(y => y.me) || {};
  const rows = `<ol class="dz-rows">${R.rows.map(y => `<li class="${y.me ? 'me' : ''}${y.rank === 1 ? ' win' : ''}${y.left ? ' left' : ''}"><span class="dz-medal${y.rank <= 3 ? ' m' + y.rank : ''}">${y.rank}</span>${duelShapeSvg(y.shape, y.col, 16)}${y.me ? avatar({ me:true }) : oppAv(y.nick)}
    <span class="dz-nm"><b>${y.me ? T('core.me') : esc(y.nick)}${y.ai ? ' <em class="aitag">' + T('core.cpu') + '</em>' : ''}</b><small>${esc(y.txt || '')}</small></span></li>`).join('')}</ol>`;
  let html = `${r1 ? '<div class="burst" aria-hidden="true"></div>' : ''}<div class="dzres" id="dzRes">
    <h3 class="dz-h${r1 ? ' r1' : ''}" data-r="${R.tie && R.rank === 1 ? 'd' : r1 ? 'w' : 'l'}">${r1 ? EMB_CROWN : ''}<span class="num">${t}</span></h3>
    ${me.txt ? `<p class="dz-mine">${esc(me.txt)}</p>` : ''}${R.why ? `<p class="dz-why">${R.why}</p>` : ''}${rows}${typeof duelResX === 'function' ? duelResX() : ''}
    <p class="dz-rec">${T('core.d.rec', { w:x.w, n:tot })}</p><p class="dz-again" id="dzAgain" aria-live="polite"></p>`;
  const RPX = typeof duelReplayOf === 'function' ? duelReplayOf(res) : null;   /* 이 판 다시 풀기 · 친구에게 보내기(R11) */
  const rpRow = RPX ? `<div class="rb-links dz-rp"><button id="dzRp">${ic('play')}${T('core.d.replay')}</button><i aria-hidden="true">·</i><button id="dzSend">${ic('share')}${T('core.map.send')}</button></div>` : '';
  const quickAgain = R.room && R.room.canAgain && !R.ai;
  const pri = EMB.room ? [T('core.d.again'), () => embRoomDuel(EMB.roomRd + 1), T('core.d.againRoom')]
    : quickAgain ? [T('core.d.again'), () => embDuelAgain(), T('core.d.againSame')] : [T('core.d.newOpp'), () => { embMenu(); embStart('duel'); }, T('core.d.newOppSub')];
  const sc = [T('core.res.home'), embMenu], ex = quickAgain ? [{ id:'mNew', label:T('core.d.newOpp'), fn:() => { embMenu(); duelStart(id); } }] : [];
  const RB = embRes(pri, sc, ex); if(quickAgain) RB.pri.keep = true;
  setTimeout(() => {
    openModal(html + duelContinueHtml() + rpRow + resBtns(RB) + '</div>'); $('#modal').classList.add('duelm', 'dzm'); resBind(RB); duelContinueBind();
    if(RPX){ $('#dzRp').onclick = () => duelReplayStart(RPX); $('#dzSend').onclick = () => embSendDuel(RPX); }
    if(r1){ fxConfetti(); sfx('fanfare'); } else if(R.tie) sfx('result'); else sfx('lose');
    try{ toyMood($('#modal .dz-rows li.me'), r1 ? 'joy' : R.tie ? 'wow' : 'sad'); }catch(_){}
    if(quickAgain) embAgainLoop(id);
  }, $('#veil').classList.contains('on') ? 0 : (r1 ? 500 : 250));
}
/* 빠른 대전 한 판 더(결과 뒤 30초): 남은 초 · 누른 사람 수 */
function embDuelAgain(){ const p = $('#mPri'); if(!duelAgain()){ toast(T('core.d.againLate')); return; } sfx('flLock'); if(p){ p.disabled = true; const l = p.querySelector('.rb-l'); if(l) l.textContent = T('core.d.waiting'); } }
function embAgainLoop(id){
  clearInterval(embAgainLoop.t);
  const g = G, tick = () => {
    const el = $('#dzAgain'), pri = $('#mPri'); if(!el || !pri || G !== g){ clearInterval(embAgainLoop.t); return; }
    const s = duelAgainState();
    if(!s.on){ clearInterval(embAgainLoop.t); pri.disabled = false; pri.innerHTML = '<span class="rb-l">' + T('core.d.newOpp') + '</span><small>' + T('core.d.againGone') + '</small>'; pri.onclick = () => { closeModal(); embMenu(); duelStart(id); }; el.innerHTML = ''; return; }
    let tm = pri.querySelector('.dz-sec'); if(!tm){ tm = document.createElement('i'); tm.className = 'dz-sec num'; pri.appendChild(tm); } tm.textContent = s.left;
    el.innerHTML = s.want ? `<span>${s.n >= 2 ? T('core.d.gathered', { n:s.n }) : T('core.d.waitOthers')}</span>` : s.n ? `<span>${T('core.d.againN', { n:s.n })}</span>` : '';
  };
  tick(); embAgainLoop.t = setInterval(tick, 400);
}

/* ---- 대전 판 다시 풀기 · 보내기(R11, 더함) ----
   보내기: 이 모듈 주소 + ?ds=<씨앗>&g&lv&pn&pc&rk&rt&t&sc(core/engine.js duelReplayQ) → 기기 공유 시트, 안 되면 복사. 붙인 곳에는 'send' 이벤트(url 포함).
   받기: 주소에 ds=가 있으면 첫 화면 위에 "친구가 보낸 대전 판" 창 → 풀어 보기(기록 안 됨). 시작·끝에 'replay' 이벤트(phase:'start'|'finish') */
const embT = t => t > 0 ? clock2(t).replace(/^0(?=\d:)/, '') : '–';
function embDsUrl(x){
  const u = new URL(location.origin + location.pathname), now = new URLSearchParams(location.search), q = duelReplayQ(x);
  for(const k of ['ns', 'sound', 'big']){ const v = now.get(k); if(v != null) u.searchParams.set(k, v); }   /* 기록 나누기·소리·큰 글씨는 그대로 */
  for(const k in q) u.searchParams.set(k, q[k]);
  return u.toString();
}
async function embSendDuel(x){
  const url = embDsUrl(x), name = NG[EMB.id].name, rec = x.dk === 'score' && x.sc ? T('core.pts', { n:fmt(x.sc) }) : x.t != null ? embT(x.t) : '';
  const text = T('core.send.text', { name, rec:rec ? T('core.send.rec', { r:rec }) : '', rk:x.rk ? T('core.send.rk', { n:x.rk }) : '' });
  embEmit('send', { kind:'duel', url, text, seed:x.seed, level:x.lv, rank:x.rk || null, time:x.t == null ? null : x.t, score:x.sc || 0 });
  try{ if(navigator.share){ await navigator.share({ title:name, text, url }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
  let ok = false; try{ await navigator.clipboard.writeText(text + '\n' + url); ok = true; }catch(_){}
  toast(ok ? T('core.send.copied') : T('core.send.made'));
}
function embDsGift(x){
  const nm = esc(x.from || T('core.friend')), m = NG[EMB.id], rec = [x.rk ? T('core.d.rank', { n:x.rk }) : '', x.rt || (x.t != null ? embT(x.t) : x.sc ? T('core.pts', { n:fmt(x.sc) }) : '')].filter(Boolean).join(' · ');
  openModal(`<h3>${T('core.sub.dsFrom', { name:nm })}</h3><span class="g-art em-dsart">${ART[EMB.id]()}</span>
    <p class="note">${T('core.ds.solo', { name:m.name })}${rec ? `<br>${T('core.ds.rec', { name:nm, r:esc(rec) })}` : ''}</p><p class="note">${T('core.ds.noRec')}</p>
    <div class="mbtns two"><button class="b2" id="mClose">${T('core.later')}</button><button class="b1" id="dsGo">${T('core.ds.go')}</button></div>`);
  $('#mClose').onclick = closeModal;
  $('#dsGo').onclick = () => duelReplayStart(x);
}
function embReplayFinish(win){
  const R = G.replay, id = G.id, m = NG[id];
  if(!R || R.kind !== 'duel'){ embPlayFinish(win); return; }
  const t = Math.round(elapsed()), isSc = R.dk === 'score', from = R.from || '';
  let score = 0; if(win || isSc){ try{ score = calcScore().score; }catch(_){ score = 0; } }
  const meTxt = isSc ? T('core.pts', { n:fmt(score) }) : win ? embT(t) : T('core.ds.notDone'), opTxt = isSc ? (R.sc ? T('core.pts', { n:fmt(R.sc) }) : (R.rt || '–')) : (R.t != null ? embT(R.t) : (R.rt || '–'));
  const meWin = isSc ? score > (R.sc || 0) : win && (R.t == null || t < R.t), opWin = isSc ? (R.sc || 0) > score : R.t != null && (!win || t > R.t);
  embEmit('replay', { phase:'finish', win, time:t, score, seed:R.seed, from:from || null });
  /* 나란히: 대전 결과 창과 같은 순위표 모양(나 · 보낸 사람 또는 대전 때 나), 앞선 쪽이 위 */
  const even = !meWin && !opWin, two = [ { me:true, nm:T('core.me'), txt:meTxt, w:meWin }, { me:false, nm:from || T('core.ds.meThen'), txt:opTxt + (R.rk ? ' · ' + T('core.ds.duelRank', { n:R.rk }) : ''), w:opWin } ];
  if(opWin) two.reverse();
  const vs = `<ol class="dz-rows em-rpvs">${two.map(y => `<li class="${y.me ? 'me' : ''}${y.w ? ' win' : ''}"><span class="dz-medal ${y.w || even ? 'm1' : 'm2'}">${y.w || even ? 1 : 2}</span>${y.me || !from ? avatar({ me:true }) : oppAv(from)}<span class="dz-nm"><b>${esc(y.nm)}</b><small>${esc(y.txt)}</small></span></li>`).join('')}</ol>`;
  const html = (win ? `<div class="burst" aria-hidden="true"></div><h3 class="ok">${resFace('joy')}${m.winTitle || T('core.ds.done')}</h3>` : `<h3 class="bad">${resFace('sad')}${T('core.res.fail')}</h3><p class="note">${lossProgress()}</p>`)
    + vs + `<p class="note">${T('core.ds.noRec2')}</p>`;
  const mine = Object.assign({}, R, { rk:0, rt:meTxt, t:win ? t : null, sc:isSc ? score : 0, from:'' });
  const RB = { pri:{ id:'mPri', label:T('core.map.replay'), sub:T('core.ds.sameSub'), fn:() => duelReplayStart(R) },
    links:[ win || (isSc && score > 0) ? { id:'dzSend', label:`${ic('share')}${T('core.ds.sendMine')}`, keep:true, fn:() => embSendDuel(mine) } : null, { id:'mGh', label:T('core.res.home'), fn:embMenu } ] };
  setTimeout(() => { openModal(html + resBtns(RB)); resBind(RB); if(win){ if(!m.noConfetti) fxConfetti(); sfx('result'); } else sfx('lose'); }, win ? 500 : 250);
}

/* ---- 엔진에 알려 주기 ---- */
Object.assign(HOST, {
  heartCost:false,
  beforeStart(id, lv, o){
    if(o.replay){ EMB.cur = 'replay'; embEmit('replay', { phase:'start', seed:o.replay.seed || null, level:lv, from:o.replay.from || null }); return { attempt:0 }; }   /* 더함(R11): 대전 판 다시 풀기 — 기록 안 됨 */
    if(o.adv) EMB.cur = 'solo'; else if(o.duel) EMB.cur = 'duel'; else if(!o.seed && EMB.cur !== 'practice') EMB.cur = 'daily';
    if(EMB.cur === 'practice' && !o.adv && !o.duel && !o.seed) o.seed = 'prac:' + id + ':' + Date.now() + ':' + Math.random();   /* 연습은 매번 새 문제 */
    let attempt = 0;
    if(EMB.cur === 'daily' && !o.adv && !o.duel){ const r = embDay(); r.tries++; embDaySave(r); attempt = r.tries; }
    embEmit('start', { mode:EMB.cur, level:o.adv ? null : lv, stage:o.adv || null, attempt });
    return { attempt };
  },
  showPlay(){ $('#menu').hidden = true; $('#play').style.display = 'block'; },
  subtitle:(L, attempt, ex) => EMB.cur === 'daily' ? (attempt === 1 ? `${L.name}${ex}` : `${T('core.map.replay')}${ex}`) : `${T('core.sub.pracShort')}${ex}`,
  subtitleFull:(L, attempt, ex) => EMB.cur === 'daily' ? T('core.sub.daily', { lv:L.name + ex, k:attempt === 1 ? T('core.sub.firstRec') : T('core.map.replay') }) : T('core.sub.prac', { lv:L.name + ex }),
  quitInfo:() => ({ note:EMB.cur === 'daily' ? T('core.quit.daily') : T('core.quit.note'), label:T('core.quit.go') }),
  finish(win){ if(G.adv) embSoloFinish(win); else embPlayFinish(win); },
  exit(){ embEmit('quit', { mode:EMB.cur }); embMenu(); },
  canDuel:() => true,
  duelResult:(r, a, b, res) => embDuelResult(r, a, b, res),
  replayFinish:win => embReplayFinish(win)
});
Object.defineProperty(HOST, 'flatMult', { get:() => EMB.cur === 'daily' });   /* 오늘의 문제는 배율 없이(사이트와 같은 점수) */

/* ---- 바깥에서 조종: postMessage({ target:'haru-puzzle', cmd:'start', mode:'daily' }) 또는 앱에서 HaruPuzzleEmbed.start('daily') ---- */
window.HaruPuzzleEmbed = {
  start:(mode, opt) => embStart(mode, opt),
  menu:() => { if(G && !G.over){ G.over = true; } embMenu(); },
  sound:on => { sndSetOn(!!on); },
  big:on => { bigSet(!!on); if(!G || G.over) embMenu(); },   /* 큰 글씨 켜기/끄기(더한 명령) */
  state:() => { const s = embState(); embEmit('state', { state:s }); return s; },
  restore:s => embRestore(s)
};
window.addEventListener('message', e => {
  const d = e.data; if(!d || d.target !== 'haru-puzzle') return;
  const A = window.HaruPuzzleEmbed;
  if(d.cmd === 'start') A.start(d.mode, d);
  else if(d.cmd === 'menu') A.menu();
  else if(d.cmd === 'sound') A.sound(d.on);
  else if(d.cmd === 'big') A.big(d.on);
  else if(d.cmd === 'state') A.state();
  else if(d.cmd === 'restore') A.restore(d.state);
});
/* 높이 알리기(부모가 iframe 높이를 맞출 때) */
(() => { let last = 0; const send = () => { const h = Math.ceil(document.documentElement.scrollHeight); if(Math.abs(h - last) > 2){ last = h; embEmit('resize', { height:h }); } };
  try{ new ResizeObserver(send).observe(document.body); }catch(_){ setInterval(send, 1000); } })();

/* ---- 시작 ---- */
registerGames([EMB.id]);
/* 게임 정의의 modes가 있으면 그 모드만(예: 오늘의 문제·연습이 없는 게임) */
if(Array.isArray(NG[EMB.id].modes)){ const ok = EMB.modes.filter(x => NG[EMB.id].modes.includes(x)); EMB.modes = ok.length ? ok : NG[EMB.id].modes.filter(x => ['daily', 'solo', 'practice', 'duel'].includes(x)); }
playChromeInit();
/* 주소 옵션 lang=en(더함, DEV-01): 창 제목·첫 화면 이름표도 그 언어로. 한국어는 페이지에 적힌 그대로(core/i18n.js) */
if(i18nLang() !== 'ko'){ try{ document.title = NG[EMB.id].name + ' · ' + T('core.brand'); $('#menu').setAttribute('aria-label', NG[EMB.id].name); }catch(_){} }
/* 뒤로가기 처리는 붙인 사이트의 방문 기록을 건드리므로 주소 옵션 ?back=1일 때만(앱 WebView 등) */
if(new URLSearchParams(location.search).get('back') === '1'){ HOST.historyGuard = true; navInit(); }
if(embHas('duel')) netStart(); else ROOM_STATE = 'none';   /* 대전을 켠 곳에서만 대전 서버에 연결 */
if(new URLSearchParams(location.search).get('sound') === '0') sndSetOn(false);
if(EMB.pace) store.set('hp:duelPace', EMB.pace);   /* 주소 옵션 pace=slow|normal: 대전 느긋하게(시간 2배) */
{ const bg = new URLSearchParams(location.search).get('big'); if(bg === '1' || bg === '0') bigSet(bg === '1'); }   /* 주소 옵션 big=1|0: 큰 글씨 */
embEmit('ready', { name:NG[EMB.id].name, modes:EMB.modes });
embMenu();
{ const ds = duelReplayParse(new URLSearchParams(location.search));   /* 주소 옵션 ds=(더함, R11): 친구가 보낸 대전 판 → 첫 화면 위에 창 */
  if(ds && ds.g === EMB.id) embDsGift(ds); else if(EMB.start !== 'menu' && embHas(EMB.start)) embStart(EMB.start); }
</script>
