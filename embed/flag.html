<!doctype html>
<html lang="ko" data-game="flag" data-ver="1.1.2+1.1.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>청기 백기 · 하루퍼즐</title>
<meta name="theme-color" content="#1C1250">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<script>/* 기록을 사이트·사용자별로 나눔: ?ns=사이트이름&user=사용자번호 · 화면 언어: ?lang=en(더함, 없으면 한국어, core/i18n.js) */(function(){var q=new URLSearchParams(location.search);window.HP_NS='hpe:'+(q.get('ns')||'')+':'+(q.get('user')||'')+':';window.HP_LANG=q.get('lang')||'';})();</script>
<style>/* 공용: 색·글꼴·배경·버튼·홈 화면 위쪽·팝업·알림 */
/* ===== 하루퍼즐 리그 · 게임 로비 디자인 시스템 v2 =====
   세계관: 밤하늘 보랏빛 퍼즐 광장. 크림색 양피지 패널 + 굵은 보라 외곽선 + 사탕 버튼.
   한 가지 세계로 고정(라이트/다크 구분 없음). */
:root{
  color-scheme:light;
  --night:#1C1250; --night2:#2A1B6E; --outline:#2A1650; --outline2:#1A0F45;
  --paper:#FFF8EA; --paper2:#FBEBCB; --paper-line:#EADBC0;
  --ink:#3A2261; --sub:#6A5884; --line:#E6D6B6;
  --gold:#FFC93C; --gold2:#FF9A1F; --pink:#F0368A; --sky:#2E8FE8;
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F3EBDD;
  --primary:#6C3CE0; --on-primary:#FFFFFF; --accent:#FF3D7F; --success:#27B86A; --danger:#E5484D;
  --g-fox:#FF7A1F; --g-sudoku:#3B6FD8; --g-ball:#9B44E8; --g-tower:#2E9E5B; --g-fleet:#1A8CC4;
  --card:var(--surface); --grape:var(--primary); --lemon:var(--gold); --mint:var(--success); --edge:#26215C; --cellink:#26215C;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --disp:"Jua","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --heavy:"Black Han Sans","Jua","Apple SD Gothic Neo",system-ui,sans-serif;
  box-sizing:border-box;
}
html{height:100%; background:var(--night)}
*{box-sizing:border-box}
body{word-break:keep-all; overflow-wrap:anywhere; margin:0; min-height:100%; background:var(--night); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.47; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0}
button:focus-visible, summary:focus-visible{outline:3px solid #FFE27A; outline-offset:3px}
.wrap{position:relative; z-index:1; max-width:460px; margin:0 auto; padding:10px 16px 44px}
.num{font-variant-numeric:tabular-nums}
.ico{display:inline-block; width:20px; height:20px; vertical-align:-4px; flex:none}
.ico svg{width:100%; height:100%; display:block}
.gdefs{position:absolute; width:0; height:0; overflow:hidden}

/* ---------- 배경 장면: 밤하늘 광장 + 천천히 도는 빛줄기 ---------- */
.scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(90% 45% at 50% 0%, #8D6BFF 0%, rgba(141,107,255,0) 70%),
    radial-gradient(70% 40% at 100% 85%, rgba(255,79,154,.35) 0%, rgba(255,79,154,0) 70%),
    radial-gradient(60% 40% at 0% 60%, rgba(46,143,232,.28) 0%, rgba(46,143,232,0) 70%),
    linear-gradient(180deg,#3A23A0 0%, #24166E 38%, #170D47 100%)}
.scene::before{content:""; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.4px), radial-gradient(rgba(255,255,255,.25) 1px, transparent 1.4px); background-size:120px 140px, 57px 61px; background-position:10px 20px, 30px 5px; opacity:.55}
.scene::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(45deg, rgba(255,255,255,.028) 0 14px, transparent 14px 28px)}
.scene .rays{position:absolute; left:50%; top:-340px; width:900px; height:900px; margin-left:-450px; border-radius:50%;
  background:repeating-conic-gradient(from 0deg, rgba(255,236,170,.13) 0deg 7deg, rgba(255,236,170,0) 7deg 18deg);
  -webkit-mask:radial-gradient(circle, #000 18%, transparent 62%); mask:radial-gradient(circle, #000 18%, transparent 62%);
  animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bgscene{position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; display:block}
.bgscene[hidden]{display:none}
body[data-mode] .scene{display:none}
body[data-mode="sudoku"]{background:var(--night)}
body[data-mode="sudoku"] .scene{display:block}
body[data-mode="ball"]{background:linear-gradient(180deg,#2A1B6E 0%,#1C1250 55%,#150C3E 100%) fixed}

/* ---------- 공통: 양피지 패널, 사탕 버튼 ---------- */
.panel{background:linear-gradient(180deg,var(--paper) 0%, var(--paper2) 100%); border:3px solid var(--outline); border-radius:22px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.75), inset 0 -4px 0 rgba(160,120,60,.12), 0 6px 0 var(--outline2), 0 14px 24px rgba(8,2,30,.35)}
.btn, .b1, .b2, .cta, .g-go{position:relative; overflow:hidden; isolation:isolate}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:52px; padding:0 18px; border-radius:16px; font-family:var(--disp); font-size:18px; transition:transform .08s, box-shadow .08s; font-weight:var(--disp-w,400)}
.btn.primary, .b1, .btn.secondary, .b2, .btn.gold{
  background:linear-gradient(180deg,var(--c1) 0%, var(--c2) 100%); border:2.5px solid var(--c3); color:#fff; text-shadow:0 2px 0 var(--c3);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.14), 0 4px 0 var(--c3), 0 7px 12px rgba(20,5,40,.22)}
.btn.primary, .b1{--c1:#FF8AC0; --c2:#F0368A; --c3:#8E0F4F}
.btn.secondary, .b2{--c1:#86D6FF; --c2:#2E8FE8; --c3:#124F92}
.btn.gold{--c1:#FFE98E; --c2:#FFB020; --c3:#9A5A00; color:#5A3300; text-shadow:0 1px 0 rgba(255,255,255,.55)}
.btn.primary::before, .b1::before, .btn.secondary::before, .b2::before, .btn.gold::before{content:""; position:absolute; z-index:-1; left:6px; right:6px; top:3px; height:42%; border-radius:12px 12px 20px 20px; background:linear-gradient(rgba(255,255,255,.6), rgba(255,255,255,.08))}
.btn:active, .b1:active, .b2:active{transform:translateY(3px); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 1px 0 var(--c3)}
.btn:disabled{filter:grayscale(.7); opacity:.6}
.btn.ghost{background:none; color:var(--sub); height:44px; font-family:var(--disp); font-size:16px; box-shadow:none; text-shadow:none; border:0; font-weight:var(--disp-w,400)}
.btn.small{height:40px; padding:0 14px; font-size:15px; border-radius:12px}
.btn.block{width:100%}
.cost{display:inline-flex; align-items:center; gap:3px; background:rgba(40,0,30,.22); border-radius:999px; padding:1px 9px 1px 7px; font-family:var(--heavy); font-size:14px; letter-spacing:.5px; text-shadow:none; color:#fff; box-shadow:inset 0 1px 0 rgba(0,0,0,.15); font-weight:var(--heavy-w,400)}
.cost .ico{width:14px; height:14px; vertical-align:-2px; color:#fff}
.btn.gold .cost{color:#5A3300; background:rgba(255,255,255,.4)}
.btn.ghost .cost{background:var(--paper2); color:var(--ink)}

/* ---------- 상단 HUD ---------- */
.hud{display:flex; align-items:center; justify-content:space-between; gap:10px; height:52px; margin-bottom:2px}
.res{display:inline-flex; align-items:center; height:38px; padding:0 4px 0 0; margin-left:14px; border-radius:999px; background:linear-gradient(#170C40,#241563); border:2.5px solid #0E0730; box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 3px 0 rgba(0,0,0,.35); color:#fff}
.res-ico{width:46px; height:46px; margin:0 2px 0 -18px; filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.res-ico svg{width:100%; height:100%; display:block}
.res-val{display:flex; align-items:baseline; gap:6px; padding-right:6px; line-height:1}
.res-val b{font-family:var(--heavy); font-size:19px; letter-spacing:.5px; font-weight:var(--heavy-w,400)}
.res-val small{font-family:var(--heavy); font-size:13px; color:#FFD86B; letter-spacing:.5px; font-weight:var(--heavy-w,400)}
.res-plus{width:26px; height:26px; border-radius:9px; display:grid; place-items:center; font-family:var(--heavy); font-size:20px; line-height:1; color:#0B3D1A; background:linear-gradient(#8BF06A,#2BB24C); border:2px solid #0F5A23; box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 2px 0 #0F5A23; text-shadow:0 1px 0 rgba(255,255,255,.45); font-weight:var(--heavy-w,400)}
.mail{position:relative; width:48px; height:44px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(#FFFFFF,#E7DDFF); border:2.5px solid var(--outline2); box-shadow:inset 0 -3px 0 rgba(90,60,160,.18), 0 4px 0 #0E0730}
.mail svg{width:30px; height:30px}
.mail:active{transform:translateY(3px); box-shadow:0 1px 0 #0E0730}
.badge{position:absolute; top:-8px; right:-8px; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:linear-gradient(#FF6B6B,#E0243A); border:2px solid #fff; color:#fff; font-family:var(--heavy); font-size:13px; line-height:18px; text-align:center; box-shadow:0 2px 0 rgba(0,0,0,.3); font-weight:var(--heavy-w,400)}

/* ---------- 로고 ---------- */
.logo{position:relative; z-index:0; isolation:isolate; display:flex; flex-direction:column; align-items:center; margin:4px 0 40px; user-select:none}
.logo-main{position:relative; font-family:var(--heavy); font-size:50px; line-height:1.05; letter-spacing:1px; color:transparent;
  background:linear-gradient(180deg,#FFFBD6 0%, #FFE35A 42%, #FFB21E 70%, #FF8A12 100%); -webkit-background-clip:text; background-clip:text; font-weight:var(--heavy-w,400)}
.logo-main::before, .logo-main::after{content:attr(data-t); position:absolute; left:0; top:0; z-index:-1; color:var(--outline2); background:none}
.logo-main::before{-webkit-text-stroke:14px var(--outline2); text-shadow:0 7px 0 #0B0526, 0 12px 18px rgba(0,0,0,.35)}
.logo-main::after{-webkit-text-stroke:6px #FFFFFF; color:#FFFFFF}
.logo-sub{position:relative; margin-top:-6px; padding:3px 22px 4px; font-family:var(--heavy); font-size:17px; letter-spacing:6px; text-indent:6px; color:#fff; text-shadow:0 2px 0 #7A0B45;
  background:linear-gradient(#FF7DB8,#E62C7F); border:2.5px solid var(--outline2); border-radius:8px; box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 var(--outline2); transform:rotate(-2deg); font-weight:var(--heavy-w,400)}
.logo-sub::before, .logo-sub::after{content:""; position:absolute; top:6px; width:16px; height:22px; z-index:-1; background:#B01A60; border:2.5px solid var(--outline2)}
.logo-sub::before{left:-11px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.logo-sub::after{right:-11px; clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.spark{position:absolute; width:18px; height:18px; animation:twinkle 2.4s ease-in-out infinite}
.spark svg{width:100%; height:100%; display:block}
@keyframes twinkle{50%{transform:scale(.55) rotate(45deg); opacity:.5}}

/* ---------- 리그 카드(히어로) ---------- */
.hero{position:relative; padding:24px 16px 14px; border-radius:24px; color:#fff;
  background:radial-gradient(120% 90% at 20% 0%, rgba(160,130,255,.45), rgba(160,130,255,0) 60%), linear-gradient(180deg,#4A33A8 0%, #2C1C7C 100%);
  border:3px solid #FFD35C; box-shadow:0 0 0 3px var(--outline2), inset 0 2px 0 rgba(255,255,255,.3), inset 0 0 0 2px rgba(255,211,92,.25), 0 9px 0 #0E0730, 0 18px 30px rgba(0,0,0,.4)}
.ribbon{position:absolute; left:50%; top:-19px; transform:translateX(-50%); z-index:2; white-space:nowrap}
.ribbon span{position:relative; display:block; padding:5px 26px 6px; font-family:var(--disp); font-size:18px; color:#fff; text-shadow:0 2px 0 #7A0B45;
  background:linear-gradient(#FF7DB8,#E62C7F); border:2.5px solid var(--outline2); border-radius:10px; box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 var(--outline2); font-weight:var(--disp-w,400)}
.hero-in{display:grid; grid-template-columns:88px 1fr; gap:14px; align-items:center}
.medal-big{width:88px; height:96px}
.medal-big svg, .pos svg{display:block; width:100%; height:100%; overflow:visible}
.hero-score small{display:block; font-family:var(--disp); font-size:14px; color:#CFC5FF; font-weight:var(--disp-w,400)}
.hero-score .n{display:flex; align-items:baseline; gap:4px; line-height:1}
.hero-score .n span{font-family:var(--heavy); font-size:48px; letter-spacing:.5px; color:#fff; -webkit-text-stroke:7px var(--outline2); paint-order:stroke fill; text-shadow:0 4px 0 var(--outline2); font-weight:var(--heavy-w,400)}
.hero-score .n em{font-style:normal; font-family:var(--heavy); font-size:20px; color:var(--gold); -webkit-text-stroke:5px var(--outline2); paint-order:stroke fill; font-weight:var(--heavy-w,400)}
.hero-score p{margin:6px 0 0; font-family:var(--disp); font-size:15px; line-height:1.35; color:#EDE7FF; text-wrap:balance; font-weight:var(--disp-w,400)}
.hero-score p em{font-style:normal; color:#FFD86B}
.gems{display:grid; grid-auto-flow:column; grid-auto-columns:1fr;   /* 과목 수만큼 한 줄(5·6과목) */ gap:8px; margin:16px 0 0}
.gem{position:relative; aspect-ratio:1; max-width:56px; justify-self:center; width:100%; border-radius:14px; display:grid; place-items:center; color:rgba(255,255,255,.28);
  background:#170C45; box-shadow:inset 0 3px 6px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.18)}
.gem .ico{width:52%; height:52%}
.gem.on{color:#fff; background:linear-gradient(180deg,var(--g1),var(--g2)); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.18), 0 3px 0 var(--outline2)}
.gem.on .ico{filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.gem-ck{position:absolute; right:-6px; bottom:-6px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#8BF06A,#2BB24C); border:2px solid var(--outline2); color:#fff}
.gem-ck .ico{width:12px; height:12px}
.hero-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px; padding-top:12px; border-top:2px dashed rgba(255,255,255,.18); font-family:var(--disp); font-size:14px; color:#CFC5FF; font-weight:var(--disp-w,400)}
.clock-chip{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; border-radius:999px; background:#170C45; box-shadow:inset 0 2px 4px rgba(0,0,0,.5); white-space:nowrap}
.clock-chip .ico{width:16px; height:16px; color:#FFD86B}
.clock-chip b{font-family:var(--heavy); color:#FFD86B; letter-spacing:.5px; font-weight:var(--heavy-w,400)}

/* ---------- 다음 한 판 (메인 버튼) ---------- */
.cta{display:flex; align-items:center; gap:12px; width:100%; min-height:82px; margin-top:22px; padding:10px 12px 12px; border-radius:22px; text-align:left; color:#fff;
  background:linear-gradient(180deg,#FF9BCB 0%, #FF4F9A 45%, #E0217A 100%); border:3px solid var(--outline2);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55), inset 0 -6px 0 rgba(120,0,60,.3), 0 7px 0 #0E0730, 0 16px 26px rgba(224,33,122,.35); transition:transform .08s, box-shadow .08s}
.cta::before{content:""; position:absolute; z-index:-1; left:10px; right:10px; top:4px; height:40%; border-radius:16px 16px 30px 30px; background:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0))}
.cta::after{content:""; position:absolute; z-index:-1; top:0; bottom:0; width:40%; left:-50%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform:skewX(-18deg); animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-50%} 85%,100%{left:130%}}
.cta:active{transform:translateY(5px); box-shadow:inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 #0E0730}
.cta-tile{flex:none; width:56px; height:56px; border-radius:16px; display:grid; place-items:center; color:var(--g2); background:linear-gradient(#FFFFFF,#FFE6F1); border:2.5px solid var(--outline2); box-shadow:inset 0 -3px 0 rgba(0,0,0,.08), 0 3px 0 rgba(80,0,40,.5)}
.cta-tile .ico{width:34px; height:34px}
.cta-txt{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.2}
.cta-txt i{font-style:normal; font-family:var(--disp); font-size:14px; color:#FFF1A8; text-shadow:0 1px 0 #8E0F4F; font-weight:var(--disp-w,400)}
.cta-txt b{font-family:var(--disp); font-size:22px; color:#fff; -webkit-text-stroke:5px #8E0F4F; paint-order:stroke fill; text-shadow:0 3px 0 #8E0F4F; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:var(--disp-w,400)}
.cta-txt small{font-size:13px; font-weight:700; color:#FFE3F0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
.cta-play{flex:none; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#FFF6B8,#FFC21C); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.7), 0 3px 0 rgba(80,0,40,.55)}
.cta-play svg{width:24px; height:24px; margin-left:3px; color:#B8250E}

/* ---------- 섹션 제목 ---------- */
.sec{display:flex; align-items:center; justify-content:center; gap:12px; margin:34px 0 14px}
.sec::before, .sec::after{content:""; flex:1; max-width:80px; height:3px; border-radius:2px; background:linear-gradient(90deg, rgba(255,211,92,0), #FFD35C)}
.sec::after{transform:scaleX(-1)}
.sec h2{margin:0; font-family:var(--disp); font-size:22px; color:#fff; -webkit-text-stroke:6px var(--outline2); paint-order:stroke fill; text-shadow:0 3px 0 var(--outline2); white-space:nowrap; font-weight:var(--disp-w,400)}
.sec h2::before, .sec h2::after{content:"◆"; display:inline-block; font-size:12px; color:#FFD35C; -webkit-text-stroke:3px var(--outline2); vertical-align:3px; margin:0 8px}

/* ---------- 게임 카드 ---------- */
.games{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.game{position:relative; display:flex; flex-direction:column; gap:3px; padding:8px 8px 10px; text-align:left; transition:transform .1s}
.game:active{transform:translateY(3px) scale(.99)}
.g-art{position:relative; display:block; aspect-ratio:16/10; border-radius:14px; overflow:hidden; border:2.5px solid var(--outline); box-shadow:inset 0 0 0 2px rgba(255,255,255,.35); margin-bottom:6px; background:var(--gc)}
.g-art svg{display:block; width:100%; height:100%}
.g-art::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 35%); pointer-events:none}
.g-nm{font-family:var(--disp); font-size:18px; line-height:1.25; color:var(--ink); padding:0 4px; font-weight:var(--disp-w,400)}
.g-st{flex:1; font-size:13px; line-height:1.45; color:var(--sub); font-weight:500; padding:0 4px}
.g-st b{color:var(--ink)}
.g-go{display:flex; align-items:center; justify-content:center; gap:6px; height:40px; margin-top:8px; border-radius:13px; font-family:var(--disp); font-size:16px; color:#fff;
  --c1:#FF8AC0; --c2:#F0368A; --c3:#8E0F4F; background:linear-gradient(180deg,var(--c1),var(--c2)); border:2.5px solid var(--c3); text-shadow:0 2px 0 var(--c3);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 var(--c3); font-weight:var(--disp-w,400)}
.g-go.re{--c1:#86D6FF; --c2:#2E8FE8; --c3:#124F92}
.g-go::before{content:""; position:absolute; z-index:-1; left:5px; right:5px; top:2px; height:42%; border-radius:10px 10px 16px 16px; background:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.05))}
.games .game:last-child:nth-child(odd){grid-column:1/-1; display:grid; grid-template-columns:48% 1fr; grid-template-rows:auto 1fr auto; column-gap:12px}
.games .game:last-child:nth-child(odd) .g-art{grid-row:1/4; margin:0; align-self:stretch; aspect-ratio:auto; min-height:120px}
.games .game:last-child:nth-child(odd) .g-nm{padding-top:4px}
.newb, .live, .stamp{position:absolute; top:6px; z-index:2; font-family:var(--heavy); font-size:13px; letter-spacing:1px; line-height:1; color:#fff; border:2px solid var(--outline2); box-shadow:0 2px 0 var(--outline2); font-weight:var(--heavy-w,400)}
.newb{left:6px; padding:4px 8px 5px; border-radius:8px; background:linear-gradient(#E8364A,#C8102E); transform:rotate(-6deg)}
.live{right:6px; display:inline-flex; align-items:center; gap:5px; padding:4px 8px 5px; border-radius:999px; background:linear-gradient(#FF6B6B,#E0243A)}
.live i{width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.stamp{right:6px; display:inline-flex; align-items:center; gap:3px; padding:3px 8px 4px 5px; border-radius:999px; background:linear-gradient(#FFE98E,#FFB020); color:#5A3300; letter-spacing:0; font-family:var(--disp); font-size:13px; font-weight:var(--disp-w,400)}
.stamp .ico{width:14px; height:14px}

/* ---------- 친구 랭킹 ---------- */
.rank{padding:6px 10px; overflow:hidden}
.row{display:grid; grid-template-columns:38px 46px 1fr auto 42px; align-items:center; gap:8px; min-height:66px; padding:6px 2px; border-top:2px dashed var(--paper-line)}
.row:first-child{border-top:0}
.row.me{margin:4px -6px; padding:6px 8px; border:2.5px solid #C98A12; border-radius:16px; background:linear-gradient(180deg,#FFF1B8,#FFD978); box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.row.me + .row{border-top:0}
.pos{width:38px; height:40px; display:grid; place-items:center}
.pnum{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-family:var(--heavy); font-size:15px; color:#fff; background:linear-gradient(#7B5CD6,#4B2C8F); border:2px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.35); font-weight:var(--heavy-w,400)}
.pnum.none{background:#CDBEA0; color:#fff; box-shadow:none; border-color:#A8966F}
.av{position:relative; width:46px; height:46px; border-radius:50%; overflow:hidden; display:grid; place-items:center; border:3px solid #fff; box-shadow:0 0 0 2px var(--outline), 0 3px 0 2px rgba(42,22,80,.35); background:var(--avbg, #FFD6E0)}
.av svg, .av img.toy{width:100%; height:100%; display:block}
.av img.toy{width:112%; height:112%; margin:-2% -6% -10%; max-width:none}
img.toy{display:block; width:100%; height:100%; -webkit-user-drag:none; user-select:none}
.who{min-width:0; line-height:1.2}
.who b{display:block; font-family:var(--disp); font-size:17px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:var(--disp-w,400)}
.who small{display:flex; gap:3px; margin-top:4px; font-size:13px; color:var(--sub); font-weight:500; white-space:nowrap}
.mini{display:inline-grid; place-items:center; width:19px; height:19px; border-radius:6px; background:#E9DCC0; color:#B7A27A}
.mini .ico{width:13px; height:13px}
.mini.on{color:#fff; background:var(--gc); box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.sc{font-family:var(--heavy); font-size:19px; color:var(--ink); letter-spacing:.3px; font-weight:var(--heavy-w,400)}
.send{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#FF9BCB,#F0368A); border:2.5px solid #8E0F4F; box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 3px 0 #8E0F4F; color:#fff}
.send .ico{width:20px; height:20px; filter:drop-shadow(0 1px 0 rgba(120,0,60,.6))}
.send:active{transform:translateY(2px); box-shadow:0 1px 0 #8E0F4F}
.send:disabled{background:#E9DCC0; border-color:#B7A27A; box-shadow:none; color:#A38E66}
.send:disabled .ico{filter:none}

/* ---------- 테스트 도구 ---------- */
.proto{margin-top:30px; font-size:13px; color:#B9AEE6; text-align:center}
.proto summary{cursor:pointer; list-style:none; min-height:44px; display:inline-flex; align-items:center; font-family:var(--disp); font-size:14px; font-weight:var(--disp-w,400)}
.proto summary::-webkit-details-marker{display:none}
.proto .btn{margin:4px}

/* ---------- 게임 화면 상단 바(스도쿠·구슬·디펜스) ---------- */
#play{display:none}
.pbar{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px; min-height:60px; margin:2px 0 12px; padding:6px 8px; border-radius:18px;
  background:linear-gradient(180deg,#4A33A8,#2C1C7C); border:3px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.25), 0 4px 0 #0E0730}
.ptitle{text-align:center; font-family:var(--disp); font-size:19px; line-height:1.2; min-width:0; color:#fff; -webkit-text-stroke:4px var(--outline2); paint-order:stroke fill; font-weight:var(--disp-w,400)}
.ptitle small{display:block; font-family:var(--font); font-size:13px; font-weight:700; line-height:1.4; padding-bottom:1px; color:#CFC5FF; -webkit-text-stroke:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iconbtn{width:44px; height:44px; min-width:44px; min-height:44px; flex:none; border-radius:50%; display:grid; place-items:center; color:var(--ink); background:linear-gradient(#FFFFFF,#E7DDFF); border:2.5px solid var(--outline2); box-shadow:inset 0 -3px 0 rgba(90,60,160,.18), 0 3px 0 #0E0730}
.iconbtn .ico{width:22px; height:22px}
.iconbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #0E0730}
.stats{display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:16px; padding:8px 14px; margin-bottom:12px; min-height:52px}
.paws{display:flex; gap:4px; color:var(--g-fox)}
.paws .ico{width:24px; height:24px}
.paws .off{color:var(--line)}
.paws .lost{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fcount{font-size:14px; font-weight:700; color:var(--sub)}
.clock{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}

/* ---------- 팝업 창 ---------- */
.veil{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(80% 60% at 50% 45%, rgba(40,20,110,.55), rgba(8,3,28,.82)); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.veil.on{display:flex}
.modal{position:relative; width:100%; max-width:420px; max-height:100%; overflow:auto; padding:16px 16px 18px; text-align:center; color:var(--ink);
  background:linear-gradient(180deg,var(--paper) 0%, var(--paper2) 100%); border:4px solid var(--outline); border-radius:26px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.8), 0 8px 0 var(--outline2), 0 26px 50px rgba(0,0,0,.5); animation:popin .32s cubic-bezier(.2,1.5,.45,1)}
@keyframes popin{from{transform:scale(.82); opacity:0}}
.modal > *:not(.burst){position:relative; z-index:1}
.modal h3{margin:0 0 12px; padding:9px 14px 10px; font-family:var(--disp); font-size:21px; line-height:1.25; color:#fff; text-shadow:0 2px 0 var(--outline2); text-wrap:balance;
  background:linear-gradient(180deg,#9C7BFF,#6236D6); border:3px solid var(--outline2); border-radius:15px; box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 var(--outline2); font-weight:var(--disp-w,400)}
.modal h3.ok{background:linear-gradient(180deg,#8BF06A,#23A548); text-shadow:0 2px 0 #0F5A23}
.modal h3.bad{background:linear-gradient(180deg,#9AA7C7,#5B6789)}
.modal .big{font-family:var(--heavy); font-size:60px; line-height:1.1; margin:6px 0; letter-spacing:1px; font-variant-numeric:tabular-nums; color:#FFC93C; -webkit-text-stroke:8px var(--outline); paint-order:stroke fill; text-shadow:0 5px 0 var(--outline); font-weight:var(--heavy-w,400)}
.modal .big svg{width:72px; height:72px; display:block; margin:0 auto}
.lose{font-family:var(--disp); font-size:21px; line-height:1.35; margin:12px 0 6px; color:var(--ink); text-wrap:balance; font-weight:var(--disp-w,400)}
.note{font-size:14px; color:var(--sub); margin:8px 0; line-height:1.55; text-wrap:pretty}
.note b{color:var(--ink)}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-family:var(--disp); font-size:15px; margin:4px 2px; border:2px solid; font-weight:var(--disp-w,400)}
.pill.good{background:#E3F8E9; color:#18804A; border-color:#8FD9A8}
.pill.new{background:linear-gradient(#FFE98E,#FFB020); color:#5A3300; border-color:#9A5A00; box-shadow:0 2px 0 #9A5A00; animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.06)}}
.pill.info{background:#EFE7FF; color:#5B3FB5; border-color:#CDBBFA}
.burst{position:absolute; z-index:0; left:50%; top:-140px; width:420px; height:420px; margin-left:-210px; border-radius:50%; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,200,60,.35) 0deg 9deg, rgba(255,200,60,0) 9deg 22deg);
  -webkit-mask:radial-gradient(circle, #000 12%, transparent 60%); mask:radial-gradient(circle, #000 12%, transparent 60%); animation:spin 14s linear infinite}
.brk{text-align:left; margin:10px 0 4px; background:#fff; border:2px solid var(--paper-line); border-radius:14px; padding:0 12px}
.brk summary{min-height:44px; display:flex; align-items:center; justify-content:center; color:var(--sub); font-family:var(--disp); font-size:15px; cursor:pointer; font-weight:var(--disp-w,400)}
.brk div{display:flex; justify-content:space-between; gap:10px; padding:8px 2px; font-size:14px; color:var(--sub); border-top:2px dashed var(--paper-line)}
.brk div b{color:var(--ink); font-variant-numeric:tabular-nums}
.mbtns{display:grid; grid-template-columns:auto 1fr; gap:10px; margin-top:18px}
.mbtns.one{grid-template-columns:1fr}
.mbtns.two{grid-template-columns:1fr 1fr}
.mbtns + .btn.ghost{margin-top:6px; width:100%}
.mbtns + .mbtns{margin-top:12px}
.mbtns button, .mbtns .btn{height:54px; border-radius:16px; font-family:var(--disp); font-size:17px; padding:0 16px; min-width:0; white-space:nowrap; line-height:1.15; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:var(--disp-w,400)}
.opts{display:flex; flex-direction:column; gap:10px; margin-top:12px; text-align:left}
.opt{text-align:left; display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:10px; min-height:66px; padding:10px 14px; border-radius:16px; background:#fff; border:3px solid var(--paper-line); box-shadow:0 3px 0 var(--paper-line); transition:transform .08s}
.opt[aria-checked="true"]{border-color:var(--pink); background:#FFF1F7; box-shadow:0 3px 0 #B8185F, 0 0 0 4px rgba(240,54,138,.18)}
.opt .lvdots{display:flex; gap:5px; padding-left:2px}
.opt .lvdots i{width:8px; height:8px; transform:rotate(45deg); border-radius:2px; background:var(--line)}
.opt .lvdots i.on{background:linear-gradient(#FFE35A,#FF9A1F); box-shadow:0 0 0 1.5px #9A5A00}
.opt b{font-family:var(--disp); font-size:18px; font-weight:var(--disp-w,400)}
.opt small{display:block; font-size:13px; color:var(--sub); font-weight:500; margin-top:1px}
.opt .rec{font-family:var(--disp); font-size:13px; color:#fff; background:linear-gradient(#FF8AC0,#F0368A); border:2px solid #8E0F4F; padding:1px 9px 2px; border-radius:999px; font-weight:var(--disp-w,400)}
.hrow{display:flex; justify-content:center; gap:4px; margin:10px 0}
.hrow .hi{width:40px; height:40px}
.hrow .hi svg{width:100%; height:100%; display:block}
.hrow .hi.off{filter:grayscale(1) opacity(.35)}
.hx{font-family:var(--heavy); font-size:20px; align-self:center; color:var(--pink); font-weight:var(--heavy-w,400)}
.gift{display:grid; grid-template-columns:40px 1fr 26px; align-items:center; gap:10px; min-height:58px; text-align:left; border-top:2px dashed var(--paper-line); font-size:15px}
.gift:first-child{border-top:0}
.gift .av{width:40px; height:40px; border-width:2px}
.gift .hi{width:26px; height:26px}
.gift .hi svg{width:100%; height:100%}
.gift.got{opacity:.45}
.help{display:flex; flex-direction:column; gap:10px; margin:12px 0 4px; text-align:left}
.hstep{display:grid; grid-template-columns:48px 1fr; gap:12px; align-items:center; padding:12px; border-radius:16px; background:#fff; border:2px solid var(--paper-line)}
.hstep .hn{width:48px; height:48px; border-radius:14px; display:grid; place-items:center; color:#fff; font-family:var(--heavy); font-size:24px; border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 var(--outline2); text-shadow:0 2px 0 rgba(0,0,0,.3); font-weight:var(--heavy-w,400)}
.hstep b{display:block; font-family:var(--disp); font-size:17px; color:var(--ink); font-weight:var(--disp-w,400)}
.hstep span{font-size:15px; color:var(--sub); line-height:1.55}
.optsep{font-family:var(--disp); font-size:14px; color:var(--sub); margin:8px 4px 0; font-weight:var(--disp-w,400)}

/* ---------- 알림 ---------- */
.toast{position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translate(-50%,-14px); z-index:40; max-width:calc(100% - 32px); height:48px; padding:0 20px; border-radius:16px;
  display:flex; align-items:center; gap:8px; font-family:var(--disp); font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transition:.2s; pointer-events:none;
  background:linear-gradient(#3D2A8F,#24186A); border:2.5px solid #FFD35C; box-shadow:0 0 0 2.5px var(--outline2), 0 10px 24px rgba(0,0,0,.4); font-weight:var(--disp-w,400)}
.toast.on{opacity:1; transform:translate(-50%,0)}
/* 게임 중에는 위쪽 정보줄(HUD)을 가리지 않게 화면 아래쪽에 띄운다 */
body[data-mode] .toast{top:auto; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,14px); white-space:normal; width:max-content; height:auto; min-height:48px; padding:8px 20px; text-align:center; line-height:1.3}
body[data-mode] .toast.on{transform:translate(-50%,0)}

@media (max-width:370px){ .logo-main{font-size:42px} .hero-score .n span{font-size:40px} .hero-in{grid-template-columns:74px 1fr} .medal-big{width:74px; height:82px} .row{grid-template-columns:34px 42px 1fr auto 40px; gap:6px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* ===== 게임 화면 ===== */
/* 캐릭터 v4: 결과 창 마스코트·대전 결과 표정(순간 연출만) */
.modal h3 img.toy.resface{display:inline-block; width:40px; height:40px; margin:-12px 6px -12px -4px; vertical-align:middle; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); animation:resface .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes resface{from{transform:scale(.2) rotate(-25deg); opacity:0}}
.dr-side img.toy.mood-joy{animation:moodjoy .7s cubic-bezier(.2,1.6,.4,1) .2s both}
.dr-side img.toy.mood-sad{animation:moodsad .7s ease-out .2s both}
@keyframes moodjoy{0%{transform:scale(1)} 35%{transform:scale(1.18) translateY(-4px)} 100%{transform:scale(1)}}
@keyframes moodsad{0%{transform:none} 40%{transform:translateY(3px) rotate(-6deg)} 100%{transform:translateY(1px) rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){ .modal h3 .resface, .dr-side img.toy{animation:none} }
/* 대전 결과 창 '계속 풀기'(상대가 먼저 끝나 판이 끊긴 쪽만) */
.modal .dcont{display:flex; width:100%; margin:12px 0 0; min-height:52px; height:auto; padding:8px 14px; flex-wrap:wrap; column-gap:6px; row-gap:0}
.modal .dcont small{flex-basis:100%; font-family:var(--font); font-size:13px; font-weight:700; opacity:.9}

/* ===== 결과 창 v2 (UI 검수 2026-10-04): 요약 카드 1장 + 버튼 위계(주 1 · 반반 2 · 글자 줄) ===== */
.rsum{margin:10px 0 2px; padding:10px 12px; border-radius:18px; background:#fff; border:2px solid var(--paper-line); text-align:center}
.rsum b{display:block; font-family:var(--disp); font-size:17px; line-height:1.35; color:var(--ink); font-weight:var(--disp-w,400)}
.rsum b.new{display:inline-block; padding:3px 12px; border-radius:999px; background:linear-gradient(#FFE98E,#FFB020); color:#5A3300; border:2px solid #9A5A00; box-shadow:0 2px 0 #9A5A00}
.rsum span{display:block; margin-top:5px; font-size:13px; font-weight:700; line-height:1.45; color:var(--sub)}
.rsum span:empty{display:none}
.rsum .ico{width:15px; height:15px; vertical-align:-2px}
.rbtns{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.rbtns button{min-width:0; font-family:var(--disp); white-space:normal; line-height:1.15; font-weight:var(--disp-w,400)}
.rb-pri{width:100%; min-height:58px; padding:6px 16px; border-radius:16px; font-size:19px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
.rb-pri small{display:block; font-family:var(--font); font-size:13px; font-weight:700; opacity:.95; text-shadow:0 1px 0 var(--c3)}
.rb-pair{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.rb-pair.one{grid-template-columns:1fr}
.rb-pair button{height:auto; min-height:50px; padding:4px 10px; border-radius:14px; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-align:center}
.rb-pair .ico{width:18px; height:18px; flex:none}
.rb-pair .cost{flex:none}
.rb-links{display:flex; align-items:center; justify-content:center; gap:2px; flex-wrap:wrap}
.rb-links button{min-height:44px; padding:0 12px; font-size:15px; color:var(--sub); background:none; border:0; text-decoration:underline; text-decoration-color:rgba(106,88,132,.35); text-underline-offset:4px}
.rb-links button .ico{width:16px; height:16px; vertical-align:-3px; margin-right:3px}
.rb-links i{font-style:normal; color:var(--line)}
.dz-rp{margin:10px 0 -4px}   /* 대전 결과 창 "이 판 다시 풀기 · 친구에게 보내기" 글자 버튼 줄(R11) */
.modal .rbtns + .note{margin-top:4px}
/* 꽃가루·효과 층: 창이 열려 있으면 창 뒤로(글자·버튼 위로 지나가지 않게) */
.veil > .fxfx{z-index:0}
.veil > .modal{z-index:1}
body.modal-open > .fxfx, body:has(.veil.on) > .fxfx{z-index:19}
/* 진행 중이던 공식 답안이 자동 제출됐을 때 안내 */
.runsub{margin:8px 0 2px; padding:12px; border-radius:16px; background:#fff; border:2px solid var(--paper-line); text-align:center}
.runsub b{display:block; font-family:var(--disp); font-size:18px; color:var(--ink); font-weight:var(--disp-w,400)}
.runsub span{display:block; margin-top:4px; font-size:14px; color:var(--sub); line-height:1.5}


/* ===== 큰 글씨(설정 "소리 · 글씨" → body.big, WP3 2026-10-06): 글자 +2px. 칩·버튼은 글자에 맞춰 늘고(min-width) 판 칸 크기는 그대로 ===== */
body.big{font-size:17px}
body.big .note{font-size:16px}
body.big .lose{font-size:23px}
body.big .modal h3{font-size:23px}
body.big .hstep b{font-size:19px} body.big .hstep span{font-size:17px}
body.big .h3l li{font-size:18px}
body.big .hmore summary{font-size:18px}
body.big .rsum b{font-size:19px} body.big .rsum span{font-size:15px}
body.big .rb-pri{font-size:21px} body.big .rb-pri small{font-size:15px}
body.big .rb-pair button{font-size:18px} body.big .rb-links button{font-size:17px}
body.big .mbtns button, body.big .mbtns .btn{font-size:19px}
body.big .brk summary, body.big .brk div{font-size:16px}
body.big .opt b{font-size:20px} body.big .opt small{font-size:15px}
body.big .pill{font-size:17px}
body.big .toast{font-size:18px}
body.big .ptitle{font-size:20px} body.big .ptitle small{font-size:15px}
body.big .who b{font-size:19px} body.big .who small{font-size:15px}
body.big .g-nm{font-size:20px} body.big .g-st{font-size:15px}
body.big .hchip{min-width:fit-content; padding:0 6px}
body.big .hchip em{font-size:15px} body.big .hchip small{font-size:15px} body.big .hchip b{font-size:21px}

/* ===== 공용 닫기(✕) 버튼 (2026-10-18 테스트팀 검수) =====
   창마다 모양이 제각각이던 ✕(맨 글자 · 네모 칸 · 제목 띠 안에 겹침)를 하나로: 40px 동그라미, 글꼴과 상관없이 같은 두께의 X(선 두 개).
   자리: 제목 띠 오른쪽 바깥, 띠 높이 가운데(제목 띠는 오른쪽을 50px 비운다). */
.mx, .modal .amx, .drules .x{width:40px; height:40px; padding:0; border-radius:50%; display:grid; place-items:center; font-size:0; line-height:0; color:var(--ink); background:var(--paper2, #fff); border:2px solid var(--outline2); box-shadow:0 2px 0 var(--outline2); cursor:pointer; -webkit-tap-highlight-color:transparent}
.mx::before, .mx::after, .modal .amx::before, .modal .amx::after, .drules .x::before, .drules .x::after{content:""; position:absolute; left:50%; top:50%; width:16px; height:2.5px; margin:-1.25px 0 0 -8px; border-radius:2px; background:currentColor; transform:rotate(45deg)}
.mx::after, .modal .amx::after, .drules .x::after{transform:rotate(-45deg)}
.mx:active, .modal .amx:active, .drules .x:active{transform:translateY(2px); box-shadow:0 0 0 var(--outline2)}
.drules .x{width:36px; height:36px}
.drules h4{padding-right:42px}
/* 도움말 단계 번호·판 고르기 판 번호: 게임 색(주황·노랑 등) 위 흰 숫자가 흐림 → 진한 테두리 글자(2026-10-18 검수) */
.hstep .hn{-webkit-text-stroke:3px var(--outline2); paint-order:stroke fill}
/* 결과 창(2026-10-18 검수): 360폭에서 "친구에게 / 도전장"만 두 줄이 되어 옆 버튼과 높이가 달라지던 것 → 한 줄, 폭에 맞춰 글자 크기 */
.rb-pair button{white-space:nowrap; font-size:clamp(14px, 4.1vw, 16px); padding:4px 8px}
/* "점수 자세히"가 빈 상자처럼 보이던 것 → 펼침 표시 */
.brk summary{list-style:none; gap:6px}
.brk summary::-webkit-details-marker{display:none}
.brk summary::after{content:""; width:8px; height:8px; border-right:2.5px solid currentColor; border-bottom:2.5px solid currentColor; transform:translateY(-2px) rotate(45deg); transition:transform .15s}
.brk[open] summary::after{transform:translateY(2px) rotate(-135deg)}
/* 2026-10-18: 아이폰은 16px보다 작은 입력칸을 누르면 화면을 저절로 확대하고 그대로 둔다 → 아래 고정 메뉴가 화면 가운데로 떠 보이던 원인.
   모든 입력칸 글자를 16px 이상으로(확대 안 됨) */
input, select, textarea{font-size:max(16px, 1em) !important}

/* 공용 효과: 점수 떠오름·연속 배지·도장·흔들림 (모든 게임이 씀) */
/* ===== 여우 효과(효과팀) ===== */
.fxfx{position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:30}
.fxfloat{position:fixed; transform:translate(-50%,-50%); pointer-events:none; z-index:19; font-weight:800; font-size:22px; color:#fff; -webkit-text-stroke:4px #2A1650; paint-order:stroke fill; animation:floatup 1.2s cubic-bezier(.2,.8,.3,1) forwards; white-space:nowrap}
.fxfloat.bad{color:#FF6A2B}
@keyframes floatup{0%{opacity:0; transform:translate(-50%,-30%) scale(.5)} 15%{opacity:1; transform:translate(-50%,-70%) scale(1.25)} 30%{transform:translate(-50%,-90%) scale(1)} 100%{opacity:0; transform:translate(-50%,-260%) scale(1)}}
.fxfly{position:fixed; z-index:19; pointer-events:none; filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.fxfly svg{width:100%; height:100%; display:block}
.fxc.glow{animation:regglow .55s ease-out both}
@keyframes regglow{35%{filter:brightness(1.35) saturate(1.2); transform:scale(1.07)}}
.fxc.pop{z-index:2}
.fxc.pop svg{animation:foxpop2 .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes foxpop2{0%{transform:scale(.1) rotate(-30deg)} 55%{transform:scale(1.35) rotate(8deg)} 100%{transform:scale(1) rotate(0)}}
.fxc.bad{z-index:2; animation:badcell .5s ease-out}
.fxc.bad svg{animation:xslam .38s cubic-bezier(.3,1.6,.5,1)}
@keyframes badcell{0%,40%{box-shadow:0 0 0 4px #FF3B30, 0 0 18px 6px rgba(255,59,48,.7); filter:brightness(.8) saturate(1.4)} 100%{box-shadow:none}}
@keyframes xslam{0%{transform:scale(2.6) rotate(-35deg); opacity:0} 60%{transform:scale(.85) rotate(4deg); opacity:1} 100%{transform:scale(1) rotate(0)}}
.fxc.conflict{z-index:2; animation:conflict .45s ease-in-out 3}
@keyframes conflict{50%{box-shadow:0 0 0 4px #FF3B30, 0 0 16px rgba(255,59,48,.8); transform:scale(1.1)}}
.fx-board.shake2{animation:shake2 .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake2{10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(5px)} 30%,50%,70%{transform:translateX(-9px) rotate(-.6deg)} 40%,60%{transform:translateX(9px) rotate(.6deg)}}
.fxvig{position:fixed; inset:0; pointer-events:none; z-index:17; box-shadow:inset 0 0 90px 30px rgba(255,40,30,.55); animation:vig .6s ease-out forwards}
@keyframes vig{0%{opacity:0} 20%{opacity:1} 100%{opacity:0}}
.fxbubble{position:fixed; z-index:19; pointer-events:none; background:#2A1650; color:#fff; font-size:14px; font-weight:700; padding:9px 13px; border-radius:12px; white-space:nowrap; box-shadow:0 6px 16px rgba(0,0,0,.25); animation:bubin .25s cubic-bezier(.2,1.5,.5,1)}
.fxbubble::after{content:""; position:absolute; left:calc(var(--ax) - 7px); border:7px solid transparent}
.fxbubble.up::after{top:100%; border-top-color:#2A1650}
.fxbubble.down::after{bottom:100%; border-bottom-color:#2A1650}
.fxbubble.out{opacity:0; transition:opacity .35s}
@keyframes bubin{from{transform:scale(.6); opacity:0}}
.fxcombo{position:fixed; z-index:19; pointer-events:none; transform:translate(-50%,0); display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:999px; background:linear-gradient(90deg,#FF8A3D,#FF5C8A); color:#fff; box-shadow:0 8px 20px rgba(255,92,138,.4); animation:combo 1.2s cubic-bezier(.2,1.4,.4,1) forwards}
.fxcombo b{font-size:20px; font-weight:800}
.fxcombo span{font-size:15px; font-weight:700}
.fxcombo.max{background:linear-gradient(90deg,#FFB300,#FF5C8A,#8E6BD1)}
@keyframes combo{0%{opacity:0; transform:translate(-50%,10px) scale(.4)} 18%{opacity:1; transform:translate(-50%,0) scale(1.15)} 30%{transform:translate(-50%,0) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-14px)}}
#fxScore.bump{display:inline-block; animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes bump{40%{transform:scale(1.35); color:#FF6FA8}}
.fxlast{position:absolute; left:50%; top:-16px; transform:translateX(-50%); background:linear-gradient(#FF7A82,#E5484D); color:#fff; font-family:var(--disp); font-size:14px; padding:3px 14px 4px; border:2.5px solid var(--outline2); border-radius:999px; z-index:3; white-space:nowrap; animation:lastin .4s cubic-bezier(.2,1.6,.4,1); font-weight:var(--disp-w,400)}
@keyframes lastin{from{transform:translateX(-50%) scale(.3)}}
.fxstamp{white-space:nowrap; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-12deg); z-index:4; font-size:clamp(40px,13vw,60px); font-weight:800; color:#FF5C8A; background:rgba(255,255,255,.9); border:6px solid #FF5C8A; border-radius:22px; padding:6px 26px; pointer-events:none; animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-12deg) scale(3); opacity:0} 100%{transform:translate(-50%,-50%) rotate(-12deg) scale(1); opacity:1}}
.fx-lost{position:fixed; z-index:19; pointer-events:none; width:26px; height:26px}
.fx-lost svg{width:100%; height:100%}
@media (prefers-reduced-motion: reduce){ .fxfloat,.fxcombo{animation-duration:.01s} }
/* ===== 이펙트 v2: 번쩍임·떠오르는 점수·연속 배지 빛 ===== */
.fxflash{position:fixed; inset:0; pointer-events:none; z-index:18; mix-blend-mode:screen}
.fxfloat{filter:drop-shadow(0 4px 6px rgba(26,15,69,.35)) drop-shadow(0 0 10px rgba(255,236,170,.45))}
.fxfloat[class="fxfloat "]{color:#FFF6CC}
.fxcombo{filter:drop-shadow(0 0 12px rgba(255,214,120,.75))}

/* 청기 백기(flag) 화면. 범위: body[data-mode="flag"] · .ng-flag
   세계: 운동회 마당(하늘·삼각 깃발 줄·잔디·구령대). 눈이 편하게: 차분한 색, 번쩍임·체크무늬·계속 흔들림 없음.
   움직임은 transform/opacity만(60fps). 동작 줄이기면 애니메이션 끔. */
html body[data-mode="flag"]{background:linear-gradient(180deg,#BFE3FF 0%,#E4F3FF 52%,#D6EFCB 100%) fixed}
html body[data-mode="flag"] .wrap{padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
html body[data-mode="flag"] .pbar{margin-bottom:10px}
.ng-flag{position:relative; display:flex; flex-direction:column; width:100%; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  --hs:120px; --fs:62px; --bh:72px; --bub:100px; --mid:110px; --strip:0px; --ol:#1A0F45}
.ng-flag .fl-defs{position:absolute; width:0; height:0; overflow:hidden}
.ng-flag .hud-row{margin:0 0 8px; flex:none}
.ng-flag .fl-lifechip .hlives{border:0; background:none; padding:0; height:auto; gap:2px}
.ng-flag .fl-lifechip .hlives i{font-size:20px}
.ng-flag .fl-lifechip.warn{background:linear-gradient(180deg,#FFF1F1,#FFD6D6)}

/* ---------- 장면(운동장) ---------- */
.ng-flag .fl-scene{position:relative; flex:1 1 auto; min-height:220px; border-radius:22px; overflow:hidden; border:3px solid var(--ol);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%); box-shadow:0 4px 0 var(--ol), 0 12px 22px rgba(30,70,130,.16); touch-action:none}
.ng-flag .fl-bunt{position:absolute; left:0; top:0; width:100%; height:46px; pointer-events:none}
.ng-flag .fl-cloud{position:absolute; border-radius:50%; background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,0)); pointer-events:none}
.ng-flag .fl-cloud.c1{width:150px; height:54px; left:-30px; top:44%}
.ng-flag .fl-cloud.c2{width:120px; height:44px; right:-24px; top:52%}
.ng-flag .fl-field{position:absolute; left:-10%; right:-10%; bottom:0; height:calc(var(--feet, 60px) * .55 + 34px); border-radius:50% 50% 0 0 / 34px 34px 0 0; background:linear-gradient(180deg,var(--fd1),var(--fd2)); pointer-events:none}
.ng-flag .fl-field::after{content:""; position:absolute; left:6%; right:6%; top:38%; height:4px; border-radius:99px; background:rgba(255,255,255,.75)}
.ng-flag .fl-podium{position:absolute; left:50%; bottom:6px; width:calc(var(--hs) * 1.28); height:calc(var(--feet, 60px) - 6px); transform:translateX(-50%); border-radius:12px 12px 6px 6px;
  background:linear-gradient(180deg,#FFF8EA 0,#FFF8EA 10px,#F0DDB6 10px,#DCC191 100%); box-shadow:inset 6px 0 10px rgba(255,255,255,.35), inset -8px -6px 12px rgba(120,80,30,.16), 0 6px 10px rgba(26,15,69,.18); pointer-events:none}
/* 구령대 앞 장식: 삼각 깃발 치마 + 가운데 청기·백기 표지 */
.ng-flag .fl-skirt{position:absolute; left:6px; right:6px; top:10px; width:calc(100% - 12px); height:14px}
.ng-flag .fl-emb{position:absolute; left:50%; top:calc(50% + 6px); transform:translate(-50%,-50%); display:flex; gap:4px; padding:5px 10px; border-radius:99px; background:rgba(255,255,255,.55)}
.ng-flag .fl-emb .fl-fi{width:20px; height:20px}

/* ---------- 깃발 든 캐릭터 ---------- */
.ng-flag .fl-rig{position:absolute; width:calc(var(--s) * 1.9); height:calc(var(--s) * 1.5); pointer-events:none}
.ng-flag .fl-rig.host{--s:var(--hs); left:50%; bottom:calc(var(--feet, 60px) - var(--hs) * .08); transform:translateX(-50%); z-index:2}
.ng-flag .fl-body{position:absolute; left:calc(var(--s) * .45); top:calc(var(--s) * .5); width:var(--s); height:var(--s); z-index:2; display:block}
.ng-flag .fl-arm{position:absolute; top:calc(var(--s) * .32); width:calc(var(--s) * .5); height:calc(var(--s) * .917); z-index:1}
.ng-flag .fl-arm.L{left:calc(var(--s) * .36); transform:scaleX(-1)}
.ng-flag .fl-arm.R{left:calc(var(--s) * 1.04)}
.ng-flag .fl-armw{width:100%; height:100%; transform-origin:50% 87.3%; transition:transform .26s cubic-bezier(.3,1.45,.5,1); will-change:transform}
.ng-flag .fl-arm.up .fl-armw{transform:rotate(14deg)}
.ng-flag .fl-arm.down .fl-armw{transform:rotate(158deg)}
.ng-flag .fl-armi{display:block; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 2px 1.5px rgba(26,15,69,.25))}
/* 깃발 천: 올림·내림마다 바깥쪽에 오는 천을 따로 그려 둔다(필터와 뒤집기 변환을 섞으면 색이 깨져서) */
.ng-flag .fl-cloth{transition:opacity .14s ease}
.ng-flag .fl-arm.up .fl-cloth.d, .ng-flag .fl-arm.down .fl-cloth.u{opacity:0}
.ng-flag .fl-top{position:absolute; left:calc(var(--s) * .807); top:calc(var(--s) * .2); width:calc(var(--s) * .286); height:calc(var(--s) * .5); z-index:1; transition:transform .26s cubic-bezier(.3,1.45,.5,1)}
.ng-flag .fl-top.down{transform:translateY(102%)}   /* 내리면 머리 뒤로 숨는다(올렸을 때와 확실히 다르게) */
.ng-flag .fl-topi{display:block; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 2px 1.5px rgba(26,15,69,.25))}

/* 흉내쟁이 너구리: 옆에서 쏙 */
.ng-flag .fl-rac{position:absolute; right:-4px; bottom:calc(var(--feet, 60px) - var(--hs) * .14); width:calc(var(--hs) * .78); height:auto; z-index:3; pointer-events:none;
  transform:translateX(125%) rotate(12deg); transition:transform .34s cubic-bezier(.3,1.4,.5,1)}
.ng-flag .fl-rac.on{transform:translateX(0) rotate(-4deg)}

/* ---------- 말풍선(명령) ---------- */
.ng-flag .fl-bub{position:absolute; left:8px; right:8px; top:28px; min-height:var(--bub); z-index:5; display:flex; flex-direction:column; padding:6px 12px 10px;
  --bg:#FFFFFF; background:var(--bg); border:3px solid var(--ol); border-radius:24px; --tail:50%;
  box-shadow:inset 0 -6px 0 rgba(26,15,69,.06), inset 0 3px 0 #fff, 0 5px 0 var(--ol), 0 14px 22px rgba(26,15,69,.16); transition:background-color .16s, border-color .16s}
.ng-flag .fl-bub::after{content:""; position:absolute; left:var(--tail); bottom:-14px; width:22px; height:22px; margin-left:-11px; background:inherit; border:3px solid var(--ol); border-top:0; border-left:0; transform:rotate(45deg); border-radius:0 0 6px 0; transition:left .25s}
.ng-flag .fl-who{display:flex; align-items:center; gap:6px; height:24px; font-family:var(--disp); font-size:13px; color:#6A5884}
.ng-flag .fl-who img{width:24px; height:24px}
.ng-flag .fl-who b{font-weight:400}
.ng-flag .fl-cmd{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; min-height:44px; font-family:var(--disp); font-size:clamp(30px,9vw,36px); line-height:1.12; color:#2A1D55; white-space:nowrap; letter-spacing:-.01em}
.ng-flag .fl-cmd.pop{animation:flag-cmd .22s cubic-bezier(.2,1.35,.4,1)}   /* 글자는 처음부터 보이게(투명에서 시작하지 않음, 판단 창이 바로 시작하므로) */
@keyframes flag-cmd{from{transform:translateY(5px) scale(.9)}}
.ng-flag .fl-pt{display:inline-flex; align-items:center; gap:8px}
.ng-flag .fl-fn{display:inline-flex; align-items:center; gap:4px}
.ng-flag .fl-fn.b{color:#1D5FC4}
.ng-flag .fl-fn.y{color:#B07800}
.ng-flag .fl-fi{width:1.05em; height:1.05em; flex:none}
.ng-flag .fl-vb{display:inline-flex; align-items:center; gap:5px}
.ng-flag .fl-vb.neg{color:#C8283A}
/* 올려·내려·하지 마 배지(말풍선·버튼 같은 모양): 둥근 장난감 단추 */
.ng-flag .fl-badge{display:inline-grid; place-items:center; flex:none; width:.9em; height:.9em; border-radius:50%; color:#fff; font-style:normal;
  box-shadow:inset 0 -.09em 0 rgba(26,15,69,.22), inset 0 .07em 0 rgba(255,255,255,.45)}
.ng-flag .fl-badge .fl-ai{width:64%; height:64%; display:block}
.ng-flag .fl-badge.up{background:#F07A12}
.ng-flag .fl-badge.dn{background:#6A4BD0}
.ng-flag .fl-badge.neg{background:#E5484D; transform:rotate(-8deg)}
.ng-flag .fl-and{font-family:var(--heavy); font-size:.5em; color:#B3A6CF; line-height:.5}
.ng-flag .fl-cardt{font-family:var(--heavy); font-weight:400; font-size:.95em; color:#2A1D55}
.ng-flag .fl-foot{position:relative; height:20px; margin-top:4px}
.ng-flag .fl-win{position:absolute; left:4px; right:4px; top:3px; height:14px; border-radius:99px; background:#ECE8F6; border:2.5px solid var(--ol); overflow:hidden; box-shadow:inset 0 2px 0 rgba(26,15,69,.08)}
.ng-flag .fl-win i{display:block; width:100%; height:100%; transform-origin:left center; transform:scaleX(0); background:linear-gradient(180deg,#8CF2BC,#22B865); border-radius:99px}
.ng-flag .fl-win.mid i{background:linear-gradient(180deg,#FFE58A,#FFB020)}
.ng-flag .fl-win.low i{background:linear-gradient(180deg,#FF9EA2,#E5484D)}
.ng-flag .fl-win.hurry{animation:flag-jit .1s linear infinite alternate}
@keyframes flag-jit{from{transform:translateX(-1px)} to{transform:translateX(1px)}}
.ng-flag .fl-res{position:absolute; inset:-3px 0; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--bg, #fff); font-family:var(--disp); font-size:16px; color:#6A5884; white-space:nowrap; overflow:hidden; transition:background-color .16s}
.ng-flag .fl-res:empty{display:none}
.ng-flag .fl-res.ok{color:#14894B}
.ng-flag .fl-res.bad{color:#C8283A}
.ng-flag .fl-res small{font-size:13px; color:#6A5884}
/* 두 줄 명령(두 개 한꺼번에) */
.ng-flag .fl-bub.two .fl-cmd{font-size:clamp(26px,7.6vw,30px); line-height:1.1; gap:2px}
.ng-flag .fl-bub.two .fl-and{display:none}
/* 판정 상태: 말풍선 테두리·바탕만 차분하게 바뀐다(번쩍임 없음) */
.ng-flag .fl-bub.is-ok{--bg:#EEFCF3; border-color:#178A4C}
.ng-flag .fl-bub.is-bad{--bg:#FFF1F1; border-color:#C8283A}
/* 흉내쟁이 명령: 점선 테두리·베이지 말풍선·꼬리는 너구리 쪽 */
.ng-flag .fl-bub.mimic{--bg:#F3ECE3; border-style:dashed; --tail:84%}
.ng-flag .fl-bub.mimic .fl-who{color:#7D6E64}
.ng-flag .fl-bub.mimic .fl-who::after{content:"따라 하지 마"; margin-left:auto; font-size:13px; color:#fff; background:#9C8D80; border-radius:99px; padding:2px 8px}
.ng-flag .fl-bub.card.flip{--bg:#F1EAFF}
.ng-flag .fl-bub.card.keep{--bg:#E8FAEF}
.ng-flag .fl-bub.lose .fl-cardt{color:#C8283A}
/* 반대로 표시(말풍선 모서리 꼬리표 + 화면 테두리 보라) */
.ng-flag .fl-flipb{position:absolute; left:50%; transform:translateX(-50%); top:-15px; display:none; padding:3px 10px; border-radius:99px; font-family:var(--disp); font-size:14px; color:#fff; background:linear-gradient(180deg,#A98BFF,#6C3CE0); border:2.5px solid var(--ol)}
.ng-flag.flipped .fl-flipb{display:block}
.ng-flag.flipped .fl-bub{border-color:#5B2BC9}
.ng-flag.flipped .fl-scene{border-color:#5B2BC9}
.ng-flag .fl-frame{position:fixed; inset:0; pointer-events:none; z-index:15; border:5px solid #8B5CF6; box-shadow:inset 0 0 22px rgba(139,92,246,.22); opacity:0; transition:opacity .35s}
.ng-flag.flipped .fl-rules{display:none}
.ng-flag.flipped .fl-frame{opacity:1}

/* 판정 도장 */
.ng-flag .fl-stamp{position:absolute; right:8px; top:-16px; width:64px; height:64px; z-index:6; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0;
  border:3px solid var(--ol); box-shadow:0 3px 0 var(--ol); color:#fff; opacity:0; transform:scale(1.6) rotate(-14deg); pointer-events:none}
.ng-flag .fl-stamp b{font-family:var(--heavy); font-weight:400; font-size:26px; line-height:1}
.ng-flag .fl-stamp span{font-family:var(--disp); font-size:13px; line-height:1.1; white-space:nowrap}
.ng-flag .fl-stamp.ok{background:radial-gradient(circle at 35% 30%,#8DF5BC,#1FB866 70%)}
.ng-flag .fl-stamp.bad{background:radial-gradient(circle at 35% 30%,#FF9EA2,#E5484D 70%)}
.ng-flag .fl-stamp.on{animation:flag-stamp .3s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes flag-stamp{to{opacity:1; transform:scale(1) rotate(-12deg)}}

/* 반대로/그대로 카드(진행자가 들어 올림) */
.ng-flag .fl-card{position:absolute; left:50%; top:calc(30px + var(--bub) + 28px); z-index:4; padding:8px 18px 7px; border-radius:16px; border:3px solid var(--ol); box-shadow:0 4px 0 var(--ol); text-align:center;
  opacity:0; transform:translate(-50%,24px) scale(.6) rotate(-6deg); transition:transform .3s cubic-bezier(.2,1.5,.4,1), opacity .2s; pointer-events:none}
.ng-flag .fl-card b{display:block; font-family:var(--heavy); font-weight:400; font-size:28px; line-height:1.1; color:#fff; -webkit-text-stroke:5px var(--ol); paint-order:stroke fill}
.ng-flag .fl-card small{display:block; font-family:var(--disp); font-size:13px; color:#fff}
.ng-flag .fl-card.flip{background:linear-gradient(180deg,#A98BFF,#6C3CE0)}
.ng-flag .fl-card.keep{background:linear-gradient(180deg,#7EE8A8,#22B865)}
.ng-flag .fl-card.on{opacity:1; transform:translate(-50%,0) scale(1) rotate(-3deg)}

/* 보스 띠·알림·규칙 칩 */
.ng-flag .fl-bossband{position:absolute; left:0; right:0; top:48%; height:48px; z-index:6; display:flex; align-items:center; justify-content:center; pointer-events:none;
  background:linear-gradient(90deg,rgba(229,72,77,0),rgba(214,48,68,.92) 18%,rgba(214,48,68,.92) 82%,rgba(229,72,77,0)); animation:flag-band 1.7s ease forwards}
.ng-flag .fl-bossband b{font-family:var(--heavy); font-weight:400; font-size:32px; color:#FFE27A; -webkit-text-stroke:6px var(--ol); paint-order:stroke fill; letter-spacing:2px}
@keyframes flag-band{0%{opacity:0; transform:scaleX(.3)} 18%{opacity:1; transform:none} 78%{opacity:1} 100%{opacity:0}}
.ng-flag .fl-note{position:absolute; left:50%; top:calc(30px + var(--bub) + 24px); z-index:7; padding:6px 16px; border-radius:99px; background:#1A0F45; color:#FFE27A; font-family:var(--disp); font-size:18px; white-space:nowrap;
  opacity:0; transform:translateX(-50%) scale(.7); pointer-events:none}
.ng-flag .fl-note.on{animation:flag-note 1.1s ease forwards}
@keyframes flag-note{0%{opacity:0; transform:translateX(-50%) scale(.7)} 15%{opacity:1; transform:translateX(-50%) scale(1.06)} 25%{transform:translateX(-50%) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translateX(-50%) translateY(-8px)}}
.ng-flag .fl-rules{position:absolute; right:10px; top:6px; z-index:1; display:flex; gap:4px; max-width:62%; overflow:hidden; justify-content:flex-end}
.ng-flag .fl-bub.mimic .fl-rules, .ng-flag .fl-bub.card .fl-rules, .ng-flag .fl-bub.two .fl-rules{display:none}
.ng-flag .fl-rules .fl-chip{padding:3px 8px; font-size:13px; border-width:1.5px; box-shadow:none}
.ng-flag .fl-chip{font-family:var(--disp); font-size:13px; line-height:1; padding:5px 9px; border-radius:99px; border:2px solid var(--ol); background:#fff; color:#1D4F9E; box-shadow:0 2px 0 var(--ol); white-space:nowrap}
.ng-flag .fl-chip.tw{background:#EFE7FF; color:#5B3FB5}
.ng-flag .fl-chip.boss{background:linear-gradient(180deg,#FFB3B6,#E5484D); color:#fff}
.ng-flag .fl-edge{position:fixed; inset:0; pointer-events:none; z-index:16; opacity:0; box-shadow:inset 0 0 0 3px rgba(229,72,77,.5), inset 0 0 56px rgba(229,72,77,.32)}
.ng-flag .fl-edge.on{animation:flag-edge .45s ease-out}
@keyframes flag-edge{0%{opacity:1} 100%{opacity:0}}

/* ---------- 조작판(엄지 자리) ---------- */
.ng-flag .fl-deck{flex:none; position:relative; display:grid; gap:12px 10px; margin-top:14px; height:var(--deck);
  grid-template-columns:1fr var(--mid) 1fr; grid-template-rows:var(--bh) var(--bh); grid-template-areas:"bu me wu" "bd me wd"}
.ng-flag .fl-deck.third{row-gap:12px; grid-template-columns:1fr 1fr 1fr; grid-template-rows:calc(var(--strip) - 4px) var(--bh) var(--bh); grid-template-areas:"me me me" "bu yu wu" "bd yd wd"}
.ng-flag .fl-me{grid-area:me; position:relative; pointer-events:none; z-index:0}
.ng-flag .fl-rig.me{--s:var(--fs); left:50%; bottom:calc(var(--fs) * .36 + 8px); transform:translateX(-50%)}
.ng-flag .fl-deck.third{margin-top:8px}
.ng-flag .fl-deck.third .fl-rig.me{bottom:-6px}
.ng-flag .fl-metag{position:absolute; left:50%; bottom:0; transform:translateX(-50%); z-index:3; padding:0 10px; border-radius:99px; background:#FF7A12; color:#fff; border:2px solid var(--ol); font-family:var(--disp); font-size:13px; line-height:20px}
.ng-flag .fl-deck.third .fl-metag{left:calc(50% + var(--fs) * .62); bottom:2px; transform:none}
.ng-flag .fl-btn{position:relative; z-index:1; min-width:0; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:4px 6px;
  border-radius:22px; border:3px solid var(--ol); --lift:5px;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.55), inset 0 -6px 0 rgba(26,15,69,.12), 0 var(--lift) 0 var(--ol), 0 calc(var(--lift) + 6px) 12px rgba(26,15,69,.18);
  transition:transform .07s ease-out, box-shadow .07s ease-out;
  font-family:var(--disp); font-size:19px; line-height:1; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.ng-flag .fl-btn:focus-visible{outline:3px solid #FFC93C; outline-offset:3px}
/* 누르는 동안: 바닥 두께만큼 내려앉음(손을 떼면 다시 올라옴) */
.ng-flag .fl-btn.down{transform:translateY(4px); box-shadow:inset 0 3px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(26,15,69,.12), 0 1px 0 var(--ol), 0 3px 6px rgba(26,15,69,.16)}
.ng-flag .fl-btn.b{background:linear-gradient(180deg,#86C2FF 0%,#3F8CF2 55%,#2C72DD 100%); color:#fff; text-shadow:0 2px 0 #174A9E}
.ng-flag .fl-btn.w{background:linear-gradient(180deg,#FFFFFF 0%,#F2F5FB 55%,#DEE5F2 100%); color:#24345E}
.ng-flag .fl-btn.y{background:linear-gradient(180deg,#FFEFA6 0%,#FFD24A 55%,#FFBE1A 100%); color:#5A3300}
.ng-flag .fl-bi{display:flex; align-items:center; gap:4px}
.ng-flag .fl-bi .fl-fi{width:24px; height:24px}
.ng-flag .fl-bi .fl-badge{width:30px; height:30px; border:2.5px solid var(--ol)}
.ng-flag .fl-bi .fl-badge .fl-ai{width:70%; height:70%}
.ng-flag .fl-bl{white-space:nowrap}
.ng-flag .fl-lamp{position:absolute; top:-7px; left:50%; width:26px; height:9px; margin-left:-13px; border-radius:99px; background:#D9D3E8; border:2px solid var(--ol); transition:background-color .15s, box-shadow .15s}
.ng-flag .fl-btn.on .fl-lamp{background:#5BF08F; box-shadow:0 0 6px rgba(91,240,143,.85)}
.ng-flag .fl-btn.hit:not(.down){animation:flag-hit .18s ease-out}
/* 오답 뒤 0.4초: 누른 버튼 빨간 테두리, 정답 버튼 초록 테두리 */
.ng-flag .fl-btn.miss::after, .ng-flag .fl-btn.ans::after{content:""; position:absolute; inset:-6px; border-radius:26px; border:3.5px solid #E5484D; pointer-events:none}
.ng-flag .fl-btn.ans::after{border-color:#1FB866; box-shadow:0 0 0 3px rgba(31,184,102,.18)}
@keyframes flag-hit{0%{transform:translateY(4px); box-shadow:inset 0 3px 0 rgba(255,255,255,.4), 0 1px 0 var(--ol)}}
@media (max-width:370px){ .ng-flag .fl-btn{font-size:17px} .ng-flag .fl-bi .fl-badge{width:27px; height:27px} .ng-flag .fl-bub{padding:6px 10px 9px} }
@media (prefers-reduced-motion: reduce){
  .ng-flag .fl-armw, .ng-flag .fl-cloth, .ng-flag .fl-top, .ng-flag .fl-rac, .ng-flag .fl-card{transition-duration:.01s}
  .ng-flag .fl-cmd.pop, .ng-flag .fl-btn.hit, .ng-flag .fl-win.hurry{animation:none}
  .ng-flag .fl-btn{transition:none}
}

/* 2026-10-18 판 위 글자 최소화(docs/29): 버튼은 그림(깃발 + ▲▼)만, 진행자 이름은 읽기 프로그램에만 */
.ng-flag .fl-sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.ng-flag .fl-bi{gap:8px}
.ng-flag .fl-bi .fl-fi{width:34px; height:34px}
.ng-flag .fl-bi .fl-badge{width:40px; height:40px; border-width:3px}
@media (max-width:370px){ .ng-flag .fl-bi .fl-fi{width:30px; height:30px} .ng-flag .fl-bi .fl-badge{width:36px; height:36px} }

/* 게임 화면 공용(모든 게임·사이트·붙여 쓰는 모듈): 솔로 맵·별 결과·축하 창·소리 설정·대전 화면 */
/* 모험 맵 */
.modal.amap{--gc:#FF7A1F}
.amap .chhead{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 6px}
.amap .chhead button{width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:#fff; border:2px solid var(--paper-line); color:var(--ink)}
.amap .chhead button:disabled{opacity:.3}
.amap .chhead .ico{width:20px; height:20px}
.amap .chhead .rot{transform:rotate(180deg)}
.amap .chname{font-family:var(--disp); font-size:19px; color:var(--ink); line-height:1.2; font-weight:var(--disp-w,400)}
.amap .chname small{display:block; font-family:var(--font); font-size:13px; font-weight:700; color:var(--sub)}
.path{position:relative; display:grid; grid-template-columns:repeat(5,1fr); gap:12px 8px; padding:14px 8px; margin-top:6px; border-radius:18px; background:color-mix(in srgb, var(--gc) 12%, #FFF8EA); border:2px solid color-mix(in srgb, var(--gc) 30%, #EADBC0)}
.st{position:relative; aspect-ratio:1; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--heavy); font-size:17px; color:#fff;
  background:linear-gradient(180deg, color-mix(in srgb, var(--gc) 65%, #fff), var(--gc)); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 3px 0 var(--outline2); text-shadow:0 2px 0 rgba(0,0,0,.3); font-weight:var(--heavy-w,400)}
.st i{position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); font-style:normal; font-size:13px; letter-spacing:-1px; white-space:nowrap; text-shadow:none; -webkit-text-stroke:0}
.st i .on{color:#FFB020; text-shadow:0 1px 0 #7A4A00} .st i .off{color:#D8C8A8}
.st.lock{background:#DCCFB4; color:#A8966F; border-color:#A8966F; box-shadow:0 3px 0 #A8966F; text-shadow:none}
.st.lock .ico{width:18px; height:18px}
.st.cur{animation:curpulse 1.3s ease-in-out infinite}
@keyframes curpulse{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 3px 0 var(--outline2), 0 0 0 6px color-mix(in srgb, var(--gc) 35%, transparent)}}
.st.sel{outline:3px solid #FFB020; outline-offset:3px}
.st.boss{border-radius:30%}
.modal .path .st.hard:not(.lock){background:linear-gradient(180deg,#FF7A7A,#B3122E); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 3px 0 var(--outline2), 0 0 0 3px #FFD0D0}
.modal .path .st.xhard:not(.lock){background:linear-gradient(180deg,#A77BFF,#4B1E9E); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 3px 0 var(--outline2), 0 0 0 3px #E2D2FF}
.modal .path .st.newc:not(.lock)::before{content:"NEW"; position:absolute; top:-9px; right:-10px; white-space:nowrap; font:13px/1 var(--disp); color:#fff; background:#178A4C; border:2px solid #1A0F45; border-radius:8px; padding:2px 5px; z-index:2}
.rule .cline{display:inline-block; margin-top:4px; font-size:13.5px; color:#5B3FB5; background:#EFE7FF; border-radius:10px; padding:3px 9px}
.legend3{font-size:13px; color:var(--sub); margin:6px 0 0; display:flex; gap:6px; justify-content:center; align-items:center; flex-wrap:wrap}
.legend3 .lg-n{font:13px/1 var(--disp); color:#fff; background:#178A4C; border-radius:6px; padding:2px 5px}
.legend3 .lg-h, .legend3 .lg-x{display:inline-block; width:12px; height:12px; border-radius:4px; background:linear-gradient(#FF7A7A,#B3122E)}
.legend3 .lg-x{background:linear-gradient(#A77BFF,#4B1E9E)}
.ncard{display:flex; gap:12px; align-items:center; text-align:left; background:#FFF8EA; border:3px solid var(--outline); border-radius:18px; padding:12px 14px; margin:10px 0 4px; box-shadow:0 4px 0 var(--outline2); color:var(--ink)}
.ncard .nc-ic{flex:none; width:48px; height:48px; border-radius:14px; background:var(--gc); color:#fff; display:grid; place-items:center; border:2.5px solid var(--outline)}
.ncard .nc-ic svg{width:28px; height:28px}
.ncard p{margin:0; font-size:15px; line-height:1.55}
.st.boss::after{content:""; position:absolute; top:-12px; width:22px; height:14px; background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 14'><path d='M1 13 2 3l5 5 4-7 4 7 5-5 1 10z' fill='%23FFC93C' stroke='%231A0F45' stroke-width='1.6' stroke-linejoin='round'/></svg>") no-repeat center/contain}
.amap .rule{margin:12px 0 0; font-size:13px; color:var(--sub); line-height:1.5}
.amap .rule b{color:#B87400}

/* 결과(모험) */
.bigstars{display:flex; justify-content:center; gap:4px; margin:4px 0 2px}
.bigstars svg{width:56px; height:56px; overflow:visible}
.bigstars .s{opacity:0; transform:scale(.2) rotate(-40deg); animation:starpop .45s cubic-bezier(.2,1.7,.4,1) forwards}
.bigstars .s:nth-child(2){margin-top:-12px}
.bigstars .s.off{filter:grayscale(1) brightness(1.45) opacity(.5)}
@keyframes starpop{to{opacity:1; transform:scale(1) rotate(0)}}
.chprog{margin:10px 0 0; padding:10px 12px; border-radius:14px; background:#fff; border:2px solid var(--paper-line); text-align:left}
.chprog .h{display:flex; justify-content:space-between; font-family:var(--disp); font-size:15px; color:var(--ink); font-weight:var(--disp-w,400)}
.chprog .h small{font-family:var(--font); font-size:13px; font-weight:700; color:var(--sub)}
.chprog .xp{background:#EFE3CB; box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.chprog .xp-t{color:var(--sub)}
.chprog .xp-t b{color:#B87400}

/* 성장 축하 창 */
.modal.celebrate{background:radial-gradient(120% 80% at 50% 0%, #5B3FD0 0%, #2C1C7C 55%, #1A0F45 100%); color:#fff; border-color:#FFD35C; box-shadow:0 0 0 3px var(--outline2), 0 0 40px rgba(255,211,92,.35), 0 26px 50px rgba(0,0,0,.5)}
.celebrate .burst{background:repeating-conic-gradient(from 0deg, rgba(255,225,120,.4) 0deg 8deg, rgba(255,225,120,0) 8deg 20deg); top:-120px}
.celebrate .kick{font-family:var(--heavy); font-size:15px; letter-spacing:4px; color:#FFD86B; margin:4px 0 0; font-weight:var(--heavy-w,400)}
.celebrate .ttl{font-family:var(--heavy); font-size:40px; line-height:1.1; margin:2px 0 6px; color:#FFE35A; -webkit-text-stroke:7px var(--outline2); paint-order:stroke fill; text-shadow:0 5px 0 #0B0526; animation:ttlin .6s cubic-bezier(.2,1.6,.4,1); font-weight:var(--heavy-w,400)}
@keyframes ttlin{from{transform:scale(2.2); opacity:0}}
.celebrate .emb{width:140px; height:150px; margin:4px auto 0; animation:embin .8s cubic-bezier(.2,1.5,.4,1) .15s both}
.celebrate .emb svg{width:100%; height:100%; display:block; overflow:visible}
@keyframes embin{from{transform:scale(.2) rotate(-25deg); opacity:0}}
.celebrate .newtitle{display:inline-block; margin:8px 0 0; padding:6px 18px 7px; font-family:var(--disp); font-size:18px; color:#fff; background:linear-gradient(#FF7DB8,#E62C7F); border:2.5px solid var(--outline2); border-radius:10px; box-shadow:0 3px 0 var(--outline2); text-shadow:0 2px 0 #7A0B45; font-weight:var(--disp-w,400)}
.celebrate .note{color:#D8D0FF}
.celebrate .note b{color:#FFD86B}
.rewards{display:flex; justify-content:center; gap:10px; margin:12px 0 0; flex-wrap:wrap}
.reward{display:flex; flex-direction:column; align-items:center; gap:4px; width:84px; padding:10px 4px 8px; border-radius:16px; background:rgba(255,255,255,.1); border:2px solid rgba(255,211,92,.5); font-family:var(--disp); font-size:13px; color:#FFE9A8; animation:embin .6s cubic-bezier(.2,1.5,.4,1) .45s both; font-weight:var(--disp-w,400)}
.reward .ri{width:40px; height:40px}
.reward .ri svg{width:100%; height:100%}
.reward b{font-family:var(--heavy); font-size:17px; color:#fff; font-weight:var(--heavy-w,400)}
.celebrate .mbtns .b1{--c1:#FFE98E; --c2:#FFB020; --c3:#9A5A00; color:#5A3300; text-shadow:0 1px 0 rgba(255,255,255,.5)}


/* 설정 창 */
.sset{display:flex; flex-direction:column; gap:8px; margin-top:6px; text-align:left}
.srow2{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px; border-radius:16px; background:#fff; border:2px solid var(--paper-line)}
.srow2.col{flex-direction:column; align-items:stretch; gap:8px}
.srow2 b{display:block; font-family:var(--disp); font-size:17px; color:var(--ink); font-weight:var(--disp-w,400)}
.srow2 small{display:block; font-size:13px; color:var(--sub); font-weight:500; margin-top:1px}
.sw{position:relative; flex:none; width:58px; height:34px; border-radius:17px; background:#DCCFB4; box-shadow:inset 0 2px 4px rgba(0,0,0,.18); transition:background .2s}
.sw i{position:absolute; top:3px; left:3px; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.25); transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.sw.on{background:linear-gradient(#8BF06A,#27B86A)}
.sw.on i{transform:translateX(24px)}
.rg{display:flex; align-items:center; gap:10px}
.rg em{font-style:normal; min-width:34px; text-align:right; font-family:var(--heavy); font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums; font-weight:var(--heavy-w,400)}
.rg input{flex:1; -webkit-appearance:none; appearance:none; height:30px; background:none; margin:0}
.rg input::-webkit-slider-runnable-track{height:10px; border-radius:5px; background:linear-gradient(90deg,#FF8AC0,#F0368A); box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.rg input::-webkit-slider-thumb{-webkit-appearance:none; width:28px; height:28px; margin-top:-9px; border-radius:50%; background:linear-gradient(#fff,#F3EBDD); border:3px solid var(--outline); box-shadow:0 2px 0 var(--outline2)}
.rg input::-moz-range-track{height:10px; border-radius:5px; background:linear-gradient(90deg,#FF8AC0,#F0368A)}
.rg input::-moz-range-thumb{width:24px; height:24px; border-radius:50%; background:#fff; border:3px solid var(--outline)}
.snd-row{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:10px}
.sdemo{height:40px; border-radius:12px; font-family:var(--disp); font-size:14px; color:var(--ink); background:#fff; border:2px solid var(--paper-line); box-shadow:0 2px 0 var(--paper-line); font-weight:var(--disp-w,400)}
.sdemo:active{transform:translateY(2px); box-shadow:none}
.psnd{margin-top:10px; width:100%; height:44px; border-radius:14px; font-family:var(--disp); font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:6px; background:rgba(0,0,0,.08); color:inherit; font-weight:var(--disp-w,400)}
.psnd svg{width:20px; height:20px}
/* 결과: 점수가 다 올라가면 튕김 */
.modal .big.land{animation:bigland .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes bigland{40%{transform:scale(1.18)}}


@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(61,220,132,0)}}
/* ===== 대전 v2 (UI팀 설계): 준비·카운트다운 · 두 줄 진행 막대 · 말풍선 알림 · 멈춤 없음 · 대기 창 ===== */
/* ---------- (1) 준비·카운트다운 화면 ---------- */
body.duel-ready #stage{visibility:hidden}                 /* 시작 전에는 문제를 보여 주지 않음(공정) */
body.duel-ready .duelbar{visibility:hidden}
.duelgo{position:fixed; inset:0; z-index:35; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); overflow:hidden;
  background:radial-gradient(90% 45% at 50% 0%, #8D6BFF 0%, rgba(141,107,255,0) 70%), linear-gradient(180deg,#3A23A0 0%, #24166E 45%, #170D47 100%);
  transition:opacity .3s ease, transform .3s ease}
.duelgo::before{content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.4px), radial-gradient(rgba(255,255,255,.25) 1px, transparent 1.4px); background-size:120px 140px, 57px 61px}
.duelgo.out{opacity:0; transform:scale(1.04); pointer-events:none}
.dg-card{position:relative; width:100%; max-width:400px; padding:12px 14px 12px; text-align:center}
.dg-kick{margin:0; font-family:var(--disp); font-size:13px; color:var(--sub); font-weight:var(--disp-w,400)}
.dg-title{margin:0 0 2px; font-family:var(--heavy); font-size:26px; line-height:1.15; color:var(--gc,var(--ink)); font-weight:var(--heavy-w,400)}
.dg-vs{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; margin:6px 0 8px}
.dg-side{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0}
.dg-side .av{width:60px; height:60px}
.dg-side b{font-family:var(--disp); font-size:16px; color:var(--ink); max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:var(--disp-w,400)}
.dg-side small{font-size:13px; font-weight:700; color:var(--sub); white-space:nowrap}
.dg-side small.ok{color:var(--success)}
.dg-side.me{animation:dgInL .45s cubic-bezier(.2,1.4,.4,1) both}
.dg-side.op{animation:dgInR .45s cubic-bezier(.2,1.4,.4,1) .08s both}
@keyframes dgInL{from{transform:translateX(-40px); opacity:0}}
@keyframes dgInR{from{transform:translateX(40px); opacity:0}}
.dg-x{font-family:var(--heavy); font-size:30px; color:#FFC93C; -webkit-text-stroke:6px var(--outline); paint-order:stroke fill; text-shadow:0 3px 0 var(--outline); font-weight:var(--heavy-w,400)}
.dg-rules{list-style:none; margin:0; padding:8px 10px; display:grid; gap:6px; text-align:left; border-radius:14px; background:#fff; border:2px solid var(--paper-line)}
.dg-rules li{display:grid; grid-template-columns:24px 1fr; gap:8px; align-items:center; font-family:var(--disp); font-size:15.5px; line-height:1.25; color:var(--ink); font-weight:var(--disp-w,400)}
.dg-rules .hn{width:24px; height:24px; display:grid; place-items:center; border-radius:8px; font-family:var(--heavy); font-size:13px; line-height:1; color:#fff; border:2px solid var(--outline2); box-shadow:0 2px 0 var(--outline2); font-weight:var(--heavy-w,400)}
.dg-win{margin:8px 0 0; font-size:13px; font-weight:800; color:#8A5A00}
.dg-count{position:relative; height:190px; width:100%; display:grid; place-items:center}
.dg-n{font-family:var(--heavy); font-size:120px; line-height:1; color:#FFD35C; -webkit-text-stroke:10px var(--outline2); paint-order:stroke fill; text-shadow:0 7px 0 var(--outline2); font-weight:var(--heavy-w,400)}
.dg-n.go{font-size:76px; color:#FF6FAE}
.dg-n.wait{font-family:var(--disp); font-size:40px; color:#fff; -webkit-text-stroke:6px var(--outline2); font-weight:var(--disp-w,400)}
.dg-n.pop{animation:dgPop .48s cubic-bezier(.2,1.6,.4,1) both}
@keyframes dgPop{0%{transform:scale(1.9); opacity:0} 22%{transform:scale(1); opacity:1} 80%{transform:scale(1); opacity:1} 100%{transform:scale(.7); opacity:0}}
.dg-n.go.pop{animation:dgGo .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes dgGo{0%{transform:scale(.4) rotate(-8deg); opacity:0} 45%{transform:scale(1.12) rotate(2deg); opacity:1} 100%{transform:scale(1)}}
.dg-ring{position:absolute; width:176px; height:176px; left:50%; top:50%; margin:-88px 0 0 -88px; transform:rotate(-90deg)}
.dg-ring circle{fill:none; stroke-width:8}
.dg-ring .bg{stroke:rgba(255,255,255,.14)}
.dg-ring .fg{stroke:#FFD35C; stroke-linecap:round; stroke-dasharray:515; stroke-dashoffset:0; transition:stroke-dashoffset .5s linear}
.dg-status{position:relative; margin:0; min-height:20px; font-size:13.5px; font-weight:700; color:#CFE3FF; text-align:center}
.dg-status i{display:inline-block; width:8px; height:8px; margin-right:6px; border-radius:50%; background:#3DDC84; box-shadow:0 0 0 3px rgba(61,220,132,.3); vertical-align:1px}
@media (max-height:700px){ .duelgo{gap:8px} .dg-count{height:150px} .dg-side .av{width:48px; height:48px} .dg-title{font-size:22px} .dg-n{font-size:96px} .dg-ring{width:140px; height:140px; margin:-70px 0 0 -70px} .dg-rules li{font-size:14.5px} }

/* ---------- (2) 게임 중 대전 막대 v2: 같은 방향 두 줄 막대 ---------- */
.duelbar{position:relative; z-index:3; display:grid; grid-template-columns:minmax(0,1fr); gap:3px; margin:2px 0 8px; padding:5px 10px 5px 7px; border-radius:16px; color:#fff;
  background:linear-gradient(180deg,#2D2380,#1A1150); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.18), 0 3px 0 #0E0730}
.duelbar[hidden]{display:none}
.db-row{display:grid; grid-template-columns:22px 28px minmax(0,1fr) auto auto; gap:6px; align-items:center; min-height:22px}
.db-row .av{width:22px; height:22px; border-width:2px}
.db-who{font-family:var(--disp); font-size:13px; line-height:1; color:#fff; white-space:nowrap; font-weight:var(--disp-w,400)}
.db-row.op .db-who{color:#FFC2DB}
