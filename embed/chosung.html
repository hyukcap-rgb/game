/* 기호 안내: 지금 판 위 칩(.hchip) 중 이름표를 숨긴 것의 그림 + 이름(게임 이름을 모르고 화면에서 읽음) */
function hsymHtml(id){
  try{
    if(!G || G.id !== id) return '';
    const out = [];
    document.querySelectorAll('#stage .hchip').forEach(c => {
      const em = c.querySelector(':scope > em'); if(!em || getComputedStyle(em).position !== 'absolute') return;
      const t = em.textContent.trim(); if(!t || out.some(o => o.t === t)) return;
      const v = c.querySelector(':scope > .hv'); let pic = '';
      if(c.classList.contains('time')) pic = ic('clock');
      else if(v){ const i = v.querySelector('.ico, svg, .hlives'); if(i) pic = i.classList && i.classList.contains('hlives') ? '<span class="hlives"><i>★</i></span>' : i.outerHTML; }
      out.push({ t, pic });
    });
    return out.length ? `<div class="htips"><b>${T('core.help.sym')}</b><div class="hsym">${out.map(o => `<span>${o.pic}${o.t}</span>`).join('')}</div></div>` : '';
  }catch(_){ return ''; }
}
function confirmQuit(){
  if(!G || G.over){ HOST.exit(); return; }
  const paused = gPause();
  /* 솔로·대전 문구는 엔진이, 그 밖(사이트의 오늘의 시험지, 모듈의 연습 판)은 HOST가 정한다 */
  const q = G.adv ? { note:T('core.quit.solo') + ' ' + HOST.soloFreeNote, label:T('core.quit.go') }
    : G.duel ? { note:T('core.quit.duel') + ' ' + HOST.duelQuitNote + (duelNoStop() ? ' ' + T('core.quit.timeRuns') : ''), label:T('core.quit.forfeit') }
    : G.practice ? { note:T('core.quit.cont'), label:T('core.leave') }
    : HOST.quitInfo();
  openModal(`<h3>${T('core.quit.title')}</h3><p class="note">${q.note}</p>
    <div class="mbtns two"><button class="b2" id="mQuit">${q.label}</button><button class="b1" id="mStay">${T('core.quit.stay')}</button></div>`);

  $('#mQuit').onclick = () => {

}

/* 실패했을 때 여기까지 한 만큼(결과 창 문구) */
function lossProgress(){ return NG[G.id].lossText(); }
/* 성공한 판의 게임 점수(배율 포함). 결과 창과 대전 판정에 같이 쓴다. 게임 정의 score()가 기본·보너스·추가 점수와 설명 3줄을 준다 */
function calcScore(){
  const q = NG[G.id].score(), base = q.base, time = q.time, paw = q.extra, [l1, l2, l3] = q.rows;
  return { base, time, paw, l1, l2, l3, score:Math.round((base + time + paw) * G.L.mult) };
}
/* 판이 끝남(게임이 부름). 대전은 엔진이 마무리, 그 밖은 HOST(사이트·모듈)가 결과 창을 보여 준다 */
function finish(win){
  if(G.over) return; G.over = true; clearInterval(tick);
  ambStop(); coachStop();
  if(G.adv && !G.duel){ try{ G.rec = win && !G.replay ? advBestSave(G.id, G.adv) : null; }catch(_){ G.rec = null; } }   /* 판마다 내 가장 좋은 기록 */
  if(G.replay && !G.duel && HOST.replayFinish){ HOST.replayFinish(win); return; }
  if(win && NG[G.id].winSfx){ sfx('win', { g:G.id }); fxBuzz([30, 60, 30, 60, 80]); }
  if(G.duel){ duelFinish(win); return; }
  if(G.practice){ practiceFinish(win); return; }   /* 대전 뒤 계속 풀기: 기록 안 함 */
  HOST.finish(win);
}

function leavePlay(){ ambStop(); coachStop(); hstarDrop(); try{ sceneStart(null); }catch(_){} duelClose(); if(G && G.cleanup){ try{ G.cleanup(); }catch(_){} G.cleanup = null; } bodyModeSet(null); delete document.body.dataset.mode; clearInterval(tick); if(G && G.raf) cancelAnimationFrame(G.raf); }

let G = null, tick = null;
let PLAY_SUB = '';   /* 제목 부제 전체 글(도움말 '이번 판'). G에 넣지 않음: 대전 판 지문(G 비교)에 안 섞이게 */

function startGame(id, lv = 'normal', o = {}){
  const adv = o.adv || 0, duel = o.duel || null, m = NG[id];
  /* 시작 전 관문(게임 정의 startGate(go), 예: 19세 확인): 개념 카드·도움말보다 먼저. 실시간 대전은 찾기 전에 gateThen()으로 */
  if(!duel && !o.gateDone){ const gf = startGateOf(id); if(gf){ gf(() => startGame(id, lv, Object.assign({}, o, { gateDone:true }))); return; } }
  if(adv && !o.cardDone){ const p0 = planOf(id, adv); if(p0.intro && !store.get('hp:seenC:' + id + ':' + p0.intro, 0)){ conceptCard(id, adv, () => startGame(id, lv, Object.assign({}, o, { cardDone:true }))); return; } }
  const pre = HOST.beforeStart(id, lv, o);   /* 사이트: 하트·오늘 몇 번째 판. false면 시작 안 함 */
  if(pre === false) return;
  if(!duel || duel.fleet) sfx('start');
  if(G && G.cleanup){ try{ G.cleanup(); }catch(_){} G.cleanup = null; }
  if(G && G.raf) cancelAnimationFrame(G.raf);
  const attempt = (pre && pre.attempt) || 0;
  let L = levelOf(id, lv, adv);
  if(!adv && !duel && HOST.flatMult) L = Object.assign({}, L, { mult:1 });   /* 시험지는 배율 없음 */
  if(duel && duel.cfg) L = Object.assign({}, L, { [id]:duel.cfg });   /* 대전 판 설정(duelCfg·느긋하게, core/duel.js) */
  if(adv) lv = m.stageLevel ? L.ai : 'adv';
  if(!adv && !duel && o.cfg && typeof o.cfg === 'object') L = Object.assign({}, L, { [id]:o.cfg });   /* 대전 판 다시 풀기(R11): 그 대전의 판 설정 그대로 */
  const rng = adv ? mulberry(seedFrom('adv:' + id + ':' + adv)) : duel ? mulberry(seedFrom(duel.seed || ('duel:' + id + ':' + Date.now()))) : mulberry(seedFrom(o.seed || ('exam:' + dayKey() + ':' + id)));   /* 날짜 씨앗 = 전 국민(모든 사이트) 같은 문제 */
  G = { id, lv, adv, duel, L, attempt, chal:o.chal || null, paws:3, start:Date.now(), over:false, limit:L[id].limit, paused:false, pauseAt:0, pausedMs:0 };
  G.cfg = L[id];
  /* 대전 판 다시 풀기(R11): init이 대전 때와 같은 갈래(대전 전용 판·규칙)를 타도록 init 동안만 가짜 대전 표식을 두고 바로 뗀다(대전 뒤 계속 풀기와 같은 모양) */
  const rpd = !adv && !duel && o.replay && o.replay.kind === 'duel';
  if(rpd) G.duel = { v:3, replay:true, mode:'replay', kind:duelKindOf(id), seed:o.seed || '', pace:o.replay.pace === 's' ? 's' : 'n', slow:o.replay.pace === 's', pl:[], P:{}, avoid:[], go:false, myPid:'me', cfg:o.cfg || null };
  try{ m.init(L[id], rng, lv); } finally { if(rpd) G.duel = null; }
  HOST.showPlay();
  G.replay = o.replay || null;   /* 다시 풀기·받은 판·지난 문제: 기록·진도에 넣지 않음(HOST.replayFinish가 결과 창) */
  const ex = m.titleExtra ? m.titleExtra() : '';
  /* 제목 아래 작은 글(UI팀 2026-10-18: 화면 글자 50% 줄이기) — 한 단어만. 자세한 건 도움말(?)의 '이번 판' 칸 */
  const aiNick = duel && duel.fleet ? (lv === 'pvp' ? '' : esc((duel.opp && duel.opp.nick) || '')) : duel ? esc(duel.vs || (duel.opp && duel.opp.nick) || '') : '';
  const sub = adv ? (G.replay && G.replay.kind === 'gift' ? T('core.sub.gift') : T('core.map.stage', { n:adv }))
    : duel ? (aiNick ? 'VS ' + aiNick : T('core.sub.duel'))
    : G.replay && G.replay.kind === 'duel' ? T('core.map.replay')
    : HOST.subtitle(L, attempt, '');
  $('#ptitle').innerHTML = GAMES[id].name + `<small>${sub}${ex}</small>`;
  PLAY_SUB = adv ? (G.replay && G.replay.kind === 'gift' ? T('core.sub.giftFull', { n:adv }) : T('core.sub.solo', { ch:WARMUP(adv) ? T('core.sub.warm') : chName(id, chOf(adv)), n:adv }))
    : duel ? T('core.sub.duelFull', { lv:L.name }) + (duel.mode === 'ai' ? ' · ' + T('core.sub.vsCpu') : '')
    : G.replay && G.replay.kind === 'duel' ? (G.replay.from ? T('core.sub.dsFrom', { name:esc(G.replay.from) }) : T('core.sub.dsReplay')) + ' · ' + T('core.noRec')
    : (HOST.subtitleFull ? HOST.subtitleFull(L, attempt, '') : '');
  hstarTick();   /* 솔로 별 목표선(판을 그리기 전에 자리를 잡아 판 크기 계산이 맞게) */
  $('.stats').style.display = 'none'; document.body.dataset.mode = id; bodyModeSet(m.bodyClass);
  $('#paws').dataset.n = 3; $('#fcount').textContent = ''; renderPaws(); renderStage();
  duelBarInit();
  if(!duel && store.get('hp:help:' + id, false) && coachWant(id)) setTimeout(() => { if(G && !G.over && G.id === id && !$('#veil').classList.contains('on')) coachStart(id, gPause()); }, 400);
  if((!duel || duel.fleet) && !store.get('hp:help:' + id, false)){ store.set('hp:help:' + id, 1); setTimeout(() => { if(G && !G.over) openHelp(id, true); }, 50); }
  clearInterval(tick);
  tick = setInterval(updateClock, 250); updateClock();
  ambStart(ambFor(id));
  try{ m.scene ? sceneStart(m.scene) : sceneStop(); }catch(_){}   /* 움직이는 배경(보이기만 함) */
  window.scrollTo(0,0);
}

function elapsed(){
  /* 대전: 시작 후엔 멈추지 않는 시계(다 풀어 멈춘 순간만 고정). 시작 전(카운트다운)은 0 */
  if(G.duel && !G.duel.fleet) return G.duel.go ? Math.max(0, ((G.paused && G.done && G.pauseAt ? G.pauseAt : Date.now()) - G.start) / 1000) : 0;
  return ((G.paused ? G.pauseAt : Date.now()) - G.start - G.pausedMs) / 1000;
}
function clock2(sec){ sec = Math.floor(sec); return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0'); }
function updateClock(){
  if(!G || G.over) return;
  const c = $('#clock'); if(c) c.textContent = mmss(elapsed());
  const sc = $('#sclock'); if(sc) sc.textContent = clock2(elapsed());
  hstarTick();
  if(G.duel) duelTick();
}

/* ===================== 공용 쉬운 화면(WP3, 2026-10-06 세대별 테스트) =====================
   큰 글씨 · 별 목표선 · 첫 판 손가락 안내 · 시작 전 관문 · 몸풀기 건너뛰기 · 기록 갱신 도장 · 대체 조작 부품(dpad·tapPlace).
   모두 게임 이름을 모르고 게임 정의(NG.<id>)의 선택 항목만 본다. 판 상태(G)·씨앗·시계·대전은 바꾸지 않는다(시계는 gPause/gResume만). */

/* ---- 큰 글씨(설정 "소리 · 글씨" 맨 위 스위치, hp:big) → body.big: 글자 +2px, 판 칸 크기는 그대로 ---- */
const bigOn = () => !!store.get('hp:big', 0);
function bigSet(on){ store.set('hp:big', on ? 1 : 0); document.body.classList.toggle('big', !!on); }
try{ if(bigOn()) document.body.classList.add('big'); }catch(_){}

/* ---- 시작 전 관문: 게임 정의 startGate(go)(함수). 예전 이름 gate가 함수면 그것도 관문으로 본다(객체 gate는 소리 간격) ---- */
function startGateOf(id){ const m = NG[id] || {}; return typeof m.startGate === 'function' ? m.startGate : typeof m.gate === 'function' ? m.gate : null; }
/* 실시간 대전·방처럼 startGame 전에 다른 화면이 먼저 뜨는 곳에서: gateThen(id, () => duelStart(id)) */
function gateThen(id, fn){ const g = startGateOf(id); if(g){ try{ g(fn); }catch(_){ fn(); } } else fn(); }

/* ---- 별 목표선(솔로만): 게임 제목 막대 아래 한 줄 .hstar. 게임 정의 starGoal() → [{ s:3, text:'1:30 안에', ok:true|false|null|() => … }]
   없으면 starRule의 ★★★ 부분 글을 그대로. 지키는 중 = 초록, 놓침 = 회색 줄긋기. 오늘의 문제·대전에는 없음 ---- */
function hstarItems(){
  const m = NG[G.id];
  if(m.starGoal){ try{ const a = m.starGoal(); if(Array.isArray(a) && a.length) return a; }catch(_){} }
  const parts = String(ADV_RULE[G.id] || '').split(' · ').map(x => x.trim()).filter(Boolean);
  const top = parts.find(x => /^★★★/.test(x)) || parts[parts.length - 1];
  return top ? [{ s:3, text:top.replace(/^★+\s*/, ''), ok:null }] : [];
}
function hstarTick(){
  try{
    if(!G || !G.adv || G.duel){ hstarDrop(); return; }
    const items = hstarItems().slice(0, 2); if(!items.length){ hstarDrop(); return; }
    let el = $('#hstar');
    if(!el){ el = document.createElement('div'); el.id = 'hstar'; el.className = 'hstar'; }
    const bar = document.querySelector('#play > .pbar');
    if(bar && el.previousElementSibling !== bar) bar.after(el);
    /* UI팀 2026-10-18: 판 위에는 별만(글은 누르면 잠깐 보이고, 도움말 '별 목표' 칸에 늘 있음) */
    const html = items.map((x, i) => { const ok = typeof x.ok === 'function' ? x.ok() : x.ok;
      return `<button type="button" class="hs${ok === false ? ' miss' : ok ? ' keep' : ''}" data-i="${i}" aria-label="${T('core.star.goalAria', { s:x.s || 3, text:x.text })}"><i aria-hidden="true">${'★'.repeat(x.s || 3)}</i></button>`; }).join('');
    if(el.dataset.h !== html){ el.dataset.h = html; el.innerHTML = html; el.setAttribute('aria-label', T('core.star.goals', { list:items.map(x => T('core.star.item', { s:x.s || 3, text:x.text })).join(', ') }));
      el.querySelectorAll('.hs').forEach(b => b.onclick = () => { const it = hstarItems()[+b.dataset.i]; if(it) toast('★'.repeat(it.s || 3) + ' ' + it.text); }); }
  }catch(_){}
}
function hstarDrop(){ const el = $('#hstar'); if(el) el.remove(); }

/* ---- 몸풀기 판: 1판을 별 3개로 깨면 결과 창 반반 자리에 "너무 쉬웠나요? 5판으로 건너뛰기"(건너뛴 판은 별 0으로 남음)
   warmSkip(id, n, 별, after?) → resBtns의 pair 버튼 하나 또는 null ---- */
function warmSkip(id, n, st, after){
  if(n !== 1 || st < 3 || (G && G.replay) || advProg(id).max >= 5) return null;
  return { id:'mSkip', label:T('core.map.skip5Q') + '<small>' + T('core.map.skip5Go') + '</small>', cls:'b2', fn:() => {
    const p = advProg(id); p.max = Math.max(p.max, 5); store.set(advKey(id), p);
    if(after) try{ after(p); }catch(_){}
    startGame(id, null, { adv:5 }); } };
}

/* ---- 기록 갱신 도장: 결과 창 기록 옆 "기록 갱신!"(다시 풀어 가장 좋은 기록을 넘었을 때) ---- */
function recHtml(){

}

/* ---- 첫 판 손가락 안내(coach): 게임 정의 coach = [{ at:() => 요소|{x,y}, text:'여기를 눌러요', act:'tap'|'drag'|'swipe', to?:() => 요소|{x,y} }]
   처음 한 번만(hp:coach:<id>). 시계를 멈춘 채 판 위 손가락이 따라 하기를 보여 주고, 사용자가 그 동작을 하면 다음 단계.
   마지막 단계에서 손가락을 대는 순간 시계를 다시 움직여 그 동작은 판에 그대로 들어간다(공식 판 시간에 안내 시간이 들어가지 않음). 대전에서는 안 나옴 ---- */
const HAND_SVG = '<svg viewBox="0 0 48 56" aria-hidden="true"><path d="M17 30V9.5a4 4 0 0 1 8 0V25l.2-3.6a3.8 3.8 0 0 1 7.6.3l-.2 4 .4-2.4a3.7 3.7 0 0 1 7.3 1.1L39.6 37c-.8 9.4-7 15.5-15.3 15.5-6.7 0-10.4-3.4-14.2-9.4L4.7 34.8a3.6 3.6 0 0 1 5.7-4.4z" fill="#fff" stroke="#1A0F45" stroke-width="2.5" stroke-linejoin="round"/><path d="M25 24v8M32.6 26v7M17 30v4" stroke="#1A0F45" stroke-width="2" stroke-linecap="round" opacity=".55"/></svg>';
let COACH = null;
function coachWant(id){ const c = NG[id] && NG[id].coach; return !!(c && c.length && G && G.id === id && !G.duel && !G.over && !store.get('hp:coach:' + id, 0)); }
function coachStart(id, paused){
  coachStop();
  const steps = NG[id].coach || [];
  const el = document.createElement('div'); el.className = 'coach'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', T('core.coach.aria'));
  el.innerHTML = `<div class="ch-hole"></div><div class="ch-hand">${HAND_SVG}</div><p class="ch-tx" aria-live="polite"></p><button class="ch-skip" type="button">${T('core.coach.skip')}</button>`;
  document.body.appendChild(el);
  const C = COACH = { el, id, paused, i:0, a:null, b:null, down:null, h:{} };
  const pos = v => { if(!v) return null; if(v.getBoundingClientRect){ const r = v.getBoundingClientRect(); if(!r.width && !r.height) return null; return { x:r.left + r.width / 2, y:r.top + r.height / 2, r:Math.max(26, Math.min(80, Math.max(r.width, r.height) / 2 + 8)) }; } return isFinite(v.x) && isFinite(v.y) ? { x:v.x, y:v.y, r:v.r || 34 } : null; };
  const finish = () => { store.set('hp:coach:' + id, 1); coachStop(); };
  const show = () => {

/* 대기실·방을 보고 할 일 정하기(0.4초마다 + 대기실이 바뀔 때) */
function duelSearchCheck(S){

/* ======================================================================
   (4) 컴퓨터 상대(사람 같은 속도, docs/21 3-10): 미리 정한 결과를 한 칸씩 계단으로
   ====================================================================== */
function duelAiSched(D){
  const a = D.ai, S = duelStatOf(G.id) || {}, me = duelStatNow();
  const dT = Object.getOwnPropertyDescriptor(a, 'T');
  if(a.smooth || (dT && dT.get)) return { smooth:true };   /* 게임이 직접 움직이는 컴퓨터(예: 실제로 두는 수) */
  const rng = mulberry(seedFrom(D.seed + 'h'));
  const score = S.score || a.pts != null || D.kind === 'score';
  const N = score ? Math.max(4, Math.round(a.T / 6)) : Math.max(1, Math.min(60, me.t != null && !S.tile ? me.t : 12));
  const fEnd = a.ok ? 1 : Math.max(0, Math.min(.99, a.fail || 0));
  const K = a.ok ? N : Math.max(0, Math.floor(N * fEnd));
  const first = 3 + rng() * 3, at = [];
  let tt = first;
  for(let k = 0; k < K; k++){ if(k){ let g = (0.5 + rng() * 1.1); if(rng() < .15) g += (4 + rng() * 4) / Math.max(1, (a.T - first) / Math.max(1, K - 1)); tt += g; } at.push(tt); }
  if(K > 1){ const span = at[K - 1] - first, want = Math.max(1, a.T - first); for(let k = 1; k < K; k++) at[k] = first + (at[k] - first) * want / span; }
  else if(K === 1) at[0] = Math.min(first, a.T);
  /* 틀린 횟수: 기회 3번 게임에서 못 끝내면 3번(기회를 다 씀), 아니면 0~2번 */
  const nm = S.lfMax === 3 && !a.ok ? 3 : Math.floor(rng() * 3), mis = [];
  for(let k = 0; k < nm; k++) mis.push(S.lfMax === 3 && !a.ok && k === nm - 1 ? a.T : 2 + rng() * Math.max(1, a.T - 2));
  mis.sort((x, y) => x - y);
  return { N, K, at, mis, score, keys:null, kOrder:null };
}
function duelAiTick(D, tf){   /* tf: 이 시각(초)까지 한 번에 진행(점수전에서 내가 먼저 끝났을 때 컴퓨터 판을 끝까지) */
  const a = D.ai, P = D.P.ai; if(!a || !P || P.st.dn) return;
  const S = duelStatOf(G.id) || {}, t = tf != null ? tf : elapsed(), st = P.st;
  if(!D.aiS) D.aiS = duelAiSched(D);
  const H = D.aiS, me = duelStatNow();
  if(H.smooth){   /* 예전 방식(연속) */
    st.pg = a.ok ? Math.min(1, Math.pow(Math.max(0, t) / a.T, .9)) : Math.min(a.fail, a.fail * t / a.T);
    if(me.t != null){ st.t = me.t; st.v = Math.min(me.t, Math.floor(st.pg * me.t)); }
  } else {
    const k = H.at.filter(x => x <= t).length, prevV = st.k || 0;
    st.k = k; st.pg = Math.min(1, k / H.N);
    if(k > prevV) st.la = Math.round(D.goSrv + H.at[k - 1] * 1000);
    if(D.kind === 'shared'){ if(me.t != null) st.t = me.t; }
    else if(me.t != null){
      st.t = me.t;
      if(S.tile){ const top = Math.log2(Math.max(4, me.t)); st.v = Math.pow(2, Math.max(1, Math.round(1 + st.pg * (top - 1)))); }
      else if(H.score) st.v = Math.round(st.pg * (a.pts != null ? a.pts : (a.sc || me.t * .5)) / 10) * 10;
      else st.v = Math.min(me.t, k);
    } else st.v = k;
    st.mis = H.mis.filter(x => x <= t).length;
    if(S.lfMax === 3) st.lf = Math.max(0, 3 - st.mis);
    if(S.lfMax === 10) st.lf = Math.max(1, 10 - Math.floor(st.pg * (a.ok ? 3 : 7)));
    /* 선점 게임: 계단마다 남은 키 하나를 차지(같은 씨앗 → 같은 순서). 키 목록은 게임의 duelKeys() */
    if(D.kind === 'shared' && k > (H.claimed || 0)){
      try{ if(!H.keys){ const f = duelNG(G.id).duelKeys; H.keys = f ? (f() || []).map(String) : []; H.kOrder = shuffle(H.keys.slice(), mulberry(seedFrom(D.seed + 'k'))); } }catch(_){ H.keys = []; H.kOrder = []; }
      for(let j = H.claimed || 0; j < k; j++){
        const key = H.kOrder.find(x => !(D.owners || {})[x]);
        if(key != null) P.cl[key] = Math.round(D.goSrv + H.at[j] * 1000);
      }
      H.claimed = k; duelClaimsRecalc(D);
      if(!H.keys.length) st.v = k;
    }
    if(k > prevV) duelOppStep(D, P, prevV);
  }
  if(t >= a.T && !(H.smooth && !a.ok)){
    st.dn = 1; st.ok = a.ok ? 1 : 0; st.sc = a.ok ? (a.sc || 0) : 0;
    if(a.ok){ st.ft = Math.round(D.goSrv + a.T * 1000); st.pg = 1; if(st.t != null && !S.score && !S.tile && D.kind !== 'shared') st.v = st.t; }
    duelOnDone(D, P);
  } else if(H.smooth && t >= a.T){ /* 끝나지 않는 컴퓨터(게임이 끝을 정함) */ }
  duelSyncOpp(D);
}

/* 게임이 컴퓨터 상대를 sec초 늦춤(예: 짝 잇기 얼음 공격을 받은 컴퓨터). 아직 오지 않은 계단과 끝나는 시각을 뒤로 민다 */
function duelAiDelay(sec){
  try{ const D = G && G.duel; if(!D || !D.ai || !D.P.ai || D.P.ai.st.dn || G.over || !(sec > 0)) return false;
    const t = elapsed(); D.ai.T += sec;
    if(D.aiS && Array.isArray(D.aiS.at)) D.aiS.at = D.aiS.at.map(x => x > t ? x + sec : x);
    return true; }catch(_){ return false; }
}

/* 시작 순간: 시계를 정해진 시각에 맞추고 판을 보여 줌(늦게 도착했으면 그만큼 이미 지난 것으로) */

      c.querySelector('.dc-val').innerHTML = left ? T('core.dbar.left') : gone ? T('core.dbar.gone', { n:Math.max(0, 15 - Math.floor((Date.now() - P.gone) / 1000)) }) : named ? `<em>${P.me ? T('core.me') : esc(duelShortNick(P.nick))}</em>` : duelValShort(id, s, D) + (s.dn && D.kind === 'score' ? '<i class="ck">✓</i>' : '');
      c.classList.toggle('first', rk[pid] === 1 && D.go); c.classList.toggle('done', !!(s.dn && D.kind === 'score'));
      c.classList.toggle('gone', !!gone); c.classList.toggle('left', !!left);
      c.classList.toggle('turn', !!(TN && TN.pid === pid));
    });
    return;
  }
  /* 미니 화면 */
  const box = $('#dMinis'); if(!box) return;
  const mini = duelNG(id).duelMini;
  box.querySelectorAll('.dmini').forEach(c => {
    const P = D.P[c.dataset.pid]; if(!P) return; const s = P.st;
    c.querySelector('.dm-val').innerHTML = P.left && !s.dn ? T('core.dbar.left') : duelValShort(id, s, D);
    c.classList.toggle('left', !!(P.left || P.gone)); c.classList.toggle('first', rk[P.pid] === 1 && D.go);
    const b = c.querySelector('.dm-board');
    if(b._s !== P.mv || P.ai){ b._s = P.mv; try{ mini.draw(b, P.mv || '', duelPub3(D, P, rk)); }catch(_){} }   /* 컴퓨터는 판 글자가 없어 매번(게임이 진행 st로 그림) */
  });
  const r = $('#dmRank'); if(r){ r.textContent = D.go ? T('core.d.rank', { n:rk[D.myPid] }) : '-'; r.classList.toggle('first', rk[D.myPid] === 1 && D.go); }
}

/* ---- 큰 알림(docs/21 3-12): 화면 위 30%, 1.2초, 같은 사람 3초에 1번, 판을 가리지 않게 반투명 ---- */
function duelNotify(text, o = {}){
  try{
    const D = G && G.duel; if(!D) return;
    const now = Date.now(), from = o.from || null, key = from ? from.pid : '_';
    D.noteAt = D.noteAt || {};
    if(!o.force && from && now - (D.noteAt[key] || 0) < 3000) return;
    D.noteAt[key] = now;
    let el = $('#dNote');
    if(!el){ el = document.createElement('div'); el.id = 'dNote'; el.className = 'dnote'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); }
    const P = from && D.P ? D.P[from.pid] : null, s = P ? DUEL_SEAT[duelViewSeat(D, P) % 5] : DUEL_SEAT[0];
    el.style.setProperty('--sc', s.col);
    el.className = 'dnote ' + (o.kind || 'info');
    el.innerHTML = `${from ? (from.me ? avatar({ me:true }) : oppAv(from.nick)) : ''}${from ? duelShapeSvg(s.shape, s.col, 14) : ''}<span>${text}</span>`;
    void el.offsetWidth; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), o.ms || 1200);
  }catch(_){}
}
/* 상황별 알림(우선순위·같은 알림 간격) → 큰 알림으로 보여 줌 */
const DPING = {
  oppDone: { pri:5, kind:'end',  sfx:'flHorn', buzz:[30, 40, 30] },
  oppFail: { pri:5, kind:'gray', sfx:'toggle' },
  oppLeft: { pri:5, kind:'gray', sfx:'toggle' },
  oppNet:  { pri:5, kind:'gray', sfx:'toggle' },
  meNet:   { pri:5, kind:'gray', sfx:'toggle', ms:2400 },
  oppBack: { pri:5, kind:'good', sfx:'toast' },
  meLead:  { pri:4, kind:'good', sfx:'star', same:12000 },
  oppLead: { pri:4, kind:'bad',  sfx:'starOff', buzz:20, same:12000 },
  oppHot:  { pri:3, kind:'hot',  sfx:'flPing', once:true },
  last10:  { pri:3, kind:'hot',  sfx:'flPing', once:true },
  oppStep: { pri:2, kind:'info' },
  oppMiss: { pri:2, kind:'info', sfx:'toast', same:15000 },
  oppHit:  { pri:2, kind:'info', sfx:'toast', same:15000 }
};
function duelPing(kind, text, from){
  const D = G && G.duel, P = DPING[kind]; if(!D || !P) return;
  const now = Date.now();
  D.pingAt = D.pingAt || {}; D.pingOnce = D.pingOnce || {};
  if(P.once && D.pingOnce[kind + (from ? from.pid : '')]) return;
  if(P.same && now - (D.pingAt[kind] || 0) < P.same) return;
  if(P.pri < 5 && (!D.go || elapsed() < 3)) return;
  if(P.pri < 5 && now - (D.pingLast || 0) < 1300 && (D.pingPri || 0) > P.pri) return;
  D.pingAt[kind] = D.pingLast = now; D.pingPri = P.pri; D.pingOnce[kind + (from ? from.pid : '')] = 1;
  duelNotify(text, { from:from || (kind === 'meLead' ? { pid:D.myPid, me:true } : null), kind:P.kind, force:P.pri >= 4, ms:P.ms });
  try{ if(P.sfx) sfx(P.sfx, P.sfx === 'star' ? { i:1 } : P.sfx === 'toggle' ? { on:false } : {}); if(P.buzz) fxBuzz(P.buzz); }catch(_){}
}
/* 상대가 하나 찾음(경주): "판다 · 5/9". 5명 대전은 1위가 바뀔 때와 마무리 때만 */
function duelOppStep(D, P, prev){
  if(G.over || D.kind !== 'race') return;
  const s = P.st, S = duelStatOf(G.id) || {};
  if(S.score || S.tile) return;
  const n = D.pl.length, rk = duelRanks();
  const near = s.t != null && s.v >= s.t - 1;
  if(n >= 5){ const lead = D.pl.find(pid => rk[pid] === 1); if(lead === D.lastLead && !near) return; D.lastLead = lead; }
  if(near) duelPing('oppHot', T('core.dn.hot', { name:esc(P.nick) }), P);
  else if(s.t != null) duelNotify(`${esc(P.nick)} · ${s.v}/${s.t}`, { from:P, kind:'info' });
}

/* ======================================================================
   (6) 소식 주고받기 · 판정
   ====================================================================== */
/* 다른 사람들의 presence 읽기 */
function duelRead(){
  const D = G && G.duel; if(!D || D.v !== 3 || D.mode !== 'pvp' || !D.nr) return;
  let ps = []; try{ ps = D.nr.peers(); }catch(_){ return; }
  const seen = {}; let dirty = false;
  for(const p of ps){
    if(p.sameTab) continue;
    const q = p.presence || {}, pid = q.pid || ('p:' + p.peer), P = D.P[pid];
    if(!P || P.me) continue;
    seen[pid] = 1; P.peer = p.peer;
    if(P.gone && !P.left){ P.gone = 0; if(!G.over) duelPing('oppBack', T('core.dn.back', { name:esc(P.nick) }), P); }
    if(D.startAt == null && typeof q.go === 'number' && (q.r == null || q.r === D.r)) D.startAt = duelLocalStart(q.go);
    if(q.rr != null && q.rr !== D.r) continue;   /* 지난 판 값 */
    const sig = JSON.stringify(q); if(sig !== P.sig){ P.sig = sig; P.msgAt = Date.now(); }
    if(q.q && !q.dn && !P.st.dn){ duelLeft(D, P); continue; }
    if(!D.go) continue;
    const st = P.st, prevV = st.v != null ? st.v : 0, prevLf = st.lf;
    if(typeof q.pg === 'number') st.pg = Math.max(st.pg || 0, Math.min(1, q.pg));
    for(const k of D.kind === 'shared' ? ['t', 'lf', 'mis', 'sc', 'ft'] : ['v', 't', 'lf', 'mis', 'la', 'sc', 'ft', 'tb']) if(typeof q[k] === 'number') st[k] = q[k];
    if(q.ok) st.ok = 1;
    if(D.kind === 'shared' && q.cl && typeof q.cl === 'object'){ const s2 = JSON.stringify(q.cl); if(s2 !== P.clSig){ P.clSig = s2; P.cl = Object.assign({}, q.cl); dirty = true; } }
    if(typeof q.mv === 'string') P.mv = q.mv.slice(0, 400);
    duelEvRead(D, P, q.ev);
    if(!G.over && !st.dn){
      if(D.kind === 'race' && typeof st.v === 'number' && st.v > prevV) duelOppStep(D, P, prevV);
      const S = duelStatOf(G.id) || {};
      if(S.lfMax === 3 && prevLf != null && st.lf < prevLf && st.lf > 0) duelPing('oppMiss', T('core.dn.miss', { name:esc(P.nick) }), P);
    }
    if(q.dn && !st.dn){ st.dn = 1; st.ge = q.ge ? 1 : 0; if(!q.ok) st.ok = 0; duelOnDone(D, P); }
  }
  if(dirty) duelClaimsRecalc(D);
  for(const pid of D.pl){ const P = D.P[pid]; if(P.me || P.ai || P.left || P.st.dn) continue; if(!seen[pid] && !P.gone){ P.gone = Date.now(); if(!G.over) duelPing('oppNet', T('core.dn.net', { name:esc(P.nick) }), P); } }
  if(D.kind === 'turn' && D.turn) duelTurnDrain(D);
  duelSyncOpp(D);
}
/* 예전 이름(1:1 게임이 G.duel.opp·oppPeer를 읽음): 첫 상대 값 맞추기 */
function duelSyncOpp(D){
  const P = D.P[D.pl.find(p => p !== D.myPid)]; if(!P) return;
  D.opp.nick = P.nick; D.opp.pg = P.st.pg || 0; D.opp.dn = P.st.dn ? 1 : 0; D.opp.sc = P.st.sc || 0;
  if(P.peer) D.oppPeer = P.peer; D.oppLeft = !!P.left; D.oppStat = P.st;
}
/* 다른 사람이 끝남 */
function duelOnDone(D, P){
  if(!G.over){
    if(P.st.ok && D.end === 'first'){ let tx = ''; try{ const f = duelNG(G.id).duelDoneMsg; if(f) tx = f(esc(P.nick)) || ''; }catch(_){} duelPing('oppDone', tx || T('core.dn.done', { name:esc(P.nick) }), P); }
    else if(!P.st.ok && D.kind === 'race') duelPing('oppFail', T('core.dn.stop', { name:esc(P.nick), r:duelRowTxt(D, P.st, false) }), P);
  } else try{ sfx(P.st.ok ? 'flPing' : 'toggle'); }catch(_){}
  duelJudge(D);
  duelRender();
}
function duelLeft(D, P){
  if(P.left) return;
  P.left = true; P.gone = 0;
  if(!G.over) duelPing('oppLeft', T('core.dn.left', { name:esc(P.nick) }), P);
  if(D.kind === 'turn' && D.turn && D.turn.pid === P.pid) duelTurnTick(D);
  duelSyncOpp(D);
  duelJudge(D);
  duelRender();
}
/* 끝나는 규칙(대표 의견 1): 경주는 누가 다 풀면 0.7초 뒤 모두 끝. 혼자 남았는데 이미 1위면 끝. 점수는 모두 끝나거나 시간. 선점·차례는 게임이 */
function duelJudge(D){
  if(!D.go) return;
  const others = D.pl.filter(p => p !== D.myPid).map(p => D.P[p]);
  if(G.over){ if(D.fin && !D.resolved && others.every(P => P.st.dn || P.left || P.ai)) duelResolveSoon(D); return; }
  if(D.end === 'first'){ const f = others.find(P => P.st.dn && P.st.ok); if(f){ if(!D.endBy) D.endBy = { k:'first', pid:f.pid }; duelCutSoon('done', typeof f.st.ft === 'number' ? f.st.ft + 700 : null); return; } }
  if(D.end === 'game'){ const f = others.find(P => P.st.dn && P.st.ge); if(f){ if(!D.endBy) D.endBy = { k:'game' }; duelCutSoon('game'); return; } }
  const active = others.filter(P => !P.left && !P.st.dn);
  if(active.length) return;
  if(others.every(P => P.left && !P.st.dn)){ if(!D.endBy) D.endBy = { k:'left' }; duelCutSoon('left'); return; }
  if(D.end === 'first' || (D.end === 'game' && D.kind === 'shared')){
    const rk = duelRanks();
    if(rk[D.myPid] === 1 && !duelTieAt(rk, D.myPid)){ if(!D.endBy) D.endBy = { k:'ahead' }; duelCutSoon('ahead'); }
  }
}
/* 한쪽이 끝나면(다 풂·나감) 다른 쪽 판도 끝난다. 끝난 쪽은 결과 뒤 '계속 풀기'로 혼자 이어 풀 수 있다(기록 안 됨) */
/* atSrv(서버 ms)를 주면 그 시각에 끝냄 → 소식이 늦게 와도 모두 같은 순간(다 푼 시각 + 0.7초)에 끝남 */
function duelCutSoon(why, atSrv){
  const D = G && G.duel, me = G; if(!D || D.fleet || G.over || D.cutT) return;
  D.cutStat = duelStatNow();   /* 알림을 보여 주는 동안에도 값이 바뀌지 않게 지금 값을 먼저 저장 */
  const ms = typeof atSrv === 'number' ? Math.max(150, Math.min(700, atSrv - duelSrv())) : 700;
  D.cutT = setTimeout(() => { if(G === me && !G.over && G.duel === D) duelCut(why); }, ms);
}
function duelCut(why){
  const D = G && G.duel; if(!D || D.fleet || G.over) return;
  if(D.v === 3){ try{ const s = duelStatNow(); D.cutStat = !D.cutStat || (s.v || 0) >= (D.cutStat.v || 0) ? s : D.cutStat; }catch(_){} }   /* 잘리기 직전 값(0% 버그) */
  D.cut = why; D.cutSec = elapsed();
  finish(false);
}
function duelCanContinue(){
  const D = G && G.duel;
  return !!(D && !D.fleet && D.cut && D.cut !== 'game' && G.over && !(D.fin ? D.fin.ok : D.me && D.me.sc) && NG[G.id] && NG[G.id].render);
}
/* 결과 창에 붙이는 '계속 풀기' 버튼(사이트·모듈 결과 창이 같이 씀) */
function duelContinueHtml(){
  return duelCanContinue() ? `<button class="btn secondary block dcont" id="mCont">${ic('play')} ${T('core.dc.cont')} <small>${T('core.dc.contSub')}</small></button>` : '';
}
function duelContinueBind(){ const b = $('#mCont'); if(b) b.onclick = duelContinue; }
function duelContinue(){
  if(!duelCanContinue()) return;
  const D = G.duel, id = G.id, sec = D.cutSec || 0;

  duelClose();
  Object.assign(G, { duel:null, practice:true, over:false, paused:false, pauseAt:0, pausedMs:0, start:Date.now() - sec * 1000, lt:0 });

  clearInterval(tick); tick = setInterval(updateClock, 250); updateClock();

/* 계속 풀기 판이 끝남 */
function practiceFinish(win){

/* 내 연결이 20초 넘게 끊김: 결과를 주고받을 수 없어서 무승부로 처리 */
function duelMyNetLost(){
  const D = G && G.duel; if(!D || D.netLost || D.resolved) return;
  D.netLost = true;
  if(!G.over) duelPing('meNet', T('core.dn.meLost'));
  if(G.over && D.fin) duelResolve();
}
/* 연결 상태 점검(게임 중·대기 창 모두): 끊긴 사람 15초 유예, 내 연결 끊김/복구 알림 */
function duelNetCheck(){
  const D = G && G.duel; if(!D || D.v !== 3 || D.mode !== 'pvp') return;
  for(const pid of D.pl){ const P = D.P[pid]; if(P.gone && !P.left && !P.st.dn && Date.now() - P.gone > 15000) duelLeft(D, P); }
  if(!D.netLost && D.go){
    const up = typeof netUp === 'function' ? netUp() : true;
    if(!up && !D.netDown){ D.netDown = Date.now(); if(!G.over) duelPing('meNet', T('core.dn.meDown')); }
    else if(up && D.netDown){ D.netDown = 0; if(!G.over) duelPing('oppBack', T('core.dn.meBack')); duelPub(true); }
  }
}
/* 내 진행 보내기: 0.8초마다, 급할 때(기회 잃음·끝남·사건·선점) 바로(최소 0.15초 간격) */
function duelPub(force){
  const D = G && G.duel; if(!D || D.v !== 3 || D.mode !== 'pvp' || !D.nr || !D.go) return;
  const s = G.over && D.fin ? D.fin : duelStatNow(), now = Date.now();
  const o = Object.assign({ pid:D.myPid, nk:D.myNick, rr:D.r }, s);
  if(D.evLog) o.ev = D.evLog;
  if(D.kind === 'shared') o.cl = D.P[D.myPid].cl;
  const mini = duelNG(G.id).duelMini;
  if(mini && !G.over && now - (D.mvAt || 0) > 700){ try{ const m = mini.get(); if(typeof m === 'string'){ D.mv = m.slice(0, 400); D.mvAt = now; } }catch(_){} }
  if(D.mv != null) o.mv = D.mv;
  const sig = JSON.stringify(o), urgent = D.urgent || (D.meStatLf != null && s.lf != null && s.lf < D.meStatLf);
  if(!force && sig === D.pubSig && now - D.lastPub < 5000) return;
  if(!force && !(urgent && now - D.lastPub > 150) && now - D.lastPub < 800) return;
  D.lastPub = now; D.pubSig = sig; D.meStatLf = s.lf; D.urgent = false;
  try{ D.nr.presence(Object.assign({ hb:(D.hb = (D.hb || 0) + 1) }, o)).catch(() => {}); }catch(_){}
}
/* 대전 규칙 목록: 게임 정의 duelHelp([[제목, 설명], …], 선택)가 있으면 그것, 없으면 help */
function duelHelpOf(id){ try{ const h = (NG[id] || {}).duelHelp; const r = typeof h === 'function' ? h() : h; if(Array.isArray(r) && r.length) return r; }catch(_){} return HELP[id] || []; }
function duelTick(){
  const D = G && G.duel; if(!D || D.fleet) return;
  if(D.v !== 3) return;
  if(!D.go){ duelRender(); return; }
  if(D.mode === 'ai' && !G.over) duelAiTick(D);
  if(D.mode === 'pvp'){ duelRead(); duelNetCheck(); if(!G.over) duelPub(false); }
  duelTurnTick(D);
  if(!G.over){
    duelJudge(D);
    const S = duelStatOf(G.id) || {}, st = duelStatNow();
    if(S.score && st && st.left != null && st.left <= 3){   /* 남은 수(st.left)는 게임의 duelStat.get이 줌 */ const o = D.P[D.pl.find(p => p !== D.myPid)]; duelPing('last10', T('core.dn.last3', { name:esc(o.nick), n:fmt(o.st.v || 0) })); }
    if(st && D.mode === 'ai' && D.P.ai && !D.P.ai.st.dn && D.kind === 'race' && D.P.ai.st.t != null && D.P.ai.st.v >= D.P.ai.st.t - 1) duelPing('oppHot', T('core.dn.hot', { name:esc(D.P.ai.nick) }), D.P.ai);
  }
  duelRender();
}

/* ---- 먼저 끝냈을 때 대기 창(아직 하는 사람이 있을 때) ---- */

      if(v2) raw.push(...(GM.list[key] || []));   /* 새 낱말은 그 분류 끝에(겹친 낱말은 아래에서 빠짐) */

  /* 빼는 목록을 쓰는 날인가: 판 날짜(대전은 씨앗 안 날짜, 그 밖은 오늘) ≥ CHOSUNG_ASK_FROM → 그 전 날짜의 문제는 예전 그대로 */

  /* ----- 개념 사이클(난이도 v2): 새 규칙 11·21·31·41, 변주 6·16·26·36·46 ----- */

  const RULE_TIP = { long:'세·네 글자', hidecat:'분류를 숨겼어요', blank:'? = 가린 초성', saying:'속담·사자성어', flash:'시간이 짧아요', bare:'힌트 없음', tight:'두 번 틀리면 끝', first:'첫 글자 열림', tick:'틀리면 −3초' };
  const TICK_SEC = 3, LIVES_TIGHT = 2;

  /* ----- 솔로 난이도 표 -----

  const LT = {
    ch1:[6, 6, 7, 7, 8, 6, 7, 8, 6, 9],
    base:[0, 0, 8, 9, 10, 10, 11],
    kOff:[0, -2, -1, 0, 0, 2, -1, 0, 1, -2, 2],
    spq:[0, 19, 17, 15.5, 14.5, 14, 13.5],   /* v1.3.0: 챕터 1·2 여유를 늘림(17→19, 16→17, 15→15.5) */
    kTime:[0, 1.15, 1.05, 1.0, 1.0, 0.9, 1.1, 1.0, 1.0, 1.1, 0.85],
    mjTime:{ long:1.05, hidecat:1.1, blank:1.15, saying:1.3 },
    twTime:{ flash:0.7, bare:1.1, tight:1.0, first:0.55, tick:1.05 }
  };
  function stageCfg(n){
    const p = planOf('chosung', n), c = p.c, k = p.k, mj = p.mj || [], tw = p.tw, has = x => mj.includes(x);
    let q = c === 1 ? LT.ch1[k - 1] : LT.base[Math.min(c, LT.base.length - 1)] + LT.kOff[k];
    q = Math.max(5, Math.min(14, q));
    const easyCats = c === 1;
    let minLen = 2, maxLen = c === 1 && k <= 4 ? 3 : 4;
    if(has('long') || has('blank')) minLen = 3;
    const maxCand = p.boss ? 2 : p.hard ? 3 : p.easy ? 6 : 4;
    const say = has('saying') ? Math.max(2, Math.round(q * (k === 1 ? .3 : .4))) : 0;
    const hide = has('hidecat') ? (has('blank') ? Math.floor((q - say) / 2) : q) : 0;   /* 빈 초성과 함께면 절반만 비밀 분류 */
    const blank = has('blank') ? Math.ceil((q - say) * .7) : 0;

    /* 챕터 1(첫소리 마을): 아주 쉬운 기본 낱말 먼저(basic) + 뜻풀이를 처음부터 무료로 보여 줌(glFree), 힌트 5 */
    return { q, minLen, maxLen, easy:easyCats ? 1 : 0, maxCand, say, hide, blank, first:tw === 'first', limit, hints, skips, basic:c === 1 ? 1 : 0, glFree:c === 1 ? 1 : 0,
      lives:tw === 'tight' ? LIVES_TIGHT : 0, tick:tw === 'tick' ? TICK_SEC : 0, boss:p.boss, hard:p.hard, mj:mj.slice(), tw, n };

  /* ===== 문제 세트 만들기(rng만): 같은 판에 같은 낱말·같은 (분류, 초성) 금지, 정답 후보가 너무 많은 초성은 피한다 ===== */
  function makeSet(cfg, rng){
    const d = dict(!!cfg.v2), q = cfg.q, say = Math.min(cfg.say || 0, q - 1), reg = q - say;
    const usedW = new Set(), usedCC = new Set(), perCat = {}, cap = Math.max(2, Math.ceil(reg / 4));
    let pool = shuffle(d.cats.filter(c => !c.special && (!cfg.easy || c.easy)).flatMap(c => c.words).filter(o => o.len >= (cfg.minLen || 2) && o.len <= (cfg.maxLen || 4)), rng);

    if(cfg.v2 && cfg.basic) pool = part(pool, o => o.basic);   /* 아주 쉬운 기본 낱말 먼저 */
    if(av) pool = part(pool, o => !av.has(o.n));          /* 최근에 나온 낱말은 맨 뒤로(모자랄 때만 다시 씀) */
    const out = [];
    const cands = (o, hide) => hide ? d.allCho[o.cho] : d.byCC[o.cat + ':' + o.cho];
    /* 두 번 훑는다: 처음엔 엄격하게(후보 수·분류 고르게·같은 분류 연달아 금지), 모자라면 너그럽게 */
    for(let pass = 0; pass < 3 && out.length < reg; pass++){

        const cs = cands(o, hide);
        if(cs.length > maxC || cs.some(x => usedW.has(x.n))) continue;   /* 한 낱말이 두 문제의 정답이 되지 않게 */
        if(pass === 0 && ((perCat[o.cat] || 0) >= cap || (out.length && out[out.length - 1].cat === o.cat))) continue;
        out.push(o); cs.forEach(x => usedW.add(x.n)); usedCC.add(cc); perCat[o.cat] = (perCat[o.cat] || 0) + 1;

    }

      const hide = i < (cfg.hide || 0);

    });

      if(out0){ id = id.filter(o => !out0.has(o.n)); sy = sy.filter(o => !out0.has(o.n)); }

  }

  function msg(html, cls){ const e = $('#csMsg'); if(!e) return; e.className = 'cs-msg ' + (cls || ''); e.innerHTML = html; }
  function baseMsg(){

  function tilesHtml(p, show, cls){

/* 오늘의 문제: 요일 난이도(월·화 쉬움 · 수·목·금 보통 · 토·일 어려움) + 날짜 씨앗 → 하루퍼즐 리그 사이트·다른 모든 사이트와 같은 문제 */
function embDailyLv(){ const w = new Date().getDay(); return w === 1 || w === 2 ? 'easy' : w === 0 || w === 6 ? 'hard' : 'normal'; }
function embDay(){ return store.get('hp:eday:' + dayKey(), null) || { best:0, first:null, tries:0 }; }
function embDaySave(r){ store.set('hp:eday:' + dayKey(), r); }
const embHas = m => EMB.modes.includes(m);

/* ---- 바깥으로 알리기: 부모 창(iframe) · 앱(WebView) 모두 ---- */
function embEmit(type, data){
  const msg = Object.assign({ source:'haru-puzzle', type, game:EMB.id, ver:EMB_VER }, data || {});
  try{ if(window.parent && window.parent !== window) window.parent.postMessage(msg, EMB.origin); }catch(_){}
  const json = JSON.stringify(msg);
  try{ if(window.ReactNativeWebView) window.ReactNativeWebView.postMessage(json); }catch(_){}                         /* React Native */
  try{ if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.haruPuzzle) window.webkit.messageHandlers.haruPuzzle.postMessage(msg); }catch(_){}   /* iOS WKWebView */
  try{ if(window.HaruPuzzle && typeof window.HaruPuzzle.postMessage === 'function') window.HaruPuzzle.postMessage(json); }catch(_){}   /* Android addJavascriptInterface · Flutter JavaScriptChannel */
  try{ window.dispatchEvent(new CustomEvent('haru-puzzle', { detail:msg })); }catch(_){}
}
/* 앱·부모 창이 다시 넣어 주는 기록(서버에 저장해 둔 진행 상황 등) */
function embState(){ return { solo:advProg(EMB.id), daily:embDay(), duel:(duelRec()[EMB.id] || { w:0, d:0, l:0 }) }; }
function embRestore(s){
  if(!s) return;
  if(s.solo && typeof s.solo === 'object') store.set(advKey(EMB.id), { max:Math.max(1, s.solo.max | 0), stars:s.solo.stars || {} });
  if(s.daily && typeof s.daily === 'object') embDaySave(Object.assign(embDay(), s.daily));
  if(!G || G.over) embMenu();
}

/* ---- 모드 시작 ---- */
function embStart(mode, opt){
  const id = EMB.id, m = NG[id]; opt = opt || {};
  if(!embHas(mode)) mode = EMB.modes[0];
  closeModal();
  EMB.cur = mode;
  if(mode === 'daily'){ startGame(id, embDailyLv()); return; }
  if(mode === 'solo'){
    const p = advProg(id), want = opt.stage || EMB.stage || p.max;
    startGame(id, null, { adv:EMB.unlock ? Math.max(1, want) : Math.max(1, Math.min(want, p.max)) }); return;
  }
  if(mode === 'practice'){
    const lv = opt.level || EMB.level;
    if(!lv && m.levelSheet){ m.levelSheet(); return; }   /* 함대: 실시간/AI 고르는 창 */
    if(!lv){ embLevelSheet(); return; }
    startGame(id, lv, { seed:'prac:' + id + ':' + Date.now() + ':' + Math.random() }); return;
  }
  if(mode === 'duel'){ if(EMB.room) embRoomDuel(); else duelStart(id); return; }
}
/* 방 코드 대전(주소 옵션 room=코드): 같은 코드로 연 사람끼리 대전 방 'fl-d3-e-<코드>-<판>'에 모여 같은 순간 시작(2명 이상, 그 게임 최대 인원까지).
   12초 안에 혼자면 계속 기다림. 사이트의 대전 방과는 따로(모듈끼리만) */
function embRoomDuel(rd){
  const id = EMB.id, code = EMB.room, n = duelMaxOf(id); EMB.cur = 'duel';
  rd = rd || EMB.roomRd + 1;
  if(!duelLive()){ toast(T('core.room.offline')); embMenu(); return; }
  let stop = false;
  openModal(`<div class="rmwait"><span class="ds-radar"><i></i><i></i><i></i></span><p class="note"><b>${T('core.room.code', { code:esc(code.length === 6 ? code.slice(0, 3) + ' ' + code.slice(3) : code) })}</b> · ${T('core.room.rd', { n:rd })}<br>${T('core.room.wait')}${n > 2 ? ' · ' + T('core.room.max', { n }) : ''}</p></div><div class="mbtns one"><button class="b2" id="erNo">${T('core.cancel')}</button></div>`);
  const h = duelPrivate(id, 'normal', 'fl-d3-e-' + code.toLowerCase() + '-' + rd, { n, round:rd, pace:duelPaceGet(), room:{ id:code, code, rd },
    onFail:why => { if(stop) return; if(why === 'gone' && $('#erNo')){ embRoomDuel(rd); return; } closeModal(); toast(why === 'offline' ? T('core.room.offline2') : T('core.room.fail')); embMenu(); } });
  EMB.roomRd = rd;
  $('#erNo').onclick = () => { stop = true; h.cancel(); embMenu(); };
}
function embLevelSheet(){
  const id = EMB.id, m = NG[id];
  const rows = Object.keys(LEVELS).map((k, i) => `<button class="opt" data-lv="${k}"><span class="lvdots">${[0, 1, 2].map(j => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</span><span><b>${LEVELS[k].name}</b><small>${m.levelDesc(k)} · ${T('core.prac.max', { n:fmt(maxPts(id, k)) })}</small></span><span></span></button>`).join('');
  openModal(`<h3>${T('core.prac.title', { name:m.name })}</h3><p class="note">${T('core.prac.note')}</p><div class="opts">${rows}</div><div class="mbtns one"><button class="b2" id="mClose">${T('core.close')}</button></div>`);
  document.querySelectorAll('#modal .opt').forEach(b => b.onclick = () => { store.set('hp:lv:' + id, b.dataset.lv); closeModal(); embStart('practice', { level:b.dataset.lv }); });
  $('#mClose').onclick = closeModal;
}

/* ---- 첫 화면 ---- */
function embMenu(){
  if(G && !G.over) return;
  leavePlay(); closeModal();
  $('#play').style.display = 'none';
  const id = EMB.id, m = NG[id], el = $('#menu'), r = embDay(), p = advProg(id), lv = embDailyLv(), R = duelRec()[id] || { w:0, d:0, l:0 };
  el.hidden = false; el.style.setProperty('--gc', m.col[1]);
  const row = (k, icon, title, sub) => `<button class="em-go ${k}" data-m="${k}"><span class="em-i">${icon}</span><span class="em-t"><b>${title}</b><small>${sub}</small></span>${ic('chev')}</button>`;
  el.innerHTML = `<div class="em-card panel"><span class="g-art">${ART[id]()}</span><div class="em-nm"><b>${m.name}</b><small>${m.abil} · ${m.time}</small></div></div>
    <div class="em-list">
      ${embHas('daily') ? row('daily', ic('clock'), T('core.m.daily'), `${T('core.m.dailySub', { wd:EMB_WD[new Date().getDay()], lv:LEVELS[lv].name })}${r.tries ? ' · ' + T('core.m.todayBest', { n:fmt(r.best) }) : ''}`) : ''}
      ${embHas('solo') ? row('solo', ic('map'), T('core.m.solo', { n:p.max }), `${chName(id, chOf(p.max))} · ${T('core.m.stars', { n:advStarsOf(id) })}${conceptsOf(id) ? ' · ' + T('core.m.every5') : ''}${m.cardNote ? ' · ' + esc(m.cardNote()) : ''}`) + `<button class="em-map" id="emMap">${ic('map')} ${T('core.m.map')}</button>` : ''}
      ${embHas('practice') ? row('practice', ic('play'), T('core.m.prac'), m.levelSheet ? T('core.m.pracSub2') : T('core.m.pracSub')) : ''}
      ${embHas('duel') ? row('duel', ic('duel'), duelMaxOf(id) > 2 ? T('core.m.duelN', { n:duelMaxOf(id) }) : T('core.m.duel1'), `${EMB.room ? T('core.room.code', { code:esc(EMB.room) }) + ' · ' : ''}${m.duelHow || T('core.m.duelHow')}${R.w + R.d + R.l ? ' · ' + T('core.m.duelRec', { w:R.w, n:R.w + R.d + R.l }) : ''}${m.cardNote ? ' · ' + esc(m.cardNote()) : ''}`) : ''}
    </div>
    <div class="em-foot"><button id="emHelp">${T('core.m.help')}</button><button id="emBig" aria-pressed="${bigOn()}">${bigOn() ? T('core.m.bigOn') : T('core.m.bigOff')}</button>${EMB.close ? `<button id="emClose">${T('core.m.close')}</button>` : ''}</div>`;
  el.querySelectorAll('.em-go').forEach(b => b.onclick = () => embStart(b.dataset.m));
  const mp = $('#emMap'); if(mp) mp.onclick = () => openAdvMap(id);
  $('#emHelp').onclick = () => openHelp(id);
  $('#emBig').onclick = () => { bigSet(!bigOn()); embEmit('setting', { big:bigOn() }); embMenu(); };   /* 큰 글씨(WP3): 글자 +2px */
  const cl = $('#emClose'); if(cl) cl.onclick = () => embEmit('close');
  window.scrollTo(0, 0);
  embEmit('menu');
}

/* ---- 결과 ---- */
function embCount(score, prefix){
  const el = $('#bigScore'); if(!el) return;
  const t0 = performance.now(), dur = FXR.reduce ? 0 : 900; let lastTk = 0;
  const step = t => { const k = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3); el.textContent = (prefix || '') + fmt(Math.round(score * e));
    if(k < 1){ if(t - lastTk > 55){ lastTk = t; sfx('tick', { p:e }); } requestAnimationFrame(step); }
    else if(el.isConnected){ el.classList.add('land'); sfx('ding'); fxPop(el, 'gold'); fxBuzz(20); } };
  requestAnimationFrame(step);
}
/* 결과 창 버튼: 사이트와 같은 위계(주 버튼 1개 · 글자 버튼 줄). 버튼 id(#mPri·#mSec·#mGh)와 이벤트는 그대로 */
function embRes(pri, sec, extra){
  return { pri:{ id:'mPri', label:pri[0], sub:pri[2], fn:pri[1] }, links:[{ id:'mSec', label:sec[0], fn:sec[1] }].concat(extra || []) };
}
function embButtons(pri, sec, extra){ return resBtns(embRes(pri, sec, extra)); }
function embBind(pri, sec, extra){ resBind(embRes(pri, sec, extra)); }
/* 오늘의 문제 · 연습 */
function embPlayFinish(win){
  const id = G.id, m = NG[id], daily = EMB.cur === 'daily', sec = Math.round(elapsed());
  const q = win ? calcScore() : null, part = !win && daily ? Math.round(gameProg() * 300) : 0, score = win ? q.score : part;
  let rec = null;
  if(daily){ rec = embDay(); if(G.attempt === 1) rec.first = score; rec.best = Math.max(rec.best || 0, score); embDaySave(rec); }
  embEmit('finish', { mode:EMB.cur, win, score, level:G.lv, attempt:G.attempt, official:daily && G.attempt === 1, partial:!win && part > 0, time:sec, date:dayKey(),
    detail:q ? { base:q.base, bonus:q.time, extra:q.paw, rows:[q.l1, q.l2, q.l3], mult:G.L.mult } : null });
  const again = () => daily ? startGame(id, embDailyLv()) : embStart('practice', { level:G.lv });
  let html;
  if(win){
    html = `<div class="burst" aria-hidden="true"></div><h3 class="ok">${resFace('joy')}${m.winTitle || T('core.res.clearShort')}</h3><div class="big" id="bigScore">0</div>
      <p class="note">${daily ? (G.attempt === 1 ? T('core.res.dailyFirst') : T('core.m.todayBest', { n:fmt(rec.best) })) : T('core.res.prac', { lv:G.L.name })}</p>
      <details class="brk"><summary>${T('core.res.detail')}</summary><div><span>${q.l1}</span><b>${q.base}</b></div><div><span>${q.l2}</span><b>${q.time}</b></div><div><span>${q.l3}</span><b>${q.paw}</b></div>${G.L.mult !== 1 ? `<div><span>${T('core.res.mult')}</span><b>×${G.L.mult}</b></div>` : ''}</details>`;
  } else {
    html = `<h3 class="bad">${resFace('sad')}${m.loseTitle || T('core.res.failTitle')}</h3><p class="lose">${daily && part ? T('core.res.partial', { n:fmt(part) }) : T('core.res.fail')}</p><p class="note">${lossProgress()} ${daily ? T('core.res.dailyRetry') : T('core.res.tryAgain')}</p>`;
  }
  const pri = [daily ? T('core.res.samePuzzle') : T('core.res.newPuzzle'), again, daily ? (G.attempt === 1 ? T('core.res.firstKept') : T('core.res.bestKept')) : T('core.res.lv', { lv:G.L.name })], sc = [T('core.res.home'), embMenu];
  html += embButtons(pri, sc);
  setTimeout(() => {
    openModal(html); embBind(pri, sc);
    if(win && !m.noConfetti) fxConfetti();
    sfx(win ? 'result' : 'lose');
    if(win) embCount(score);
  }, win ? 500 : 250);
}
/* 솔로 */
function embSoloFinish(win){
  const id = G.id, n = G.adv, p = advProg(id), prev = p.stars[n] || 0, sec = Math.round(elapsed());
  let st = 0, first = false, better = false;
  if(win){ st = advStarCalc(); first = !prev; better = st > prev; p.stars[n] = Math.max(prev, st); p.max = Math.max(p.max, n + 1); store.set(advKey(id), p); }
  embEmit('finish', { mode:'solo', win, stage:n, stars:st, first, best:p.stars[n] || 0, time:sec });
  embEmit('progress', { solo:{ max:p.max, stars:p.stars, total:advStarsOf(id) } });
  const c = chOf(n), cs = (c - 1) * 10;
  let dots = ''; for(let k = 1; k <= 10; k++){ const s = p.stars[cs + k] || 0; dots += `<i class="${s ? 's' + s : cs + k === p.max ? 'cur' : ''}"></i>`; }
  const chBox = `<div class="chprog" style="--gc:${GCOL[id][1]}"><div class="h">${chName(id, c)} <small>${T('core.map.chapter', { c, s:chStars(id, c) })}</small></div><div class="chdots">${dots}</div></div>`;
  let html;
  if(win){
    html = `<div class="burst" aria-hidden="true"></div><h3 class="ok">${resFace('joy')}${T('core.res.clear', { n })}</h3>
      <div class="bigstars" aria-label="${T('core.res.starsAria', { n:st })}">${[1, 2, 3].map(i => `<span class="s${i <= st ? '' : ' off'}" style="animation-delay:${(0.1 + i * 0.22).toFixed(2)}s">${STAR_G}</span>`).join('')}</div>
      ${first ? '<span class="pill new">' + T('core.res.firstClear') + '</span>' : better ? '<span class="pill new">' + T('core.res.starBest') + '</span>' : `<p class="note">${T('core.res.starKept', { n:p.stars[n] })}</p>`}
      ${recHtml()}${chBox}<p class="note">${st === 3 ? T('core.res.perfect') : T('core.res.moreStars') + ' · ' + ADV_RULE[id].split(' · ')[st]}</p>`;
  } else {
    html = `<h3 class="bad">${resFace('sad')}${T('core.res.fail')}</h3><p class="lose">${T('core.stageN', { n })}</p><p class="note">${lossProgress()} ${T('core.res.failNote')}</p>${chBox}`;
  }
  const pri = win ? [T('core.res.next'), () => startGame(id, null, { adv:n + 1 })] : [T('core.res.retry'), () => startGame(id, null, { adv:n })];
  const sc = [`${ic('map')}${T('core.res.map')}`, () => { embMenu(); openAdvMap(id, win ? n + 1 : n); }], gh = [{ id:'mGh', label:T('core.res.home'), fn:embMenu }];
  const RB = embRes(pri, sc, gh);
  RB.pair = [ win ? warmSkip(id, n, st, p2 => embEmit('progress', { solo:{ max:p2.max, stars:p2.stars, total:advStarsOf(id) } })) : null ];   /* 몸풀기 1판 ★3 → 5판으로 */
  html += resBtns(RB);
  setTimeout(() => {
    openModal(html); resBind(RB); recFx();
    if(win){
      fxConfetti(); sfx('result');
      document.querySelectorAll('#modal .bigstars .s').forEach((s, k) => setTimeout(() => {
        if(!s.isConnected) return;
        if(s.classList.contains('off')){ sfx('starOff'); return; }
        sfx('star', { i:k + 1 }); fxPop(s, 'gold'); fxBuzz(18);
      }, (0.1 + (k + 1) * 0.22) * 1000 + 180));
    } else sfx('lose');
  }, win ? 500 : 250);
}
/* 대전: 사이트와 같은 배치(큰 순위 → 순위표 → 버튼), 포인트 대신 "대전 기록". finish 이벤트는 더하기만(rank·players·kind·round·room) */
const EMB_CROWN = `<svg class="dcrown" viewBox="0 0 32 24" aria-hidden="true"><path d="M3 7l6.5 6L16 3l6.5 10L29 7l-3 14H6z" fill="#FFC93C" stroke="#1A0F45" stroke-width="2.4" stroke-linejoin="round"/><circle cx="16" cy="15.5" r="2.2" fill="#F0368A" stroke="#1A0F45" stroke-width="1.4"/></svg>`;
function embDuelFallback(r, a, b){
  const D = G.duel, ai = D.mode === 'ai' || (D.fleet && G.mode !== 'pvp' && G.lv !== 'pvp'), tx = x => x && x.txt ? x.txt : x && x.sc ? T('core.pts', { n:fmt(x.sc) }) : '';
  return { kind:'turn', n:2, ai, rank:r === 'l' ? 2 : 1, tie:r === 'd', why:duelWhy(r, a, b), round:null, room:{ code:null, canAgain:false },
    rows:[ { pid:'me', nick:T('core.me'), me:true, col:DUEL_SEAT[0].col, shape:DUEL_SEAT[0].shape, rank:r === 'l' ? 2 : 1, txt:tx(a) },
      { pid:'op', nick:(D.opp && D.opp.nick) || T('core.opp'), ai, col:DUEL_SEAT[1].col, shape:DUEL_SEAT[1].shape, rank:r === 'w' ? 2 : 1, txt:tx(b) } ].sort((x, y) => x.rank - y.rank) };
}
function embDuelResult(r, a, b, res){
  const D = G.duel, id = G.id, R = res && res.rows ? res : embDuelFallback(r, a, b), r1 = R.rank === 1 && !R.tie;
  const RC = duelRec(), x = RC[id] || { w:0, d:0, l:0 }; x[r]++; RC[id] = x; store.set('hp:duelRec', RC);
  embEmit('finish', { mode:'duel', result:r, win:r === 'w', vs:D.mode === 'ai' || (D.fleet && G.mode !== 'pvp') ? 'ai' : 'live', me:a ? { score:a.sc, progress:a.pg } : null, opp:b ? { score:b.sc, progress:b.pg } : null, record:x,
    rank:R.rank, players:R.rows.map(y => ({ nick:y.me ? null : y.nick, me:!!y.me, ai:!!y.ai, rank:y.rank, ok:!!y.ok, v:y.v == null ? null : y.v, t:y.t == null ? null : y.t, mis:y.mis || 0, score:y.sc || 0, text:y.txt || '', left:!!y.left })),
    kind:R.kind, round:R.round ? { r:R.round.r, series:R.round.series || {} } : null, room:EMB.room ? { code:EMB.room, r:EMB.roomRd } : (R.room && R.room.code ? { code:R.room.code } : null) });
  const tot = x.w + x.d + x.l, t = R.n <= 2 && R.tie ? T('core.d.draw') : `${R.tie ? T('core.d.tie') : ''}${T('core.d.rank', { n:R.rank })}`;
  const me = R.rows.find(y => y.me) || {};
  const rows = `<ol class="dz-rows">${R.rows.map(y => `<li class="${y.me ? 'me' : ''}${y.rank === 1 ? ' win' : ''}${y.left ? ' left' : ''}"><span class="dz-medal${y.rank <= 3 ? ' m' + y.rank : ''}">${y.rank}</span>${duelShapeSvg(y.shape, y.col, 16)}${y.me ? avatar({ me:true }) : oppAv(y.nick)}
    <span class="dz-nm"><b>${y.me ? T('core.me') : esc(y.nick)}${y.ai ? ' <em class="aitag">' + T('core.cpu') + '</em>' : ''}</b><small>${esc(y.txt || '')}</small></span></li>`).join('')}</ol>`;
  let html = `${r1 ? '<div class="burst" aria-hidden="true"></div>' : ''}<div class="dzres" id="dzRes">
    <h3 class="dz-h${r1 ? ' r1' : ''}" data-r="${R.tie && R.rank === 1 ? 'd' : r1 ? 'w' : 'l'}">${r1 ? EMB_CROWN : ''}<span class="num">${t}</span></h3>
    ${me.txt ? `<p class="dz-mine">${esc(me.txt)}</p>` : ''}${R.why ? `<p class="dz-why">${R.why}</p>` : ''}${rows}${typeof duelResX === 'function' ? duelResX() : ''}
    <p class="dz-rec">${T('core.d.rec', { w:x.w, n:tot })}</p><p class="dz-again" id="dzAgain" aria-live="polite"></p>`;
  const RPX = typeof duelReplayOf === 'function' ? duelReplayOf(res) : null;   /* 이 판 다시 풀기 · 친구에게 보내기(R11) */
  const rpRow = RPX ? `<div class="rb-links dz-rp"><button id="dzRp">${ic('play')}${T('core.d.replay')}</button><i aria-hidden="true">·</i><button id="dzSend">${ic('share')}${T('core.map.send')}</button></div>` : '';
  const quickAgain = R.room && R.room.canAgain && !R.ai;
  const pri = EMB.room ? [T('core.d.again'), () => embRoomDuel(EMB.roomRd + 1), T('core.d.againRoom')]
    : quickAgain ? [T('core.d.again'), () => embDuelAgain(), T('core.d.againSame')] : [T('core.d.newOpp'), () => { embMenu(); embStart('duel'); }, T('core.d.newOppSub')];
  const sc = [T('core.res.home'), embMenu], ex = quickAgain ? [{ id:'mNew', label:T('core.d.newOpp'), fn:() => { embMenu(); duelStart(id); } }] : [];
  const RB = embRes(pri, sc, ex); if(quickAgain) RB.pri.keep = true;
  setTimeout(() => {
    openModal(html + duelContinueHtml() + rpRow + resBtns(RB) + '</div>'); $('#modal').classList.add('duelm', 'dzm'); resBind(RB); duelContinueBind();
    if(RPX){ $('#dzRp').onclick = () => duelReplayStart(RPX); $('#dzSend').onclick = () => embSendDuel(RPX); }
    if(r1){ fxConfetti(); sfx('fanfare'); } else if(R.tie) sfx('result'); else sfx('lose');
    try{ toyMood($('#modal .dz-rows li.me'), r1 ? 'joy' : R.tie ? 'wow' : 'sad'); }catch(_){}
    if(quickAgain) embAgainLoop(id);
  }, $('#veil').classList.contains('on') ? 0 : (r1 ? 500 : 250));
}
/* 빠른 대전 한 판 더(결과 뒤 30초): 남은 초 · 누른 사람 수 */
function embDuelAgain(){ const p = $('#mPri'); if(!duelAgain()){ toast(T('core.d.againLate')); return; } sfx('flLock'); if(p){ p.disabled = true; const l = p.querySelector('.rb-l'); if(l) l.textContent = T('core.d.waiting'); } }
function embAgainLoop(id){
  clearInterval(embAgainLoop.t);
  const g = G, tick = () => {
    const el = $('#dzAgain'), pri = $('#mPri'); if(!el || !pri || G !== g){ clearInterval(embAgainLoop.t); return; }
    const s = duelAgainState();
    if(!s.on){ clearInterval(embAgainLoop.t); pri.disabled = false; pri.innerHTML = '<span class="rb-l">' + T('core.d.newOpp') + '</span><small>' + T('core.d.againGone') + '</small>'; pri.onclick = () => { closeModal(); embMenu(); duelStart(id); }; el.innerHTML = ''; return; }
    let tm = pri.querySelector('.dz-sec'); if(!tm){ tm = document.createElement('i'); tm.className = 'dz-sec num'; pri.appendChild(tm); } tm.textContent = s.left;
    el.innerHTML = s.want ? `<span>${s.n >= 2 ? T('core.d.gathered', { n:s.n }) : T('core.d.waitOthers')}</span>` : s.n ? `<span>${T('core.d.againN', { n:s.n })}</span>` : '';
  };
  tick(); embAgainLoop.t = setInterval(tick, 400);
}

/* ---- 대전 판 다시 풀기 · 보내기(R11, 더함) ----
   보내기: 이 모듈 주소 + ?ds=<씨앗>&g&lv&pn&pc&rk&rt&t&sc(core/engine.js duelReplayQ) → 기기 공유 시트, 안 되면 복사. 붙인 곳에는 'send' 이벤트(url 포함).
   받기: 주소에 ds=가 있으면 첫 화면 위에 "친구가 보낸 대전 판" 창 → 풀어 보기(기록 안 됨). 시작·끝에 'replay' 이벤트(phase:'start'|'finish') */
const embT = t => t > 0 ? clock2(t).replace(/^0(?=\d:)/, '') : '–';
function embDsUrl(x){
  const u = new URL(location.origin + location.pathname), now = new URLSearchParams(location.search), q = duelReplayQ(x);
  for(const k of ['ns', 'sound', 'big']){ const v = now.get(k); if(v != null) u.searchParams.set(k, v); }   /* 기록 나누기·소리·큰 글씨는 그대로 */
  for(const k in q) u.searchParams.set(k, q[k]);
  return u.toString();
}
async function embSendDuel(x){
  const url = embDsUrl(x), name = NG[EMB.id].name, rec = x.dk === 'score' && x.sc ? T('core.pts', { n:fmt(x.sc) }) : x.t != null ? embT(x.t) : '';
  const text = T('core.send.text', { name, rec:rec ? T('core.send.rec', { r:rec }) : '', rk:x.rk ? T('core.send.rk', { n:x.rk }) : '' });
  embEmit('send', { kind:'duel', url, text, seed:x.seed, level:x.lv, rank:x.rk || null, time:x.t == null ? null : x.t, score:x.sc || 0 });
  try{ if(navigator.share){ await navigator.share({ title:name, text, url }); return; } }catch(e){ if(e && e.name === 'AbortError') return; }
  let ok = false; try{ await navigator.clipboard.writeText(text + '\n' + url); ok = true; }catch(_){}
  toast(ok ? T('core.send.copied') : T('core.send.made'));
}
function embDsGift(x){
  const nm = esc(x.from || T('core.friend')), m = NG[EMB.id], rec = [x.rk ? T('core.d.rank', { n:x.rk }) : '', x.rt || (x.t != null ? embT(x.t) : x.sc ? T('core.pts', { n:fmt(x.sc) }) : '')].filter(Boolean).join(' · ');
  openModal(`<h3>${T('core.sub.dsFrom', { name:nm })}</h3><span class="g-art em-dsart">${ART[EMB.id]()}</span>
    <p class="note">${T('core.ds.solo', { name:m.name })}${rec ? `<br>${T('core.ds.rec', { name:nm, r:esc(rec) })}` : ''}</p><p class="note">${T('core.ds.noRec')}</p>
    <div class="mbtns two"><button class="b2" id="mClose">${T('core.later')}</button><button class="b1" id="dsGo">${T('core.ds.go')}</button></div>`);
  $('#mClose').onclick = closeModal;
  $('#dsGo').onclick = () => duelReplayStart(x);
}
function embReplayFinish(win){
  const R = G.replay, id = G.id, m = NG[id];
  if(!R || R.kind !== 'duel'){ embPlayFinish(win); return; }
  const t = Math.round(elapsed()), isSc = R.dk === 'score', from = R.from || '';
  let score = 0; if(win || isSc){ try{ score = calcScore().score; }catch(_){ score = 0; } }
  const meTxt = isSc ? T('core.pts', { n:fmt(score) }) : win ? embT(t) : T('core.ds.notDone'), opTxt = isSc ? (R.sc ? T('core.pts', { n:fmt(R.sc) }) : (R.rt || '–')) : (R.t != null ? embT(R.t) : (R.rt || '–'));
  const meWin = isSc ? score > (R.sc || 0) : win && (R.t == null || t < R.t), opWin = isSc ? (R.sc || 0) > score : R.t != null && (!win || t > R.t);
  embEmit('replay', { phase:'finish', win, time:t, score, seed:R.seed, from:from || null });
  /* 나란히: 대전 결과 창과 같은 순위표 모양(나 · 보낸 사람 또는 대전 때 나), 앞선 쪽이 위 */
  const even = !meWin && !opWin, two = [ { me:true, nm:T('core.me'), txt:meTxt, w:meWin }, { me:false, nm:from || T('core.ds.meThen'), txt:opTxt + (R.rk ? ' · ' + T('core.ds.duelRank', { n:R.rk }) : ''), w:opWin } ];
  if(opWin) two.reverse();
  const vs = `<ol class="dz-rows em-rpvs">${two.map(y => `<li class="${y.me ? 'me' : ''}${y.w ? ' win' : ''}"><span class="dz-medal ${y.w || even ? 'm1' : 'm2'}">${y.w || even ? 1 : 2}</span>${y.me || !from ? avatar({ me:true }) : oppAv(from)}<span class="dz-nm"><b>${esc(y.nm)}</b><small>${esc(y.txt)}</small></span></li>`).join('')}</ol>`;
  const html = (win ? `<div class="burst" aria-hidden="true"></div><h3 class="ok">${resFace('joy')}${m.winTitle || T('core.ds.done')}</h3>` : `<h3 class="bad">${resFace('sad')}${T('core.res.fail')}</h3><p class="note">${lossProgress()}</p>`)
    + vs + `<p class="note">${T('core.ds.noRec2')}</p>`;
  const mine = Object.assign({}, R, { rk:0, rt:meTxt, t:win ? t : null, sc:isSc ? score : 0, from:'' });
  const RB = { pri:{ id:'mPri', label:T('core.map.replay'), sub:T('core.ds.sameSub'), fn:() => duelReplayStart(R) },
    links:[ win || (isSc && score > 0) ? { id:'dzSend', label:`${ic('share')}${T('core.ds.sendMine')}`, keep:true, fn:() => embSendDuel(mine) } : null, { id:'mGh', label:T('core.res.home'), fn:embMenu } ] };
  setTimeout(() => { openModal(html + resBtns(RB)); resBind(RB); if(win){ if(!m.noConfetti) fxConfetti(); sfx('result'); } else sfx('lose'); }, win ? 500 : 250);
}

/* ---- 엔진에 알려 주기 ---- */
Object.assign(HOST, {
  heartCost:false,
  beforeStart(id, lv, o){
    if(o.replay){ EMB.cur = 'replay'; embEmit('replay', { phase:'start', seed:o.replay.seed || null, level:lv, from:o.replay.from || null }); return { attempt:0 }; }   /* 더함(R11): 대전 판 다시 풀기 — 기록 안 됨 */
    if(o.adv) EMB.cur = 'solo'; else if(o.duel) EMB.cur = 'duel'; else if(!o.seed && EMB.cur !== 'practice') EMB.cur = 'daily';
    if(EMB.cur === 'practice' && !o.adv && !o.duel && !o.seed) o.seed = 'prac:' + id + ':' + Date.now() + ':' + Math.random();   /* 연습은 매번 새 문제 */
    let attempt = 0;
    if(EMB.cur === 'daily' && !o.adv && !o.duel){ const r = embDay(); r.tries++; embDaySave(r); attempt = r.tries; }
    embEmit('start', { mode:EMB.cur, level:o.adv ? null : lv, stage:o.adv || null, attempt });
    return { attempt };
  },
  showPlay(){ $('#menu').hidden = true; $('#play').style.display = 'block'; },
  subtitle:(L, attempt, ex) => EMB.cur === 'daily' ? (attempt === 1 ? `${L.name}${ex}` : `${T('core.map.replay')}${ex}`) : `${T('core.sub.pracShort')}${ex}`,
  subtitleFull:(L, attempt, ex) => EMB.cur === 'daily' ? T('core.sub.daily', { lv:L.name + ex, k:attempt === 1 ? T('core.sub.firstRec') : T('core.map.replay') }) : T('core.sub.prac', { lv:L.name + ex }),
  quitInfo:() => ({ note:EMB.cur === 'daily' ? T('core.quit.daily') : T('core.quit.note'), label:T('core.quit.go') }),
  finish(win){ if(G.adv) embSoloFinish(win); else embPlayFinish(win); },
  exit(){ embEmit('quit', { mode:EMB.cur }); embMenu(); },
  canDuel:() => true,
  duelResult:(r, a, b, res) => embDuelResult(r, a, b, res),
  replayFinish:win => embReplayFinish(win)
});
Object.defineProperty(HOST, 'flatMult', { get:() => EMB.cur === 'daily' });   /* 오늘의 문제는 배율 없이(사이트와 같은 점수) */

/* ---- 바깥에서 조종: postMessage({ target:'haru-puzzle', cmd:'start', mode:'daily' }) 또는 앱에서 HaruPuzzleEmbed.start('daily') ---- */
window.HaruPuzzleEmbed = {
  start:(mode, opt) => embStart(mode, opt),
  menu:() => { if(G && !G.over){ G.over = true; } embMenu(); },
  sound:on => { sndSetOn(!!on); },
  big:on => { bigSet(!!on); if(!G || G.over) embMenu(); },   /* 큰 글씨 켜기/끄기(더한 명령) */
  state:() => { const s = embState(); embEmit('state', { state:s }); return s; },
  restore:s => embRestore(s)
};
window.addEventListener('message', e => {
  const d = e.data; if(!d || d.target !== 'haru-puzzle') return;
  const A = window.HaruPuzzleEmbed;
  if(d.cmd === 'start') A.start(d.mode, d);
  else if(d.cmd === 'menu') A.menu();
  else if(d.cmd === 'sound') A.sound(d.on);
  else if(d.cmd === 'big') A.big(d.on);
  else if(d.cmd === 'state') A.state();
  else if(d.cmd === 'restore') A.restore(d.state);
});
/* 높이 알리기(부모가 iframe 높이를 맞출 때) */
(() => { let last = 0; const send = () => { const h = Math.ceil(document.documentElement.scrollHeight); if(Math.abs(h - last) > 2){ last = h; embEmit('resize', { height:h }); } };
  try{ new ResizeObserver(send).observe(document.body); }catch(_){ setInterval(send, 1000); } })();

/* ---- 시작 ---- */
registerGames([EMB.id]);
/* 게임 정의의 modes가 있으면 그 모드만(예: 오늘의 문제·연습이 없는 게임) */
if(Array.isArray(NG[EMB.id].modes)){ const ok = EMB.modes.filter(x => NG[EMB.id].modes.includes(x)); EMB.modes = ok.length ? ok : NG[EMB.id].modes.filter(x => ['daily', 'solo', 'practice', 'duel'].includes(x)); }
playChromeInit();
/* 주소 옵션 lang=en(더함, DEV-01): 창 제목·첫 화면 이름표도 그 언어로. 한국어는 페이지에 적힌 그대로(core/i18n.js) */
if(i18nLang() !== 'ko'){ try{ document.title = NG[EMB.id].name + ' · ' + T('core.brand'); $('#menu').setAttribute('aria-label', NG[EMB.id].name); }catch(_){} }
/* 뒤로가기 처리는 붙인 사이트의 방문 기록을 건드리므로 주소 옵션 ?back=1일 때만(앱 WebView 등) */
if(new URLSearchParams(location.search).get('back') === '1'){ HOST.historyGuard = true; navInit(); }
if(embHas('duel')) netStart(); else ROOM_STATE = 'none';   /* 대전을 켠 곳에서만 대전 서버에 연결 */
if(new URLSearchParams(location.search).get('sound') === '0') sndSetOn(false);
if(EMB.pace) store.set('hp:duelPace', EMB.pace);   /* 주소 옵션 pace=slow|normal: 대전 느긋하게(시간 2배) */
{ const bg = new URLSearchParams(location.search).get('big'); if(bg === '1' || bg === '0') bigSet(bg === '1'); }   /* 주소 옵션 big=1|0: 큰 글씨 */
embEmit('ready', { name:NG[EMB.id].name, modes:EMB.modes });
embMenu();
{ const ds = duelReplayParse(new URLSearchParams(location.search));   /* 주소 옵션 ds=(더함, R11): 친구가 보낸 대전 판 → 첫 화면 위에 창 */
  if(ds && ds.g === EMB.id) embDsGift(ds); else if(EMB.start !== 'menu' && embHas(EMB.start)) embStart(EMB.start); }
</script>
