<!doctype html>
<html lang="ko" data-game="chosung" data-ver="1.3.1+1.1.0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>초성게임 · 하루퍼즐</title>
<meta name="theme-color" content="#1C1250">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<script>/* 기록을 사이트·사용자별로 나눔: ?ns=사이트이름&user=사용자번호 · 화면 언어: ?lang=en(더함, 없으면 한국어, core/i18n.js) */(function(){var q=new URLSearchParams(location.search);window.HP_NS='hpe:'+(q.get('ns')||'')+':'+(q.get('user')||'')+':';window.HP_LANG=q.get('lang')||'';})();</script>
<style>/* 공용: 색·글꼴·배경·버튼·홈 화면 위쪽·팝업·알림 */
/* ===== 하루퍼즐 리그 · 게임 로비 디자인 시스템 v2 =====
   세계관: 밤하늘 보랏빛 퍼즐 광장. 크림색 양피지 패널 + 굵은 보라 외곽선 + 사탕 버튼.
   한 가지 세계로 고정(라이트/다크 구분 없음). */
:root{
  color-scheme:light;
  --night:#1C1250; --night2:#2A1B6E; --outline:#2A1650; --outline2:#1A0F45;
  --paper:#FFF8EA; --paper2:#FBEBCB; --paper-line:#EADBC0;
  --ink:#3A2261; --sub:#6A5884; --line:#E6D6B6;
  --gold:#FFC93C; --gold2:#FF9A1F; --pink:#F0368A; --sky:#2E8FE8;
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F3EBDD;
  --primary:#6C3CE0; --on-primary:#FFFFFF; --accent:#FF3D7F; --success:#27B86A; --danger:#E5484D;
  --g-fox:#FF7A1F; --g-sudoku:#3B6FD8; --g-ball:#9B44E8; --g-tower:#2E9E5B; --g-fleet:#1A8CC4;
  --card:var(--surface); --grape:var(--primary); --lemon:var(--gold); --mint:var(--success); --edge:#26215C; --cellink:#26215C;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --disp:"Jua","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --heavy:"Black Han Sans","Jua","Apple SD Gothic Neo",system-ui,sans-serif;
  box-sizing:border-box;
}
html{height:100%; background:var(--night)}
*{box-sizing:border-box}
body{word-break:keep-all; overflow-wrap:anywhere; margin:0; min-height:100%; background:var(--night); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.47; -webkit-tap-highlight-color:transparent}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0}
button:focus-visible, summary:focus-visible{outline:3px solid #FFE27A; outline-offset:3px}
.wrap{position:relative; z-index:1; max-width:460px; margin:0 auto; padding:10px 16px 44px}
.num{font-variant-numeric:tabular-nums}
.ico{display:inline-block; width:20px; height:20px; vertical-align:-4px; flex:none}
.ico svg{width:100%; height:100%; display:block}
.gdefs{position:absolute; width:0; height:0; overflow:hidden}

/* ---------- 배경 장면: 밤하늘 광장 + 천천히 도는 빛줄기 ---------- */
.scene{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(90% 45% at 50% 0%, #8D6BFF 0%, rgba(141,107,255,0) 70%),
    radial-gradient(70% 40% at 100% 85%, rgba(255,79,154,.35) 0%, rgba(255,79,154,0) 70%),
    radial-gradient(60% 40% at 0% 60%, rgba(46,143,232,.28) 0%, rgba(46,143,232,0) 70%),
    linear-gradient(180deg,#3A23A0 0%, #24166E 38%, #170D47 100%)}
.scene::before{content:""; position:absolute; inset:0; background-image:radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.4px), radial-gradient(rgba(255,255,255,.25) 1px, transparent 1.4px); background-size:120px 140px, 57px 61px; background-position:10px 20px, 30px 5px; opacity:.55}
.scene::after{content:""; position:absolute; inset:0; background:repeating-linear-gradient(45deg, rgba(255,255,255,.028) 0 14px, transparent 14px 28px)}
.scene .rays{position:absolute; left:50%; top:-340px; width:900px; height:900px; margin-left:-450px; border-radius:50%;
  background:repeating-conic-gradient(from 0deg, rgba(255,236,170,.13) 0deg 7deg, rgba(255,236,170,0) 7deg 18deg);
  -webkit-mask:radial-gradient(circle, #000 18%, transparent 62%); mask:radial-gradient(circle, #000 18%, transparent 62%);
  animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bgscene{position:fixed; inset:0; width:100vw; height:100vh; z-index:0; pointer-events:none; display:block}
.bgscene[hidden]{display:none}
body[data-mode] .scene{display:none}
body[data-mode="sudoku"]{background:var(--night)}
body[data-mode="sudoku"] .scene{display:block}
body[data-mode="ball"]{background:linear-gradient(180deg,#2A1B6E 0%,#1C1250 55%,#150C3E 100%) fixed}

/* ---------- 공통: 양피지 패널, 사탕 버튼 ---------- */
.panel{background:linear-gradient(180deg,var(--paper) 0%, var(--paper2) 100%); border:3px solid var(--outline); border-radius:22px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.75), inset 0 -4px 0 rgba(160,120,60,.12), 0 6px 0 var(--outline2), 0 14px 24px rgba(8,2,30,.35)}
.btn, .b1, .b2, .cta, .g-go{position:relative; overflow:hidden; isolation:isolate}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:52px; padding:0 18px; border-radius:16px; font-family:var(--disp); font-size:18px; transition:transform .08s, box-shadow .08s; font-weight:var(--disp-w,400)}
.btn.primary, .b1, .btn.secondary, .b2, .btn.gold{
  background:linear-gradient(180deg,var(--c1) 0%, var(--c2) 100%); border:2.5px solid var(--c3); color:#fff; text-shadow:0 2px 0 var(--c3);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.14), 0 4px 0 var(--c3), 0 7px 12px rgba(20,5,40,.22)}
.btn.primary, .b1{--c1:#FF8AC0; --c2:#F0368A; --c3:#8E0F4F}
.btn.secondary, .b2{--c1:#86D6FF; --c2:#2E8FE8; --c3:#124F92}
.btn.gold{--c1:#FFE98E; --c2:#FFB020; --c3:#9A5A00; color:#5A3300; text-shadow:0 1px 0 rgba(255,255,255,.55)}
.btn.primary::before, .b1::before, .btn.secondary::before, .b2::before, .btn.gold::before{content:""; position:absolute; z-index:-1; left:6px; right:6px; top:3px; height:42%; border-radius:12px 12px 20px 20px; background:linear-gradient(rgba(255,255,255,.6), rgba(255,255,255,.08))}
.btn:active, .b1:active, .b2:active{transform:translateY(3px); box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 1px 0 var(--c3)}
.btn:disabled{filter:grayscale(.7); opacity:.6}
.btn.ghost{background:none; color:var(--sub); height:44px; font-family:var(--disp); font-size:16px; box-shadow:none; text-shadow:none; border:0; font-weight:var(--disp-w,400)}
.btn.small{height:40px; padding:0 14px; font-size:15px; border-radius:12px}
.btn.block{width:100%}
.cost{display:inline-flex; align-items:center; gap:3px; background:rgba(40,0,30,.22); border-radius:999px; padding:1px 9px 1px 7px; font-family:var(--heavy); font-size:14px; letter-spacing:.5px; text-shadow:none; color:#fff; box-shadow:inset 0 1px 0 rgba(0,0,0,.15); font-weight:var(--heavy-w,400)}
.cost .ico{width:14px; height:14px; vertical-align:-2px; color:#fff}
.btn.gold .cost{color:#5A3300; background:rgba(255,255,255,.4)}
.btn.ghost .cost{background:var(--paper2); color:var(--ink)}

/* ---------- 상단 HUD ---------- */
.hud{display:flex; align-items:center; justify-content:space-between; gap:10px; height:52px; margin-bottom:2px}
.res{display:inline-flex; align-items:center; height:38px; padding:0 4px 0 0; margin-left:14px; border-radius:999px; background:linear-gradient(#170C40,#241563); border:2.5px solid #0E0730; box-shadow:inset 0 2px 0 rgba(255,255,255,.12), 0 3px 0 rgba(0,0,0,.35); color:#fff}
.res-ico{width:46px; height:46px; margin:0 2px 0 -18px; filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.res-ico svg{width:100%; height:100%; display:block}
.res-val{display:flex; align-items:baseline; gap:6px; padding-right:6px; line-height:1}
.res-val b{font-family:var(--heavy); font-size:19px; letter-spacing:.5px; font-weight:var(--heavy-w,400)}
.res-val small{font-family:var(--heavy); font-size:13px; color:#FFD86B; letter-spacing:.5px; font-weight:var(--heavy-w,400)}
.res-plus{width:26px; height:26px; border-radius:9px; display:grid; place-items:center; font-family:var(--heavy); font-size:20px; line-height:1; color:#0B3D1A; background:linear-gradient(#8BF06A,#2BB24C); border:2px solid #0F5A23; box-shadow:inset 0 2px 0 rgba(255,255,255,.5), 0 2px 0 #0F5A23; text-shadow:0 1px 0 rgba(255,255,255,.45); font-weight:var(--heavy-w,400)}
.mail{position:relative; width:48px; height:44px; border-radius:14px; display:grid; place-items:center; background:linear-gradient(#FFFFFF,#E7DDFF); border:2.5px solid var(--outline2); box-shadow:inset 0 -3px 0 rgba(90,60,160,.18), 0 4px 0 #0E0730}
.mail svg{width:30px; height:30px}
.mail:active{transform:translateY(3px); box-shadow:0 1px 0 #0E0730}
.badge{position:absolute; top:-8px; right:-8px; min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:linear-gradient(#FF6B6B,#E0243A); border:2px solid #fff; color:#fff; font-family:var(--heavy); font-size:13px; line-height:18px; text-align:center; box-shadow:0 2px 0 rgba(0,0,0,.3); font-weight:var(--heavy-w,400)}

/* ---------- 로고 ---------- */
.logo{position:relative; z-index:0; isolation:isolate; display:flex; flex-direction:column; align-items:center; margin:4px 0 40px; user-select:none}
.logo-main{position:relative; font-family:var(--heavy); font-size:50px; line-height:1.05; letter-spacing:1px; color:transparent;
  background:linear-gradient(180deg,#FFFBD6 0%, #FFE35A 42%, #FFB21E 70%, #FF8A12 100%); -webkit-background-clip:text; background-clip:text; font-weight:var(--heavy-w,400)}
.logo-main::before, .logo-main::after{content:attr(data-t); position:absolute; left:0; top:0; z-index:-1; color:var(--outline2); background:none}
.logo-main::before{-webkit-text-stroke:14px var(--outline2); text-shadow:0 7px 0 #0B0526, 0 12px 18px rgba(0,0,0,.35)}
.logo-main::after{-webkit-text-stroke:6px #FFFFFF; color:#FFFFFF}
.logo-sub{position:relative; margin-top:-6px; padding:3px 22px 4px; font-family:var(--heavy); font-size:17px; letter-spacing:6px; text-indent:6px; color:#fff; text-shadow:0 2px 0 #7A0B45;
  background:linear-gradient(#FF7DB8,#E62C7F); border:2.5px solid var(--outline2); border-radius:8px; box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 var(--outline2); transform:rotate(-2deg); font-weight:var(--heavy-w,400)}
.logo-sub::before, .logo-sub::after{content:""; position:absolute; top:6px; width:16px; height:22px; z-index:-1; background:#B01A60; border:2.5px solid var(--outline2)}
.logo-sub::before{left:-11px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.logo-sub::after{right:-11px; clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.spark{position:absolute; width:18px; height:18px; animation:twinkle 2.4s ease-in-out infinite}
.spark svg{width:100%; height:100%; display:block}
@keyframes twinkle{50%{transform:scale(.55) rotate(45deg); opacity:.5}}

/* ---------- 리그 카드(히어로) ---------- */
.hero{position:relative; padding:24px 16px 14px; border-radius:24px; color:#fff;
  background:radial-gradient(120% 90% at 20% 0%, rgba(160,130,255,.45), rgba(160,130,255,0) 60%), linear-gradient(180deg,#4A33A8 0%, #2C1C7C 100%);
  border:3px solid #FFD35C; box-shadow:0 0 0 3px var(--outline2), inset 0 2px 0 rgba(255,255,255,.3), inset 0 0 0 2px rgba(255,211,92,.25), 0 9px 0 #0E0730, 0 18px 30px rgba(0,0,0,.4)}
.ribbon{position:absolute; left:50%; top:-19px; transform:translateX(-50%); z-index:2; white-space:nowrap}
.ribbon span{position:relative; display:block; padding:5px 26px 6px; font-family:var(--disp); font-size:18px; color:#fff; text-shadow:0 2px 0 #7A0B45;
  background:linear-gradient(#FF7DB8,#E62C7F); border:2.5px solid var(--outline2); border-radius:10px; box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 var(--outline2); font-weight:var(--disp-w,400)}
.hero-in{display:grid; grid-template-columns:88px 1fr; gap:14px; align-items:center}
.medal-big{width:88px; height:96px}
.medal-big svg, .pos svg{display:block; width:100%; height:100%; overflow:visible}
.hero-score small{display:block; font-family:var(--disp); font-size:14px; color:#CFC5FF; font-weight:var(--disp-w,400)}
.hero-score .n{display:flex; align-items:baseline; gap:4px; line-height:1}
.hero-score .n span{font-family:var(--heavy); font-size:48px; letter-spacing:.5px; color:#fff; -webkit-text-stroke:7px var(--outline2); paint-order:stroke fill; text-shadow:0 4px 0 var(--outline2); font-weight:var(--heavy-w,400)}
.hero-score .n em{font-style:normal; font-family:var(--heavy); font-size:20px; color:var(--gold); -webkit-text-stroke:5px var(--outline2); paint-order:stroke fill; font-weight:var(--heavy-w,400)}
.hero-score p{margin:6px 0 0; font-family:var(--disp); font-size:15px; line-height:1.35; color:#EDE7FF; text-wrap:balance; font-weight:var(--disp-w,400)}
.hero-score p em{font-style:normal; color:#FFD86B}
.gems{display:grid; grid-auto-flow:column; grid-auto-columns:1fr;   /* 과목 수만큼 한 줄(5·6과목) */ gap:8px; margin:16px 0 0}
.gem{position:relative; aspect-ratio:1; max-width:56px; justify-self:center; width:100%; border-radius:14px; display:grid; place-items:center; color:rgba(255,255,255,.28);
  background:#170C45; box-shadow:inset 0 3px 6px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.18)}
.gem .ico{width:52%; height:52%}
.gem.on{color:#fff; background:linear-gradient(180deg,var(--g1),var(--g2)); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.18), 0 3px 0 var(--outline2)}
.gem.on .ico{filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.gem-ck{position:absolute; right:-6px; bottom:-6px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#8BF06A,#2BB24C); border:2px solid var(--outline2); color:#fff}
.gem-ck .ico{width:12px; height:12px}
.hero-foot{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:14px; padding-top:12px; border-top:2px dashed rgba(255,255,255,.18); font-family:var(--disp); font-size:14px; color:#CFC5FF; font-weight:var(--disp-w,400)}
.clock-chip{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; border-radius:999px; background:#170C45; box-shadow:inset 0 2px 4px rgba(0,0,0,.5); white-space:nowrap}
.clock-chip .ico{width:16px; height:16px; color:#FFD86B}
.clock-chip b{font-family:var(--heavy); color:#FFD86B; letter-spacing:.5px; font-weight:var(--heavy-w,400)}

/* ---------- 다음 한 판 (메인 버튼) ---------- */
.cta{display:flex; align-items:center; gap:12px; width:100%; min-height:82px; margin-top:22px; padding:10px 12px 12px; border-radius:22px; text-align:left; color:#fff;
  background:linear-gradient(180deg,#FF9BCB 0%, #FF4F9A 45%, #E0217A 100%); border:3px solid var(--outline2);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55), inset 0 -6px 0 rgba(120,0,60,.3), 0 7px 0 #0E0730, 0 16px 26px rgba(224,33,122,.35); transition:transform .08s, box-shadow .08s}
.cta::before{content:""; position:absolute; z-index:-1; left:10px; right:10px; top:4px; height:40%; border-radius:16px 16px 30px 30px; background:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,0))}
.cta::after{content:""; position:absolute; z-index:-1; top:0; bottom:0; width:40%; left:-50%; background:linear-gradient(100deg, transparent, rgba(255,255,255,.45), transparent); transform:skewX(-18deg); animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-50%} 85%,100%{left:130%}}
.cta:active{transform:translateY(5px); box-shadow:inset 0 3px 0 rgba(255,255,255,.5), 0 2px 0 #0E0730}
.cta-tile{flex:none; width:56px; height:56px; border-radius:16px; display:grid; place-items:center; color:var(--g2); background:linear-gradient(#FFFFFF,#FFE6F1); border:2.5px solid var(--outline2); box-shadow:inset 0 -3px 0 rgba(0,0,0,.08), 0 3px 0 rgba(80,0,40,.5)}
.cta-tile .ico{width:34px; height:34px}
.cta-txt{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.2}
.cta-txt i{font-style:normal; font-family:var(--disp); font-size:14px; color:#FFF1A8; text-shadow:0 1px 0 #8E0F4F; font-weight:var(--disp-w,400)}
.cta-txt b{font-family:var(--disp); font-size:22px; color:#fff; -webkit-text-stroke:5px #8E0F4F; paint-order:stroke fill; text-shadow:0 3px 0 #8E0F4F; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:var(--disp-w,400)}
.cta-txt small{font-size:13px; font-weight:700; color:#FFE3F0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
.cta-play{flex:none; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#FFF6B8,#FFC21C); border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.7), 0 3px 0 rgba(80,0,40,.55)}
.cta-play svg{width:24px; height:24px; margin-left:3px; color:#B8250E}

/* ---------- 섹션 제목 ---------- */
.sec{display:flex; align-items:center; justify-content:center; gap:12px; margin:34px 0 14px}
.sec::before, .sec::after{content:""; flex:1; max-width:80px; height:3px; border-radius:2px; background:linear-gradient(90deg, rgba(255,211,92,0), #FFD35C)}
.sec::after{transform:scaleX(-1)}
.sec h2{margin:0; font-family:var(--disp); font-size:22px; color:#fff; -webkit-text-stroke:6px var(--outline2); paint-order:stroke fill; text-shadow:0 3px 0 var(--outline2); white-space:nowrap; font-weight:var(--disp-w,400)}
.sec h2::before, .sec h2::after{content:"◆"; display:inline-block; font-size:12px; color:#FFD35C; -webkit-text-stroke:3px var(--outline2); vertical-align:3px; margin:0 8px}

/* ---------- 게임 카드 ---------- */
.games{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.game{position:relative; display:flex; flex-direction:column; gap:3px; padding:8px 8px 10px; text-align:left; transition:transform .1s}
.game:active{transform:translateY(3px) scale(.99)}
.g-art{position:relative; display:block; aspect-ratio:16/10; border-radius:14px; overflow:hidden; border:2.5px solid var(--outline); box-shadow:inset 0 0 0 2px rgba(255,255,255,.35); margin-bottom:6px; background:var(--gc)}
.g-art svg{display:block; width:100%; height:100%}
.g-art::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 35%); pointer-events:none}
.g-nm{font-family:var(--disp); font-size:18px; line-height:1.25; color:var(--ink); padding:0 4px; font-weight:var(--disp-w,400)}
.g-st{flex:1; font-size:13px; line-height:1.45; color:var(--sub); font-weight:500; padding:0 4px}
.g-st b{color:var(--ink)}
.g-go{display:flex; align-items:center; justify-content:center; gap:6px; height:40px; margin-top:8px; border-radius:13px; font-family:var(--disp); font-size:16px; color:#fff;
  --c1:#FF8AC0; --c2:#F0368A; --c3:#8E0F4F; background:linear-gradient(180deg,var(--c1),var(--c2)); border:2.5px solid var(--c3); text-shadow:0 2px 0 var(--c3);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.14), 0 3px 0 var(--c3); font-weight:var(--disp-w,400)}
.g-go.re{--c1:#86D6FF; --c2:#2E8FE8; --c3:#124F92}
.g-go::before{content:""; position:absolute; z-index:-1; left:5px; right:5px; top:2px; height:42%; border-radius:10px 10px 16px 16px; background:linear-gradient(rgba(255,255,255,.55), rgba(255,255,255,.05))}
.games .game:last-child:nth-child(odd){grid-column:1/-1; display:grid; grid-template-columns:48% 1fr; grid-template-rows:auto 1fr auto; column-gap:12px}
.games .game:last-child:nth-child(odd) .g-art{grid-row:1/4; margin:0; align-self:stretch; aspect-ratio:auto; min-height:120px}
.games .game:last-child:nth-child(odd) .g-nm{padding-top:4px}
.newb, .live, .stamp{position:absolute; top:6px; z-index:2; font-family:var(--heavy); font-size:13px; letter-spacing:1px; line-height:1; color:#fff; border:2px solid var(--outline2); box-shadow:0 2px 0 var(--outline2); font-weight:var(--heavy-w,400)}
.newb{left:6px; padding:4px 8px 5px; border-radius:8px; background:linear-gradient(#E8364A,#C8102E); transform:rotate(-6deg)}
.live{right:6px; display:inline-flex; align-items:center; gap:5px; padding:4px 8px 5px; border-radius:999px; background:linear-gradient(#FF6B6B,#E0243A)}
.live i{width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.stamp{right:6px; display:inline-flex; align-items:center; gap:3px; padding:3px 8px 4px 5px; border-radius:999px; background:linear-gradient(#FFE98E,#FFB020); color:#5A3300; letter-spacing:0; font-family:var(--disp); font-size:13px; font-weight:var(--disp-w,400)}
.stamp .ico{width:14px; height:14px}

/* ---------- 친구 랭킹 ---------- */
.rank{padding:6px 10px; overflow:hidden}
.row{display:grid; grid-template-columns:38px 46px 1fr auto 42px; align-items:center; gap:8px; min-height:66px; padding:6px 2px; border-top:2px dashed var(--paper-line)}
.row:first-child{border-top:0}
.row.me{margin:4px -6px; padding:6px 8px; border:2.5px solid #C98A12; border-radius:16px; background:linear-gradient(180deg,#FFF1B8,#FFD978); box-shadow:inset 0 2px 0 rgba(255,255,255,.7)}
.row.me + .row{border-top:0}
.pos{width:38px; height:40px; display:grid; place-items:center}
.pnum{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-family:var(--heavy); font-size:15px; color:#fff; background:linear-gradient(#7B5CD6,#4B2C8F); border:2px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.35); font-weight:var(--heavy-w,400)}
.pnum.none{background:#CDBEA0; color:#fff; box-shadow:none; border-color:#A8966F}
.av{position:relative; width:46px; height:46px; border-radius:50%; overflow:hidden; display:grid; place-items:center; border:3px solid #fff; box-shadow:0 0 0 2px var(--outline), 0 3px 0 2px rgba(42,22,80,.35); background:var(--avbg, #FFD6E0)}
.av svg, .av img.toy{width:100%; height:100%; display:block}
.av img.toy{width:112%; height:112%; margin:-2% -6% -10%; max-width:none}
img.toy{display:block; width:100%; height:100%; -webkit-user-drag:none; user-select:none}
.who{min-width:0; line-height:1.2}
.who b{display:block; font-family:var(--disp); font-size:17px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:var(--disp-w,400)}
.who small{display:flex; gap:3px; margin-top:4px; font-size:13px; color:var(--sub); font-weight:500; white-space:nowrap}
.mini{display:inline-grid; place-items:center; width:19px; height:19px; border-radius:6px; background:#E9DCC0; color:#B7A27A}
.mini .ico{width:13px; height:13px}
.mini.on{color:#fff; background:var(--gc); box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.sc{font-family:var(--heavy); font-size:19px; color:var(--ink); letter-spacing:.3px; font-weight:var(--heavy-w,400)}
.send{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:linear-gradient(#FF9BCB,#F0368A); border:2.5px solid #8E0F4F; box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 3px 0 #8E0F4F; color:#fff}
.send .ico{width:20px; height:20px; filter:drop-shadow(0 1px 0 rgba(120,0,60,.6))}
.send:active{transform:translateY(2px); box-shadow:0 1px 0 #8E0F4F}
.send:disabled{background:#E9DCC0; border-color:#B7A27A; box-shadow:none; color:#A38E66}
.send:disabled .ico{filter:none}

/* ---------- 테스트 도구 ---------- */
.proto{margin-top:30px; font-size:13px; color:#B9AEE6; text-align:center}
.proto summary{cursor:pointer; list-style:none; min-height:44px; display:inline-flex; align-items:center; font-family:var(--disp); font-size:14px; font-weight:var(--disp-w,400)}
.proto summary::-webkit-details-marker{display:none}
.proto .btn{margin:4px}

/* ---------- 게임 화면 상단 바(스도쿠·구슬·디펜스) ---------- */
#play{display:none}
.pbar{display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:8px; min-height:60px; margin:2px 0 12px; padding:6px 8px; border-radius:18px;
  background:linear-gradient(180deg,#4A33A8,#2C1C7C); border:3px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.25), 0 4px 0 #0E0730}
.ptitle{text-align:center; font-family:var(--disp); font-size:19px; line-height:1.2; min-width:0; color:#fff; -webkit-text-stroke:4px var(--outline2); paint-order:stroke fill; font-weight:var(--disp-w,400)}
.ptitle small{display:block; font-family:var(--font); font-size:13px; font-weight:700; line-height:1.4; padding-bottom:1px; color:#CFC5FF; -webkit-text-stroke:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iconbtn{width:44px; height:44px; min-width:44px; min-height:44px; flex:none; border-radius:50%; display:grid; place-items:center; color:var(--ink); background:linear-gradient(#FFFFFF,#E7DDFF); border:2.5px solid var(--outline2); box-shadow:inset 0 -3px 0 rgba(90,60,160,.18), 0 3px 0 #0E0730}
.iconbtn .ico{width:22px; height:22px}
.iconbtn:active{transform:translateY(2px); box-shadow:0 1px 0 #0E0730}
.stats{display:flex; justify-content:space-between; align-items:center; background:#fff; border-radius:16px; padding:8px 14px; margin-bottom:12px; min-height:52px}
.paws{display:flex; gap:4px; color:var(--g-fox)}
.paws .ico{width:24px; height:24px}
.paws .off{color:var(--line)}
.paws .lost{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fcount{font-size:14px; font-weight:700; color:var(--sub)}
.clock{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums}

/* ---------- 팝업 창 ---------- */
.veil{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(80% 60% at 50% 45%, rgba(40,20,110,.55), rgba(8,3,28,.82)); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px)}
.veil.on{display:flex}
.modal{position:relative; width:100%; max-width:420px; max-height:100%; overflow:auto; padding:16px 16px 18px; text-align:center; color:var(--ink);
  background:linear-gradient(180deg,var(--paper) 0%, var(--paper2) 100%); border:4px solid var(--outline); border-radius:26px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.8), 0 8px 0 var(--outline2), 0 26px 50px rgba(0,0,0,.5); animation:popin .32s cubic-bezier(.2,1.5,.45,1)}
@keyframes popin{from{transform:scale(.82); opacity:0}}
.modal > *:not(.burst){position:relative; z-index:1}
.modal h3{margin:0 0 12px; padding:9px 14px 10px; font-family:var(--disp); font-size:21px; line-height:1.25; color:#fff; text-shadow:0 2px 0 var(--outline2); text-wrap:balance;
  background:linear-gradient(180deg,#9C7BFF,#6236D6); border:3px solid var(--outline2); border-radius:15px; box-shadow:inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 var(--outline2); font-weight:var(--disp-w,400)}
.modal h3.ok{background:linear-gradient(180deg,#8BF06A,#23A548); text-shadow:0 2px 0 #0F5A23}
.modal h3.bad{background:linear-gradient(180deg,#9AA7C7,#5B6789)}
.modal .big{font-family:var(--heavy); font-size:60px; line-height:1.1; margin:6px 0; letter-spacing:1px; font-variant-numeric:tabular-nums; color:#FFC93C; -webkit-text-stroke:8px var(--outline); paint-order:stroke fill; text-shadow:0 5px 0 var(--outline); font-weight:var(--heavy-w,400)}
.modal .big svg{width:72px; height:72px; display:block; margin:0 auto}
.lose{font-family:var(--disp); font-size:21px; line-height:1.35; margin:12px 0 6px; color:var(--ink); text-wrap:balance; font-weight:var(--disp-w,400)}
.note{font-size:14px; color:var(--sub); margin:8px 0; line-height:1.55; text-wrap:pretty}
.note b{color:var(--ink)}
.pill{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px; font-family:var(--disp); font-size:15px; margin:4px 2px; border:2px solid; font-weight:var(--disp-w,400)}
.pill.good{background:#E3F8E9; color:#18804A; border-color:#8FD9A8}
.pill.new{background:linear-gradient(#FFE98E,#FFB020); color:#5A3300; border-color:#9A5A00; box-shadow:0 2px 0 #9A5A00; animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:scale(1.06)}}
.pill.info{background:#EFE7FF; color:#5B3FB5; border-color:#CDBBFA}
.burst{position:absolute; z-index:0; left:50%; top:-140px; width:420px; height:420px; margin-left:-210px; border-radius:50%; pointer-events:none;
  background:repeating-conic-gradient(from 0deg, rgba(255,200,60,.35) 0deg 9deg, rgba(255,200,60,0) 9deg 22deg);
  -webkit-mask:radial-gradient(circle, #000 12%, transparent 60%); mask:radial-gradient(circle, #000 12%, transparent 60%); animation:spin 14s linear infinite}
.brk{text-align:left; margin:10px 0 4px; background:#fff; border:2px solid var(--paper-line); border-radius:14px; padding:0 12px}
.brk summary{min-height:44px; display:flex; align-items:center; justify-content:center; color:var(--sub); font-family:var(--disp); font-size:15px; cursor:pointer; font-weight:var(--disp-w,400)}
.brk div{display:flex; justify-content:space-between; gap:10px; padding:8px 2px; font-size:14px; color:var(--sub); border-top:2px dashed var(--paper-line)}
.brk div b{color:var(--ink); font-variant-numeric:tabular-nums}
.mbtns{display:grid; grid-template-columns:auto 1fr; gap:10px; margin-top:18px}
.mbtns.one{grid-template-columns:1fr}
.mbtns.two{grid-template-columns:1fr 1fr}
.mbtns + .btn.ghost{margin-top:6px; width:100%}
.mbtns + .mbtns{margin-top:12px}
.mbtns button, .mbtns .btn{height:54px; border-radius:16px; font-family:var(--disp); font-size:17px; padding:0 16px; min-width:0; white-space:nowrap; line-height:1.15; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:var(--disp-w,400)}
.opts{display:flex; flex-direction:column; gap:10px; margin-top:12px; text-align:left}
.opt{text-align:left; display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:10px; min-height:66px; padding:10px 14px; border-radius:16px; background:#fff; border:3px solid var(--paper-line); box-shadow:0 3px 0 var(--paper-line); transition:transform .08s}
.opt[aria-checked="true"]{border-color:var(--pink); background:#FFF1F7; box-shadow:0 3px 0 #B8185F, 0 0 0 4px rgba(240,54,138,.18)}
.opt .lvdots{display:flex; gap:5px; padding-left:2px}
.opt .lvdots i{width:8px; height:8px; transform:rotate(45deg); border-radius:2px; background:var(--line)}
.opt .lvdots i.on{background:linear-gradient(#FFE35A,#FF9A1F); box-shadow:0 0 0 1.5px #9A5A00}
.opt b{font-family:var(--disp); font-size:18px; font-weight:var(--disp-w,400)}
.opt small{display:block; font-size:13px; color:var(--sub); font-weight:500; margin-top:1px}
.opt .rec{font-family:var(--disp); font-size:13px; color:#fff; background:linear-gradient(#FF8AC0,#F0368A); border:2px solid #8E0F4F; padding:1px 9px 2px; border-radius:999px; font-weight:var(--disp-w,400)}
.hrow{display:flex; justify-content:center; gap:4px; margin:10px 0}
.hrow .hi{width:40px; height:40px}
.hrow .hi svg{width:100%; height:100%; display:block}
.hrow .hi.off{filter:grayscale(1) opacity(.35)}
.hx{font-family:var(--heavy); font-size:20px; align-self:center; color:var(--pink); font-weight:var(--heavy-w,400)}
.gift{display:grid; grid-template-columns:40px 1fr 26px; align-items:center; gap:10px; min-height:58px; text-align:left; border-top:2px dashed var(--paper-line); font-size:15px}
.gift:first-child{border-top:0}
.gift .av{width:40px; height:40px; border-width:2px}
.gift .hi{width:26px; height:26px}
.gift .hi svg{width:100%; height:100%}
.gift.got{opacity:.45}
.help{display:flex; flex-direction:column; gap:10px; margin:12px 0 4px; text-align:left}
.hstep{display:grid; grid-template-columns:48px 1fr; gap:12px; align-items:center; padding:12px; border-radius:16px; background:#fff; border:2px solid var(--paper-line)}
.hstep .hn{width:48px; height:48px; border-radius:14px; display:grid; place-items:center; color:#fff; font-family:var(--heavy); font-size:24px; border:2.5px solid var(--outline2); box-shadow:inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 var(--outline2); text-shadow:0 2px 0 rgba(0,0,0,.3); font-weight:var(--heavy-w,400)}
.hstep b{display:block; font-family:var(--disp); font-size:17px; color:var(--ink); font-weight:var(--disp-w,400)}
.hstep span{font-size:15px; color:var(--sub); line-height:1.55}
.optsep{font-family:var(--disp); font-size:14px; color:var(--sub); margin:8px 4px 0; font-weight:var(--disp-w,400)}

/* ---------- 알림 ---------- */
.toast{position:fixed; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translate(-50%,-14px); z-index:40; max-width:calc(100% - 32px); height:48px; padding:0 20px; border-radius:16px;
  display:flex; align-items:center; gap:8px; font-family:var(--disp); font-size:16px; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:0; transition:.2s; pointer-events:none;
  background:linear-gradient(#3D2A8F,#24186A); border:2.5px solid #FFD35C; box-shadow:0 0 0 2.5px var(--outline2), 0 10px 24px rgba(0,0,0,.4); font-weight:var(--disp-w,400)}
.toast.on{opacity:1; transform:translate(-50%,0)}
/* 게임 중에는 위쪽 정보줄(HUD)을 가리지 않게 화면 아래쪽에 띄운다 */
body[data-mode] .toast{top:auto; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,14px); white-space:normal; width:max-content; height:auto; min-height:48px; padding:8px 20px; text-align:center; line-height:1.3}
body[data-mode] .toast.on{transform:translate(-50%,0)}

@media (max-width:370px){ .logo-main{font-size:42px} .hero-score .n span{font-size:40px} .hero-in{grid-template-columns:74px 1fr} .medal-big{width:74px; height:82px} .row{grid-template-columns:34px 42px 1fr auto 40px; gap:6px} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }

/* ===== 게임 화면 ===== */
/* 캐릭터 v4: 결과 창 마스코트·대전 결과 표정(순간 연출만) */
.modal h3 img.toy.resface{display:inline-block; width:40px; height:40px; margin:-12px 6px -12px -4px; vertical-align:middle; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25)); animation:resface .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes resface{from{transform:scale(.2) rotate(-25deg); opacity:0}}
.dr-side img.toy.mood-joy{animation:moodjoy .7s cubic-bezier(.2,1.6,.4,1) .2s both}
.dr-side img.toy.mood-sad{animation:moodsad .7s ease-out .2s both}
@keyframes moodjoy{0%{transform:scale(1)} 35%{transform:scale(1.18) translateY(-4px)} 100%{transform:scale(1)}}
@keyframes moodsad{0%{transform:none} 40%{transform:translateY(3px) rotate(-6deg)} 100%{transform:translateY(1px) rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){ .modal h3 .resface, .dr-side img.toy{animation:none} }
/* 대전 결과 창 '계속 풀기'(상대가 먼저 끝나 판이 끊긴 쪽만) */
.modal .dcont{display:flex; width:100%; margin:12px 0 0; min-height:52px; height:auto; padding:8px 14px; flex-wrap:wrap; column-gap:6px; row-gap:0}
.modal .dcont small{flex-basis:100%; font-family:var(--font); font-size:13px; font-weight:700; opacity:.9}

/* ===== 결과 창 v2 (UI 검수 2026-10-04): 요약 카드 1장 + 버튼 위계(주 1 · 반반 2 · 글자 줄) ===== */
.rsum{margin:10px 0 2px; padding:10px 12px; border-radius:18px; background:#fff; border:2px solid var(--paper-line); text-align:center}
.rsum b{display:block; font-family:var(--disp); font-size:17px; line-height:1.35; color:var(--ink); font-weight:var(--disp-w,400)}
.rsum b.new{display:inline-block; padding:3px 12px; border-radius:999px; background:linear-gradient(#FFE98E,#FFB020); color:#5A3300; border:2px solid #9A5A00; box-shadow:0 2px 0 #9A5A00}
.rsum span{display:block; margin-top:5px; font-size:13px; font-weight:700; line-height:1.45; color:var(--sub)}
.rsum span:empty{display:none}
.rsum .ico{width:15px; height:15px; vertical-align:-2px}
.rbtns{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.rbtns button{min-width:0; font-family:var(--disp); white-space:normal; line-height:1.15; font-weight:var(--disp-w,400)}
.rb-pri{width:100%; min-height:58px; padding:6px 16px; border-radius:16px; font-size:19px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
.rb-pri small{display:block; font-family:var(--font); font-size:13px; font-weight:700; opacity:.95; text-shadow:0 1px 0 var(--c3)}
.rb-pair{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.rb-pair.one{grid-template-columns:1fr}
.rb-pair button{height:auto; min-height:50px; padding:4px 10px; border-radius:14px; font-size:16px; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-align:center}
.rb-pair .ico{width:18px; height:18px; flex:none}
.rb-pair .cost{flex:none}
.rb-links{display:flex; align-items:center; justify-content:center; gap:2px; flex-wrap:wrap}
.rb-links button{min-height:44px; padding:0 12px; font-size:15px; color:var(--sub); background:none; border:0; text-decoration:underline; text-decoration-color:rgba(106,88,132,.35); text-underline-offset:4px}
.rb-links button .ico{width:16px; height:16px; vertical-align:-3px; margin-right:3px}
.rb-links i{font-style:normal; color:var(--line)}
.dz-rp{margin:10px 0 -4px}   /* 대전 결과 창 "이 판 다시 풀기 · 친구에게 보내기" 글자 버튼 줄(R11) */
.modal .rbtns + .note{margin-top:4px}
/* 꽃가루·효과 층: 창이 열려 있으면 창 뒤로(글자·버튼 위로 지나가지 않게) */
.veil > .fxfx{z-index:0}
.veil > .modal{z-index:1}
body.modal-open > .fxfx, body:has(.veil.on) > .fxfx{z-index:19}
/* 진행 중이던 공식 답안이 자동 제출됐을 때 안내 */
.runsub{margin:8px 0 2px; padding:12px; border-radius:16px; background:#fff; border:2px solid var(--paper-line); text-align:center}
.runsub b{display:block; font-family:var(--disp); font-size:18px; color:var(--ink); font-weight:var(--disp-w,400)}
.runsub span{display:block; margin-top:4px; font-size:14px; color:var(--sub); line-height:1.5}


/* ===== 큰 글씨(설정 "소리 · 글씨" → body.big, WP3 2026-10-06): 글자 +2px. 칩·버튼은 글자에 맞춰 늘고(min-width) 판 칸 크기는 그대로 ===== */
body.big{font-size:17px}
body.big .note{font-size:16px}
body.big .lose{font-size:23px}
body.big .modal h3{font-size:23px}
body.big .hstep b{font-size:19px} body.big .hstep span{font-size:17px}
body.big .h3l li{font-size:18px}
body.big .hmore summary{font-size:18px}
body.big .rsum b{font-size:19px} body.big .rsum span{font-size:15px}
body.big .rb-pri{font-size:21px} body.big .rb-pri small{font-size:15px}
body.big .rb-pair button{font-size:18px} body.big .rb-links button{font-size:17px}
body.big .mbtns button, body.big .mbtns .btn{font-size:19px}
body.big .brk summary, body.big .brk div{font-size:16px}
body.big .opt b{font-size:20px} body.big .opt small{font-size:15px}
body.big .pill{font-size:17px}
body.big .toast{font-size:18px}
body.big .ptitle{font-size:20px} body.big .ptitle small{font-size:15px}
body.big .who b{font-size:19px} body.big .who small{font-size:15px}
body.big .g-nm{font-size:20px} body.big .g-st{font-size:15px}
body.big .hchip{min-width:fit-content; padding:0 6px}
