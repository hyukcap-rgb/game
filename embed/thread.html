.ng-thread .th-ctl{margin-top:0; padding-top:14px}
.ng-thread .th-ctl .tool{flex-direction:row; gap:6px; min-height:54px; font-size:16px}
.ng-thread .th-ctl .tool .cnt{font-style:normal}
